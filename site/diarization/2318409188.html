    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.04" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 0:11–2:09</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, oi oi nüüd töötab tere. Mul on hea meel, et te olete tulnud siin pool kolm, laupäeval Paidesse, kes ei ole koha lik, et see on väga suur asi. Mina kohalikuna, siis tänan teid selle eest väga. Ja olete tulnud kuulama arutelu programmeerimisest ja me esitasime selle mitte küll küsimus e vormis, aga see võib nii olla, et et me siis natuke ütleme seda kui faktina, aga sama s ka küsime, et kas programmeerimine kui uus emakeel. Oleme kokku kogunud väga laheda panelistid, väga lahedad inimesed siia, kellel kõigi l on ääretult palju selle teema kohta öelda. Ja vaatame, kuhu me umbes üheksakümne minutiga või natukese vähema ajaga jõuame. Me korralduslikult veel nõnda palju. Teil on võimalik jooksvalt esitada küsimusi, mis ei vaja nagu kohest sekkumist Slido kaudu. Võite minna slido punkt kom või skännida QR-koodi. Ja, ja kui küsimus on põletav, tahate kohe reageerida mingile mõttele, mis siit lavalt kostub, siis tõstke julgelt käsi püsti. Carolin on seal vasakul pool servas ja siis tema toob kohe mikrofoni ka. Aga siis, kui on vaja kohe reageerida, et kui on küsimus, mis tegelikult natuke kanna tab oodata, et ma jälgin neid jooksvalt, et, et ma loodan, et me jõuame need kõik ilus ti siin ka ette võtta. Mina olen Kaspar Tammist, olen kood Järva kogukonna ja kommunikatsioonijuht. Olen põline paidekas, vedanud sedasama arvamusfestivali viis aastat ja teinud veel palju asju siinsamas Paides enda kodulinnas. Aga ma annan sõna vaikselt edasi. Palun, et iga osaleja siin ennast tutvustaks, alustame Kristinast, et räägib, kes ta on, mida ta teeb ja, ja võib-olla esimene mõte, mis tal tekkis selle pealkirjaga või selle sisuga, mis me tall <button type="button" class="segment-card" data-segment-id="segment-0002" data-start="129.36" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:09–3:20</span></span><span class="segment-text">Tere kõigile, Aita Kaspar. Tervist olen Kristiina ja ma olen tehniline värbaja Boltist. Töötan Boltist juba üle üks aasta ja tegelikult mul on päris suur kogemus tehnilisel värbamisel. Olin töötanud ka Eesti Energias ja Nortalis. Jah, ja mul oli tegelikult väga hea meel siia tulla, et ka panustada sellele kõnele ja kui ma vaatasin seda pealkirja tegelt mul tuleksid kaks mõtet sellest, et kas programm eerimine on ikka nagu meie uus emakeel. Olen nõus, et digitaalne oskus on hädavajalik meile praegu tänase l päeval, sest kõik muutub, et tehisintellekt tulnud ja pead olema päris paindlik ja uudishimulik ja õppida palju. Ja siis nagu teine mulje ka tekkis, et no kui kõik osaksid, ainult digitaalseid asju teha, kes hakkab siis midagi kätega tegema, et nagu teised ametikohad on ka just olulise d ehk ja et seetõttu ma usun, et meil tuleb siin päris huvitav diskussioon jah, aitäh</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="200.12" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 3:20–4:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh sulle, Markus. Tere, minu nimi on Markus, ma olen IT-inimene, kes siis töötab väga paljude erineva asja dega IT ringis, programmeerimises, inseneerias ja päevatööna ma töötan sellises ette võttes nagu Pipedrive. Sellise veidi niššala peal, võib-olla paljud ei ole sellest kuulnud, selle nimi on siis DevOps inseneeria. Ja kui mina lugesin seda pealkirja, siis mul tulid siuksed mõtted, et kas minu, minu vaatepildist arutades, et kas programmeerimine on tegelikult, kas see on, ütleme, ühe IT-inimese siis peamine ülesanne, peamine eesmärk, osata hästi programmeerida või siis kas osata seda kasutada kui tööriistana. Ehk siis kasutada seda võimalikult vähe, aga kasutada seda targalt.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="246.04" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:06–5:12</span></span><span class="segment-text">Ja tervist, Ott Velsberg, justiits- ja digiministeeriumis. Olen kahe tuhande kaheksateistkümnendast aastast olnud riigi andmete valdkonna juht. Ja igapäevatöös tegeleme tegelikult valdkonna edasiarengu juhtimise ja tegelikult vii me ka kõikvõimalikke erinevaid, siis nii tehisharu, andmehalduse, andmete kättesaada vusega seotud projekte ellu. Kui ma seda pealkirja vaatasin, siis ma läksin võib-olla sellest programmeerimisest kohe esmajoones natukene kaugemale, sest kui me vaatame, mis suurte keelemudelite pealetu lekuga on toimunud, generatiivne tehisharu, siis just see matemaatiline mõtlemine on tegelikult oluline. Et kui me toetume liiga palju lahendustele, siis tihtilugu need lähevad natukene kii va ja pärast saame ka pikemalt rääkida, et jah, täna väga lihtne on tarkvaraarendusel näiteks vibe coding&#x27;u põhjal loota endale veebirakenduse ja nii edasi. Aga probleemid tulevad päris kiiresti ehk selline üleenesekindlus võib tekitada probleem</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="311.56" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 5:12–5:18</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">e. Aitäh sulle selle matemaatika juurde tuleme peaaegu kohe peale Piretit, aga palun.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="318.2" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:18–6:00</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, mina olen Piret. Töötan täna programmeerijana sellises ettevõttes nagu Codeborne. Ja see on minu kolmas karjäär ehk siis ma olen otsustanud noh, põhimõtteliselt võib öelda , et programmeerimise või tehnoloogia kui emakeele kasuks praegu, pärast erinevaid va rasemaid valikuid. Ja kui ma pealkirja peale mõtlen, siis. Ma ütleks, et võib-olla tehnoloogia on nagu rohkem uus emakeel, mitte programmeerimine kui sellise, selline programmeerimine on nagu selline tegevus, aga kui ümberringi vaadata , siis seda tehnoloogiat on niivõrd palju rohkem ja rohkem, et selle kasutamise osku s, miks mitte ka selle tegemise oskus on väga oluline.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="360.12" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 6:00–6:24</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Väga hea, aitäh esimeste mõtete eest. Suur tänu teile. Enne tegelikult, kui me lähme sinna matemaatikasse, sest meil on juba küsitud ka küsimus selle kohta, et me peame kindlasti sellega hakkama peale. Aga Piret, sa tahtsid ühe ägeda alguse teha ja siis natuke selgita seda ja, ja ma anna n nagu siis mingi mõneks minutiks sulle võimaluse.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="384.16" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:24–7:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma vaatasin täna hommikul kodus ringi ja mõtlesin, et mul ei ole ühtegi sellist tuba , kus ei ole mõnda nutikat seadet. Ja siis mõtlesin, et küsiks teie käest, et mitme nutika seadega teie siia tulite täna Nagu siia Paidesse üldse, et väga raske on elada niimoodi, et sul ei ole ühtegi nuti kat seadet kuskil küljes, kõrval, autos. Kolm-neli-kaks, üks, keegi on ilma ka. Ma näen ühte inimest, kes ütleb, et tal ei ole ühtegi nutikat seadet, väga äge.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="424.64" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:05–7:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Haruldane. Jah, ja tegelikult see mõte on selles, et me oleme ümbritsetud igalt poolt ümberringi nutiseadmetega, et samamoodi kui me siin laval oleme, et meil on neid väga palju, meil on telefonid, meil on needsamad mikrofonid, meil on muide nutisõrmused, nutikellad, ta hvelarvutid, et neid asju on meil ümberringi ja need on tegelikult kõik seotud programm eerimisega ju. Et keegi on need loonud, teinud, sisud loonud, et et see on igal pool meie ümber, see ei ole mingisugune kosmoseteadus või, või mingi uus asi, mis meid kuskilt ründab, mille le peab kindlasti vastu seisma. Aga aitäh.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="463.56" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:44–8:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Võib-olla lisaks nii palju ka, et, et need nutiseadmed ei juhtu ju iseenesest, et nad lihtsalt ei teki, et kellelgi tekib mõte siis keegi teine inimene üldjuhul on pannud oma näpud klaviatuurile ja siis teinud selle teoks ja siis meie võtame oma näpud ja pa neme selle asja külge ja, ja siis asjad juhtuvad. Aga see ei ole nagu magic, et keegi teeb selle nimel midagi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="486.64" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 8:07–8:43</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Just aitäh. Aga liigume edasi ja hakkame siis lahkama esimeste suuremat tükki. Küsimus, sa rääkisid, puudutasid Ott juba matemaatikat, et ma küsin tegelikult siis alguses kohe sinu käest, et, et kes siis on programmeerija ja mis oskusi tal vaja on, et kas nagu matemaatika on nagu A ja O, et kui see gümnaasiumit ei lõpeta matemaatika eksami kõige paremate tulemustega, siis põhimõtteliselt on läbi su elu üldse programmeerimis valdkonnas ja sa peadki tegema nagu Kristjan ütles, kätega midagi lihtsamat.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="523" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 8:43–10:25</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No päris nii must ei ole, et lihtsalt, et mõtlen nagu enda selle gümnaasiumi ja põhi kooli ajale tagasi, siis ütleme jah, matemaatika istus väga hästi , aga ütleme nii, olin suhteliselt koolipoiss, et et on võimalik ikkagi edasi liikuda. Ei ole kadunud. Et pigem, kui ma mõtlengi, et programmeerimine kui emakeel, siis täna ma näen, et seda vajadust sellise kriitilise loogilise mõtlemise järele, isegi veel enam ja see on tegelikult , kui me räägime siin programmeerimisest, just see nii-öelda süsteemne mõtlemine tuleb tegelikult kõige enam kasuks. Et kui me võtame, et mida iga indiviid täna võiks võita, siis viis loogiliselt tegelikult mõelda. Võtame kõikvõimalikult need keelemudelite kasutus, see, kuidas sa kirjutad viipasi nii -öelda prompte, sellest oleneb hästi palju see, mis tulemuse ta tegelikult kätte saa te. Iga inimene võib täna kasutada OpenAid, aga see tulem sõltub sellest, kuidas ta loogi liselt mõtete läbi, millised käsklused te annate, milline on agendi näiteks nii-öelda käitumine. Kui te pikalt kasutanud, las ta teeb teie kohta väikese analüüsi, kes te olete, usku ge mind, sealt saab päris palju teada. Ehk siis see on natukene ka selline hingepeegel justkui, aga jah, ma just, just pigem ütleks, et see loogiline mõtlemine läbi mõelda erinevad sammud ja see on tegelikult programm eerimises samamoodi oluline. Programmeerimiskeeli, neid on toh ja palju. See ei ole tähtis.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="624.88" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 10:25–10:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh, Piret, sina oled teinud karjääripöörde. Kuidas sul matemaatika oli, et ikkagist katsume selle juureni jõuda sinul ja ka Marku sega, kes on samas valdkonnas praegu aktiivne.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="636.28" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 10:36–11:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No matemaatikaga mul oli okei. Ma ei saa öelda, et ma oleks olnud matemaatika geenius, aga okei oli, et ma käisin re aalkoolis reaalklassis, nii et selles mõttes võrdlusmomenti oli kohutavalt raske ümber ringi, et kui ma olin keskpärane, siis tegelikult oli väga okei. Aga pärast seda ma tegelesin, mul on haridus on avalikes suhetes ehk siis PR. Ma tegelesin hoopis teiste asjadega, pärast seda ma tegelesin muudatuste juhtimisega Aga ma ütleks, et loogikat oli igal pool vaja. Ja siis, kui ma hakkasin programmeerimist õppima, siis hästi mitmed tuttavad tulid selle peale ütlema, et kuule, et aga programmeerimine, see on ju puhas matemaatika, et see on nagu ilgelt hirmus, et kindel või. Aga ma ei tea, nüüd on seitse aastat möödas ja ma ütleks, et mingi põhikooli lõpu ma temaatikat on vaja olnud, aga väga palju rohkem nagu mitte, aga noh, see sõltub kindlasti hästi palju ka valdkonnast.</span></button>
