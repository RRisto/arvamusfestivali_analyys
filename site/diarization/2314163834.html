    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.56" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:11–1:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast kõigile Eesti Vabariigi välisministeeriumi ja Tartu Ülikooli rahvusvahe liste suhete ringi korraldatavale arutelule. Eestlastele üldiselt, eriti vabariigi aastapäeval, meeldib süüa ikka kilusid ja kilu võileibu. Ja seetõttu ma esitaksingi sellise metafoori, et meie siin Läänemere riikidena oleme gi justkui ühed kilud, kes seisavad vastu suurele karule või kas me ikka oleme nii väike sed ja kas see karu ikka on tõesti nii suur? Meie arutelu kannab pealkirja &quot;Kilud versus karud Läänemeremaade koostöö uues julgeo lekuolukorras. Mul on hea meel kõiki välis- ja julgeolekupoliitika huvilisi siin täna näha ja seda eri ti olukorras, kus Venemaa agressioon Ukrainas on muutnud ka Läänemere piirkonna julge oleku arhitektuuri. Ning seetõttu soovimegi täna arutada siin Läänemeremaade koostööd, erinevaid or ganisatsioone ning koostööd tulevikku.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="79.16" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 1:19–4:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt. Mul on väga-väga hea meel tutvustada meie arutelu eksperte, kelle teadmiste, arvamus te ja ideedega saame järgneva pooleteise tunni jooksul kaasa mõelda. Eesti alaline esindaja NATO juures Jüri Luik. Rahvusvahelise Kaitseuuringute Keskuse direktor Kristi Raik. Ja Eesti Vabariigi välisminister Margus Tsahkna. Antud arutelu korraldavad välisministeerium ja Tartu Ülikooli rahvusvaheliste suhete ring ning modereerivad organisatsiooni liikmed Talis Timmi ja Liisbet Reinsalu. Aga enne veel, kui anname sõnajärje üle meie panelistidele, tutvustame kuulajatele natukene täpsemalt arutelu formaati. Arutelu esimene osa on suunatud vestlusele meie panelistidega. Kuid olge mureta, kallis publik. Ka teil on võimalik oma sõna sekka öelda läbi veebiplatvormi Slido. See on imelihtne. Lähete avate oma nutiseadme, lähete leheküljele slido. com, sisestate sinna märksõna kilud versus karud kaks tuhat kakskümmend viis. Kirjuta küsimuse, saadate ära ning teie küsimused peaksid siia ekraanile olema ku vatud ja jõuavad ka meieni. Ja publiku küsimusi proovime võtta arutelu sees jooksvalt. Aga lõpus anname samuti sõnaga päriselt teile. Soovijad saavad oma mõtteid jagada ja küsimusi esitada mikrofoni kaudu otse. Nii et siis, kui selleks on õige aeg, siis soovime näha kätemerd. Tundub, et ülesehitus on enam-vähem selge ja võime asuda asja juurde. Alustame kõige olulisemast. Julgeolekust ja hetkeolukorda kaardistamisest. Venemaa täiemahuline agressioonisõda Ukrainas on tänase seisuga kestnud tuhat kakssa da kakskümmend kaheksa päeva. Muutunud on kogu maailma ja Euroopa julgeoleku arhitektuur. Räägime NATO laienemisest, Euroopa Liidu järjekordsest sanktsioonide paketist ja nii edasi ja nii edasi. Ehk siis ma pöörduksingi Jüri Luik teie poole hästi, võib-olla sellise lapsesuise küsimus ega. Aga kas Euroopa on nüüd täna valmis? Kas Euroopa on nüüd esmakordselt päriselt valmis iseenda sees seisma?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="244.6" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 4:05–7:30</span></span><span class="segment-text">Ja tervist ka minu poolt ja suur aitäh kutsumast. Ma arvan, et sellist, sellisele küsimusele on raske vastata selles mõttes, et kui me räägime Venemaa täiemahulisest agressioonist, näiteks Balti riikide vastu, siis on selge, et ainult Euroopa sõjalised võimed siin ei ole piisavad. See on ka üks põhjus, miks väga oluline on kogu alliansi kooshoidmine. Nagu te teate, sellega on kõikvõimalikke probleeme, on teemasid. Aga mina ütlen alati seda, et NATO on elanud üle väga keerulisi aegu. NATO-st on riigid, no näiteks Prantsusmaa isegi sõjalisest struktuurist välja astunud NATO on Pariisist isegi ära aetud. Nii et ma usun, et mitte kunagi ei tohi sattuda masendusse või lasta murel enda üle võimust võtta. NATO tugevus seisneb ikkagi selles, et see on väga hästi sisse töötatud süsteem, mis hoiab koos samade väärtustega riike ja ma arvan, et see põhi ei ole tegelikult muutunud. Nii et kui me küsime, kas Euroopa on valmis, siis ma ütleksin, et NATO liik melisus tagab meile noh, teatava niisuguse julgeolekupadja. Ja küsimus on eelkõige jõudude ümber grupeerimises NATO sees. Et me peame olema valmis võtma enda kanda terve hulga selliseid ülesandeid, mida me traditsiooniliselt kunagi ei teinud. Sest me peame arvestama, et on sõjalised võimed, mida Ameerika Ühendriigid igal juhul Euroopast ära viivad. Millised võimed on, see on arutelu aines. Ja seoses sellega me peame ka arvestama, et Euroopa maad peavad need sõjalised võime d igal juhul üle võtma. See eeldab investeeringuid kaitsesse, aga see eeldab ka poliitilist valmisolekut, noh , Eestis on see poliitiline valmisolek selgelt olemas. Aga mitte kõik Euroopa, NATO liikmed ei võta seda teemat niivõrd tõsiselt ja me räägime suurtest rahadest, sest need võimed, mis ameeriklastel Euroopas on, mis on meile olulised nagu luure, eelhoiatus, staabid ja nii edasi ja nii edasi, need eeldavad väga suuri investeeringuid, nii et ma ütleksin niimoodi, me ei ole praegu valmis, aga meil on aega ja samm-sammult me saame oma noh, ütleme nii sugust sõjalist võimet tugevdada, me ei saa, me ei pea seda tegema paaniliselt, me ei pea seda tegema kuidagi hirmunult. Nii et see on niisugune rahulik protsess, aga ta peab olema muidugi piisavalt kiire.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="450.44" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:30–7:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Välisminister Tsahkna, teie ametiaeg välisministrina algas kahe tuhande kahekümne kolm andal aastal. Kui te nüüd mõtlete oma ametiajale, siis mis on olnud need kaks-kolm suurimat välispo liitilist edusammu saavutust, mis te tahaksite siin meie publikule välja tuua?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="471.92" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:52–10:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt väga hea küsimus, et poliitikule eriti, et võiks hakata kõiki neid üles lugema ja enda nii-öelda kontole kirjutama, et. Et ma ei saa öelda, et minul on mingi üks või teine saavutus, küll aga Jürile jätkuks , et me peame aru saama ka sellest taustast, et õnneks meie ei pea ja ei ole olnud su nnitud oma välispoliitilisi eesmärke ja põhimõtteid muutma. Ja, ja noh, tulles nüüd küsimuse juurde tagasi, on see, et pigem, mida me oleme näinud , on see, et meid võetakse oluliselt tõsisemad, mitte ainult Eestit, vaid just nimelt neid nii-öelda idarinde riike. Ja kui me vaatame ka seda teemat, et see kilud ja Läänemeri ja, ja kogu see regioon. Siis ma arvan, et noh, kui nüüd lihtsalt nimetada mõningaid olulisi otsuseid, mida me oleme saat- , suutnud Euroopas läbi suruda ja eest vedada. Nagu te teate, siis otsuste protsess on väga keeruline kahekümne seitsme liikmesriigi ga seoses. Siis need oleksid kõigepealt kindlasti see, mis ei ole kuidagi meie teene. Aga see, et Soome ja Rootsi on NATO-sse astunud, et see on ikkagi olnud see samm, mis kogu meie julgeolekustruktuuri siin regioonis on oluliselt muutnud. Ja, ja, ja näiteks see on üks samm. Teine, mis puudutab kõikvõimalikku sanktsioonipoliitikat Euroopa Liidu poolt. See on kohutavalt raske protsess, iga pakett nõuab väga suuri pingutusi ja ma pean ikkagi väga oluliseks läbimurdeks seda, mis juhtus siin paar nädalat tagasi ehk siis kaheksa teistkümnes sanktsioonipakett ja nafta hinnalae alandamise mehhanismi vastuvõtmine ja see oli üks koht, kus tõesti Eesti pani ala maha ja teatas, et me ei ole, me oleme valmis vetostama kogu paketi, kui seda naftahinna alandamise mehhanismi otsust ei tule. Ja siin ma tahan tõesti tänada kõiki meie diplomaate, et see oli nagu päris karm sur ve meie vastu. E-seitsme riikide ja mõnede teiste poolt ja, ja see otsus tehti ära. Ja, ja kolmas teema, millest on palju räägitud, mis ei ole lõpuni ära otsustatud, kahju ks, aga on see, mis puudutab Venemaa külmutatud varasid. Ehk siis ka see on olnud üks teema, mida Eesti on eest vedanud ja saavutanud vähemalt selle, et need varad on külmutatud. Me räägime Euroopas üle kahesaja miljardi euro väärtuses varasid ja mis on tähtis, on see, et G seitsme Euroopa Liidu ühises koostöös otsustati need varad panna garantiiks siis viiekümne miljardi dollari väärtuse abipaketile, mis anti Ukrainale ja seal on kaks asja, et üks on see, et see raha maht on iseenesest päris, päris suur. Aga teine on see, et see otsus tähendab, et need Venemaa varad jäävad väga pikaks aja ks külmutatuks, kuna nad peavad seda väga pika aja peale võetud kohustust siis garan teerima. Need võib-olla on sellised kolm konkreetsemat, aga, aga noh, väga raske on öelda, et nüüd on seesama küsimus, kas Euroopa on valmis ja kas Eesti on nüüd oma välispoliiti lise missiooni nagu lõpetanud, ei ole, et seda tööd on väga-väga palju.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="651.52" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 10:52–11:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kristi Raik. Venemaa tegevus ei piirdu enam ammu lihtsalt tankide ja rakettidega. Juurde on tulnud hübriidsõda, droonid, desinformatsioon, sabotaaž ja kõik muu selline Küsiksin hästi lihtsalt. Kui me nüüd mõtleme Läänemerele, siis miks üldse Venemaad see Läänemeri huvitab? Mis on see nende strateegia siin Läänemere suunal?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="677.2" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 11:17–14:43</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja kõigepealt tänan kutsumast ja arutelule. Tere kõigile. No Venemaa jaoks kahtlemata Läänemeri on strateegiliselt ülimalt oluline. See on oluline julgeoleku vaatest. See on oluline ka Venemaa majanduse vaatest, näiteks Venemaa nafta ekspordist üle poole , pea kaks kolmandikku liigub läbi Läänemere. Ja kui me nüüd vaatame seda strateegilist pilti, kuidas on viimase kolmekümne viie aasta jooksul muutunud, siis päris radikaalselt. Ja mitte Venemaad rõõmustavas suunas selline Venemaa ütleme kinnisidee ajalooliselt on see, et selleks, et Venemaa saaks ennast tunda kaitstuna, arvavad, et nad peavad naaberriikide üle omama kontrolli. Ja seda on nad tasapisi kaotanud ja, ja võib isegi öelda, et Venemaa mõju Läänemere re gioonis ja, ja selline kontroll, mida nad tahavad saavutada, täna on, on nõrgem, kui ta on olnud kunagi viimase, enam kui kolmesaja aasta jooksul. Ja nüüd on ka esmakordselt muud Läänemere riigid, välja arvatud Venemaa, kuuluvad sama sse sõjalisse allianssi, on samameelsed, sarnase vaatega Venemaale sa rnase vaatega. Oma julgeolekule ja, ja kaitsele. Ja, ja kahjuks ei ole nagu Venemaa suutnud siis luua oma naabritega selliseid nii-öelda normaalseid heanaaberlikke suhteid. Vaid, vaid on sellise oma suurriikliku imperialistliku vaatega lähenenud Läänemere re gioonile. Ja noh need meetodid, mida Venemaa siis kasutab selleks, et oma positsiooni ikkagi ho ida või taastada, seal tegelikult midagi väga uut ei ole külma sõja ajal täpselt samamoodi räägiti võib-olla natuke teiste terminitega, aga Venemaa aktiivsed meetmed olid kõik kasutusel desinformatsioon, sabotaaž, mis on nüüd tulnud juurde , on, on sotsiaalmeedia, uued tehnoloogiad, mis võimaldavad mingeid uusi mõjutusmeeto deid. Meil Balti riikides on muidugi pikaajaline kogemus sellest, et Venemaa proovib meie ühis kondi nõrgestada selliste mittesõjaliste meetmetega. Kui vaadata nagu läänepoolsemaid Euroopa riike, neile see on nagu kuidagi uuem teema , võib-olla oli rohkem sellist naiivsust peale külma sõja lõppu, et mingi ajastu oli läbi ja selliseid probleeme enam suhetes Venemaaga ei olnud. Ka sõjalise kaitse vajadust enam ei nähtud mingil perioodil lääne, Lääne-Euroopas. Aga nüüd on jällegi see ühtne arusaam jah, sellest nagu julgeolekuohust on Läänemere regiooni riikide hulgas tugev ja ma arvan, selline hoiak, et me peame suutma ennast ka itsta nii sõjaliselt kui siis ka nende mittesõjaliste meetodite vastu. Et selles osas on väga selge, selge arusaam ja soov ka koostööd teha, nii et see on nagu selline positiivne külg selle praegu muidu äreva ja, ja murettekitava julgeolekupildi</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
