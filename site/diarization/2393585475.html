<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="182.24" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 3:02–4:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Just ja lõpuks jätame ka aega pikemalt publiku küsimuseks ja publiku küsimusteks ning aruteluks. Aga me võimegi liikuda sujuvalt meie esimese teema juurde ning enne, kui me hakkame aru tama selle üle, et kas internet vajab rohkem või vähem reegleid, peatume korraks üle riigikohtu otsusel. Mis eelmine aasta pälvis väga palju tähelepanu. Juhtumise oli suhteliselt lihtne. Tiktokis tehti otseülekannet, kus mõnitati ja solvati inimesi ning lubati ka inimesi , lubati ka kedagi tappa ning politsei määras selle eest otseülekande tegijale avaliku korra rikkumise eest trahvi. Riigikohus aga tühistas selle. Mitte sellepärast, et käitumine oleks olnud aktsepteeritav, vaid sellepärast, et Tik Tok ei ole korrakaitseseaduse järgi avalik koht. Riigikogu riigikohus rõhutas, et avalik koht tähendab seaduse järgi ruumi, tänavat, par ki, väljakut, ehitist või ühissõidukit, millele on ligipääs määratlemata isikute ringi l. Kristjan, mis on selle otsuse mõju ning miks see on oluline, et internet ei ole korra kaitseseaduse tähenduses avalik koht ning miks me üldse lähtume riigikohtu otsustest</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="411.92" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 6:52–7:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Maria, kas väide, et internet ei ole avalik koht, kohtunud teile pigem juuratehnilise tõena või kirjeldab see praegust ühiskonna tegelikkust?</span></button>

/button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="536.4" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 8:56–9:05</span></span><span class="segment-text">Mart, ma küsin teilt jätkuküsimuse, et kas me räägime enam üldse kahest erinevast maailma st või internet on saanud nii suureks päris elu osaks nendel maailmatel ei saa enam vahe</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
