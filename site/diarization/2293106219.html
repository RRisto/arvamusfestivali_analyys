    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.2" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 0:11–2:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast siis arutlema meiega ravivalikute loterii üle. Et lähema poolteist tunni jooksul arutame siis selle üle, milline on eri raviviiside kättesaadavus, miks see selline on ja mis sellega tehtud on, mida veel teha saab, mida tegema hakatakse? Ja meil on äärmiselt tore arutlejate ring siin laval täna. Tere tulemast Maria Malva on silmaarst, Regionaalhaiglast ja, ja ka nüüd ma jään hätta, ma kohe ütlen, mis kliinikust veel. Lasevisiooni silmas. Lasevisiooni kliinikust, meil on patsientide poole pealt Kristel Leif, onkoloogika kogu konna eestvedaja. Meil on Maivi Parv Tervisekassast ja meil on minister Karmen Joller ja, ja enne kui me siit nii-öelda teele läheme, siis me oleme täna valinud nii, et küsimusi saab esitada eelkõige onlainis. Ja, ja seda väga mitmel põhjusel, esiteks nii on neid mul lihtsam hallata ja ma ja, ja enne, kui me nende küsimuste esitamise lähen ütlen ära ka, et kuna täna ja eile ja üle eile on olnud väga pingelised teemad õhus Tervisekassaga seotult ja, ja minister on nende ga seotud, siis siis ma lihtsalt palun, et me püsime siin tänase arutelu piirides, et me räägimegi ravivalikutest, ravi kättesaadavusest ja ei lähe Tervisekassa juhtimiskü simuste või ministri nii-öelda valikute juurde selles osas, mis puudutab seda viimast nii-öelda meediateemat. Ma loodan, et see kõigile osalejatele sobib. Ja, ja siin on nüüd see QR kood, millega te saate sinna keskkonda, kus te saate küsimus i esitada ja need peaksid ilusti jõudma minu juurde siia tahvlisse, kui ei jõua, siis Kristi aitab mind, nii et saame vast sellega kenasti teele, nii et tere tulemast. Aga läheme kohe teele, et millised aga enne, enne veel <button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="166.56" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 2:47–3:50</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja no kõige keerulisemad on kindlasti need valdkonnad, kus ongi, kus tead us ei olegi jõudnud sinnamaani, et et oleks üleüldse ravi teinekord või kui see ravi on piiratud, et lihtsalt neid ravimeid ei olegi. Ja teine on siis selline valdkond, kus ravi on, aga see on väga kallis ja, ja, ja siis kas ei suuda riik seda tagada või ka inimene ise teinekord peab raha välja käima, et see on alati hästi keeruline olukord ja noh, laialt lai öeldes võib-olla tõesti siis harvikhaigused ka vähiravi ja tegelikult on ka muid tervisemuresid, kus ravi võib olla väga kallis, et aga Tervisekassa on teinud paljudes kohtades ka hea d tööd ja suutnud ikkagi ravi tagada, aga noh, seal alati on see nõudlus on suurem kui kui reaalselt me pakkuda jõuame. Võib-olla sa Maili saadki jätkata.</span></button>

see, et meil on näiteks teatud sellised, teatud ravimid, sellised kallimad ravimid, spetsiifilised ravimid, ka niinimetatud sellise teise rea ravimid ehk et me peame, et seda teise rea ravimit saada, me peame tegelikult sellise esimese rea ravimi ära proovima. Nii et, et võib-olla, võib-olla jah, need põhjused jäävad kindlasti ka see, et, et meil ongi justkui info, hea teenus, uus teenus, uus ravim, aga see on veel pooleliolevates</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="382.8" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 6:23–8:02</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">kliinilistes uuringutes. Kui patsiendina selle kõige peale mõelda, siis ega enne kui ei vaata otsa surmale või väljapääsmatule olukorrale, siis ei saagi võib-olla aru, et kas siin on mingisugust ki tsaskohta. Ja kui me vaatame selle teema peale, siis võib-olla esimene assotsiatsioon, mis teki b, on ikkagi seotud mingisuguse innovaatilise raviga, ravimiga, mis ei ole meie riigi s rahastatud, mille pärast keegi peab tegema midagi ekstra või paluma annetusi või käi ma välja oma isiklikust rahakotist väga suure summa. Aga ma tahaksin lihtsalt sellesse arutelu selle niigi ilmselge teema kõrvale tuua ka selle, et kui me räägime ravi kättesaadavusest, siis minu peas patsiendina me ei räägi ainult sellest, kas mingisugune konkreetne ravim või uus ravimeetod on kättesaadav. Me peame ikkagi rääkima ka tegelikult sellest, kas me saame arstile ehk siis ravi kätte saadavus mitte ainult ravimite kättesaadavus, sest et sageli olles ise vähipatsient ja hetkel selles kontekstis siis küll õnnega koos saanud välisravi väga innovaa tilise ravimiga, olles praegu puhas sellest kasvajast, siis ega sellega minu ravivaja dus ei lõpe. Kõik, mis puudutab patsientide sotsiaalpsühholoogilist tuge, ravi just ka vaimse tervi se kontekstis taastusraviga, see kõik on ravi, et kas me räägime selle teema konteks tis ka sellest või me räägime ainult innovaatilistest uutest ravimitest, mida mõnes val dkonnas on ja teises ei ole. Et ma tahaksin selle siia kõrvale kindlasti panna.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="482" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 8:02–13:31</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, head kuulajad. Et mina töötan siis silmaarstina ja tooksin siis oma erialalt ka ühe valusa näite, millega siis silmaarstid täna kokku puutuvad. Ja teen siis sissejuhatuseks haigusele väikese ülevaate. Et silmaealine kollatehn kärbumine on populatsioonis väga laialt levinud silmahaigus. Et esmaseid muutusi me näeme juba viie-kuuekümne aastastel inimestel silma põhjas ja haigus on elukestev. Kuivorm on aeglaselt progresseeruv, mõjutab meie silmahaigust silmanäge mist kvaliteeti aeglaselt. Aga silma agressiivne vorm, kus silmapõhja tekivad tursed ja verevalumid laastab siis inimese nägemist kiiresti ja kui me ei ravi seda või ravime seda ebaefektiivselt, siis inimene kaotab oma tsentraalse nägemise. Nüüd täna agressilma kollatähni kärvamise agressiivse haigu se ravi number üks kogu maailmas ja ka Eestis on silmasisene intervallsüstravi. Ja ka Eestis on seda süstravi aktiivselt tehtud peaaegu kakskümmend aastat. Ja Tervisekassa täna rahastab praktiliselt ühte anti VGF süstravimit. Ja väga paljud inimesed on saanud tänu sellele ravimile abi. Nüüd täna Eestis siis neid süstraipatsiente, ma nüüd täpset numbrit ei oska öelda, aga neid on tuhandeid, kes saavad siis oma silmahaiguse tõttu intervallsüstravi. Ja aga nendest umbes viisteist protsenti on sellised patsiendid, kellel see ravim üldse ei tööta. Haigus on sama, kulgeb agressiivsemalt. Ravim ei tööta, see ainus tervisekassa poolt rahastatav ravim või siis aja jooksul ra vimi efektiivsus langeb, et meil on vaja minna üle teise toimeainega ravimile. Täna on Eestis need head uue põlvkonna pikematoimelisemad, tugevamatoimelised süstra vimid kõik saadaval, nad on aastaid saadaval, tuleb ka järjest juurde. Aga need ravimid on tasulised ja nad on kordades kallimad. See hinnavahemik täna, ma ei räägi konkreetselt ravimitest, vaid ravimitest on patsi endi jaoks keskmiselt kakssada kuuskümmend kuni seitsesada eurot üks süst. Ja ka neid kalleid tasulisi süste vajab patsient regulaarselt vastavalt oma silmahai gusele, uue põlvkonna süstravid võimaldavad teha süste harvemini, ent kui see tervise kassa poolt rahastatav ravim peab praktiliselt iga nelja nädala tagant patsiendile si lma süstima, et silmahaigust hoida kontrolli all, siis uue põlvkonna pikematoimelised , tugeva toimsed ravimid võimaldavad teha süste seal kaheksa kaheteist, heal juhul kuu eteist nädalase intervalliga. Ja neid patsiente on siis umbes viisteist protsenti ja väga paljud nendest patsientide st ei ole võimelised omale seda ravi täna lubama. Et kas üldse ei ole võimelised lubama või siis suudavad osta teatud süsti korrad ja siis on neil see rahalised vahendid otsas. Ja mida siis, mida siis nende patsientidega teha? Patsienti arvuliselt on, arvuliselt ma nii täpselt ei oska öelda, aga ka nii-öelda teist e riikide kogemuste peal artiklite põhjal, et nendest silma märja kollatähni kärvamise ga patsientidest, kes ravi süstravi saavad, et ligi viisteist protsenti vajab teise to imeainega ravimit. Ja, ja siis antud olukorras me olemegi patsiendiga koos seal kabinetis selle sunnitud olukorras, et kus ma näen, et haigus vajab teise toimimine ka ravimit. Mul on olemas seal apteegis seal selle ainsa ravimiga, mida tervisekassa rahastab, ka kõik need muud teise toimeravimid, aga ma saan võtta see ravimi sealt siis, kui patsi endil on raha. Ja kui patsiendil raha ei ole, siis on arst sunnitud jätkama selle ebaefektiivsema ra vimiga haigus ikkagi vaikselt progresseerub inimese nägemine läheb halvemaks. Ta vajab tihedamini süste, tihedamini jälgimist, tihedamini visiite, koormab arstiõde de vastuvõtt, aparaate, opituba ja et noh, nii-öelda sellest nokk kinni, saba lahti olukorras tegelikult täna me ei võida. Elanik <button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="810.64" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 13:31–13:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kas sa mainin? Äkki ma kohe kommenteerin? Ma arvan, et me räägime samast toimeainest ja minul on info, et see ongi täna läbirä äkimiste faasis ja töötatakse selle nimel, et see oleks esimesest jaanuarist järgmise l aastal paketis.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="827.72" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 13:48–14:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et kui väike kommentaar ka, et, et silma, silmaarstide selts on selle teemaga aastate jooksul tegelenud, on olnud Haigekassas ka läbirääkimisi, seni on olnud see tulutult Et selles mõttes on see olukord nagu üsna teravaks muutunud, sest nii-öelda nii patsi ent kui arst on sunnitud kasutama ühte toimeainet. Et sama meil on näiteks vererõhuhaigus, et me ei saa ravida ühe toimeainega sadat pa tsienti, osadele mõjub väga hästi, aga mida teha teistega, kellele see vererõhk ei la nge. Et meil on vaja ikkagi teatud näidustusel võtta alternatiivid kasutusele, lubada see , et uue põlvkonna ravimid turule nii-öelda tavapraktikas, et patsienti aidata.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
