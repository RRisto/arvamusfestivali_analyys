    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.16" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:11–2:32</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii tere, tere kõigile, mul on nii hea meel, et teid on siia kogunenud nii palju. Kell on märkamatult saanud pool üks ja ma mõtlesin, et võiks vaikselt alustada meie aru teluga. Kõigepealt korraldusliku poole pealt, nii palju, et kui teil tekib jooksvalt küsimus i, siis te saate anda sellest märku käega ja siis Silva on seal mikrofoniga ja liigu b teie juurde ja siis saate oma küsimusi küsida. Nii, aga minu nimi on siis Noora Reinsalu. Ma olen Eesti õigusteaduse Üliõpilaste Liidu liige ja hetkel alustamas siis oma kolm andat aastat õigusteaduskonnas. Ja minuga on siin täna koos siis Mari-Liis Mikli, justiits- ja digiministeeriumist, just iitshalduspoliitika asekantsler. Siis on meiega täna Merit Pobrõšev Harju maakohtu kriminaalkohtunik. Jakob Juksaar, Põhja Ringkonnaprokuratuuri ringkonnaprokurör ja siis on viimasena meiega ka Triin Toom Eesti advokatuuri juhatuse liige ja siis advokaadibür oosne nii vandeadvokaat. Nii, ja millest me siis täna räägime? Kui te seda siin teemat vaatasite, võib-olla tundub alguses veidi spetsiifiline, aga ma kinnitan teile, et kohtutöö ja kohtusüsteem puudutab kindlasti te id kõiki ja igatühte meist, sest et tegu on ikkagi ühe meie põhiõigusega. Seega alustame siis meie aruteluga ja ma küsiksin esimesena sinu käest, Me rit, et sina kui kohtunik. Mis, mis, kuidas see probleem meil siis praegu välja näeb, et kohtute ülekoormus. Kuidas, esiteks, kuidas sa seda tajud ja võib-olla sa veidi kirjeldad seda siis sisse juhatavalt ka meie kuulajatele?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="151.88" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:32–4:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt ja aitäh Noorale. Et ma ei tea, kas päris õige kohe alustada sellest, et, et me räägime kohtunike üleko ormusest, ülekoormusest, et tegelikult meil on õige sõnum on ikkagi see, et kohtus tööta vad väga ägedad inimesed. Ja see vastutus on siis selline väga-väga mitmekülgne ja mitmetahu line. Ja fakt on ka see, et, et kohtusüsteem, süsteem kindlasti peab käima, aga ajaga kaasa s. Ja loomulikult, kui me räägime tänasest julgeolekuolukorrast ja sellest, et, et meil tuleb vaadata oma rahalised vahendid üle, siis midagi ei ole teha, see puudutab ka kohtu id. Ja sealt on siis ka need, need murekohad või, või õigemini siis teemad, mis on ka siis ajakirjanduse ette jõudnud ka nii-öelda võrsunud. Ehk et teemad on olulised. Alustades siis sellest, et tõepoolest, et meil on kärpeteemad üleval, võimalikud maja de sulgemised, siis kohtusüsteemi muutmine selliselt, et, et meil e jääks üks maakohus, ringkonnakohus. Ja loomulikult meie jaoks väga oluline küsimus on ka järelkasvu teema. Aga juba etteruttavalt ma saan täna kinnitada, et, et sõltumata sellest, millised on need väljakutsed, et me ikkagi teeme oma tööd suure rõõmuga südamest ja ma annan sõnajärje sulle tagasi, et me saame tänaste teemadega alustada.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="251" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 4:11–4:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Super, aga ma päris vabaks veel sind ei lase, et ma kohe pinniksin edasi, et, et. Nüüd, kui me räägime, siis sellest veidi spetsiifilisemalt just sellest töö nagu üle koormusest. Kuidas sina kohtunikuna seda tunnetad? Kas sa tajud seda juba siis, kui on tekkinud läbipõlemise oht või lihtsalt, et kuidas see nagu, kuidas sina seda, seda näed enda töös?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="286.88" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 4:47–6:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Meie võib-olla kõige selliseks suuremaks probleemiks ongi see, et, et isegi kui me ütleme, et nende sissetulevate asjade arv ei kasva, siis erinevad õigusvaidlused on oma sisu mõttes muutunud mahukamaks, keerulisemaks ja me ei saa ju teha või kohus ei saa lahendada ju asja kuidagi lihtsalt viisil, et, et me teeme selle kuidagi ära. Et kui on pöördutud juba kohtusse, mis tahes põhjusel, siis on tekkinud kellegagi mingi sugune mure ja kohtukohus on see siis lahendada võimalikult mõistlikul ja sellisel. Võimalikult suures osas siis nii-öelda pooli arvestaval viisil. Ehk me üritame pakkuda ikkagi lõppkokkuvõttes sellist õigusrahu. Ja samal ajal ongi siis see, et kui neid teemasid on palju, kui asju tuleb palju ja ka nii-öelda teemad on keerulised, siis olukorras, kus sa ei taha teha seda otsust kuidagi kergekäeliselt pealiskaudselt, sest ma võin öelda, et ma, minu, ma ei tea ühtegi kol leegi, kes teeks oma tööd kuidagi pealiskaudselt. Et siis see, need nõudmised, mida sa juba iseenesele püstitad, siis sa, sa pead tegema , sa tahad teha ja sa tahad teha oma tööd hästi.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="378.72" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 6:19–6:39</span></span><span class="segment-text">Mari-Liis, justiits ja digiministeerium. Kuidas siis teie töömätas seda probleemi tunnetab ja, ja mida see teie jaoks tähendab , et, et kohtuasjad venivad ja, ja menetlusaeg läheb pikemaks?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="398.8" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:39–7:43</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See on meie jaoks hästi-hästi oluline teema ja, ja selles mõttes noh, tuleb olla posi tiivne tegelikult, sest Eesti kohtusüsteem on väga tubli, me oleme jätkuvalt, oleme tegelikult Euroopas nii-öelda tippude seas oma menetlusaegade osas. Aga, aga fakt on see, et see töökoormus võib-olla või suurenenud töökoormuse kõige selge m väljund ka, ka nii-öelda ühiskonnale on see, et menetlused pikenevad ja, ja tõepoolest noh, näiteks kriminaalmenetluste puhul tegelikult sisse tulevate asjade ar v on isegi vähenenud. Aga menetlusaeg on pikenenud ja, ja nüüd ongi küsimus selles, et kuidas me selle välja kutsega tegeleme, kuidas me seda ära hoiame, vähendame ja arvestades tõepoolest vaba riigi valitsuse poolt ette antud kärpeülesannet, mis mõjutab tegelikult järgmiste aasta te jooksul väga tugevalt ka sedasama võib-olla töökoormust arvestades eksju, et kohtu te eelarve koosnebki ju eelkõige nendest tööjõukuludest. Nii et see on meie jaoks äärmiselt-äärmiselt oluline teema ja õigusriigi tagamine te rvikuna on ülimalt oluline.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="463.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:43–8:31</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jakob, ma tulen sind kiusama nüüd. Et ma ütleks, et, et prokuratuur on ju kindlasti mõ nes mõttes ka. Noh, ütleme, kõik on tihedalt kohtutööga kindlasti seotud, et aga, aga sina siis kui Mõnes mõttes nagu riigi esindaja, et kuidas, kuidas teieni see probleem jõuab ja, ja näiteks ka kriminaalasjade puhul, et kui menetlused nagu venivad pikaks. Ja kohtunikel on see. Siis surve asjadega toime tulla. Kuidas teie siis maja seda, seda tajub ja mida see näiteks sinu jaoks isiklikult tähendab</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="512.32" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 8:32–9:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma arvan, et meie vaates on rõhk tõhususel ses mõttes, et tõesti nagu Mari-Liis väga õigesti ütles, siis ees seisavad ja käimas on väga märkimisväärsed kärped. Aga sellest hoolimata me peame toime tulema nende kriminaalmenetlustega, mis meie ees on ja me peame need ka õiglaselt lahendama, et seda nii prokuratuuri kui kohtute vaa tes. Seega praegu on ilmselt see õige aeg, kus viia läbi need muudatused, noh meie vaates just kriminaalmenetluses, mis teevad selle efektiivsemaks, nii et me saame kas vähema te inimestega või siis sama hulga inimestega lahendatud rohkem asju.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="551.08" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 9:11–9:50</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii, ja viimaseks Triin, sina kui siis justkui siis nii -öelda see vastaspool, et justkui nagu tundub, et, et, et te lähete nagu kohtu sse võib-olla näiteks prokuratuuri vastu vaidlema mõnikord. Aga sellest hoolimata on siis kohtunike töö kvaliteet ja just see, see menetluse aeg väga otseselt ka sinu tööga seotud. Et mida see tähendab siis eelkõige ühe advokaadi jaoks, kes selle siis konkreetse asjaga tegeleb.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="589.84" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:50–11:39</span></span><span class="segment-text">Just et no seda võib ette tulla tõesti, et me kohtusse läheme, vaidlema omavahel. Aga advokatuuri jaoks ja advokaatide jaoks jah, menetluse venimine on väga suur teema ja väga oluline teema. Ja sellepärast me vaatame ka suure murega neid kärpeid, sest me ju näeme, et kohtuni ke töökoormus on niigi kõrge ja menetlusajad venivad. Seda, see ei ole mingi saladus, et viimastel aastatel nad on järjest pikemaks läinud Ja siin tuleb ka tähele panna seda, et ühelt poolt see keskmine menetlusaeg, ta võib -olla ei olegi nii palju pikenenud, aga mida me ise näeme, on tihti see, et just sellist es keerulistes asjades kipub juhtuma ka mul endal on olnud asju, kus justkui kõik asjad on juba kohtule ära esitatud, kõik on tehtud. Ja siis on vaikus kohtult mitu kuud või äärmuslikel juhtudel isegi kuni kaks aastat on mul olnud. Ja sellises olukorras noh, üks pool on ja see, et mis on mõistetav, et inimeste põhi õigus on ju mõistliku aja jooksul menetlusele. Aga see ei ole lihtsalt, et me kaitseme niisama inimeste õigust kui sellist, et pike nenud menetlusajal on ka väga reaalne mõju kogu meie ühiskonnale, et muuhulgas on selle kohta erinevaid uuringuid, kuidas see majandust mõjutab. Et kohtud ju, mida nad teevad oma olemuslikult nad tagavad ühiskondliku kokkuleppe tä itmist, et inimesed täidavad seadusi, et nad täidavad lepinguid. Ja kui me ei saa seda kohtuotsust mõistliku aja jooksul, siis kogu see õiguskindlus ühis konnas väheneb, et on näidatud, et kui menetlused venivad, siis näiteks ka välisinve steeringute arv väheneb. Et sellel on väga suur mõju kogu meie ühiskonnale, kui me ei suuda hoida oma kohtusüsteem i efektiivsena ja kui me ei suuda seda menetlusaegade pikenemist ära hoida.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="699.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 11:39–11:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga kas on olemas üldse siis ka üksikisikule võimalikud õ iguskaitsevahendid selle vastu, kui näiteks peaks see menetlus ebamõistlikult pikale venima?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="714.92" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 11:55–12:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No sellist tõhusat õiguskaitsevahendit ei ole, et jah, kui menetlus on üheksa kuud se isnud, siis me võime taotleda menetluse kiirendamist. See tähendab seda, et siis kohus peab sellele reageerima ja tegema järgmise nii-öelda sammu menetluses. Aga noh, praktikas võib juhtuda, et okei, et siis õnnestub see järgmine samm ära teha , aga see ei tähenda, et see lõpplahend endiselt kiiremini tuleb ja, ja noh, jah, lõ puks võib minna ka inimõiguste kohtusse ja kompensatsiooni nõuda, kui, kui liiga pik k menetlus on, aga aga ütleme nii, et ega see kompensatsioon isegi kui kellelgi õnne stub see saada, ei kata tõenäoliselt seda või ei lahenda seda probleemi, et mis see pi kk menetlus on juba tekitanud.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="755.52" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 12:36–12:48</span></span><span class="segment-text">Merid, palju sina oled kokku puutunud sellega, et taodeldakse siis menetluse ki irmenetlust siis, et tehakse järgmine samm menetluses.</span></button>
