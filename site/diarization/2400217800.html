    <div class="segments"><button type="button" class="segment-card" data-segment-id="segment-0001" data-start="10.92" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 0:11–5:00</span></span><span class="segment-text">On täpselt südapäev, tere päevast, head Arvamusfestivali külalised. Tere tulemast festivali Teise päeva tervise tulevikuala teisele debatile. No täna hommikul siia Paidesse jõudes ja värskelt niidetud heinamaal oma autot parki sin, parkides ründasid mind kohe verejanulised sääsed. Selle võrra on mul väga hea meel olla tervisealal. Olen saanud siin kõrval asuvast kiirabitelgist kosutust. Millised on aga need sügelema ajavad punnid ja hammustused, mis puudutavad Eesti tervi shoiusüsteemi laiemalt, sealhulgas konkurentsi seisab meil ees läbi arutada järgmise orienteeruvalt üheksakümne minuti jooksul. No tervishoiu arenguid ja tulevikku puudutav debatt on Eestis noh, kuidas öelda, tih ti veidi lombakas või vastuoluline. Ühelt poolt toetutakse meile sellest rääkides teesile, printsiibile, et tavapärane tu ruloogika tervise valdkonda justkui ei sobi, seda seal rakendada ei saa. Ja seetõttu tuleb ettevaatlikult suhtuda muuhulgas ka näiteks meie tänasesse peamisse jututeemasse konkurentsi. Samal ajal leitakse aga teiselt poolt, et näiteks ravimite valdkonnas võiks seda kon kurentsi hoopistükkis suurendada ja samal ajal kõlavad ühiskonnas järjest valjemalt hääl ed, mis kutsuvad üles tervishoiu ja ravimisektorit laiemalt konsolideerima. See tähendab võimaldada siis turul tegutseda väiksemal arvul suurematel tegijatel. Meid huvitab täna see küsimus, kuhu need arengud jõuavad, kuidas nad muudavad meie te rvishoiusüsteemi, teevad nad selle tugevdamaks, tugevamaks või hoopis murendavad. Milline peaks olema tervishoiusüsteemis era ja avaliku sektori konkurents, tasakaal ning kas konkurents kui selline on osa lahendusest tervishoiust rääkides või hoopistükkis probleem? Me soovime tänase arutelu jooksul käsitleda tervishoiuteemat tervikuna. Kindlasti ei taha me vastandada era ega avalikku sektorit. Me sooviksime laduda oma kivi sellesse müüri, mis on ju tervishoiusüsteemist rääkides selle keskne tegelane või peategelane patsient ja tema tervis. Seda enam, et minister Joller andis meile neil päevil siin selleks ka haruldaselt hea võimaluse, loobudes Tervisekassalt siis küsima lisaraha järgmiseks aastaks. Loobus ta tõenäoliselt ka kavandatavatest reformidest, kui see nii tõesti peaks mine ma, annab see meile minu hinnangul väga hea ja vajaliku pausi selleks, et asja üle aru tada, oma mõtteid formuleerida järgmise aasta Riigikogu valimisteks ja selleks , et nüüd see ulatuslik problemaatika ka kenasti esitatud saaks, oleme täna palunud siia arutelule terve rea eksperte, kellega me kohe ka tuttavaks saame. Aktsiaselts Magnum juhatuse esimees Mari Krass, tere. Riigikogu sotsiaalkomisjoni aseesimees Jaanus Karilaid, Isamaa erakond. Tere päevast. Tallinna kiirabi peaarst ja juht Raul Adlas, tere päevast. Riigikogu sotsiaalkomisjoni liige Tanel Kiik sotsiaaldemokraat. Ja Eesti Ringhäälingute Liidu tegevjuht, temaatika aktiivne jälgija ja patsient, nagu ta enda kohta sageli oma juhitavates raadiosaadetes öelnud on Rein Lang ja tasub vist öelda ka Reformierakond, tere, Rein. Ja mina olen siis Mart Mardisalu, kes jagab panelistidele täna need süstid kätte. Me oleme oma arutelu jaganud mõtteliselt viide ossa. Loodame selle vestluse lõpus ka teid, head kuulajad, kaasata. Kui teil relevantseid küsimusi panelistidele olema peaks ning olgu öeldud ka seegi, et tänast debatti saab jälgida otseülekandes Postimehe veebiküljelt mettuudiste veebikü ljelt ja järelvaatamiseks avanevad võimalused Youtube&#x27;ist ja Spotifyst. Ja võtame siis härjal sarvist. Esimeses sissejuhatavas voorus tahaksime patsientidelt või panelistidelt võib-olla tä psemat ülevaadet sellele, mida me üldse silmas peame, kui me konkurentsist tervishoi us räägime. Lähenemisviise on siin tõepoolest erinevaid ja mitmeid. Püüaksime nii-öelda kuidagi lipu maasse torgata ja end selles küsimuses kaardistada. Mari Krass, millest me siis räägime, kui me räägime konkurentsist meditsiinis?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="299.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:00–7:15</span></span><span class="segment-text">Ja tõepoolest konkurents meditsiinis ainult sellise ühe lausena on, on kahjuks läbi aasta te kujunenud natukene tabuteemaks. Et minu meelest sellest tuleneb ka selliseid dogmasid, kus öeldaksegi, et jah, konku rents tervishoidu ei sobi, aga kui me vaatame natukene sisse, et mida see siis tähendab või millest räägitakse, et siis mina väga selgelt näen, et et üks asi on tõepoolest kon kurents, konkurents tervishoiuteenuse valdkonnas. Üks asi on konkurents tööandjate omavaheline konkurents tervishoiutöötajate üle, siis kindlasti esineb konkurentsitasand veel konkurents Tervisekassa raha, rahakasutuse üle , et tegelikult need konkurentsi aspekte on hästi-hästi mitmeid ja me loodame, et täna jõuame nendest nii nii mõndagi põhjalikumalt arutada. Mina kindlasti olen selles, selles nurgas või, või kaldun sinnapoole, et me võiksime tervishoius konkurentsi julgemalt kasutada, julgemalt lubada, olla avatumad ja, ja, ja ma usun, et see viib parema kvaliteedini, see viib valikuvabaduseni, mis on väga oluline nii patsiendi kui tervishoiutöötaja jaoks. Ma jätsin nimetamata patsiendid võiksid ju ka saada valida, millisesse tervishoiuasutus se nad lähevad ja ja kellelt nad teenust soovivad saada. Ehk et see paljuräägitud lause raha liigub koos patsiendiga on tegelikult ju endiselt laual ja endiselt Eestis vähemalt lahendamata. Ehk et, et mitte minna oma oma avasõnadega liiga pikaks. Tõepoolest see on seinast seina maailm ja, ja ühtset hinnangut sellele anda absoluut selt kindlasti ei saa, nagu ikka, tõde on kusagil vahepeal. Loomulikult on tervishoid valdkond, mis ei, ei kuulu nii-öelda täiesti vaba konkuren tsi maailma ja vaba konkurentsi tingimustesse, see peab olema reguleeritud. Inimestel peab olema tagatud tervishoid, peab ole <button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="442" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:22–9:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja kõige tähtsam ongi see, et me neid ei vastandaks avaliku ja era, et nad täiendavad üksteist ja ma olen paljuski eelkõnelejaga nõus, et me konkurents täna on juba olemas , tegelikult see mudel nagu mõnes mõttes toimib, küsimus on, kuidas me seda nüüd disa inime nii, et me teeme asja paremaks patsiendi vaatevinklist. Et patsient saaks siis parimat teenust võimalikult kiiresti ja me alati, kui me mingi t ülesannet vaatame, me vaatame, mis taustsüsteemis me oleme, oleme demograafia kriis is, me oleme olukorras, kus tööjõud on tegelikult suur probleem ja oleme olukorras, kus me seitse koma viis protsenti SKP-st paneme tervishoidu, oleme selle juures väga efe ktiivsed, aga ilmselge on see, et rahapuudus on olemas. Küsimus, kust me seda raha nagu lisaraha saame? Pärast sellist suurt maksukaost, mis on olnud siin viimased kolm, kolm aastat, keegi ei taha ju rääkida uutest maksudest, ei saagi rääkida, on ju küsimus, kus me siis saa me seda lisaraha. Kas me, kas me siis seda elavdame konkurentsimudelit, kas me panustame ennetusse? Et igal juhul neid võimalusi on nagu olemas, aga seda konkurentsimudelit kindlasti tule ks kokkuvõtlikult sissejuhatuses öelda, et seda avalikku ja era tuleb näha koostöös ja , ja, ja mitte siis hakata siin ütlema, et kumb on parem, kumb on halvem. Et selline see debatt, mis siin kunagi oli, mingi aeg tagasi, ma õnneks on see vist m öödas, nii et tundub, et kuidas me seda mudelit täna nii disainime, et me saame sinna ka raha juurde tuua ja, ja mul on kahtlemata ka mõtteid, mida ma siis hiljem ka paku n välja, et kus ma näen, et kus me seda turgu saaksime ka meie tervishoius elav elav dada. Nii et see on sissejuhatav markeering.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="678.88" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 11:19–11:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">da. No see vist kipub olema see üks ja ainuke vähemalt kõige suurem konkurents just nime lt see rahastus, aga hea kui see praegu sinnapaika. Tanel, kuidas teie enda jaoks konkurentsi meditsiinisektoris lahti mõtestaksite, mida see teie jaoks tähendab?</span></button>
