    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.48" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 0:10–2:31</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere kõigile, tere tulemast arutelule, nõusolek seksikuse summutaja või hoopis võime ndaja. Täna me ei räägi nõusoleku sellisest seaduse poolest või, või varju poolest või, või , või sellest, millega ta kõige rohkem nii-öelda meedias on. Me räägitakse tegelikult nõusolekust üha rohkem ala, riskide ja piiride ja selliste asjad e ümber ja nii võib jäädagi mulje, et tegelikult see on selline intiimsuse pidur ja a metlik kontrolli küsimus, mida siis nüüdsest on vaja iga kord küsida. Täna proovimegi vaadata asja teistpidi ja nii, et võib-olla me ei peakski alati rääki ma ainult nõusoleku küsimusest, vaid hoopis sellest, et me veendume, et nõusolek on ja nõusolek ei pea tulema alles vastusena küsimusele, vaid inimene võib oma soovi ja valmis olekut ka ise selgelt väljendada. Meie põhiküsimus täna saab olema see, et kas nõusolekus veendumine võib hoopis suure ndada mängulisust. Kas usaldust võib see suurendada lähedust ja miks mitte ka erutust. Ja minuga on täna laval Liisa Larm ja Lauri Pihkva. Teile annan peagi ka sõna, aga enne üks kokkulepe publikuga. Keegi pea täna enda eraelust midagi meile jagama ja me räägime olukordadest hästi ül diselt ja teie saate siis näiteks reageerida väidetele ning näidetele ja ühel hetkel ka soovi korral erinevaid küsimusi küsida. Ja mina kõigepealt küsingi teie käest esimese asjana, tõstke käsi, kui te olete sellega nõus. Kas te olete kuulnud väidet, et nõusoleku küsimine rikub spontaansuse või muudab inti imse hetke kohmakaks? Kas jah või jah? Ühesõnaga, kui te olete kuulnud, siis tõstke käsi. Väga hea. Ja kes arvab, et hästi väljendatud soov või nõusolekus veendumine võib hetke hoopis parem aks muuta? Suurepärane, hoidke see meeles selle kõige juurde, me tuleme selle paneeli lõpus tagasi Aga nüüd võtame esimese osa lahti, eesmärk võiks olla see, et, et me saaksime vabaks sellest ametlikust loast, sellest kujutusest, et see on mingisugune ametlik luba. Liisa, alustame sinuga. Kas probleem võibki alata sellest, et me, me räägime nõusolekus kui millegi küsimise st, see sõna küsimine ja, ja mis vahe on sinu arvates nõusoleku küsimusel ja nõusole kus veendumisel?</span></button>
