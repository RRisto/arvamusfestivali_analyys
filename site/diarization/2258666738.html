    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 0:11–1:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ilusat augustikuist laupäeva. Head kuulajad, panelistid meiega veebiülekandes liitunud ja viipekeele tõlgid. Mina olen Kati Pakratsebank, olen südamest õpetaja igapäevaselt, aga täna siis modera atori rollis ja kutsun teid siis avatud uste päevale mitmekultuurilisse Eesti kooli. Natukene võib-olla sissejuhatuseks Eesti koolid on muutumas ühe mitmekesisemaks eriku ltuuride ja kodukeeltega õpilased õpivad koos. Oleme arutelu põiminud isiklike keelelugusid, ühiskondlikke vaateid, räägime stereot üüpidest, räägime aktsepteerimisest, kultuuride eripäradest ja ühise keele ja üleüld se ühisosa otsimisest. Uurime, et milline võiks olla mitmekultuuriline Eesti kool, kus siis kõik lapsed tunne ksid, et nad oleksid väärtustatud, nähtud ja ühtsena. Ja enne kui avame uksed mitmekultuurilisse maailma Eesti koolis, lepime kokku, et iga arvamus ja vaade on lugupidav ja, ja kuulame ja ole ja see kõik on väärtuslik meie jaoks . Panelistidega tutvume me jooksvalt, meie arutelu käigus. Publiku seas on Karl Robert ja viipekeele tõlgid Keiti Veerpu ja Regina Paavo aitavad siis viia vestluste vaegkuulajateni. Ja võib-olla alustuseks selline ring, et tere Marta. Kuidas sulle tundub, kui tähtsaks peavad kaasõpilased mitme võõrkeele õppimist?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="111.6" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 1:52–2:13</span></span><span class="segment-text">Salve, multimehikampaania bensanaare Piul Inguasterani.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="133.4" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 2:13–2:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Äkki kõige raskem alustamiseks oli, et eestlased räägivad inglise keele, inglise keel t väga hästi ja iga kord, kui ma hakkasin rääkima eesti keeles aktsentiga me kiiresti vahetasime inglise keelde, aga jah, as a parent, was there any thing you were worried about when sending your child to an Estonian school?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="159.84" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:40–3:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma pean tunnistama jaa, tõepoolest ma pelgasin, et kas no ma kartsin, et laps tunneb ennast tõrjutuna sellepärast, et tuleb teisest kultuuriruumis, aga ma pigem kartsin, et kas tema keeleoskus, eesti keele oskus on piisav selleks, et suhelda teiste laste ga, ta väga tahtis sõpru saada. Aga no õnneks lapsed ei mõtle nendest kategooriates nagu meie ega nende sõprus ei põhi ne keeleoskuse peal ja see hirm, ma ei tea, kahe kuu mul läks üle, et kõik on hästi praegu .</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="193.96" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:14–3:55</span></span><span class="segment-text">Virve. Kati, what would you say brings joy to s tudents in learning different languages?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="235.2" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 3:55–7:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Definitely, these communication, using different digital skills and digital devices de finitely this is what matters to them. Ja, ja näeme, et keeleõppest on rõõmu pakkunud vist kõigile panelist idele, et meie selline väike avavooru algus oli mõeldudki selleks, et näidata, kui palju keeli meie sees on meie ümber ja milliste rikkust endaga kaasa toob. Aga enne, kui me läheme selliste sügavamate teemadeni, et vaatame korra, mida ütleb s tatistika. Ma viitan kahel korral statistilistele andmetele ja kasutan Euroopa Komisjoni Rita R änne ja Statistikaameti andmeid. Euroopa Komisjoni läbi viidud uuringus mitmekeelsuse teemal kahe tuhande kahekümne kolm andal aastal osales Eestis siis tuhat neli intervjueeritavat ja eestlased arvasid, et me peaksime oskama rääkima vähemalt ühte keelt lisaks oma emakeelele üheksakümmend protsenti . Eesti kontekstis arvati ka, et teist keelt lisaks emakeelele, mis on kõige kasumliku maks isiklikuks arenguks, olid inglise keel seitsekümmend kuus protsenti, vene keel kolm kümmend kaks ja eesti keel kuusteist protsenti. Oma lastele arvatakse, et kõige tähtsamad teised keeled lisaks emakeelele on inglise keel kaheksakümmend kuus protsenti vene keel, kakskümmend üks protsenti saksa keel, kaks teist protsenti ja eesti keel kümme protsenti. Ja eelised uue keele õppimisel on siis eelkõige seotud tööga teises riigis, aru saada teiste kultuuride inimestest ja saada parem töökoht. Nendel oli kõigil üle viiekümne protsendi. Ja mis puudutas keele õppimist, siis kõige efektiivsemaks viisiks peetakse koolis ja haridussüsteemis kakskümmend neli protsenti ja siis vähem suhtlemaks emakeeles kõnelejatega sihtriigi külastused. Nii et selle statistika pealt on praegult täitsa huvitav vaadata, mida arvab publik. Nii et kaasame teid ka aeg-ajalt ja ma palun, et te võtaksite selle kaardi, mis teil oli tooli peal ja siin on seda statistikat näha ka, millest me täna räägime, nii et tõ stame korra ja hääletame. Esimene väide. Kadri esimene väide. Nii vähemalt üks võõrkeele oskus peaks olema. Iga inimene peab oskama vähemalt ühte võõrkeelt nii ja ei siiapoole jah, meie poole. Ja roheline on meie poole ja aitäh, aga võtame kohe, ega inimene peab oskama vähemalt kahte võõrkeelt. Aitäh, nii kaks võõrkeelt, mis on kõige tähtsamad, on inglise ja vene keel ja , ja ei ja hääletus. Aitäh ja usun, et kõige efektiivsem viis on õppida keeli koolis. Aitäh teile, publik ja panelistid, mis me nägime publikute seas.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="430.92" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:11–7:31</span></span><span class="segment-text">Ma olen väga huvitatud teada, millised võõrkeelad on olulisemad. No minu jaoks eesti keel on minu ainuke võõrkeel, inglise keel on minu emakeel. Aga ma nägin päris palju ei-d, et, et kõige tähtsamad on inglise või või vene keel.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="451.4" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 7:31–7:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga proovime korra inglise vene keel oli vähem, kuidas on inglise ja saksa keel ja või ei? Inglise ja prantsuse keel. Inglise ja soome keel. Kas, kas inglise keel on kõige number üks järgmine oligi ja ma tahtsin inglise keele</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="476" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 7:56–8:13</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">ära jätta, aga seda ei olnud. Vabandust, võib-olla mõned leiavad, et, et, et ongi kõige parem, kui on väga palju erinev aid võõrkeeli ja kõik ei pea kahte konkreetset võõrkeelt rääkima. Et kes oleks sellega nõus. Oi kui tore.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="492.56" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 8:13–8:17</span></span><span class="segment-text">Pigem on vist oluline lihtsalt see mitmekesisus, et ei olegi nii kindel see üks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="497.4" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 8:17–8:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga kuidas meil on siis võõrkeelte õppimisega koolis? Et meil on siin jooksvalt tutvuda meie panelistidega, meil on koolijuht, meil on lapse vanem, meil on keeleekspert ja meil on õpilane ja teil kõigil on kokkupuu, et kuidas võõrkeelte õppimisega koolis läheb.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="513.36" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 8:33–9:26</span></span><span class="segment-text">Minu isiklik kogemus oli, et koolis ei olnud kõige efektiivsem isegi kui ma tulin Eestis se ja hakkasin õppima ühes keelekoolis, keeltekoolis. See suur grupp ja see ei töötanud minu jaoks väga hästi. Siis see oli ainuke, kui mul oli eraõpetaja, üks-ühele ja oma perekonnaga, oma na ise ja tema lastega, siis ma ma tunnen päriselt hakkasin õppima. Aga kooli direktorina, kus me, me õpetame päris palju keelt koolis . Ma öeldakse, et kooli kontekstis, kuidas sa õpid koolis, kas õpetaja lihtsalt räägib sulle ja sa tõlgid või sul on aega rääkida teiste no õpilastega. See on erinevad viisid, kuidas õppida koolis.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="566.4" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 9:26–10:34</span></span><span class="segment-text">Jah mina ütleksin, et nõus täiesti ja ma ütleksin, et meie võõrke elte õppimise maastik Eestis on väga kirju. Et ühelt poolt on õudselt hea, et me, et koolid õpetavad, lapsed peavad õppima kahte võõrkeelt, see on suurepärane võimalus neile. Aga sõltuvalt õpetajast, koolist, õpilaste motivatsioonist ja ka keelest on väga erinev edukus ja näiteks minu laste kogemuse põhjal ma ütleksin, et vene keelt ja inglise keelt ja saksa keelt õpetatakse väga-väga erinevalt ja see, mis jõuab õpilase ni, motiveerimise mõttes ja ka keeleoskuse mõttes on siis väga erinev ka, ma leian, et me ei kasuta piisavalt hästi ära seda, et meil on väga suur venekeelne kogukond Eestis , kellega õpilased, kes õpivad võõrkeelena vene keelt, võiksid suhelda, et see suhtle mine nagu Iien ütles kõige olulisem aspekt keele omandamisel ja seda ei, seda ei, ei , ei soodustata või seda ei kasutata keeleõppes ära.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0014" data-start="634.24" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 10:34–11:09</span></span><span class="segment-text">Ja ma ütleks omast kogemusest lihtsalt juurde, et ma olen õppinud koolis hästi palju erinevaid keeli, aga ma ütleks, et just minu jaoks kõige tugevamad on need, mida ma olen ise endale kas õpetanud või näiteks inglise keel, millega ma küll olen koolis õppinud , aga peamiselt puutun ikkagi kokku meedias ja igapäevaelus. Et koolis ja klassiruumis on tõesti väga keeruline keelt õppida, sest et ongi, sul ei ole seda suhtlust nende inimestega ja see, et sa loed nagu õpikust mingit ülesannet, see tegelikult ei õpeta sulle keelt, sa lihtsalt õpid sõnu pähe ja see nagu loogika ei arene niimoodi, et sul ongi vaja seda suhtlust just, mis nagu on juba korduvalt maini</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="669.48" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 11:09–11:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">tud. Ja aga me lähme kohe siit edasi ja esimene suur teema, mille me avame, on stereotüüb id ja vaatame Eesti Keele Instituudi ühisõnastikust ka, et mida see täpsemalt tähendab , see on siis kinnistunud, kivinenud ja harilikult lihtsustatud hoiak või arusaam. Nii et kuidas on siis mitmekeelses ja kultuurilises koolis need stereotüübid ja esimese na avab Uljana selle paneeli siis oma keelelooga. Palun, Uljana.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0016" data-start="700.96" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 11:41–12:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah, et minu eesti keele õppimise teekond on olnud päris pikk ja pole siiamaani lõpp enud, lõppenud. Ma küll õppisin eesti keelt koolis, venekeelses koolis ja oli, olin tundides viieline , aga õpik nagu Mardi juba rääkis ja päris elu ei läinud kokku. Sest väljaspool kooli ma saan aru, et mul on raske eestlastest aru saada, mul on raske eestlastega rääkida, see kõik sõnavara üldse ei sobi ja aida siiski suhtlemine eestlaste ga, mida ma rohkem kuulasin, seda ma paremini kordasin ja aastaid hiljem ma otsustasin oma last panna just eestikeelsesse kooli, et temal oleks lihtsam kui tema emal ja seda teekonda, mida mina läbisin kolmekümne aastaga, tema läbis vaid aastaga, ta just lõpe tas esimese klassi ja nüüd ta väljendab end absoluutselt vabalt.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="755.88" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 12:36–12:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh, Uljana, selle keeleloo eest ja esimene küsimus kohe sulle, et kuidas siis lapse l läks üks aasta ja sul nii palju kauem?</span></button>
