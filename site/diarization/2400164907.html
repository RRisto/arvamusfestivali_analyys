    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 0:12–2:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii, tere, tere tulemast siia alushariduse alale. Mina olen Anne-Maimeesak, Tallinna Ülikooli hariduspsühholoogiakeskusest ja mul on suur rõõm üleüldse olla täna siin alal ja, ja täna avada meie päeva esimene siis arutelu. Suured tänud korraldajatele, et, et ta nii seda ala eest vedasite, kui usaldasite mi nd seda, seda arutelu siin vedama. Et täna räägime me teemast, mis sageli võib kõlada justkui sellise kitsa hariduspo liitilise küsimusena, kuid tegelikult ju seda ei ole, ehk siis meie teema on iga lapse tulevik, on Eesti arengu küsimus. Tegelikult see teema juba peaks ära ütlema, et see, mis, mis juhtub lapse siis va rajaste aastatega, on väga oluline ja, ja sellest siis oleneb nii paljugi muud. Mitte siis ainult tegelikult see alushariduse valdkond. See kandub edasi kooli, tööle ja, ja lihtsalt ka lapse edasisse heaolusse. Ja minu roll siis täna ongi siin, et hoida seda arutelu siis selle juures, et, et me ei unustaks ära seda last siin küsimuses, et me mõtleks sellele, kuidas me tõesti siis väärtustame iga iga last ja tema arengut. Ja meil on siin täna laua ääres inimesed, kes näevad tegelikult seda küsimust väga erinevate st vaatevinklitest, et minuga on täna siin Jaak, Marju, Lembit, Maarja ja Lavly ja anna ksingi teile endale sõna, et korra siis ennast tutvustada ja öelda ka võib-olla ühe- kahe lausega, et mis teid täna siia toob, miks see tänane teema oli teie jaoks piisa valt oluline, et siin paneelis osaleda. Nii võtame võib-olla Lavly.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="136.64" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 2:17–4:16</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Ma kõigepealt ütlen siiralt suure aitäh, et, et olete ma siia kutsunud, ma tahaks just kui vastu küsida, et huvitav, miks ma siin olen, sest ma just ütlesin naabrile, et vaata n paremale käele ja vaatan kõikidele alt üles, sest julgen öelda, et teie teate seda teemat, millest me rääkima hakkame oluliselt rohkem kui mina, mis siis, et ma olen ka kolme lapse ema. Ja, ja samas ma mõtlen, et aga võib-olla ma sellepärast olengi siin, et see võiks olla selline väike mudel poliitikast, poliitilistest otsustest. Et poliitikute ülesanne on alati kuulata oma valdkondade parimaid ja pakkuda välja see maailmavaateline otsus, et kas me siis läheme seda rada või mitte, seda otsustavad vali jad. Aga miks ma siin olen, ma arvangi, on, on täpselt see, et eks me ju oleme võtnud sõna ka haridusteemale, ma ikkagi arvan naljaga pooleks, et ma ei ole siin sellepärast, et ma olen kolme lapse ema, sest tegelikult olen ma ju jurist, aga, aga, aga ma loodan, et ma olen siin sellepärast, et kui me räägime, ma ei tea, vabadusest ja madalatest ma ksudest, siis võib ju tunduda, et kuidas see kõik haridusega kokku puutub, aga ükskõ ik, kas me võtame selle personaliseeritud lähenemise, kui me räägime, ma ei tea toetus test või me räägime nagu haridusest, kus me julgeme öelda, et ka kõrghariduses, sest alusharidusest kõik algab kõrgharidus on see hariduse tippude tipp, seal kõik lõpeb, peab olema osaliselt, osaliselt tasuline, siis me jõuame kõikide nende aruteludega selle ni, et kuidas siis päriselt ühiskonnas võiks, sest see, mida parempoolsed on alguses t peale välja öelnud, haridussüsteemi on ainult üks eesmärk ja siis ma lõpetan. See on see, et sealt väljuks. Ja kuigi see sõna on kole, väljuks maailma kõige konkurentsivõimelisemad noored. Ja, ja see tähendab kolme asja heas hariduses, see tähendab teadmisi, see tähendab o skust ise hakkama saada ja see tähendab võimet olla eluga rahul, näidata näha enda ees ilusat tulevikku, nii et ma arvan, sellepärast aitäh. Aitäh sulle ja Maarja üks-kaks lauset.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="255.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 4:16–4:17</span></span><span class="segment-text">Nii kas on kosta?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="257.12" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 4:17–5:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja on. Ja tere, mina olen Maarja, mina esindan lapse heaolu arengukeskust ja mida meie teeme , me oleme välja arendanud sellise ennetuse varajase märkamise lapsevanemate toetamise mudeli ja siis toetame läbi, rakendame seda mudelit läbi perepesa selliste perekesku ste üle Eesti. Aga võib-olla alustaks korraks, et, et, et see, et Lauli, et te ütlesite, et miks teie siin olete, ma arvan, ainus mõte, miks mina ja võib-olla meie siin oleme, on just sellepärast , et meie teame, mis on probleemid, aga see sõnum nagu päriselt viia kohale poliitik akujundajateni. Aga et miks, mis see teema minu jaoks tähendab, et et, et rääkisime, et Eesti tulevik ja, ja laps on Eesti tulevik, et siis Eesti tulevik ei alga ülikoolist, Eesti tulevik ei alga tegelikult ka koolisüsteemiga, vaid Eesti tulevik algab nii-öelda lapsevanema sülest ehk siis, et kuidas me täna suudame neid peresid toetada selleks, et nad suuda ksid omakorda toetada last, et, et just need esimesed eluaastad, mis on kõige olulise mad, sest siis see lapse aju areneb välja ja, ja, ja, ja pannakse alus tema toimetule kule ja õpivõimele ja kui Lavly te rääkisite just sellest Eesti konkurentsivõimest, et siis me jõuame detailidesse hiljem, et, et just vaadata neid mõjuuuringuid, et, et erinev ad mõjuuuringud ja ka rahvusvaheline praktika näitab seda, et just nimelt see esimes te eluaastate toetamine on see, kuhu me peame investeerima, sest sealt sõltub Eesti kon kurentsivõime. Vot ja seda me perepesadega siis oma väikse sammu läbi kodanikualgatuse oleme siis nüüd nagu tegemas.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="355.44" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 5:55–7:15</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja tere hommikust. Kui mind siia juba kutsuti, siis esimese asjana ma kasutan tõesti häbitult võimalust tervitada Tartu Karlova lasteaia õnnepärelite rühma fantastilisi õpetajaid-kasvataja id ja abiõpetajaid, õpetajaabisid üks ja kaks ja kes seal kõik on. Et te olete suurepärased. Mida ma tahaks öelda loomulikult kõikide õpetajate kasvatajate õpetajad ja, ja teist e kohta. Aga nendega mul isiklikku kogemust vähemasti hetkel ei ole. Aga kogemus, mis mul on, on Eesti suuruselt teise omavalitsuse haridusvaldkonna, seal hulgas siis alushariduse eest vastutamine abilinnapeana Tartus ja ma tahaks uskuda, et mind ei ole siia kutsutud ilusate silmade pärast, vaid selleks, et tuua seda kohalikku pidaja vaadet. Sest Eestis on ju niimoodi, et alusharidus ja lapsed on kõigi teema, aga see, kelle la ua peal see Exceli tabel, kus on kõik ilusad mõtted ja nende hinnasildid, see kokku tuleb , et see laud asub ikkagi kas Raekojas või vallavalitsuses ja, ja mina olen seda Exce lit kokku pannud, nii et tahan, tahan seda kohalikku vaadet ja kohalikku vastutust natukene kirjeldada ja rääkida sellest.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="435.2" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 7:15–8:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt, mina olen Marju Saar ja olen täna siin, et anda sellesse arutellu sellist praktikuvaadet, et olen alusharidusvaldkonnas olnud tegev kakskümmend neli aastat erinevates positsioonides lasteaiaõpetaja, tugispetsialist, lasteaiajuht ja ka pidaja ja nii munitsipaal kui erasektoris olen siis tegutsenud ja täna siis valdavalt nagu era sektoris tegev. Ehk siis soovin siia tuua siis sellist eriilmelisust alushariduses, et, et ma saan aru seda teemat, et alusharidus, miks see alusharidus on oluline ja kuidas see laste are ngut see esimesed seitse eluaastat mõjutavad, et seda on kõik tänased panelistid juba puudutanud ka, et, et seda ma uuesti nagu lauda ei too, aga võib-olla nagu selline huvitav ajastu, millel me elame, on see, et eelmise aasta septembris sai vastu võetud uus alus haridus, mis tõi selliseid teatavaid muudatusi alusharidusvaldkonda ja et elame ka sellise l ajastul, kus see demograafiline seis on selline, et et lapsi sünnib järjest vähem, ehk siis kui alushariduse põhiline probleem varasematel aastatel oli see, et on tohu tu kohtade puudus ja lahendati kohtade puudust, siis täna me oleme nagu võiks öelda isegi vastupidises olukorras ja ja, ja siis ongi laual, et mis siis nüüd see järgmine probleem on, et mida me lahendame, et kohtade probleem on lahendatud, et, et äkki nüüd vaatame sinna sisu ja kvaliteedi poole edasi, et võib-olla see on see minu nurk, kus ma täna oma panust soovin anda.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="526.6" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 8:47–9:40</span></span><span class="segment-text">Tere hommikust, minu nimi on Jaak. Põhitöökoht on mul isa, leiba teenin Haridus- ja Noorteameti peadirektorina. Ja nüüd siin, siin täna Arvamusfestivalil, olen tänu sellele, et siis väikese, väike se sõbrad kutsusid, on üks asi ja teine on see, et nüüd siis selle leiva teenimise poole pealt vaadates, siis ma arvan, et alusharidus ei saa ühiskondlikus plaanis seda tähelepanu, mida ta väärib. Ja, ja kombineerides siis isa ametit enda põhitööga, siis tunne n, et mul on võimalus selles küsimuses seda tähelepanu defitsiiti vähendada. Ja, ja sestap, sestap olengi siin ja proovin siis seda defitsiiti vähendada.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="579.68" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 9:40–10:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh kõigile. Väga hea, et te tegelikult kõik juba ühel või teisel moel tõite välja selle kui oluline alusharidus on ja, ja mõned juba ka siin viitasid sellele, kui palju tegelikult loeb sellest, mis, mis meil varajaste aastate jooksul toimub, mis tegelikult siis kandub meil edasi, eks ole. Et ka paljud longitud uuringud ju tegelikult näitavad seda, et varajased oskused mõju tavad paratamatult edasi, sest hakkamasaamist ja tegelikult näitavad ka majandusuuri ngud seda, et kui me investeerime vara, siis meil on ka kõige suurem nii-öelda see too tlikkus või, või see tagasiside, mis me sealt saame. Aga praegust olukorda vaadates ei tundu justkui, et alusharidus meil oleks, eks ole, nii suurt prioriteet, kui ta sõnade järgi peaks olema. Et miks peaks või, või miks siis ikkagi ei peaks alus, alusharidus olema meil priori teet kui valik käib näiteks tervishoiu või ka kaitsekulude mõistes, eks ole, et kuidas me ikkagi saaksime suurendada neid investeeringuid?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="644" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 10:44–13:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Lembit, palun. Esiteks ma väga vabandan, aga ma lihtsalt alati pean ebatäpsusi parandama selles val las, et tulles kohalikust omavalitsusest, mille eelarve pannakse kokku väga kindlate reeglite järgi, kuigi ma saan nii-öelda metafooriliselt sellest aru, kui me räägime a lusharidusest kui investeeringust, siis tegemist on tegevuskuluga. Ja sellele kehtivad täiesti teised eelarvereeglid, et tegevuskulusid on ainult võimalik teha tegevustulude eest. Investeeringud teed, tänavad, needsamad majad ja nii edasi. See on, need on teised eelarve ära, aga taas, et see ei kuidagi, ei vähenda selle mõ tte metafoorilist tähendust, et me investeerime tulevikku, aga nüüd selle jaoks, kelle , kelle käes on see rahakott, kust need kulud reaalselt tulevad, ei ole tegemist fina ntsilises mõttes investeeringuga ja, ja see mõjutab väga palju seda, kui palju me saa me endale lubada, me ei saa nagu üle üle oma võime elada, see on, see on selge, eks ju Aga nüüd see põhiküsimus tegelikult oli sellest, et kuidas me siis seame seda priori teeti riigikaitse ja, ja alushariduse vahel piltlikult öeldes, kui, kui me väga-vä ga nagu labastame seda asja. Ja siin ma tahan tagasi tulla selle juurde, et, et siin on tegelikult me segame väga kaks asja. Riiklikud ülesanded ja kohalikud ülesanded, riigikaitse ei ole kohaliku omavalitsuse ülesanne, laiapindne riigikaitse, valmisolek nii edasi. Jah, aga kui me räägime riigikaitsest, siis me üldiselt räägime asjadest, mis lendavad ja teevad pauku. Ja sellega ei tegele ei Tartu linn isegi mitte Tallinna linn, rääkimata väiksematest omavalitsustest. Alusharidus seevastu on seaduse tasemel väga selgelt pandud kohustusena omavalitsusele Ja seega t
