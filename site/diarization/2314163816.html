<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="176.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 2:57–6:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma, ma võin alustada ja ma võin alustada küll. Tere kõigile, mul on väga hea meel siin olla, väga auväärses seltskonnas muidugi. Aga et, et mul on hea meel, et sellest rääkida ka just nimelt sellise pilguga, et, et noh, mis siis tegelikult, mis tegelikult toimub. Kuidas mõista ameeriklasi, kust seda infot, allika infoallikat ja seda nii-öelda info t ammutada, siis no noh selge on see, et kõige paremini selleks, et ameeriklasi mõis tab, et see olema ameeriklane. Olgem ausad või siis seal elanud, eks ju, ja, ja et, et aga no olgem ausad, eks me oleme siin eestlased ja, ja et, et me peame kuskilt leidma selle nagu arusaama, miks nad käi tuvad nii nagu nad käituvad, miks nad mõtlevad nii nagu nad mõtlevad, miks nad valivad neid inimesi, keda nad valivad, miks nad hääletavad selliste asjade poolt, mida nad tee vad, ehk siis nagu et, et seda empaatiat on natuke keeruline aru saada siis kui sa ei ole seal olnud. Minul on olnud selline nii-öelda privileeg, et, et siis kui ma olin laps, laps, noor Kui ma käisin üheksandas ja kümnendas klassis keskaas, et siis mul oli võimalik kaks aastat elada Ameerika Ühendriikides seal justnimelt seal selles Kesk-Lääne ja, ja lõ unaosariikides nagu Kentucky osariigis ühes väikeses nelja tuhande elanikuga linnake ses nimega Wilmore. Ja siis teise aasta ühes väikeses neljasaja tuhande inimesega linnakeses nagu Talsa O klahoma. Ehk siis nagu, et, et Kentucky&#x27;s ja, ja, ja siis Oklahomas, et see oli nagu üks niisu gune nagu tükk. Muidugi siis, kui ma siis töötasin ERR-is korrespondendina kolm pool aastat seal, et , et siis, siis ma elasin enamasti Washingtoni ehk siis pealinnas sealjuures ja, ja mul oli siis nii-öelda sihuk <button type="button" class="segment-card" data-segment-id="segment-0009" data-start="722.08" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 12:02–14:30</span></span><span class="segment-text">Kas ma tohin, lihtsalt korraks nagu ma räägin sellest Fox Newsi loogikast ka veel, nagu lihtsalt Ameerika meediatarbimise loogika vaatenurgast ka. Nii Fox News, uudistekanal, samasuguseid uudistekanaleid on Ameerikas suuresti kolm. Fox News MSNBC ja CNN, need on siis need kolm suurt uudistekanalit. Hoolimata sellest, et Fox News on selgelt kõige suurem auditooriumiga, vaatab neid võib -olla õhtul kõige primetime&#x27;i ajal mingisugune nii-öelda üks-kaks miljonit inimest, üks -kaks miljonit inimest, kolmesaja kahekümnest miljonist. Ehk siis kolmsada kakskümmend miljonit beebid ja vanurid võib-olla välja arvata. Võib-olla need, kes ei oska inglise keelt väga hästi ka, eks ju, aga ikkagi nagu üks -kaks miljonit, see on nagu nii-öelda protsendiliselt me ei saa seda võrreldagi Aktu aalse kaameraga või mingisuguse siukse asjaga, eks ju. Et, et see, see on nagu, sellel on tohutu suur jälgijaskond võrreldes teiste uudiste kanalitega, aga mitte tohutu suur jälgijaskond võrreldes üleüldise uudistevooga Ameeri ka Ühendriikides. Kõige rohkem, kuni siis vist selle aastani oli see kõige rohkem said ameeriklased kätte oma uudised ja oma meedia kohaliku telekanali õhtustest uudistest, mis võis olla Fox või NBC või CBS, millel on siis nagu iga päev näitavad õhtul seal ma ei tea, laua noor derit ja siis nagu siis vahele tuleb noh, mida näeb siis kogu Ameerika ja siis sinu koha lik Cincinnati tev mingisugune usecast tuleb siis kell kaheksa ja ütleb news, et ei. Ja siis nemad siis kajastavad sulle kohaliku uudi ehk siis kuni selle aastani oli siis see kõige suurem uudiste tarbimise koht, kus ameeriklased kõige rohkem uudiseid kätte said ja siis sel aastal vist ületas esimest korda, ületas sotsiaalmeedia esimest korda need uudised. <button type="button" class="segment-card needs-review" data-segment-id="segment-0046" data-start="5189.2" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 86:29–89:02</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii et kas valijad Kendakis siis saavad aru, miks neile NATO vajalik on? Ei, no ma arvan, et, et lõpuks nad ikkagi noh, jällegi ameeriklastel on niisugune nagu komme nii-öelda venelasi vihata, et, et nad neile lihtsalt ei meeldi nagu, et, et ko mmarid vaata, et no okei, aga üldjoontes mulle tundub, et et ma nagu mõtlen nüüd natukene valjusti spekuleerin umbes niipidi, sest ma ei ole sellele küsimus ele nagu varem sellisel viisil mõelnud, et. Et kas USA jätkab Euroopas? Ei noh, mitte ainult selles nagu kuidas, vaid et noh, et kuidas see mõjutaks nagu kas ameeriklasi või et, et nagu mida see nende jaoks nagu tähendaks, eks ju, et, et kui nad tõmbaksid rohkem välja ja mulle tundub, et, et me peame siin nagu võib-olla nagu aru tama ja mõtlema nagu ka selles suunas, et, et tegelikult nii nagu kui Afganistani ja Iraagi sõja sõdade järel või seal selle nagu taamal tekkis siis pärast seda ja paral leelselt väga suur hulk ka selliseid erasektori ettevõtluse noh, nii-öelda siis turva ettevõtteid, kellel olid väga tugevad nagu taustad, kuidas nad suutsid siis panustada või noh, nagu oma sõjalist kogemust ära kasutada selle jaoks, et nagu pakkuda mingisuguse id teenuseid siis ka teistes riikides era, erasektor nii-öelda siis võttis mingisuguse d asjad üle. Et siis võib-olla nüüd ka selle Ameerika siis nii-öelda sõjalise kompleksi nagu uuenda mise ja selle logistika ja Ukraina sõja nagu nõustamise ja, ja kogu selle intelligen ce ehk siis luureandmete kogumise analüüsimise, sealhulgas ka küberruumi kogu selle loo gika --- . Peame nagu arvestama sellega, et, et Ameerikas on nii ettevõtlikud, et nad suudavad kõik e rahaks teha, vaata. Et, et kuidagi nad suudavad kogu selle loogika, mis nad on siit Euroopast õppinud ja mida nad pidevalt õpivad ka nagu meiega koos harjutades ja meie, meie maastikuga, ma astikega ja Ukrainaga ja umbes niimoodi vaadates, et kuidas need droonide asjad, kuidas seda kõike teha rahaks ja ühel hetkel meil uuesti maha müüa. Ehk siis see on nagu see Ameerika psyche, eks ju, et, et nagu ühel hetkel kõik see, mis sul on olemas, selle kuidagi sa võiksid nagu maha müüa, et, et rahaks teha, et, et see võib-olla on nagu see, mis on minul tunne, et, et me peaksime siin nagu selle väljat õmbamise sõjalise väljatõmbamise mõistes nagu arvestama.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0047" data-start="5341.52" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 89:02–91:08</span></span><span class="segment-text">Ma räägin, ma räägiks sellest psychi teisest, ühest teisest aspektist. Et minu, minu kogemus on selline. Mul on minut aega. Kui käia, kui käia Ameerikas ringi, kui käia ja rääkida erinevate inimestega, mitte ainult otsida linnapäid ja, ja mingisuguseid kohalikke tööstusjuhte, vaid võimalikult erinevate inimestega rääkida, siis see soov teha nii-öelda häid asju ei ole mitte kus agil Ameerikast kadunud ja, ja, ja ameeriklaste huvi, nagu ma enne ütlesin, on näida ta seda, et Ameerika on maailma kõige parem riik. Kõige nii-öelda maailmas kõige tunnustatum, austatum riik ja kui, kui neile, kui nende ga rääkida keeles, kus, kus ei ole mingisuguseid abstraktsed sellised väljendid või, või, või mingisugune nende jaoks väga selline amorfne kuvand mingis tulevikumaailmast , vaid on väga praktiline probleem see, et üks riik on näinud näiteks teisele kallale , ründab seal linnu, tapab naisi-lapsi, vägistab ja, ja teeb mingisuguseid teisi jub edusi. Ja et meil on võimalus see kõik peatada, ära hoida, teha õiget asja, siis tegelikult sellega ollakse nii-öelda pardal. Ameeriklastele, minu meelest meeldib teha head, aga neil on oluline näha seda konkre etset eesmärki, lõpptulemust. Neile ei meeldi see, kui neile öeldakse, et noh, lähme kuskile ei tea kuhu, teeme, ei tea mida ja siis oleme kakskümmend aastat kuskil sõjas näiteks. Ja, ja Euroopa puhul minu meelest, kui me selgitame ka Euroopa ka nii-öelda koosolemise vajadust läbi majanduse investeeringute numbri, läbi selle, et meil on tegelikult la ias laastus võtted ikkagi selline ühine kultuuriline taust ja pärand, mis, mida me, mida me jagame, siis seda mõistmist on tegelikult palju rohkemal määral kui igapäevaselt kas või Ameerika meediat jälgides. See võib tunduda isegi siis, kui seda parajasti vaatab kaks miljonit inimest, aga nii nagu Laurigi ütles, tuletan meelde, see on ainult kaks miljonit inimest.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0048" data-start="5467.52" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 91:08–91:49</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See on väga hea sõnum, millega lõpetada. See tuleb koos asju teha, aga selline oligi arutelu, kuidas mõista USA-d, ma loodan, et te saite parema ülevaate sellest, kuidas ameeriklased mõtlevad, miks neil võiks olla huvi ikkagi osaleda ka Euroopa kaitses ja miks nad peaksid siia panustama. Suur tänu teile selle arutelu eest, Kristjan Prikk ja Lauri Tankler.</span></button></div>
