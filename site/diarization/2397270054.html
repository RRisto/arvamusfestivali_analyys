    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.64" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:12–0:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Seega me saame vaadata terve sellise toidu, tootmise ja tarbimise ahela ulatuses seda toidujulgeoleku teemat arutada läbi, mis see on, miks ta on ja kuidas sellega hakkama saada. Nagu te näete, publik on täidetud nägusate meestega ilusti meie taga on ja juhuslikult oleme me kõik meesterahvad siin, kuidagi on see niimoodi sattunud, aga ärme lase sellest midagi ennast hoolida, sest et teema on oluliselt suurem. Ma palun teil kõigil iseennast tegelikult kiirelt publikule tutvustada, mis sest, et meil on kenasti selja taga kirjutatud nimed ja tiitlid. Seega alustame Hendrik sinust.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="55.24" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 0:55–1:07</span></span><span class="segment-text">Tere, minu nimi on Hendrik. Täna olen siia kutsutud regionaal ja põllumajandusministrina. Hobideks on korvpall ja üldiselt veedan oma vaba aega oma tütrega mänguväljakutel hetkel</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="67.44" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 1:07–1:42</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Martin. Tere hommikust, minu nimi on Martin. Olen sellise ettevõtte nagu Mag Food OÜ juhatuse liige ametinimetuse poolest äriarendus e planeerimise kvaliteedikeskkonna direktor vastan ka IT-st. Ja, ja Food on siis selline ettevõte, kes Maag Grupis omab meie toidutööstusi ja sellega seoses siis oleme nii Eesti suurim toidutööstusette võte kui ka Eesti suurim põllumajandusettevõte, sest me kasvatame ka oma loomi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="102.08" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 1:42–2:13</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Tere, mina olen siis Toomas ja praegu olen siis Eesti Kalatootjate Keskühistu tegevju ht, et kalatootjate Keskühistu kuulub sisuliselt siis kolmele kalapüügiühistule, kes tegelevad siis Läänemerel traalpüügiga ehk kilu, räim põhiliselt, aga igapäevaselt tegele n siis ühe tehase, mis tegeleb siis kalaprutiini ja õli tootmisega igapäevase toimetamise ga nii ostud-müügid, igapäevane tehniline valmisolek, aitäh.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="132.8" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:13–2:36</span></span><span class="segment-text">Meil on Hannes, tere hommikust kõigile. Mina olen Eesti suurima põllumeeste ühistu KEVILi juhatuse esimees, KEVILi tegeleb siis teraviljaga ja omab umbes niisugust kolmekümne protsendist turuosa Eesti teravilja too tmises ja varasemas elus enne seda kümme aastat toimetanud ühes Eesti piimatööstuses ja natukene puutunud kokku ka piimalehmakasvatusega.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="156.36" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:36–3:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Tere, minu nimi Rando Eesti Maaülikoolist ja tegelen siis maamajanduse ökonoomika poole ga, et kuidas siis need numbrid Excelis kokku tuleksid ja võib-olla see vaba aja tegevus ongi seotud sellega, kuidas siis teadust teha ja vaadata, et mis eespool meid terenda b, kui me räägime sellest toidu tootmisest ja, ja põllumajandustootmisest laiemalt, nii et, et õpetan Maaülikoolis ökonoomika poolt ringpäevamajandust, nii et, et väga palju erinevaid asju, mis on siis maamajandusega seotud.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="187.04" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 3:07–3:45</span></span><span class="segment-text">Tere hommikust minu poolt ka. Kõigepealt tänan regionaal- ja põllumajandusministeeriumit kutsumast siia paneeli. Olen siis Hannes Oks ja esindan Eesti jaekettide siis tarneahela poolset siis vii mast otsa. Olen Coop Eesti logistikadirektor ja kolmsada kakskümmend kauplust üle Eesti siis Koo bil kokku töötajaid kuus tuhat inimest logistikas ainuüksi siis üle viiesaja inimese , et tagada siis kõikide kaupade jõudmine õigeaegselt üle Eesti kolmesaja kahekümnesse kauplusesse.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="225.04" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:45–5:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Aitäh kõigile. Lisaks mina olen, korra on mind normaalselt ka kuulda, eks ju, väga hea, suurepärane Ma ei peagi seda kuulma. Elmar Reinhold, igapäevaselt töötan sellises ettevõttes nimega EAGronoom. Olen Eesti kliendisuhete juht, aitan põllumeestel oma andmeid hallata ja lisaks selle le kõigele siis põllumajandust populariseeriva taskuhäälingu või podcasti kabiini ju tud kaassaatejuht. Väga hea, kaks inimest, vabandust, mitte inimest, kaks osalejat on veel vaja tegelikult tutvustust välja tuua. Meil on õun Kasper Pollist ja on siis eksootilise nimega, mida ma hetkel välja ei ütle , Ploom pollist, et nemad on kohalikud toidujulgeoleku olulised lülid, neid võib loomulikult meie tänase siis arutelu käigus nii laval kui lavad maas tarbida. Aga lähme asja juurde ja minu ootus on, et me saame koos täna siin siis päriselt aru tleda ja vaadata, nagu me kõik nägime, meil on tõesti ahel täies pikkuses siin olemas Meil on alates põllumeeste esindusest liikudes edasi toidutöötlemise, toidu turustamise juurde, selle taga oleva teaduse kui nii poliitikani välja kõik lülid. Seega võiks olla korralik rügement selleks, et lahendada julgeolekuteemalist punkti, mis meie siis tannert, sõjatannert toidulaual peaks viima edule. Esimene väga lihtne küsimus, mille me peame ära vastama. Mis ka eilsel päeval veealas tuli teemaks, toidujulgeolek, mida see termin tegelikult tähendab? Hendrik, tee sa enda avapakkumine, selgitus, kuidas sina mõistad või kuidas sa selgi taksid publikumile ja mulle toidujulgeolekut?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="340.96" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 5:41–9:35</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah, toidujulgeolek tähendab seda, et kas kriisi ajal on võimalik inimestel süüa. See on väga lihtsalt tegelikult kokku võetud, kas sul on toit laual või ei ole. Kui me lähme sinna sügavamale, siis ma olen mõelnud selle peale, et kui me räägime si sejulgeolekust või riigikaitselisest julgeolekust, on kõik jämedad otsad tegelikult riigi käes. Et me ehitame enda kaitseväge, ostame neile varustust, me kutsume ajateenistusest küll nii-öelda vabataht nii-öelda, mitte küll vabatahtlikult, aga et me kutsume rahvast riik i teenima. Sama sisejulgeolekus, meil on politseinikud, kes on kõik riigi palgal. Toidujulgeolekus on see natuke teistmoodi. Et seal on selle peamine tagaja, eraettevõtted ja riik saab seda, hoida seda raami, lu ua seadusandlust, teha kriisiplaane ja tagada sellele rahastus. Aga otseselt tegelikult on see nii-öelda vastutus jagatud laiemalt selle ahela peale , nagu sa tutvustasid seda ahelat tervikuna. Ja toidujulgeolek on tagatud siis, kui terviseahel toimib. Ja ühes otsas ongi siis meie isevarustatus, et kui palju me midagi toodame. Kas me toodame piisavalt toitainet rahvast ära toita? Näiteks piima toodame rohkem, kui me tarbime, sellega on nagu hästi. Puuvilju me toodame umbes kaheksa protsenti ja meie tarbimisest, mis on mõnes mõttes ka loogiline siin teadlased või eksperdid võivad seda ka kommenteerida, aga meil lihtsalt virsikuid nii hästi ei kasva. Küll ma olen näinud Ruhnu saarel kasvatatakse arbuus ja päris pirakad olid, maitse kahju ks ei saanud. Et kui palju me suudame ise toota, kui tugevam meie jalgtootmine, kui jalgtootmine on tugev, see on esimene lilli kaetud, meil on piisavalt seda toorainet, millest toitu teha Teiseks on tööstused, et kuidas me sellest toorainest teeme midagi, mida meil on võimalik süüa. Siin läheb natuke keerulisemaks juba, sest kõige suurem sõltuvus seal tegelikult on e nergiast, et kui kriisi ajal energiat ei ole, ei ole elektrit, ei ole kütust, siis on keerulisem toota vett ja muid sisendeid on, on, on palju. Siis kolmas jupp, mida tegelikult täna esindatud ei ole, on ka logistika, et kuidas see valmis toide siis või toit tööstusest saab siis jaotuspunktidesse. Ja siis on jaotuspunktid, kuidas rahvas selle kätte saab ja terve see terviklik nii- öelda viieosaline ahel on kokku toidujulgeolek, et kui kõik need asjad on toimepidevad kriisi ajal töötavad, saavad omavahel suheldud, siis meil on kõik hästi. Elemente on siin veel, et selle jaoks, et see kõik saaks teoks ja nagu ma ütlesin, et kuna me vastutust jagame nii-öelda ka ettevõtjatele, et seda tagada, siis kui sul on mingid investeeringud, mis ettevõtted peavad tegema, mis ei ole otseselt seotud ärika sumi saamisega, mis on ettevõtte peamine eesmärk, on teenindada kasumit, siis kui sa investeerid näiteks uute traktorisse, see aitab sul teenida kasumit. See on ettevõtte vastutus, et ta seda investeeringut teeb. Kui me nüüd ühiskonnana palume, et, et lisaks sellele palun tehke veel midagi, mis ei ole otseselt äriliselt kasulik, mis on kasulik tervele ühiskonnale, siis tuleb see ka kinni maksta ühiskonna nagu noh, riiklikult siis tuleb see kinni maksta. Ja see toobki meid siis, noh, ma selle jutu lõpetuseks toongi siis välja, et kus meil see nii-öelda teelahkme koht on, ongi järgmine Euroopa Liidu rahastusperiood, põlluma jandust väga suures osas toetatakse Euroopa Liidu vahenditest. Need vahendid on kokku kuivanud või noh, ütleme praegune ettepanek on, et see summa jää b samaks, mis eelmisel seitsmel aastal. Aga inflatsioon on nii palju tõusnud, nominaalselt see summa on väiksem. Ja süsteem on ka muutunud ja nüüd järgmisel paaril kuul on valitsuses, siis selle Euroopa Liidu rahajagamise protsess ja seal on Euroopa Liit eraldanud põllumajandussektorile , on öelnud, et siin on viis, nelikümmend kuus miljonit. See tuleb anda toidu tootmisesse selleks, et võrdsustada toetusi põllumajanduses üle Euroopa Liidu, on see raha antud ja see raha peab sinna minema, et tagada meie toidu julgeolekut.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="575.28" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:35–10:09</span></span><span class="segment-text">Aitäh. Ja need punktid sealt sellest sinu pikast jutust, aitäh esiteks selle eest. Me võtame päris mitmeid tükke täna teemadeks laiali. Kurikuulus viis, neli, kuus kindlasti tuleb teemaks meile. Toon väikese märkuse juurde, tarneahel on meil kenasti olemas. Et meil on siis logistikadirektori poole pealt, aga see on väga okei. On täiesti logistika tehtud, minul ka. Pole üldse probleemi, hea meelega aitan siit välja. Martin, palun, kuidas sinu vaatevinklist nüüd toidutöötlejana, mis asi on toidujulge</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="608.52" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 10:09–12:29</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">olek? No ma arvan, et suures pildis Hendrik ütles nagu ära, mis tegelikult olema peab, et me räägime jah, kriisi ajal laiema elanikkonna toiduga varustamisest, ma tahaks võib-olla kahte asja kommenteerida. Esiteks see erinevus või seos selle isevarustatuse ja siis toidujulgeoleku vahel, et sellest isevarustatusest endast ainult ei piisa, et näiteks Eestis toodetakse umbes viis kümmend viis protsenti vajamine- või nagu tarbitavast broileri lihast on ju meie ette võte teeb sellest üheksakümmend üheksa protsenti sellest, sellest viiekümne viiest. Aga täna kõik tibud, millest me broilerid üles kasvatame, tulevad välismaalt. Ja kui nüüd peaks olema nii, et kriisis piirid on kinni, siis neljakümne viie päeva pärast ei ole poes ühtegi grammi värsket broileri liha. Et selles mõttes ei saa öelda, et see isevarustatus annaks meile tingimata ka toiduju lgeoleku, sest et see, kuidas isevarustust arvestatakse, on lihtsalt nagu ainult osa sellest ketist. Et teine pool, kus ma võib-olla teeks ka veel täpsustuse, on see, et, et, et, et kuidas mõtleb ettevõtja nendest investeeringutest, mida oleks vaja teha selleks, et kriisi ajal oleks toidujulgeolek tagatud. Ja ma arvan, et see ei ole päris nii, et, et, et on nagu tootlikud ja, ja siis mitte tootlikud investeeringud vaid, vaid, vaid, sest loomulikult on ju ka, on ju ka ettevõ tte omanik huvitatud sellest, et erinevates siis ma ei ühiskonna olukordades ettevõte saaks edasi toimida ja, ja kasumit teenida. Aga probleem sellise laiapõhjalise kriisiga tekib sellest, et, et see kahju, mida ettevõtja peab investeeringutega ennetama, on piiratud selle kasumiga, mida ettevõte teenib, eks oma tegevusega. Aga riigi vaates see kahju on palju suurem, sest et inimesed jäävad toiduta. Ja, ja see selle tõttu ongi nii, et ühiskonna seisukohalt oleks justkui mingid inves teeringud põhjendatud, mis ettevõtte seisukohalt ei ole ehk ettevõte ise ka tahaks tegelikult ju kriisi ajal edasi toimida. Ja see matemaatika, matemaatika erinevus tuleb nagu selle koha pealt, et seal on selline välismõju mida, mida nagu ettevõtja oma taskus kunagi tunda ei saa. Et minu arust see on oluline.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="748.6" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 12:29–12:35</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma küsin hästi lühidalt, kas küsimuse ja siis liigume edasi. Kas ma saan õigesti aru, et see ei ole lahendatud hetkel?</span></button>
