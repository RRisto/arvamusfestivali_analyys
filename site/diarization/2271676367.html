    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.92" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:11–2:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast kaitseressursside ameti veetavale arutelule pealkirjaga &quot;Kui sõda algab, kolin Hispaaniasse, palun andke käega märku, kelle sõber on kunagi midagi sellist väljendanud, öelnud. Vau, olgu ja mis on selle arutelu teema, ma põgusalt annan teema piirjoone, siis ma ütlen põgusalt midagi meie osalejate kohta ja siis me läheme teele. Et millest me täna räägime, on see, et meie riigikaitse, kes me loomulikult moodusta vad inimesed ei midagi muud kui inimesed kes opereerivad ressursse, mis meil on või mida meil ei ole ja, ja, ja see reserv võimekus sõltub sellest, kui hea on meie süsteemne planeerimine või sipelgas. Ta on vastutegevuses. Kuidas me oma ressursse suuname, kuidas me oma inimesi hoiame. Ja kui reservväelane tunneb, et süsteem tegelikult väärtustab teda igal ajahetkel, siis ta tahab seda süsteemi ise ka hoida ja väärtustada, siis ta on tõenäolisemalt kriisi olukorras meil olemas. Ja, ja ta täidab seda rolli, mis tal on. Nii ja, ja mida see tähendab reservväelaseks olemine, ma küsin korra ka uuesti, kui palju d meil siin päriselt on reservväelased siinviibijatest? Et nendest siis räägime. Et mis see tähendab, millised tingimused peaksid olema täidetud, et ma tunnen, et jah , kui läheb jamaks, siis küsimus ei ole, kas, vaid küsimus on, kuidas ja mida, kus, millega, kellega, onju. Küsimused on tehnilised, aga mitte filosoofilised enam, eks ju. Aga kes me siis siin täna oleme? Meil on siin väga äge seltskond koos. Meil on leitnant Rainer Järvela, kes on Kaitseressursside Ameti reservteenistuse bür oo juhataja.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="131.28" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:11–2:39</span></span><span class="segment-text">Ja tere kõigile. Kus kõlab praegu vabandust. Et te saate kõike oma. Aga igal juhul kogu see temaatika, mis me täna siin hakkame rääkima, me keskendume re servväelastele, sellel samal temaatikal nii palju erinevaid kihte, nii ühiskonna mõttes , nii laia riigikaitse vaatevinklist, nii et ma arvan, me puudutame ka neid ja, ja mul on äärmiselt suur rõõm siin selles paneelis osaleda ja rääkida sellest.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="159.2" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 2:39–3:01</span></span><span class="segment-text">Absoluutselt kindlasti ja tegelikult see vaata see eristus, mis ma tegin, et kes on re servväelane, et tegelikult mõnikord nendel, kes ei ole, tekib küsimus, et aga võib-olla , mis on minu roll, et ma arvan, et me puudutame ka seda. Et mingis mõttes meil saab olla kõigil roll, eks ju, ja siis on meil siin nooremleit nant Marit Lippur, kes on riigikaitseõpetuse õpetaja. Tere, Marit.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="181.12" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:01–3:20</span></span><span class="segment-text">Tere. Mina olen jah olnud riigikaitse õpetuse õpetaja alates kaks tuhat kaheksa aastast erinevate s koolides, nii et, et põhimõtteliselt mina olen see, kes siis sellele kasvavale rese rvile peaks selle sära silma panema, et nad tahaksid saada selleks reservväelaseks ja oma isamaast väljas olla siis vajalikul hetkel.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="199.68" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:20–3:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja ma arvan, et see fookus, fookus noortele, et sina oled tõenäoliselt kõige paremini kontaktis sellega, et mida need noored, mida nad mõtlesid varem, mida nad mõtlevad nüüd , kuidas need asjad muutuvad, kui erinev on see, mida me arvame, et mida nad mõtlevad ja see, mida nad päriselt mõtlevad, et see on, ma arvan, väga suurepärane ressurss siin laval. Siis on meil siin nooremleitnant Armani Pogosjan, kes on Eesti reservohvitseride kogu juhatuse liige.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="223.56" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 3:44–4:27</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere. Tere, issand, tõesti on vali. Olen Armaani Pogosjan ja kuigi ma tulen tõesti Eesti reservstide kogust erakist, siis ilmselgelt täna ma esindan ikka enda seisukohti, aga ma loodan, et ei, ma olen enam kui kindel, et see rahvamass, kes meil siin vastu vaatab, ei ole tulnud siia selleks, et , et saada soovitusi, kuhu täpsemalt Hispaaniasse endale kinnisvara osta. Vaid tegelikult saab aru, et see küsimus, kes on reservväelane, on ju tegelikult palju laiem, et põhiseadusega tagatud laiapinna riigikaitse näeb ette, et me kõik saame oma l moel panustada. Ja see on tegelikult väga positiivne, et, et see huvi on nii suur, nii et ma loodan, et nii mõnigi saab täna vastuse sellele küsimusele, mida tema saab teha.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="267.4" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:27–4:36</span></span><span class="segment-text">Aitäh ja siis on meil siin veel leitnant Lauri Läänemets, kes on kaitseliitlane ja e ndine siseminister ja kindlasti sul on neid tiitleid palju veel.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="276" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 4:36–4:57</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, Lauri. Tere kõigile. Mind see hääl ei kohuta, et muideks hästi huvitav, eile õhtul rääkisin ühe hispaanla sega, et ma elan siitsamast kümme kilomeetrit Väätsal ja siis näiteks hispaanlane ka vatseb Väätsale maja osta, nii et see protsess on vastupidine, et neil on nii kuum ja suvel on nii palju raha, et seal ei ole võimalik elada, et tuleb Eestisse ära tulla.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="297.16" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:57–4:59</span></span><span class="segment-text">Kas ta pakub vahetust kellelegi?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="298.96" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 4:59–5:07</span></span><span class="segment-text">Ei, ma vaatasin, et vähemalt mingi tasakaal nagu tundub olevat, nii et meil on lõpuks võtta küll, et, et, et see mingi võõrleegene hakkab kokku kokku tulema siit.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="307.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:07–6:28</span></span><span class="segment-text">Keskkonna ja keskkonnateemat pole sellel oma teemadega, nagu me teame, siis Hispaani a kõrbestub, nii et ma küll ei ole kindel, et Hispaania on mina, mina läheksin, mida ma ei tee, onju, ma muidugi läheks loomulikult Ukrainasse. Kui siin läheb jamaks, Ukrainas on korras kõik, siis mina läks sinna, aga see selleks , et modereerib seersant Arro. Nii et siis on kõigi auastmed ka paigas. Ja ma ütlen ka seda, et ma väga tahaks, et me oleksime võimalikult dialoogilised, et kui te tunnete, et te tahate vahele karjuda, kommenteerida, küsida ja just nüüd ja praegu mõnda fookust täpsustada, siis andke käega märku ja siin olevat üks vormis vend, kes toob teile mikrofoni, ma hetkel teda ei näe, aga küll ta siis välja ilmub, ma arvuta n nii hästi, väga super ja muidu sinu jah, see varjestus oli väga hea. Aga alustame sellest, et millest me räägime, kui me räägime reservväelasest üldse, et mis on see reservväelase identiteet või, või mis see roll, kellena ta noh, kellest ta mõtleb, kui ta mõtleb iseendast, kes ma siis olen ja mis on see, mis paneb inimest üldse ennast seostama riigikaitse rolliga? Ja esimese küsimuse puhul ma annan vabaks, et kes tunneb, et tema tahaks alustada ja edasi ma võib-olla hakkan natuke ka suunama neid, aga et võib-olla see on nii filosoo filine lai küsimus, küsimus on ju oma riigi kodanikuks olemisest.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="388.08" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:28–8:00</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kes siis, kes siis see reservväelane on? Ma tegelen selle poolega, mida riigiseadusandlus meile ütleb ja reservväelane, me ül distame seda tegelikult reservis olev isik ja neid inimesi on meil Eestis umbes kaks sada viiskümmend tuhat. Need on kõik mehed vanuses kaheksateist kuni kuuskümmend eluaasta kuuskümmend. Kellel on kaitseväe kohustus ja nendest kaitseväe kohustusest osa lähevad ajateenistus se, nemad hakkavad täitma kaitseväeteenistuskohustust ja neid taasiseseisvunud Eestis on umbes sada tuhat, kes on läbinud mingisuguse sõjaväelise väljaõppe ja need on esma järgus need, keda Eestil on riigikaitseks vaja, nemad on ka reservväelased ja sealt väikse m ports veel on need, kes on määratud otseselt sõdima, nendel on sõjaametikoht ja neid Eesti riigis on umbes nelikümmend kolm tuhat seitsesada meest ja na ist ehk siis nemad on tehniliselt reservväelased, need on need mehed ja naised, kes lähe vad Eesti eest sõtta ja on Eestile hädavajalikud, et see hetk, kui vastane meid ründa b, siis nemad oleks võitlustahtega, kaitsetahtega, sooviga võtta relv ja minna Eesti eest surmani. Ja nüüd me jõuame sinna ehk siis sisemiselt.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="479.56" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:00–8:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Miks nad seal on, on ju?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0014" data-start="480.96" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 8:01–9:09</span></span><span class="segment-text">Miks nad seal on? See küsimus on, ma arvan, äärmiselt individuaalne. Ma ise olen olnud kaks tuhat üksteist ajateenistuses, kümme aastat ma olin tegevväela ne ja ma alguses ütlesin, et tegelikult ei saanud aru, et miks ma seda teen, hoopis teise d asjad olid, ma tahtsin oma elule jalgu alla saada, ma ei mõelnud suuri asju, et ma nüüd hakkan riiki kaitsma ja niisugused asjad. Ja siis tekkis perekond, tekkisid olmelised asjad ehk siis connection Eestiga , side. Ja nüüd reservväelasena ma mõtlen seda, et ma olen tegelikult see, kes kaitseb ennek õike enda lähedasi. Ja seda, mis elu ma siin Eestis elan. Ehk siis kõik need, et ma saan täna siin arvata ja isegi öelda võib-olla mõned negatiivse d sõnad Eesti või meie süsteemi kohta ja mind homme ei lasta töölt lahti ja võib-olla ei ole kuskil gulaagis, et siis see on see, mida reservväelased kaitsevad ja see on see , mis ma arvan, et on väga paljudes sisemine motivatsioon.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="549.28" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 9:09–9:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma arvan, et sellest üldkogumist, kes on reservväelased, ma arvan, et üsna suure osa selle identiteedi nagu põhitrigeeris kirjeldasid ära, aga mida teised lisaksid. Et nagu sa ütlesid, need on väga individuaalsed, nad on erinevad põhjendused ja inimesed jõuavad sinna eri teid pidi. Äkki Marit, et kuidas võib-olla võtaks nüüd selle noore inimese vaate, mida sa ilmselt nagu näed õpetajana või oled ka ilmselt kogunud aja jooksul neid nägemusi, need võivad olla väga erinevad, et kuidas sina tajud, et mis teeb inimesest selle, kes valib oma rollide hulka ka reservväelase rolli?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0016" data-start="580.48" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:40–11:27</span></span><span class="segment-text">No mina arvan selles mõttes, mis ma olen näinud, et, et tegelikult algul ma räägin sellest tundidest kõigepealt onju. Et riigikaitse tunnis kõik tulevad algul niimoodi, ma ei tea, kümme, üksteist, kaksteist klass tulevad, kõigil on siuksed natuke tühjad pilgud ees onju, kes on natuke aru saanud , et mis see riigikaitse on, mõnest tunnist kuskilt, kes ei ole üldse nagu midagi aru saanud. Siis kui neile see paber ette pannakse, et no kirjuta kümme asja vähemalt, et mida sa tead riigikaitsest, noh, tead, et on kaitseväe juhataja või tead, et on, on meil kaitse minister või et on kaitsevägi või on midagi ja siis ütleme nii, et nendel noortel inimeste l on kõigepealt nende tundide alguses raskusi üldse mõelda välja, mis asi see riigikaitse on, ennem kui nad hakkavad sellest mõtlema, et miks nad reservväelaseks lõpuks tahavad saada. Ja siis, kui need riigikaitsetunnid on ära ja laoga on ära, siis peale laagri, et palju d tulevad, oh nüüd ma saan aru sellest. Osadel tuleb see klikk ka siis, kui nad käivad siin Viimsis Sõjamuuseumis, ütlevad, et nüüd ma saan aru, et mis kõik on nagu toimunud ja et tekib mingi side. Ja siis nad saavad aru, et siis nad tahavad seda riiki kaitsta ja mida noh, paljud ma alati küsin tagasisidet, et paljud näevad, et noh, mis vaeva on nähtud, et selline riik oleks üldse olemas. Et sellised vabadused ja väärtused oleksid ja, ja siis mina muidugi oma tundides alati tal niimoodi ka, et ma annan mingit konfliktis olevad riigid a la, anna kaheksakümmend kaks riiki, millest valida, enamus on Aafrikast ja kuskilt mujalt ja siis nad valivad selle riigi, panevad need konfliktis osapooled kirja ja mõtlevad ise lahendused välja , et kuidas nendel nagu parem elu oleks, et see ka nagu annab seda sidusust tuua, sest nad näevad, et nendes teistes riikides ei pruugi see asi nii hästi olla kui siin ja siis neil tekib see omanditunne ja nad tahavad siin riigis neid asju hoida hästi, et ei juhtu ks nii, nagu teistes riikides on juhtunud paraku.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
