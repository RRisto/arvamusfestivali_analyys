<button type="button" class="segment-card" data-segment-id="segment-0014" data-start="412.56" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:53–7:57</span></span><span class="segment-text">Aitäh, nagu näete, siis selline väga lai spekter on meil kõigest midagi siin täna la val esindatud ja kindlasti erinevaid mõtteid siin ka kuulda saame. Ütlen veel korraldusliku poole pealt, et hea meelega, armas publik, kaasame ka teid ja teeks seda niimoodi, et, et kui teil jooksvalt tekib mingisugune kommentaari soov või küsimuse soov, siis andke käega märku ja siis Kadri saab mikrofoniga teie juurde tulla ja siis prooviks kuidagi niimoodi, et, et see küsimus või mõte kuskil sinna ühe minu ti sisse mahuks ja siis panelistid saavad sellele ka siis vastata. Aga alustame siit nüüd teie kõigi teekonnaga energeetikasse. Karmen, sa natukene mainisid, et kuidagi nagu juhuslikult veidikene või või kuidas teil läks või oli väga teadlik valik ja, ja millistes koolides te enne õppisite ja kus t tuli see äratundmine, et vot, see vist, või siis kohe päris kindlasti, alustame Ka</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="476.88" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:57–8:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">rmen sinust. Ja ehk siis mina õppisin Tallinna Saksa Gümnaasiumis saksa osakonnas ja seal oli saks a keel väga tugevalt, et noh, mul natukene oli grammatikaga arusaamisega probleeme, ma temaatika oli mul lemmik füüsikat ma südamest vihkasin. Jah, siis viimasel aastal seal füüsikas natukene tuli see radiatsiooni teema ja mul on endal oli siis tuttav ka, kes rääkis tuumajaamadest, ütles, et jah, et väga head ja ma saatsin ta pikale, saatsin ta metsa. Ja siis lõpuks hakkasime Tšernobõli neid sarju vaatama ja siis mõtlesin, et tegelikult on huvitav küll, et tahaks rohkem teada, et tegelikult see energeetika valdkond, et ma ei tea sellest mitte mõhkugi. Ja noh, jätsin siis selle unistuse ära, et ma olen alati tahtnud välismaal õppida, et matemaatikat ma ei lähe, et lähen energeetikasse. Noh, üks põhjus oli see, et teadsin, et tahan TalTech&#x27;i teha midagi natukene inseneeri aga, sihuke tundus praktiline ja siis tegelikult lugesin oma need Taltechi kõik need ained ette ja siis mul õde valis mulle aine ka välja. Ehk siis see on nagu mitme erineva osa pealt kokku pandud, ütles, et see tundus kõige</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0017" data-start="537.04" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:57–9:13</span></span><span class="segment-text">Ei, tema ei tulnud mitte midagi, ta oli lihtsalt, et millised sõnad tunduvad huvitav ad eesti keeles olevat ja siis selle järgi, et ma natukene lugesin kirjelduse ka ette , siis oli nagu, et mõtlesin talle, et noh, see on ka üks potentsiaalne vaata valik, et kus sulle tundub, et nojah, see tundub kõige huvitavam nende seast, et minu jaoks on kõik igavad, et.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0018" data-start="553.32" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 9:13–9:18</span></span><span class="segment-text">Aga ikkagi nagu keskkoolis pigem olid humanitaar rohkem. Mõlemad.</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0156" data-start="5303.44" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 88:23–88:27</span></span><span class="segment-text">ga. Seda on nimetatud ka, et see on selline kuri lobi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0157" data-start="5307.32" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 88:27–89:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ta on lobitöö, aga paratamatult sa ei saa luua midagi uut inimese nii-öelda tagaaeda , kui sa ei näita talle, mida see kaasa toob, mis on minu arust tegelikult üks nagu väga oluline aspekt, et nagu sa peadki tegelikult inimestele näitama, neile rääkima ja neil e selgeks tegema, mis neid ees ootab. Et see võib olla tundub inimesele peas hirmsam, kui see tegelikult on. Ja, ja niimoodi ma arvan, et peaks tegema teiste projektidega ka tegema ja, ja inimeste le lihtsalt rääkima, sest et neid teemasid, millega tavainimene ennast kursis peab ho idma või noh, me tegelikult kõik peame kursis hoidma, neid on nii palju ja kui mina olen valdkonna inimene energeetikas, siis võib-olla mul ei ole õrna aimugi, mis toimub kuskil kaitsetööstuses või kus iganes, on ju. Et see ongi nagu keeruline ja, ja selles osas peab lihtsalt aitama inimestel kaasas p üsida. Mulle tundub, et Eerik tahab väga midagi juurde.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0158" data-start="5361.16" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 89:21–89:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma tahtsingi küsida, kas see peaks olema arendajate ülesanne või siin on ikkagi nagu midagi riigil ka teha, aga vaatame, anname Eerikule sõna lõpetuseks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0159" data-start="5370.28" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 89:30–90:22</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Minu kaaspanelistid on andnud väga kenasid vastuseid, väga sotsiaalteadustest vastuse id, mis on väga olulised selliste ühiskondlike teemade puhul. Aga ma võib-olla võtaksin lihtsalt kokku selle mõttega, et kuni meie energiaturg on selline , kus tipuhindasid kujundavad fossiilkütustel töötavad elektrijaamad ehk siis nii-öelda need muutuvkuludega elektrijaamad, siis kuni see mudel on selline, siis oluline on aasta s minimeerida neid tunde, kui need fossiilkütused neid tipuhindasid kujundavad. Sest et kui ei ole fossiilkütuseid, siis üldiselt ei ole muutuv kulusid ja kui ei ole ka muutuv kulusid, siis meil on rohkem neid soodsamaid tunde. Seega väga lihtsasti kokku võetud muidugi see ei ole nii lihtne, aga see on kindlasti üks võtmekontseptsioon seal, kuni me tahame, et energiamajandus oleks rohkem või natukene vähem ikkagi endiselt turupõhine.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0160" data-start="5422.16" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 90:22–90:58</span></span><span class="segment-text">No vot nii selline punkt meie tänasele vestlusele, ma väga loodan, et need, kes siin Eestis otsuseid teevad, mis iganes tasandil ülikoolis, kuskil ministeeriumis, asutus tes, võtavad teid kuulda ja et, et, et te nendeni ka jõuate ja siis ma usun, et Eesti energeetikal on väga särav tulevik. Minu meelest siin laval oli täna tunda tõelist sellist mõnusat värsket energiat. Aitäh teile, et tulite siia vestlema ja oma mõtteid publikuga jagama. Minul on usku Eesti energeetika tulevikku, sest teie olete olemas.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
