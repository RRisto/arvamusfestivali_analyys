    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.52" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 0:12–1:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mul on väga hea meel tutvustada teile meie paneliste. Minu kõrval istub kohe meie kõikide lemmikmagusa maailma orkla personalijuht Krista Laever. Et pärast annan teile ka sõna, siis, et saate ennast pikemalt tutvustada. Siis on meil kõikide töötajate õiguste eest seisev ja tööandjate juhendamise oma sü dameasjaks võtnud tööinspektsiooni esindaja Vladimir Loogatšev. Samuti on meil täna paneelis osalemas Bolti esindajaid, kindlasti oleme me kõik tead likud Boltist ja, ja selle nähtavusest meie tänavatel. Meil on kohale tulnud Leila Mäll ja lisaks siis ka meil kõikide eestlaste jaoks olemas olev ja nähtav koop ka kõige väiksemas ja pisemas paigas kohati Eesti iga s igas väikses nurgas Kerstin Jaani. Ja annangi teile siis sõna kallid panelistid, tutvustage paari lausega siis enda val dkonda ja avame selle mõiste, et mis see paindlikkuse kontroll siis teie jaoks tähendab.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="96.08" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 1:36–2:16</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Alustame siit. Tere päevast, mina olen Krista Laeveer. Siis Orkla Eesti Piple kaitse direktor. Ja veel võib-olla taustaks, et hariduselt olen ma jurist, aga ma ennast enam juristi ks ei pea, sest ma ei ole praktiseeriv jurist. Olen olnud ka õppejõud pikki aastaid. Olen ema kahele, nüüd juba täiskasvanud lapsele. Ja eks mul on veel mingeid kvaliteete, aga jätame siis praegu siia, siia kohta need. Ja mis see teine küsimus oli, et juba läks meeles suure tõenäosusega ära.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="135.92" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 2:16–2:26</span></span><span class="segment-text">Kõige tähtsamale küsimusele sa vastasid, aga teine oli siis ka see, et kuidas sina mõ istad, mis on paindlikkus ja mis on kontroll üldse, mida see sinu jaoks tähendab.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="146.32" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 2:26–3:18</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Minu vaade on selline, et inimesi tuleb usaldada. Ja esimene, esimene samm ongi see, et sa usaldad inimest. Aga selleks, et see inimene saaks aru, mis talt oodatakse, peavad olema mingid reegl id. Reeglid peavad olema alati selgitatud ehk inimesel peab olema võimalik küsida, miks on meil selline reegel. Ja kui on usaldus, kui on reeglid, siis seda, et me kuskil väga vaidleme kelle giga, seda juhtub väga harva ja ma pean ka ütlema, et meie oleme niisugune organisat sioon, et ma isegi ei mäleta, millal me kellegiga viimati käisime töövaidluses. Ja meil on olnud tööl circa viissada kuni seitsesada inimest, praegu hetkel on küll natukene vähem, ühe oma osa müüsime maha. Aga tegelikult see on võimalik, on see minu sõnum. Aitäh. Võib-olla alustuseks rohkem ei räägi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="198.24" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 3:18–3:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii, Vladimir.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="199.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:19–5:10</span></span><span class="segment-text">Ja tere ka minu poolt, mina olen tööinspektsioonis üks nendest, kes siis nõustab teid , kui te helistate või kirjutate ja mina siis vastutan selle meeskonna eest, kui te helista te ja kirjutate või siis näiteks kui te olete tööandja ja kutsute neid. Olenemata siis sellest kohast, kus ta asute. Ja minu jaoks see paindlikkus, ma olen nõus ka Kristega eelkõi ge tähendab usaldust. Et kui tööandja usaldab töötajat, siis järelikult ma eeldan, ka töötaja usaldab oma töö andjat ja siis ka suhted lähevad paremaks. Sest kui nii vaadata, siis, siis töötaja on ikkagi ettevõtte väärtus, ta ei ole lihtsalt ressurss, et kui me hakkame töötajaid ära kasutama, las ta töötab mi tu kuud järjest kolmsada, nelisada tundi kuus ja siis vahetame teda ära, siis see ei ole sellises pikemas perspektiivis ikkagi jätkusuutlik. Ja teiseks paindlikkus tähendab ka võimekust kohandada muutustega kuna iga aastaga väga palju uusi töötajaid tööturule ei tule. Eesti elanikkond ka väheneb, siis ma arvan, et võib-olla aastatega muutub see pi lt, et mitte tööandja valib, keda ta võtab tööle, vaid töötaja hakkab vaatama, kas ta läheb ettevõttesse A või ettevõttesse B. Ja siis, kui ettevõte näiteks kaks ettevõtet pakuvad ühte sama töötasu suurust, aga üks ettevõte pakub ka muid hüvesid või, või sedasama paindlikkust, siis ma arvan, et see sama ettevõte, kelle kasuks otsustatakse, ta on ikkagi see, kes pakub seda paindlikku</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="309.52" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 5:10–6:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">st. Aitäh. Tere, mina olen Leila. Esindan Bolti ja Boltis juhin Baltikumi personalipartnerite meeskonda. Läbi oma meeskonna ja läbi ka enda töö on minul imeline ligipääs kõikidele tööta jatele ja juhtidele ja meeskondadele. Ja see, et meie tänane teema on kindlasti üks nendest, millega me tihti kokku puutume Hiljem saan natukene rohkem detailidesse minna. Paindlikkus minu jaoks, ma arvan, et laiemalt, et kui mõelda ka eraelu peale, mitte ainult tööelu peale, tähendab võimalus teatud piiride sees teha iseseisvalt otsuseid. Et kui me räägime tööelust, siis näiteks võimalust teha kodukontoripäevi, kui mu lapse d on haiged või võimalust teha pikemaid tööpäev või mõnel päeval lühemaid tööpäev i. Et anda seda vabadust töötajatele teha neid valikuid, mis toetavad nende vaimset tervi st, nende heaolu ja, ja samal ajal olla ka edukad.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="389.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 6:30–7:51</span></span><span class="segment-text">Ja tere, mina olen Kerstin ja olen siis Coopia Eesti keskühistu personali direktor. Ja personalitööd teinud üle kahekümne viie aasta. Paindlikkuse teema on üllataval kombel tegelikult olnud, kui me arvame, et see tuli all es Covidi ajast, siis tegelikult on see personalitöötajate laual mingit, mingil kuju l olnud ikkagi, ma julgen öelda ka viisteist aastat tagasi julgelt juba oli kindlasti Kuidas ma ise paindlikkust käsitlen või mis see minu jaoks on, et ma, minu jaoks on see natukene nagu sarnane inimõiguste teemaga ehk et minu õigused lõpevad sealma al, kus algavad kellegi teise õigused. Ja võib-olla see, seesama, mis on siit juba ka läbi käinud, et see paindlikkus siis, et, et, et paindlikkuse jaoks peavad olema piirid ja kui on kokkulepped ja piirid, siis need ongi see, et sealt kuskilt maalt hakkavad kellegi teise õigused, kellegi teise võimalus ed oma tööd teha. Et lõppkokkuvõttes on ju vaja, et ettevõtted saaksid töö, saaks töö tehtud ja selleks on siis need noh, ka siin eelkõneleja, kõnelejad on nendest piiridest rääkinud, et on need piirid olulised, ehk et siis nagu valikuvabadus, kokku lepitud piirides.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="470.8" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 7:51–8:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Väga huvitav jah, sest tegelikult töösuhtele ju ongi omane see, et tööülesandeid jaga b nende täitmist kontrollib tööandja. Tööandja, tööandja siis loob selle töökeskkonna, selle kultuuri, mis tegelikult selles ettevõttes on nagu oodatav, vastuvõetav ja mis on ka keelatud, et see kõik on ju töö andja otsus. Aga samas töötajad aina enam ja enam nagu nõuavad seda vabadust ja soovi töötada kas kodus, võib-olla mitte ainult kodus, aga ka kohvikus, rongis, Hispaanias ärgata võib -olla mõnel päeval tund aega hiljem, alustada tööpäeva hiljem, et need paindlikkuse pi irid on väga-väga palju juba ajas ka nagu nihkuvad, et kuigi Kersti sa ütlesid, et, et juba viisteist aastat sa oled nagu seda märganud ja nii, aga kas on nagu märgata ka muutu si nende generatsioonide suhtes? Et kas, kuidas need erigeneratsioonid tõlgendavad seda paindlikkust?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="535.36" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 8:55–10:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma olen üldse nagu hästi seda usku, et ma liiga palju ei paneks nendele generatsiooni dele rõhku. Jah, on mingisuguseid märksõnu, aga noh , me kipume ütlema, et kuuekümne, et kui kuuelt, tänaselt kuuekümne aastased olid kahe kümne aastased, siis nemad küll ei küsinud paindlikkust, eks ju, ei küsinud kodukont orit ja nii edasi, aga, aga, aga nelikümmend aastat tagasi ka keegi ei küsinud nende käest seda, kas sa sooviksid töötada kodukontoris. Et see töömaailm on juba noh, kõik see maailm meie ümber on nii palju muutunud, et kas ja noh, loomulikult see mõjutab ka hoobilt kohe neid generatsioone või, või neid põl vkondi, mis, mis kasvavad. Aga tänasel päeval ma ei saaks öelda seda, et, et nüüd noored küsivad seda vabadust rohkem kui vanemaealised. Et pigem see sõltub sellest, millises eluetapis keegi on ja mille jaoks ta seda vaja b. Kõikides põlvkondades on neid, kes ütlevad, et noh, me siin enne just põgusalt rääkis ime, nüüd võib-olla võtan sõnad suust Kristel, aga, aga kõikides põlvkondades on neid , kes ütlevad, et ma palun lubage mul kontoris töötada, on ju, ja on neid, kes ütlevad , et palun, et ma ei, kui te mul kont-, kontorisse kasvate tulla, siis ma teie juurde tööle ei tule on ju. Aga mis mind alati nagu häirib kogu selle paindlikkuse jutu juures on see, et, et me räägime ju sellest nagu noh, kodukontorist, nii kui ütleme paindlikkus, siis me mõtle me kohe kodukontor ja siis me mõtleme kontoritöötajaid, kes tegelikkuses moodustavad väga väikese osa kogu meie töötajaskonnast. Et meil on ju tootmised, noh, meil endal logistika, kaubandus, kelle jaoks on paindlikku s ikkagi absoluutselt hoopis teise tähendusega asi.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="647.36" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 10:47–10:58</span></span><span class="segment-text">Just, et see paindlikkus siis ei tulene ja see soov mitte sellest, kui vana see inimene on, vaid mis on tema isiklikud eelistused, mis on tema tööülesanded, et mis on tema he</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="658.36" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 10:58–11:13</span></span><span class="segment-text">tke eluetapp, kui tal on väikesed lapsed kodus, siis ta vajab nende põetamiseks aega , eks. Kui tal on lapselaps, siis ta tahab, et ta saaks seda lapselast käia hoidmas ja, ja tal on vaja vaba aega selleks on ju, kui tal käib ülikoolis, siis tal on vaja ülikoolis käi</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0014" data-start="678.48" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 11:18–12:23</span></span><span class="segment-text">Ei, ma arvan, et ei võetud, et ongi nii, et inimesed vajavad erinevatel aegadel erinev at lähenemist ja kui tööandja suudab seda võimaldada, siis see on suurepärane. Ja minu meelest väga oluline on ka rääkida tõesti nendest inimestest, kes ei tööta kon toris, sest kontoritööd teha kodust on suht lihtne organiseerida. Et siis nende teiste inimeste jaoks peab olema ka mingi paindlikkus ja noh, tegelikult läbi aegade, kui me võtame noh, näiteks teenindussektori inimesed, siis nende paindlikku s on olnud tööaja graafiku koostamise paindlikkus. Et ma mingitel päevadel ei taha üldse käia või, või eelistan mingit teatud rütmigraa fikut ja sellega seoses mul tuleb üks mitte enda lugu tuleb meelde üks turvafirma lu gu, kes siis ütles, et graafikud sai kõige paremini paika siis, kui turvamehed reegl ina pigem on mehed. Siis kui see graafik tehti lahtiseks ja kogu perekond sai osaleda graafiku panemises , et siis ei juhtunud seda, et graafik läks kuidagi vale koha peale, olid need vabad päevad pandud, et et noh, see on ju ka omamoodi paindlikkus, et sa annad seda võimalus</span></button>
