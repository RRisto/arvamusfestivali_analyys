    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.96" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 0:11–1:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Teeme väikse kerge tutvustuse, meil on siin esindatud Eesti Üliõpilaskondade Liidu vä rske juht Robin Liiber. Tere. Rakenduskõrgkoolide rektorite nõukogu esimees, kõrgkooli vallas re ktor. Meil on esindatud Tallinna Tehnikaülikooli rektor ja meil on esitanud haridus ja tead usminister ja siis mina ise olen Allan Aksiim selle paneeli moderaator ja ma mõtlesin , et kõige esimene küsimus võiks olla mitte niisugune nagu sissejuhatav teemat palgu stev küsimus, vaid pigem äkki võiks iga panelist meenutada. Et kui nad olid mõtlemas ülikooli astumise peale, siis mis olid need mõtted tollal, mille alusel tihti oma valik? Ja siis kui mina hakkan järele mõtlen, siis minu valik oli täiesti suvaline. Seal ei olnud mingisuguseid ratsionaalset analüüsi. Mina lihtsalt teadsin, et mõned keskkooli eksamid läksid hästi, mõned läksid halvasti , see kohe piiras valikuid ja siis ma valisin nii, nagu ma sain keskkonna valdkonna. Teine valik oli filosoofia, seda ma sisse ei saanud. Kas nende kahe valdkonna vahel on mingi seos, mingi ratsionaalne loogiline analüüs? Muidugi mitte. Ma lihtsalt vaatasin, et saab ja läksin ja oli väga huvitav. Aga alustame äkki Robin&#x27;ist, kui meie kõige nooremast, kelle mälestus seoses ma arvan kõige värskem.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="101.4" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 1:41–3:16</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah, et see ei olnud üldse mitte kaua aega tagasi. See lugu on tegelikult päris hea lugu, et minul oli kindel plaan ära minna välismaale Et mis ma siin Eestis ikka õpin, et tuleb ikka välismaale minna, et seal on ikkagi parem ad ülikoolid ja suuremad võimalused ja nii edasi ja ma mäletan, oli üks üks arutelu siis Teaduste Akadeemias ja suhtlesin seal siis Tartu Ülikooli rektori Toomas Asseriga ja tema ütles väga ilusasti, et aga, et te lähete sinna välismaa kõrgkooli, maksate õppe maksu, investeerite sinna oma elamisse ja siis lõpuks tulete tagasi jõuate Eestisse, aga kus on teie võrgustik, kus on need inimesed, kus on see, kus on see, mille põhja lt siis te oma karjääri hiljem hakkate ehitama? Ja, ja ma hakkasingi mõtlema tõesti, et investeerimispoole pealt ka, et isegi kui ma majanduslikult mõtlen, Eestis ma saan enda eestikeelse esimese kõrghariduse tasuta, noh , õppemaksuta, mitte tasuta, aga õppemaksuta. Et miks, miks ma ei kasuta seda võimalust ja, ja tegelikult noh, see oligi tegelikult määrav roll, sest ma teadsin oma eriala, ma tahtsin riigiteadlased minna õppima, seda ma ka praegu õpin. Aga siis oli küsimus, et kus seda teha ja, ja see Liisk langeski tegelikult sinna, et Eestis ma sain kõrghariduse kätte sedasi, et ma sain keskenduda oma akadeemilise töö le, ma ei pidanud käima samal ajal poole koha või täiskohaga tööl või kuidagi leidma finantsvõimalusi, et, et seda kõrgharidust omandada. Et seal see liisk langeski. Riigiteaduseid jah.</span></button>

si sama teema juurde, et ka välismaale minek, et jah, et, et kui ma lõpetasin ülikooli ära, õppisin viis aastat ülikoolis Tartu Ülikoolis, siis vahe peal oli ka võimalus käia Punaarmees koos, kohustuslikus korras kaheks aastaks nii-öelda akadeemilise puhkusel, aga kui me ülikooli ära õpetasin, siis oli võimalik välismaale minna, siis ma läksin välismaale, ma läksin välismaale, kõik oli kolmeks kuuks, ma oli n ära kuusteist aastat. Ma tulin tagasi ja tegelikult täpselt see, mida sa ütlesid, et tegelikult selle viie aasta jooksul, mis ma õppisin ülikoolis enne tegelikult sotsiaalne võrgustik, sideme d olid tegelikult loodud, ma tunnen, et sellest on mulle praegu hiljem olnud väga-vä ga palju kasu.</span></button>

ajalukku. Ma veel kahtlesin, kas ma ikkagi esitan sinna, sest inglise keele, inglise keele, ing lise keel oli mul jube nõrk, ma olin väga väiksest maakoolist. Ma sain lõpuks sisse vist viimasena või eelviimasena sinna ajalukku. Aga, aga see, see tunne, et ma nüüd oleksin teadnud põhikooli lõpust kuskilt, et mida ma õppima lähen, seda kindlasti ei olnud, aga seda ma küll soovitan täpselt samamoodi üritan oma lastele, kes on praegu ka gümnaasiumi lõpus, lõpuklassides hakkavad minema öelda, et bakalaureusekraadi tegemine Eestis on ülioluline, et võib minna välismaale Tundub, et tahaks õudselt siit Eestist ära, aga nii palju, kui ma oma lähesugu lähisu gulaste pealt olen näinud, kes seda teinud on, siis tagasi tulemine ja töö leidmine ja karjääri ülesehitamine on kordades ja kordades raskem võrreldes sellega, kui sa teed bakalaureuse siin, sa saad need kontaktid selle sotsiaalse võrgustiku ja tegelikult ka Eesti kohta teadmised, näiteks sinu see riigiteadlased, minu sugulane õppis riigitea dusi Inglismaal, tuli tagasi, ükski riigiamet teda tegelikult väga temast huvitatud ei olnud, sest Eesti riigiteaduste kohta ja Eesti konteksti kohta ei teadnud ta mitte midagi Et kuidas Eestis avalik sektor töötab, kuidas ta toimib, seda ta õppinud ei olnud, kui gi tal oli bakalaureusekraad riigiteadustes, aga tegelikult olid tema teadmised selles mõttes ikkagi vähekasulikud Eesti avalikus sektoris. Ta läks väga pikalt aega, ta pidi lõpuks Eestis uuesti magistri tegema selleks, et tegelikult oleks ta huvitav Eesti tööandjatele töötajana, nii et ma tegelikult soovitan, kindlasti soovitan bakalaureusekraadi teha Eestis ja noh, magistrit või siis doktorit juba, juba välismaal kindlasti proovida.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="592.04" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 9:52–11:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See on ka minu soovitus, ma nagu mäletan väga eredalt, kui ma kandideerisin tööle riigi kantseleisse, kus ma töötan praegu, siis üllatavalt suure osakaalu minu tööintervjuust moodustas vestlus minu tulevase ülemusega selle osas, et kuidas demojääri töötada EI L-is ja kuidas siis minu ajal oli töötada EIL-is. Mis ka näitab huvitavaid võrgustumise ja ajaloo perspektiive. Aga ma nüüd selle isikliku kogemuse pealt natuke läks nagu laiema peale. Et meil on nagu kõrgharidus on mitu erinevat eesmärki ja inimeste erinevad huvid, et eesmärgid on nii tööjõu, töö, sellise perspektiivi vaates, kus mind tulevane niisugu ne sissetulek kui ka niisugune seda nagu inimeste võrgustumine kui ka see, et mis tüüpi maailmapilt inimesel koguneb, see nagu üldiselt see, et nagu, mis siis Eesti, Eestis nagu toimub, tekivad mingid arusaamad iseenda ja teiste kohta. Et siis ka mind huvitaks, et mis on panisti arvamus selle osas, et, et mis on peamine kaalutlus inimestel praegu, kui nad kõrgkooli astuvad. Ja kas riik peaks kuidagi selle suunama? Alustaks kohe ministrist, et kui meie riigi esindaja.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="681.04" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 11:21–13:15</span></span><span class="segment-text">Ei, ma küll ei arva, et riik peaks seda kuidagi suunama, et hoidku, hoidku selle eest , et iga inimene peaks ikkagi oma otsuses täiesti vaba olema. Et noh, see, see suunamine oli meil vist nõukogude ajal, kui meid suunati tööle ja kon kreetsetesse koolidesse ja keelati mingeid vabasid valikuid, et see valik peaks ikkagi täiesti vaba olema. Aga et noh, riik, avalik sektor ehk siis maksumaksja ju tegelikult rahastab seda kõrg haridust ja siin on küll see tegelikult ühiskondliku arutelu koht. Et kui suur on poliitiline otsuse kaal sellel, kuhu maksumaksja raha suunatakse. Versus siis, kui suur on see akadeemiline vabadus teiselt poolt otsustada, kuidas seda raha nagu kasutada, see on hästi selline õhkõrmpiir, see on väga keeruline, me oleme siin halduslepingute läbirääkimistel seda piiri kombanud ühele poole ja teisele poole , sellepärast et ka puht, ma lähen nüüd hästi teoreetiliseks ka puht demokraatia põhi mõttest lähtuvalt demokraatlikus süsteemis sa valid endale, eks ole, esindajad, kes peaks id sinu eest otsustama nende maksuraha kasutamist, mida nemad siis sulle nii-öelda esi ndusdemokraatias usaldavad ja sul on poliitiline vastutus seda, seda raha vastutustund likult nii-öelda suunata, aga samal ajal on sul vastas ikkagi ka akadeemilise vabaduse põhimõte ehk siis teadlaste õigus ise otsustada ja teha poliitilisest survest vabalt otsuseid teaduse tegemiseks, et noh, et ei ole poliitilist survet, et sa pead just sellist teadust tegema just sellistel teemadel. Et see on väga keeruline selline tasakaalu, tasakaalu otsimise koht ja ka Eestis Kuigi Eestis on minu arust akadeemilist vabadust alati suuremalt tähtsustatud ja mis ongi, mis ongi, ma arvan, hea. Aga noh, see poliitiline ootus on alati olnud see, et on o   <script>
