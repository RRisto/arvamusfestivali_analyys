 Riigikontrolli kriitikale vaatamata on meil ju tegelikult olemas andmed, millest ikkagi võiks näha, kus patsient seal raviteekonnal on, kus ta on sealt raviteekonnalt nii-öelda maha kukkunud, kelle terviseriskid on ohtlikult kõrged, millised näitajad võib-olla viitavad sellele, et inimene vajaks kiiremas korra s meditsiinilist sekkumist või milline ravi ka tegelikult võiks anda parema tulemuse , meil on selle kõige kohta tegelikult väga palju andmeid, mis ei tähenda ometigi, et me neid alati kasutame. Näiteks Tartu Ülikooli teadlased leidsid hiljuti, et ligi pooltele südamepuudulikkuse diagnoosi saanud patsientidele ei olnud enne seda diagnoosi tehtud mitte ühtegi diag nostilist testija, vaid pooled neist said vajalikku ravi. Ja siit tekibki selline üsna lihtne küsimus, et kas need Eesti terviseandmed on siis selline kristallkuul, mis aitavad, aitab meil tegelikult neid terviseriske ette näha rahva tervist, tervisepoliitikat suunata või on see vähemalt kompass, kuhu tervis hoid peaks nagu liikuma või, või siis me oleme ehitanud hoopis sellise väga moodsa di giarhiivi, mis oskab suurepäraselt kirjeldada seda, mis inimesega juba juhtus, kuhu siis nagu viimased päevad on ka värvikalt ajakirjandus kirjeldanud, satuvad võib-olla tead laste ja poliitikakujundajate asemel hoopis tihemini uitama näiteks korrakaitsjad. Selline väike sissejuhatus minu poolt, laval on inimesed, kes seda teemat läbi ja lõ hki tunnevad, mina olen Rahvusringhäälingu ajakirjanik Johannes Tralla, minu kõrval on Sotsiaalministeeriumi andmepoliitika juht Liisi Lilipuu. Teie aplausi toel on alati hea neid inimesi tervitada, siis nad tunnevad, et te pane te neid tähele ja oskate hinnata seda aega, mis nad on võtnud täna, et siia tulla. Ida-Tallinna Keskhaigla kardioloog Hendri Kaljumäe istub siin samuti patsiendid, patsientide vaadet esindab Eesti insuldipatsientide Seltsi juht Helen Kirt. Ja Tartu Ülikooli Tervise informaatika teadur Raivo Kolde on seesama tervise informaa tik, kellele juba sissejuhatuses ka viitasin ning Novartise tervishoiulahenduste juh t Brigitta Kask räägib, milline on ravimifirmade huvi tegelikult nende andmete vastu ja miks. Teeme esimese sellise küsimuse hästi lühidalt, et te saate juba soojaks. Nii paari lausega, kui te peaksite ütlema, kas Eesti terviseandmed täna aitavad meil tegelikult nagu tulevikku juhtida või pigem minevikku kirjeldada. Brigita võib-olla alustame sinust, sest ma tean, et no siin minu kõrval kohe on kindlasti see vastus võib-olla mõnevõrra teistsugune, kui, kui teil ülejäänutel.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
</body>
</html>
