 selle taasiseseisvumise aja laias laastus vähemalt selle nüüd viimase aja sellise ühese rütmiga, kus ülikoolid teavad, gümnasistid juba teavad, kõik teavad , nüüd kui me muudame seda, siis, siis kindlasti on vaja seda just kommunikatsiooni osa selgitada ka eelkõige ülikoolidele, lastevanematele, tööandjatele, et nüüd on natuke teistmoodi. Te peate täpselt samamoodi, kas võib-olla tulebki erinevates erialades mingisugused õppe d võib-olla hakkavadki hiljem, et kui lõpetatakse ajateenistus ära, nad tulevad noh, jõuluks koju, võib-olla ongi mingisugused erialad, mis ülikoolides ei hakka esimesel septembril, hakkavad esimesel veebruaril ehk siis see, see rütm tõenäoliselt, kuna me ühest sellest sünnikuhordist tegelikult võtame ikkagi üsna suure hulga ära, siis tõenäoliselt noh, ühiskond peab ja ka haridusvaldkond peab sinna kaasa tulema oma innovatsiooniliste lahendustega täpselt, täpselt samamoodi olema sellised o pen minded või siukse lahtise peaga seal tulema kaasa, sest lõpuks ülikoolidel on ka vaja omale neid noori. Ja seal on, seal on kindlasti see koostöö, et mida siis mina saan rektoritele jälle sel gitada ja, ja öelda, et noh, see on nüüd see koostöökoht ja lõpuks tegelikult ju ül ikoolid on, on ka öelnud, need noored, kes on käinud ajateenistuses ära. Nad neid noori on selles mõttes ka mugavam ja parem õpetada. Mina olin ka ülikoolis õppejõuna ja täiesti võin ausalt öelda, ongi neid kursuseid li htsam, sest sa tead, et nad tulevad õigel ajal loengusse. Sa tead, et sa sellise nagu tunnidistsipliiniga tegelema sisuliselt ei pea, sest see on neile ilusti nagu selgeks tehtud. Sa tead, et kui sa annad neile mingisuguse grupitöö, siis seal ei hakka mingisugune selline nagu vorsti jagamine eri, eriti, vaid võetakse grupp kokku, jagatakse rollid, tehakse ära, kantakse ette, võetakse vastutus, mida nad on tegelikult üksteist kuud sisuliselt siis ajateenistuses ju saanud. Tööandja samamoodi olen nagu palju seda näidet toonud, et kui kõige elementaarsemalt , et seletada   <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
