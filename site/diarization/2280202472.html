<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="214.56" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 3:35–3:47</span></span><span class="segment-text">Ei jah, mul ei ole nagu suurt midagi lisada, et. Rändega ühe ja teise nurga alt kokku puutunud, jah, rohkem ei räägi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="226.96" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 3:47–8:28</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh, aga hea publik oma arutelus oleme planeerinud ka teie aktiivset kaasamist. Siis kas siis läbi Slido keskkonna, mille kaudu te saate oma häält edastada? Meie Rkoodid on siin telgis laiali seintel ja ekraanil ja selles ja saa te esitada ka küsimusi, meil on vaba mikrofoni. Aga nüüd natukene ka teemast. Meie tänase arutelu keskseks teemaks on kolmandate riikide kodanike sisseränne Eestis se eelkõige nii-öelda targa rände kujundamine. Et säilitada Eesti ühiskonna toimimine, koostöövõime ja rahvastiku tasakaal. Arutleme panelistidega, kuidas suunata rännet nii, et see toetaks meie majandust, arvestaks ka rändega kaasnevate riskidega. Ning loodame vestluse käigus pakkuda ka mõned lahendused. Aga hea publik, kes te olete tulnud kuulama, me oleme teile ette valmistanud ka esimese küsimuse. Mis te arvate, kas Eesti vajab teie hinnangul rohkem sisserännet? Ja anname teile ühe hetke aega ka vastamiseks. Ja kuni te vastate, ma teeksin teemasse väikese sissejuhatuse, mis ehk selgitab, miks me üldse arutleme antud teemal. Ja mis on meie rändevaldkonna edulood ja murekohad? Kuna paljud Euroopa riigid, sealhulgas Eesti, seisavad silmitsi demograafiliste kriis idega, siis on enamik liikmesriike hakanud reformima ning korrastama oma seadusliku r ändepoliitikat, et soodustada rännet, sealhulgas vajaliku tööjõu saabumist. Samas teadlased ning nende prognoosid näiteks OSKA prognoos näitavad, et tulevikus vaja me me aina enam välistööjõudu. Kuna meie ühiskond vananeb ning tööealiste elanikkonna hulk kahaneb. Statistikaamet eelmisel aastal rahvastikuprognoosiga hinnati, et juhul, kui Eestisse saabub igal aastal sisserändega umbes neli tuhat inimest rohkem kui siit lahkub, siis on meie rahvastik siiski langustrendis. Rahvastiku arvu vähenemist on küll võimalik kompenseerida sündimuse suurenemise ja sisse rändega, aga hetkel on meil nii sündide arv langustrendis kui sisseränne. Kuigi paljudes riikides on tööjõurände mahud kasvanud, mõjutab endiselt elanikkonna vana nemine, tehnoloogia kiire areng, rohepööre, kasv, vajadus innovaatiliste lahenduste jä rele. Ja eelkõige puudutab see siis sektori nagu tervishoid, sotsiaalhoolekanne, ehitus, too tmine, transport, majandus, majutus ja toitlustus. Vaatame korra, mis on meie publik meile vastanud, et meil on kindlasti siin palju val dkonna eksperte ja nagu ma just enne kuulsin, väga targa lause ühes teises paneelis, et peame jutlust kuulutama Jumala sõna preestritele, et siis on samamoodi, meil on siin valdkonna eksperdid kõik kohal. Et tõesti, et Eesti vajab sisserännet on, on enamus vastanuid. Kuna ränne seostub paljudele meediapiltidega kummipaadis põgenikest ja nende piiriüle tuse tõkestamisest, siis tegelikult on enamik sisserändest seaduslik. Meil saabutakse piiripunktide kaudu ja mis panustab oluliselt meie majandusse. Nii näiteks eelmisel aastal see saabus seadusliku sisserände, sisserände kaudu Euroopa Liidu ülem nelja miljoni inimese. Samas ebaseadusliku rände kaudu. Ebaseaduslikke rändejuhtumeid tabati alla kahesaja viiekümne tuhande. Aga kui me nüüd kaasan ikkagi ka meie paneliste, et ei pea siin ainult monoloogi, siis head panelistid, mis te arvate, kas ja miks me vajame rändepööret, milline on teie arva tes Eesti rände hetkeseis ja tervis? Et kui teil oleks võimalik anda selline olukorra pilt, siis kuidas te olukorda kirje ldaksite? Alustan kohe kaunilt Eero sinuga.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="508.44" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 8:28–11:03</span></span><span class="segment-text">Aitäh. Aitäh, mina vastaksin ka, ma oleks selle seitsmekümne kaheksa protsendi seas. Et lühikeses perspektiivis on see üks lahendus, ma ei, ma ei näe ühtegi muud alterna tiivi. Et kõik, miks me sellest üldse teemast räägime, miks on nagu minu valdkond nimega õpi ränne muutunud mingitel hetkedel ka nii-öelda talendipoliitika tööriistaks, lihtsalt ajalooliselt alustades, kui loodi programm Study in Estonia, mida mina siis olen veda nud otseselt või kaudselt päris pikad aastad ja selle sees olnud, siis meie esimene põhjus , miks me seda tegime, oli tegelikult kõrghariduse kvaliteet. Märksõnad nagu rahvusvahelistumine kodus, põnev rahvusvaheline auditoorium, kes tuleb sulle siia koju kätte sotsiaalmajanduslikult raskes olukorra, olukorras olevad Eesti noored, kes õppima kunagi niikuinii välismaale minna ei saa või neil ei ole raha, nad saavad selle rahvusvahelise tunde kätte kodupingis, kõik muud sellised teemad, me taht sime, et meil oleks vinged ägevad õppekavad inglise keeles, et see teadmine, kui vilist lased lõpuks saavad selle kraadi kätte, läheks viiks selle teadmise igale poole laia maailma, see oli see algne põhjus, miks me üldse kõike seda nagu alustasime. Ja see tunne tekkis just pärast seda, kui me liitusime Euroopa Liiduga kaks tuhat neli ja siis oli selge, et tegelikult kogu Lääne-Euroopa näeb õpirännet ühe nagu nurgakivi na terve ühiskonna funktsioneerimisest. Kas riik on atraktiivne noortele, kes loovad elu vundamente? Terveks eluks, sest lõpuks see diplom välismaalt või magistrikraad üldiselt, see peaks avama kõik uksed tulevases elus. Ja niimoodi ta läks ja siis hakkas tulemagi, kui need kriisid hakkasid süvenema ja hakka s selguma, et ikkagi meil rahvastik on demograafilises kriisis. Sündimus on nagu madal, siis järsku hakkas nagu tulema rohkem ja rohkem seda sõnumit , et ka õpiränne võiks olla osa talendipoliitikast. Ehk siis andekamad, motiveeritumad, need, kellele väga Eesti meeldib, miks nad ei võiks jääda pärast õpingute lõppu Eestisse ka tööle? Ja nii ta nagu alguse sai ja ma arvan, et sellisel kujul ma olen nagu kahe vahel, et ütleks nii, et osa üliõpilasi, kes lõpetavad, ma oleks väga rõõmus ja ülikoolid sama moodi, kui nad läheks laia maailma, nad oleks edukad ja nende diplomi peal on eluaeg näiteks siis näiteks, et see kõik juhtub tänu sellele, et ta on õppinud, ma ei tea, Eesti Kunstiakadeemias või Tallinna Tehnikaülikoolis ja osa, kellele siin meeldib, nad võiks jääda meile siia, aga mitte selliseks lühikeseks sutsuks võimalikult kauaks. Et nendest see maksimum, et see kasutegur oleks maksimaalne.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="663.28" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 11:03–11:08</span></span><span class="segment-text">Aga kuidas sa seda hetkeseisu on õpirände tervis korras või?</span></button>
