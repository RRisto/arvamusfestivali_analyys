<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="489.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 8:10–9:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Postimehes mu arvamuslugudega ei tegele. Aga üldiselt tal on õigus loomulikult, et debatt peab olema intellektuaalselt aus ja kohati on kerge sellest mööda vaadata. Mõlemat pidi või õigepidi. Aga see on nüüd kõige ohtlikum asi, mida teha, ongi see kuvand kellestki teisest, eks ju, et nagu mingisugune hirmus asi, kas ta on siis valitsus või, või mõni, ma ei tea, ühesõnaga keegi kuskil, kes tahab halba, justku i ühiskonnale ja kelle vastu tuleb võidelda, nad ei ole üldse nagu võitlemist võiks vähe m olla ja nagu konstruktiivselt arutada rohkem, ma arvan, et Aedul on nagu sada kümme protsenti õigus selle lähenemise poolest. Grans inimesi puudutavas debatis on seda hästi palju näha, kus inimene unustatakse väga tihti ära ja kus on justkui kahe poole arvamused, aga need tegelikult ei ole kahe poole arvamused, vaid inimeste, kes ei ole ise need inimesed, arvamus millestki, kuhu ühiskond peaks liikuma, unustades ära selle, et kõige keskmes on inimene. No umbes nagu, nagu siis, kui me abordidebatti peavad keskealised mehed omavahel ja otsus tavad, kui palju inimesi parasjagu peaks sünnitama.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent

          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
