    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:11–5:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere õhtust kõigile, täna kestasid meid kuulama tulite. Ja meie arutelu teema on kultuur, on majandusharu. Sest see on niisugune teine, ütleme teine lähenemine kultuurile, sest siiamaani kult uurist räägitakse Eestist ikkagi enamasti identiteedi, keele ja väärtuste kontekstis Ja see on muidugi ka igati põhjendatud, sellepärast et meie põhiseaduse preambulis on riigi eesmärgina sõnastatud Eesti rahvuse, keele ja kultuuri säilimine läbi aegade. Kuid kultuur on alati olnud ja jääb ka edaspidi majandusharuks, sest ta loob töökoht i, toob investeeringuid Eestisse, kasvatab eksporti, elavdab turismi ja kujundab ka Eesti rahvusvahelist mainet. Tänane arutelu on organiseeritud uue ühenduse poolt, mille nimi on Kultuuritahe. See idee sai alguse märtsikuus ja tänaseks on sellesse organisatsioon, no ta ei ole jah , ütleme organisatsiooni, kuulub juba kolmkümmend pluss ühingut, liitu, loomingu list organisatsiooni, ettevõtet ja see on väga võimas ühendus ja koosseis. Ja me oleme siin arutelu festivalil, arvamusfestivalil oleme kolme paneeliga, üks nende st on meie paneel, kultuur on majandusharu. Nii et me püüame uurida selle seltskonnaga, kas Eesti üldse käsitleb kultuuri majandus haruna, kas meie maksu ja investeerimispoliitika toetab kultuuri kasvu? Kas me oleme loonud piisavad võimalused erakapitali kaasamiseks ja kas üldse on mõist - , on olemas selline mõistlik tasakaal kultuuri kui avaliku hüve ja ku ltuuri kui majanduse vahel? Meie paneel on ülimalt soliidne. Ma alustan siit vasak- , enda kõrvalt daamidest, minu kõrval on Ksenia Joost, kes on kultuuriministeeriumi loomingu asekantsler, loovisik ja ettevõtja, kellel on mitmekü lgne kogemus loomevaldkonnas ettevõtluses, rahvusvahelise ekspordi arendamises ja ku ltuuripoliitikas ja enne kultuuriministeeriumisse minemist töötasid sa ISIS-is, Eesti ettevõtete Ekspordi arendamise eest Aasia turgudel. Võimas. Ksenija kõrval istub Evelin Pentile, kes on filmiprodutsent, väga eduka rahvusvahelise haardega filmistuudio, Stellarfilm üks omanikke, kellel sellel aastal on käigu käi gus olnud või käiku minemas neli filmi. Nendest mängufilmi, nendest kaks kodumaist ja kaks rahvusvahelist, siis koostööprojekt i. Edasi on, kohe võtan spikrid jah. Evelini kõrval istub Aivar Sirelpuu. Väga pikaajaline, tunnustatud Eesti muusika ja meelelahutusäri edendaja, kontse rdikorraldaja ja tippjuht. Praegu on ta Alexela kontserdimaja tegevjuht, enne seda oli Aivar Saku Suurhalli ehk nüüdse Unipet Arena tegevjuht. Järgmisena Aivari kõrval on Sven Kirsipuu, kes on rahandusministeeriumi eelarvepoliitik a asekantsler. Enne seda on ta juhtinud ministeeriumi fiskaalpoliitika osakonda ja töötanud ka peami nistri rahandus ja poliitika majanduspoliitika nõunikuna. Ja meie minu vastas istub Siim Raie, kes on Artrovert-gale rii asutaja ja galerist. Ja varem töötanud muinsuskaitseameti direktori, Vabariigi Presidendi kantselei direktor i ja Eesti Kaubandus- ja Tööstuskoja direktorina. Ja mina ise olen Piret Ivohatšins, olen Eesti filmitööstuse klastri tegevjuht, enne seda olin kümme aastat Eesti Filmi Instituudi peaprodutsent ja enne seda aegade alguses oli n filmiprodutsent ja stuudio Allfilm üks loojatest. Aga asume siis rääkima teemal, kas kultuur on majandusharu või mis ta üldse on. Ja ma alustuseks esitan sellise küsimuse teile, et miks meil üldse on olnud lihtsam rääkida kultuuri sümboolsetest väärtustest, kui selle majanduslikust mõjust ja mida see on läbi aastate tähendanud Eesti kultuuripoliitikale? Kes võiks sellega algust teha?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="311.36" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:11–7:04</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Siim, palun alusta sina. No eks see kõik algabki definitsioonidest, et asjadel on see tähendus, mis me neile anna me ja kultuurile me kipume andma enamasti selliste kaunite kunstide tähendust. No mulle kangesti meeldib ka kultuuri puhul öelda, et kultuur on kõik see, mis alles jääb, kui valitsus enam ei toimi. Ja kahel puhul on siis rahvuskultuur või etnosel põhinev kultuur meile ka seda oma riik i andnud, et ma arvan, et meie, me lihtsalt kogu selline riigi kogemus ütleb seda, et kultuur on riikluse aluseks enesemääratlusõiguse aluseks ja ja sellest oleme ka tõuku nud. Et kultuuri vaatamine kui lisandväärtuse allikana võib-olla ongi ka keeleliselt meil e meile võõras. Et aga, aga noh, paratamatult ta seda on ja ega jälle. Teine kultuuri definitsioon on see, et see on tähenduslikud seosed inimeste vahel, et me neid tähenduslikke seoseid kogu aeg loome. Kas me tahame või ei taha, need on erineval määral, erinevate asjadega seotud, erinevate inimestega seotud, me loome suhteid ka asjadega. Ja, ja, ja noh, kunst näiteks on üks selline asi, millega me suhteid loome viisil või teisel tähenduslikke seoseid, siis iseenda jaoks kõigil neid seoseid ei teki. Osadel tekib rohkem meelelahutusvaldkonnaga seoseid, osadel tekib seoseid rohkem, ma ei tea mingite muude esemetega. Et aga see õnneks on kõik õpitav või niisugune kultuuriline, sotsiaalne konstrukt, eks , et see saab muutuda õnneks ajas, see, mis tähendusi me me asjadele anname.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="424.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:04–7:19</span></span><span class="segment-text">Ksenija, kas, kui me räägime kultuuripoliitikast, kas see, et me oleme pidevalt selle le sümboolsele väärtusele rohkem tähelepanu pööranud, mida see on tähendanud meie ku ltuuripoliitikale läbi aegade iseseisvusajal näiteks?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="439.24" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:19–12:25</span></span><span class="segment-text">Ma korra tagasi Siimu kommentaari juurde, ta ütles, et see on nagu meile võõras mõel da väljaspool sellist sümboolset võib-olla tähendust ja me täitsa nõustun, et, et nii on, et, et pigem äkki me lihtsalt ei ole harjunud sedasi mõtlema, et, et et ta loob h üvesid ka väljaspool kultuuriruumi. Aga kultuur, kultuuril on nagu erinevaid mõjusid ja kindlasti need mõjud, mis sa siin ka nimetasid, on, on, on kõige olulisemad ja väga suured, mis ei vähenda seda, et tal on ka majanduslikke mõjusid, eks ole. Et kas me oleme sellega nagu harjunud või mitte, see on iseasi, aga tasub nagu vaadata sisse ka asjadele, millega me ei ole harjunud ja hakata neid arendama. Et kultuur kindlasti loob majanduslikku mõju ja mida nagu aeg edasi, seda rohkem, kui me vaatame nagu geopoliitikat ka, siis see on üks nagu suuremaid ja olulisemaid, võib -olla ka selliseid meie nagu eripärasid ja tugevusi, et meil on see kultuuriruum, see on rikas, see on ajaloolisele pinnale üles ehitatud ja ka meie praegune see kultuuri kiht on väga rikkalik, mida me oleme suutnud ehitada ja hoida. Et kuidas me nagu suudame sellest näha ja arendada ka majanduslikku mõju, on nüüd meie nagu oskuste ja tahte küsimus. Ja kuidas me seda süstemaatiliselt nagu ka ehitame, aga see, et see on üks meie tugev usi, noh kindlasti ja seda me saame ka nagu mõju mõttes arendada ka nagu kaugemale ku ltuurist, et see oli lihtsalt siis Siimu nagu vastuse tahtsin väga nagu lisaks öelda Et ja kultuuripoliitiliselt me siiamaani pigem ajalooliselt oleme hoidnud seda kultuuri valdkonnas väljaspool siis suuremaid selliseid koostöid teiste siis sektoritega, muu hulgas siis majandussektoriga, vaatamata sellele, et nagu sa ka mainisid, see loob juba erinevaid hüvesid, aga kindlasti seal on võimekus ka neid nagu suurendada, kui seda k äsitleda ja vastavalt, et see on koht, kus tekib innovatsioon, et tal on väga palju mõju siis majandusele ja mitte ainult, mis on väga oluline, et ku ltuurivaldkonnad ise on võimelised looma majandusmõõdet ja loovadki. Kultuur on ka selles mõttes oluline, et ta loob ka horisontaalset majandusvõimestust ka teistele sektoritele ja näiteks traditsioonilistele sektoritele, mis meil Eestis on ajalooliselt nagu kujunenud, aga võib-olla me ei ole osanud nagu järgmist hüpet teha ja võib-olla vähem abstraktseks seda, seda toon näitena siis, et natuke sel gitada, näiteks kui meil on siis traditsioonilised tootmised olnud ja täna me enam ei konkureeri hinnas, et teha siis allhanget, siis üks väga lihtne hüpe on teha brände, on teha brände, on teha disaine ja needsamad allhanke tehased viia nagu selles väärtuse, siis loomises kallimasse otsa ja just läbi selle loovsektori jõu ja os kuse, mis meil riigis juba on, me ei pea seda ehitama. Maailmas on riike, kus peab seda ka ehitama, me ei pea ehitama, see on olemas. Küsimus on lihtsalt, kuidas me oskame neid seoseid luua. Siis traditsioonilise sektori ja loovsektori vahel ja nagu sa ka mainisid, kindlasti ka riigi kuvand, mis on tänases geopoliitilises olukorras ka ääretult oluline, et me räägime kultuuri osast kui narratiivi loomisest, ka sellest, kelle narratiivid jõuavad ja kui kaugele ja kui natuke mõelda nüüd Eestist väljapoole ja kogu meie Euroopa Liidu kontekstist, siis noh, Euroopa Liit on nagu väärtuse oaas täna ja see , kuidas me oskame seda väärtust ja seda narratiivi väljapoole viia Euroopa Liitu, sama l ajal kui sul on teisel pool nagu megamammutid nagu Netflix, kes toovad kõik need na rratiivid meile ja järgnevatele põlvkondadele. Samal ajal kui meie Euroopas oleme megatraditsioonide lugude loojatena, meil on kõik see oskus olemas, aga me peame seda nagu võimendama ja nagu kaugemale vii ma seda narratiivi. Nii et minu arust nagu kultuuril on nagu mega-mega suur ja oluline roll ja küsimus ei ole minu jaoks selles, kas sellel roll on, küsimus on see, kas meie riigina oskame seda kasutada, kas me oskame seda suunata, kas me oskame luua neid dialooge ja omavahel seda koostööd teha, mitte nagu istuda omaette selle teadmise otsas ja teadma kultuuriinime sed nagu teame seda ja oskame, vaid kuidas me oskame koostööd teha majandusega, kuidas me oskame teha koostööd diplomaatiaga, kuidas me oskame seda narratiivi eksportida, nii et see looks majandusmõõdet, et see looks meile kuvandit ja nii edasi ja nii edasi, et mul on nagu seal pigem küsimus, et mitte see, et kas on mõjusid, on.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="745.4" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 12:25–12:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Sven, kui me nüüd kuulasime Xenjat ja et mõjud on olemas ja kultuur on majandusharu , siis kas me peaksime kohtlema kultuuri, nagu kõiki teisi majandusharusidki? Või on tal mingisugune eripära, mingi spetsiifika?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="767.2" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 12:47–15:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja rahandusministeeriumi vaatest võib-olla tuleb kellelegi üllatusena, aga rahandusministeerium i eelarvepoliitika valdkonna missioon ei ole mitte hoida eelarve tasakaalus ilmtingi mata või lugeda igat senti või, või tagada ainult majanduskasvu. Meie missioon nimelt on maksimeerida Eesti elanike heaolu ja heaolu tähendab kõiki erinev aid poliitikavaldkondi ja kultuur, nagu ka haridus, nagu ka turvalisus on osa heaolu st. Ja seetõttu meie vaatame neid valdkondi selle pilguga, kuidas maksimeerida heaolu ehk siis mis on kultuurivaldkonna sellised olulised mõõdikud, mida me soovime saavutada, kuidas me paistame rahvusvahelises kontekstis ehk siis kuidas maksimeerida selle väike se rahaga, kuidas saada pikast bang for the buck põhimõtteliselt, on meie selline mis sioon ja, ja tuua siis otsustajatele, luua otsustajatele siis adekvaatne pilt Eesti hea olu nagu siis heaolust. Kus me oleme teiste riiki riikidega võrreldes maas, kus me oleme objektiivselt halva s olukorras ja siis neid valdkondi järgi aidata ja siin on kultuurivaldkonnal väga suur töö just sedasama narratiivi, mitte ainult eksporti, eksportida väljapoole, vaid seda sama narratiivi kuvada ja selgitada ka Eesti siseriiklikult kirjeldades siis objektiivse lt selle valdkonna siis olukorda. Ja kui selles valdkonnas on asjad halvasti objektiivsetel kaalutlustel või, või kuidagi konteksti tajudes raha pähe, ütleme niimoodi, kõigil on raha puudu, aga objektiivselt raha vähe, siis see on see koht, kus rahandusministeerium tuleb ja vaatab ja mõtleb kaasa , peegeldades otsustajatele siis seda, seda probleemi, eks, ja võrreldes ka teistega , sest kultuurivaldkond konkureerib ka raha mõttes kõikide teiste valdkondadega. Ja ma ei ole veel sõnagi rääkinud majandusest, eks, ehk siis see on rahandusministeerium i esimene prioriteet saada suurim mõju maksumaksja raha eest võimalikult väikse raha ga saada võimalikult suurim, suurim mõju ja, ja siis peegeldada seda, seda tegelikku st. Ja majandus on seal taustal loomulikult üks vahend, kuidas või mida, mida nii-öelda juurde vaadata ja kultuurivaldkonnas loomulikult on, on mitu seost juba Rahandusministeerium ile kultuurivaldkonnal, kui me räägime sellest samast Actribate&#x27;ist või, või mis iga nes sellist majandus soodustavatest töökohtade töökohti loovatest meetmetest, siis neid on igas valdkonnas, ka kultuurivaldkonnas ja seal on otsene seos ja kontakt meie ja siis teiste ministeeriumide vahel. Nii et nad on, ma ei tea, kas ühe mündi kaks erinevat külge, aga igal juhul rahandus ministeeriumi mõtetes on mõlemad teemad paralleelselt kogu aeg. Majandus ja sissetulekud, mis on üks osa heaolust ja siis see teine ja veelgi suurem osa ehk siis sama turvalisus ja kultuur ja haridus ja kõik sotsiaalvaldkond ja tervi s nagunii, eks.</span></button>

ugineb emotsioonidel, sest esimene küsimus alati on see, et mis probleemi me lahendame ja nagu siin oli, et käibemaks ei ole probleem lahendus kõikidele probleemidele ja äkki on lahendus hoopis mujal, et ärme räägi käi bemaksust, räägime sihitud toetustest näiteks. Nendesse kohtadesse, kus on päriselt vaja. Ja see on efektiivsem raha kasutus kui riigi vaatest vaadata, sest maksusoodustus on maksukulu, see on samasugune kulu eelarve jaoks. Jätame erandid kõrvale, kus maksumäära langetamine toob mingi suurem nagu hüppe majandus kasvus, sellised kaasused on ka, aga negatiivses suunas, kui me räägime piirikaubandus est, mida me mäletame siin alkoholiralli näol, eks, kus maksumäära väike muudatus või mitte, mitte väike, aga päris suur muudatus toob väga suure hüppe ühes või teises su unas, et ka nende nende etendustega võib teoreetiliselt nii olla, eks, et kui me oleme äkki ootamatult väga konkurentsivõimelisemad, tuleb siia väga palju korraldajaid ja siis saab majandus väikse boost&#x27;i, aga aga olemuslikult ikkagi see see esimene debatt on vaja ära pidada, et kas me tahame olla nagu õiglase süsteemina või me nagu maksusüsteemina erandite mõttes või me hakkame tegema erisusi, mis tekitab alati ebaõigluse tunnet teist es valdkondades. Ja siis ikkagi, et äkki on mingi muu lahendus, sellepärast et ka, ka riigi jaoks on see lisakulu, maksulaekumine väheneb ja siis tekib küsimus, et kas siis me jõuame tagasi heaoluni, kas see on see valdkond, kuhu riik peab kulutama või on hoopis õpetajate pa lga suurus, palgad suurem prioriteet kui see, et piletihind on natuke odavam? Aga noh, see jääbki kõik sellise argumentatsiooni tasemele, seesama noh kultuuriministeerium , kultuuriminister laua taga peab veenma valitsust, et vot selles valdkond on priori teet number üks, esiteks see valdkond vajab lisasüsti ja vot käibemaksu erand on par im lahendus selle saavutamiseks. Noh, see saab selle kaudu üldse see debatt tekkida. Vastasel korral on need üldised argumendid, rahvusvahelised soo
