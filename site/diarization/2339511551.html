    <div class="legend" aria-label="Kõnelejad"><span class="speaker-chip" style="--speaker-color:#2563eb">SPEAKER_00</span><span class="speaker-chip" style="--speaker-color:#db2777">SPEAKER_01</span><span class="speaker-chip" style="--speaker-color:#059669">SPEAKER_02</span><span class="speaker-chip" style="--speaker-color:#d97706">SPEAKER_03</span><span class="speaker-chip" style="--speaker-color:#7c3aed">SPEAKER_04</span><span class="speaker-chip" style="--speaker-color:#0891b2">SPEAKER_05</span><span class="speaker-chip" style="--speaker-color:#dc2626">SPEAKER_06</span></div>
    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.92" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 0:11–6:02</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere õhtust ja alustame välispoliitika paneeli viimase aruteluga, mis on kriise rohkem , raha vähem ning seekord me räägime arengukoostööst ja humanitaarabist. Meie viimasele arutelule on, me oleme kutsunud kolm panelisti, mina olen Kairi Saaris o arengukoostöö humanitaarabiosakonna peadirektor Välisministeeriumist ning minuga on Eero Janson, pagulasabijuhataja Silja Kasman, kes on Euroopa Liidu esinduses Armeeni as arengusektsiooni asejuht ning Olga Sõtnik Üro pagulasameti valitsuse kontaktametni k Eestis nagu öeldud, me räägime arengu koostööst ja humanitaarabist ning võib-olla selleks, et alustada ka definitsioonid, mille st me räägime, et kui väga üldiselt öelda, siis arengukoostööga me aitame kaasa arengu riikide arengule ning lähtume selles nende arengu põhimõtetest ning arenguprioriteet idest. Humanitaaria humanitaarabi abil me toetame inimesi, kes on sattunud kriisidesse ja hä tta näiteks kas mingi sõja looduskatastroofi või mingisuguse muu sündmuse tulemusel. Arengukoostööl ja humanitaarabil on ka Eestiga tihe side. Eesti on olnud arengukoostöö sihtriik üheksakümnendate alguses, mil Eestit aidati ning Eestile aidati ennast üles ehitada. Ning alates üheksakümne kaheksandast aastast on Eesti ise arengurahastuse andja. Üheksakümne kaheksandal aastal alustas Eesti oma tööd arengukoostöö doonorriigina sellega , et aidati Ukrainat, kus toona olid üleujutused. Praegu kulutab Eesti arengurahastusele umbes seitsekümmend seitse miljonit eurot, see on kahe tuhande kahekümne neljanda aasta andmed, mis teeb umbes null koma kaks prots ent protsenti meie SKT-st ning suurem osa meie rahastusest läheb Ukraina toetamisele Samal tasemel ehk sellise null koma kahekümne protsendi ümber on olnud meie, meie arengurahastuse summa juba viimased mitmed aastad. Maailma arengukoostöö ja humanitaarabi puudutavad Eestit ka lisaks veel seeläbi, et see , mis maailmas toimub, on loomulikult Eestile väga oluline, see mõjutab Eesti arengu t, mõjutab meie turvalisust ja mõjutab ka seda, millises majanduskeskkonnas me elame , et mida rohkem on maailmas kriise, seda ebastabiilsemad on tarneahelad, mis omakord a võib tähendada Eestile endale ka väiksemat majandusarengut. Kui nüüd tulla tagasi teema juurde, mis oli, et kriise rohkem, raha vähem, siis selle ks, et natukene anda tausta, et miks on selline väide valitud meie arutelu pealkirja ks siis arengukoostöö ja arengurahastuse statistikat kogub OECD vastav komitee. Ja numbrid näitavad, et aastatel kaks tuhat üheksateist kuni kaks tuhat kakskümmend kolm oli arenenud riikide poolt arengurahastusse suunatud summad pidevalt tõusid ning kahe tuhande kahekümne kolmandal aastal nad jõudsid rekordilisele tasemele, mis oli kaks kaks sada kakskümmend kolm miljardit usa dollarit. Aga juba eelmisel aastal andmed näitavad langust ning eelmisel aastal maailma arengu rahastus vähenes seitse koma üks protsenti ja me teame, et ehkki käesolev aasta on all es käimas, me teame, et sel aastal saab see langus olema veelgi suurem. Palju on räägitud Ameerika Ühendriikide rahastuse vähenemisest ja USA-d sulgemisest. Aga samamoodi on teatanud mitmed teised riigid ka oma arengurahastuse vähendamisest ning eeskätt just sellepärast, et suurendada tuleb kaitsekulusid niimoodi, et kui selle aasta statistika kokku lüüakse, siis ilmselt me näeme, et see rahastus, mis on suunatud are ngule humanitaaril, on veelgi väiksem. Aga kriiside arv maailmas ei ole kuidagi vähenenud. Otsisin ka selle kohta statistikat ning nägin, et kahe tuhande seitsmeteistkümnendal aastal ehk enne Covid vajas humanitaarabi umbes sada nelikümmend üks miljonit inimest kolmekümne seitsmes riigis. Ja statistika näitab, et eelmisel aastal ehk kahe tuhande kahekümne neljandal aastal oli abivajajate arv kolmsada miljonit inimest seitsmekümne kahes riigis ehk tegelikult nende aastatega on see arv pea kaks korda suurenenud. Mitmed nendest suurtest kriisidest, mis maailmas on, on ka meil meedia abil väga näh tavad, näiteks see, mis toimub Ukrainas, mis toimub Gazas, aga on ka kriise, mis meil ei ole nii nähtavad, aga mis on ka väga suured näiteks Sudaan, Somaalia, Myanmar ning kui väheneb arengurahastus ja see tähendab, et on vähem võimalusi ka humanitaarselt a idata neid inimesi, kes on sattunud hätta ning arengukoostöö poolelt see tähendab, et on vähem võimalik toetada vähem arenenud riikide arengut, muuhulgas ka selleks, et nad võtaksid kasutusele keskkonnasõbralikumad tehnoloogiad. Nii et, et olukord ongi tegelikult täpselt selline, nagu pealkiri ütles, maailmas on kriise rohkem, aga raha selleks, et sellega tegeleda, on vähem. Selleks, et saada aru, et mis on see praegune olukord täpsemalt, siis ma annan järgne valt sõna kõikidele panelistidele, et nad saaksid anda ennast natuke täpsemalt tutvus tada ning rääkida veidi täpsemalt, kuidas nemad seda näevad. Ning alustaksin Silja Kasmannist, kes kuni selle suveni töötas Armeenias Euroopa Liidu esinduses. Armeenia on üks meie arengukoostöö sihtriikidest ning üks Kaukaasia riik, mis selles praeguses ebastabiilses õhkkonnas on siiski võtnud suuna Euroopa Liidule, Euroopa in tegratsioonile. Kuidas on praegu olukord Armeenias ning kas sealt on ka näha, et arengurahastuse vähe nemine paistab välja?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="362.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 6:02–9:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tegelikult just jõudsin Armeeniast tagasi eile õhtul, nii et värskelt siia Eesti värskusesse Armeenia neljakümne kraadisest kuumusest, et hea vaheldus tagasi olla siin Eestis. Jah, raha on alati vähe, et, et Armeenia suhtes on olnud viimased poolteist aastat selline hüppeline muutus, seal on toimunud praegu selline nagu momentum, nagu me seda praegu nimetame, et, et viimase pooleteist aasta jooksul on Armeenia otsus tanud siiski rohkem Euroopa Liidu poole vaadata ja, ja, ja omalt poolt siis Euroopa Li it on, on panustanud ka selle Armeenia sellisele edasisele arengule ja, ja , ja panustanud just nimelt sellise arengu läbi arengukoostöö. Et, et kui näiteks eelnevate aastate jooksul on olnud arenguk oostöö summad aastalised summad, mis on läinud arengukoostööle, on kuskil kolmkümmend miljonit, siis, siis, siis alates kahe tuhande kahekümne neljandast aastast on need are ngukoostöö summad kuskil kuuskümmend seitse ja pool miljonit aastas, nii et need A rmeenia puhul on, on need summad läinud suuremaks, et see on, see on nagu ka sellest , et, et, et, et aidata kaasa sellisele uue partnerluse ülesehitamisele, et praegu ongi kavas selline uus partnerluskava läbirääkimised Armeeniaga aida ta ka kaasa majanduse mitmekesistamisele ja, ja, ja, ja, ja siis sellega seoses on, on siis Euroopa Liit välja kuulutanud järgmise kolme aasta jooksul niisuguse kahe tuhande seitsme miljon, kahe tuhande seitsmekümne miljoni suuruse vastupanuvõime ja majandus kava Armeenia, Armeeniale. Et Euroopa Liit on, on ka alustanud viisavabaduse läbirääkimisi Armeeniaga ja ka sinna on oodata uued panustused sellisele arengukoostööle, et miks me seda teeme on, on ikkagi , et, et aidata Armeenial muutuda moo rohkem demokraatlikumaks, otsustada lõpuks, mis nad tahavad, kas, kas, kas nende suund on Euroopa Liidu suunas või, või on nende suund kusagil mujal, et, et me praegu üritame neid toetada ja aidata ka Armeeniat rohkem sellist kasvatada sellist riigisuutlikkust ja, ja ja sellist reformiagendat, nagu nad on võtnud. Nii et selleks, selleks on arengukoostööd vaja ja selleks on hästi palju ka vaja sellist doonorite koostööd ja, ja, ja, ja Euroopa Liidul noh, üksi ei saa ja siis on nagu välja töötatud ka selline asi nagu team Europe, kus siis, kus siis Euroopa Liit töötab hästi tugevasti koostöös Euroopa Liidu liikmesriikide ja, ja, ja vastavate sellist e like-minded partneritega. Et jah, nii palju siis olukorrast, aga raha on alati vähe ja, ja võib-olla kriisist räägime natuke hiljem, aga, aga, aga Armeenia on ka läbi teinud suure humanitaarkriisi ja , ja, ja ka seal oli kohe näha, et, et probleem tekkis, et kuidas seda humanitaarkri isi rahastada ja mis edasi saab. Aga ma lõpetan praegu siin.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="583.52" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 9:44–10:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii aitäh. Kuna see humanitaarkriisini jutu viisid, siis järgmiseks Eero pagulasabil ongi olemas kontorid paljudes kriisipiirkondades ning te tegutsete just mitmetes kohtades, mis ongi praegu väga suurtes kriisides. Kuidas paistab praegu arengurahastuses toimuv humanitaarpoolelt?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="605.68" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 10:06–15:15</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tahaks öelda, et olukord on sitt, aga see on meie tulevikuväetiseks, aga mul on tunne , et see väetis veel ei toimi. Nagu siin sai sissejuhatuses öeldud jah kaks tuhat kakskümmend neli on või kaks tuhat kakskümmend viis on juba teinud läbi sellise väga-väga suure languse humanitaarrahastus es, sest me teame, et eelmisel aastal kaks tuhat kakskümmend neli siis USA osakaal hu manitaarrahastuses globaalselt oli nelikümmend viis protsenti ehk siis kui me täna võta me arvesse lihtsalt, et noh, meil ei ole seda neljakümmet viite protsenti enam noh, asi nüüd nii mustvalge muidugi ka ei ole, aga ka teised riigid nagu Kaili juba mainis, Sa ksamaa, Prantsusmaa, Holland väga paljud on teinud ju samasuguseid vähendusi, need võib -olla ei ole nii suure meediakäraga olnud kui vähemalt meil siin Eestis kui, kui USA-d lammutamine. Aga reaalnumbrites need siiski annavad endast märku. Iga aasta ÜRO siis Otsa teeb plaani järgmiseks aastaks iga detsembrikuus an takse välja globaalne humanitaarülevaade, kus on siis tuleva järgneva aasta plaanid. Kui nüüd kaks tuhat kakskümmend neli lõpus, detsembris jah, Kairi viitas ka umbes kolm sada miljonit inimest, kes humanitaarabi vajavad seitsmekümne kahes kriisis ja selle ks kõigeks oli vaja kokku nelikümmend neli miljardit dollarit noh võrdluseks siin Eesti riigieelarve on umbes kaheksateist miljardit, noh see on umbes kaks pool korda Eesti riigieelarvet. Ja nüüd selle, selle USA tõuke tõttu siis või U SA selle, selle rahastuse USA loodud rahastuskriisi tõukel siis siin just juunikuus Üro siis rekalkuleeris kõik oma plaanid, selline hüperp rioritiseeritud siis humanitaarvajaduste ülevaade anti välja kus ka Tom Fletcher, kes on siis Ürohumanitaarjuht, ütles, et me teeme vähema rahaga vähem. Me peame tegema selliseid otsuseid, mis on sisuliselt elu ja surma küsimused nelja kümne nelja miljardit dollarilt kukkus siis kahekümne üheksa miljardi dollari peale see küsimine. Ja seitsekümmend viis miljonit inimest letad sink kinni, eks ole, seitsekümmend viis miljonit inimest jäeti kõrvale. Mida see siis reaalselt tähendab? Me siis nii-öelda sellise globaalse kogukonnana sulgeme näiteks naistevastase vägival la teenuseid selleks, et rahastada siis nendesamade naiste, kes siis on vägistatud k riisipiirkonnas siis traumaravi või nende siis ravimist, meditsiinilist ravimist, nii et selle asemel, et ennetada vägistamist, me teeme selle valiku, et me peame keskenduma praegu sellele kõige elupäästvamale asjale ehk siis nende, kes nais te, kes on juba vägistatud ravile. Bangladeshis Rahinja pagulaslaagrites inimeste toiduportsjonid vähendati poole võrra Sudaanis kaksteist miljonit inimest jäävad toiduabist ilma, kaksteist miljonit inime st, eks ole, kümme Eesti elanikkonda jäävad toiduabist ilma, sest nende olukord ei ole katastroofiline ehk siis level viis vaid hädaolukorra tase ehk siis level neli. Ehk siis nad ei ole veel piisavalt näljased selleks, et saada toiduabi. Ehk siis me oleme juba olukorras, kus me teeme elu ja surma valikuid ja me ei peaks seda tegema. Kas keegi suudab selle selle augu täita, mida siis USA ja teised on, on jäetud, ma arvan , et noh, selge on see, et sellisel kujul ei. Küll, aga kui me siin nii-öelda kõrvutame seda suurfirmade USA korporatsiooni de kasumitega, siis ma arvan, et see on üsnagi pisku, mida me tegelikult ju humanita arvajaduste katteks vajame. See nelikümmend neli miljardit dollarit. Kas keegi teab, palju on näiteks Apple&#x27;i või Microsofti kasum? Ma ei räägi siin üldse käibest, vaid kasum. Kasum on kaks korda nii palju. Ehk siis, kui Apple loovutaks pool oma kasumist, oleks tegelikult humanitaarvajaduste rahastus meil täna olemas, nii et küsimus ei ole võib-olla tingimata selles, et kas meil on raha vähe vaid kelle käes on raha.</span></button>
