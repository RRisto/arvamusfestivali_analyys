gist teisest väga palju kaugemal. Aga lähme täna natuke rohkem teemade juurde tagasi, et meil nagu me rääkisime, ohud on meil igal pool, ei ole olemas turvalist maailma, on pigem küsimus selles, et kas me le iame need ohud ise üles või leiavad need ohud meid üles, kumba pidi teil seda peate ise vaatama ja otsustama ja, ja kui palju teil selles on sõnaõigust, on juba teie enda pea s. Aga alustame võib-olla päris algusest, et miks on vaja mõelda nagu häkker, et kust nii sugune mõtlemine üldse tuleb, et see kõlab kuidagi halvasti. Häkker on kuidagi nagu meie silmis pahategijad, võib-olla, kui vaatame filme, siis on need mehed, keda me peame samasuguseks kriminaaliks kui neid, kes kuskile lihtsalt po odi sisse murravad ja midagi varastavad, et Jaanus, võib-olla sina aitad meil aru saada , et miks on vaja mõelda nagu häkker?</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="459.28" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:39–7:54</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ehk siis tegelikult kõrval küberturvalisus ei ole lihtsalt mingi üks või teine asi, vaid see on tegelikult pidev tegelemine, planeerimine ja läbimõtlemine, kuhu, mida ja mille eest me kaitseme ja millist kaitset meil on efektiivne osta ja millist meil ei ole e fektiivne osta.</span></button>
