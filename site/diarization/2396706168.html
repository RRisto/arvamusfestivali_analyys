    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.96" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 0:11–2:20</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tänases debatis on põhivõim muidugi Heleri ja Jaani käes. Teil on väga suur osakaal avaldada oma arvamust. Kas pigem majanduskasv või pigem tavaline, pigem tavaline majanduskasv, milles me täna oleme pigem või tasaarengus on rohkem võib-olla ka loo bumist, aga suurem osakaal arvestame ka keskkonda ja loodust. Meil on üks sissejuhatav foor ja viis põhivooru. Viimane voor tuleb natukene meeleolukam, võib-olla kui see tava line kuiv teadlase argumentatsioon. Selle viie vooru jooksul kümme minutit anname debateerijatele viis pluss viis, viis, kuus minutit, napsan sellest osa mina ja kindlasti sellest kuuest minutist on hulk minuteid teil oma arvamust kolleegiga ja gada ja seejärel ka meiega jagada. Nii, et kõik saavad sõna, kes vähegi sõna tahavad. Ja siit ta tuleb, algab tšempionite võistlus. Kõigepealt sissejuhatav tutvustus, paar, kaks minutit kummalegi. Kes te olete, miks te toetate ühte või teist, ma praegu isegi ei ütle, kumb toetab mida Ja, ja mis on see mõiste, millest teie täna kõige enam kinni peate, mida see sisu tähendab, mis on meie jaoks majanduskasv ja mis on meie jaoks ta saareng?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="139.56" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 2:20–3:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Palun. Tervist, mina olen Jaan Kers, mina olen puidutehnoloogia professor ja täna ses debatis siis püüan ma siis lahti mõtestada seda, et mis see tasaareng siis on. Et me peaksime siis vähem tarbima, vähem kasutama loodusres sursse, väärindama neid targemini ja teenima siis iga selle kilogrammi peal t, mida me loodusressursse võtame, siis võimalikult hästi raha, et siis üleval pida da oma armast kallist Eesti riiki. Kõiki neid teenuseid, mida me täna tarbime ja mida me riigi käest saame ja selle käi gus me peame ka millestki loobuma, sest kõigi jaoks me paratamatult raha ei jätku. Kuna sellist suurt majanduskasvu minu arvates ikkagi ei tule või on nagu raske ette nä ha. Jah, see oleks siis sissejuhatuseks kõik.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="209.68" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:30–3:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt, mina olen siis Heleri Tasana, majandusteadlane taustalt, väikest viisi ettevõtja, töötanud nii era- kui ka avalikus sektoris. Ja minu roll siis täna on rääkida pigem majandusperspektiivist, panin ka majandaja m ütsi pähe, et segi läheks. Kes meist, kes on?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="233.08" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:53–4:13</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja aitäh ja, ja veel sissejuhatuseks, et mis, miks te arvate , et kas tasaareng või siis majanduskasv oleks Eesti jaoks ikkagi see kõige parem valik?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="252.96" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 4:13–5:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No tasaareng on ikkagi kõige parem valik, sest me ei taha midagi otsustada ja üldse tegelikult investeerida uutesse tehnoloogiatesse tundub väga selline suur risk ja, ja sellega võib palju raha kaotada. Ja targem on ikkagi jätkata samamoodi, nii nagu meil siin on, et kuidagi ikka ots ot saga siin kokku tuleme. Et ei, ei tulnud meile ei biotoodete tehast ega ei ole tulnud ka bioetanooli tehast ega kõik need suured vägevad investeerimisprojektid siiamaani on millegipärast meil läbi kukkunud. Ei, ei ole õnnestunud. Nüüd on meil vaja hakata andmekeskusi näiteks rajama. Need andmekeskused tegelikult tarbivad umbes sama palju energiat kui üks Estonian Cel li tehase töötund, ütleme see kakskümmend viis kuni kolmkümmend megavatti tunnis ütleme sellise suurtootmise energiamaht ja nüüd peamegi mõtlema, et kus see elektrienergia nüüd nendele andmekeskustele tuleb ja neid tahetakse kolm või neli või isegi rohkem rajada Eestisse. Ja sinna tuleb ka väga palju investeerida. Need investeeringud on sadades miljonites, et kuskilt tuleb selle jaoks ka siis nüüd raha võtta. Nii et kuna me ei taha midagi otsustada, ei taha midagi uut ja suurt ja ägedat teha, siis ma arvan, et tasaareng ongi meil ainukene, ainukene tee.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="341.28" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:41–6:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh Helen. Heleri. Selles osas ma olen Jaaniga nõus, et me areneme tasa ja targu, tark ei torma. Aga et, et no mis on siis nagu mõistlikum Eestile, et, et kas tasa ja targu või ikkagi kasvada kiiremini, mina ikkagi ütleks, et kasvada kiiremini. Ja miks on see, et, et me oleme väga väike riik, meil on väga väikene sisemin- sisema jandusturg ja tegelikult on see, et ühiskond vananeb, elu muutub kallimaks, meil, meil on kõik siin suhteliselt kallim, sest meie turg on lihtsalt niivõrd väike, et paratama tult tänast elustandardite juures ma ei näe, et, et me saame ikkagi majanduskasvu kui sellise nii-öelda maha kirjutada.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="390.24" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:30–9:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nonii, esimene küsimus publikule. Kui teil on tuulega Annit, siis võite nendega lehvitada. Kes on poolt, kes on poolt, et Eesti järgmise kahekümne aasta majandus peaks olema kiire kasvuga? Käsi püsti, lipp püsti. Kiire-kiire. Nonii, väga hea, jätke oma praegune arvamus siis endale ka hetkeks meelde, et vaatame , mis selle arvamusega äkki muutub või ei muutu. Võib-olla tuleb hoopis kasvupooldajaid juurde või, või siis vastupidi, saab näha. Heakene küll, lähmegi nüüd siis selle põhi, põhiteemade juurde ja, ja esimene selline sisuline voor on majanduskasvu ja tasaarengu hi nd, kes maksab ja kui palju? Nii. Meil on kõigil telefonid siin, kellel käes ja kellel taskus ja mina püüan kotte, et ei segaks ja noh, see kakssada grammi on ju igalühel on, maksab seal kas neli sada või, või, või tuhat eurot on ju, natukene siiapoole sinnapoole. Aga see pole kõik, see hind ei ole pooltki see, mis ta tegelikult maksab, on ju. Et hulganisti, kümneid tonne maavarasi, mis kogu selle, ütleme, et toote tootmiseks me vajame vesi, elek ter, kõik. Tarneahelad otsast lõpuni. See on, see on, sissearvestamata tegelikult, eks ju. Turuhinna me suudame kinni maksta, aga keskkonna hinda me ilmselt ei maksa. Samas on muidugi selline tasaareng jälle toob meil kaasa võib-olla riigi tulude vähenemise ja eelarve defitsiidid. Et kus siis sinna raha tuleb, et keegi peab kuskilt need augud kinni maksma, vahet ei ole, kas nad on siis looduses või keskkonnas. Heleri, kui majanduskasv põhineb klassikalisel tootmisel ja tarbimisel, nii nagu me seda täna enamasti teame, siis milline peaks olema see tuleviku ärimudel Mis ikkagi lubaks inimestel seda heaolu edasi nautida? Ja samas vähendada siis seda võib-olla kaasnevat keskkonnakahju, et, et oleks see ikkagi majanduskasv, aga, aga mida peaksid tänased ärimudelid teistmoodi hakkama tegema</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="586.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 9:46–12:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See on hea küsimus selles mõttes, et kui sellele vastus oleks, siis me kindlasti juba järgiks seda tõenäoliselt, sest et noh, kui me räägime kestlikkusest, rohepöördest, noh tegelikult idee on ju ilus. Idee on hea ja, ja noh, ütleme üks planeet meil on, seda me justkui nagu kaitsma peaks ime. Aga kuidas seda saavutada teiste mehhanismidega, noh, me ei tea täna. Et kui me võtame, et noh, mis on majandus üldse on, et me räägime SKP-st, mingisuguse st majandusest, mingisugusest kasvust. Aga noh, majandus on tegelikult inimloodud nii-öelda konstrukt. See koosneb mingitest väärtustest, mingisugustest uskumustest ja mingisugustest reeg litest, seadustest, kõigest muust sellisest. Ja kogu see süsteem on tegelikult arenenud kogu selle aja jooksul, kui inimkond on põhimõtteliselt eksisteerinud ja selle süsteemi eesmärk on olnud tegelikult ressursse kaitsta. Et meil on mingisugune väärtus, selle väärtuse alusel, kes on võimalik seda väärtust kandma, kinni maksma, me jaotame neid ressursse. Sest kui me kõik saaksime piiramatult ressursse nii-öelda tarbida, me oleks meil juba ammu need ressursid kõik otsas. Kuna tegemist on inimloodud justkui konstruktiga, siis kõike, mida inimene on loonud , saab inimene ümber teha, nüüd on küsimus nagu see, et, et kuidas teda ümber teha, meil ei ole täna sellele vastust, mitte kellelgi ei ole, sest et noh, kui oleks, siis oleks ju kõik ilus ja tore. Miks, miks me siis ei teeks seda? Teine aspekt on nagu see, et kuna kogu see süsteem on ikkagi ajalooliselt väga pika aja jooksul välja arenenud, kunagi vahetati vääriskive, väärismetalle, noh erinevatel asjad el oli erinev väärtus. Noh, täna me mõõdame kõike seda rahas. Aga see on olnud ikkagi väga pikaajaline süsteem ja nüüd on küsimus, et noh, kui me selle nüüd ümber mõtestame, ütleme, et meie majandus toimib kuidagi nagu mingitel teistel loo gilistel alustel siis kas me oleme valmis selle hinna kinni maksma? Alates tervishoiust, kaitsest, haridusest, millega me vaheta me seda nii-öelda tundi mingi muu tunni, mingi muu kauba vastu, et saadame lapsed ka rtulikotid käes kooli, et õpetajal on ka piir, kui palju tal seda kartulit vaja on, ä</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="731.2" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 12:11–13:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">kki tal on vorsti vaja. Selge, selge. Seesama tegelikult oli ka minu küsimus juba ka nüüd Jaanile, et see aeglasem majandus võibki tähendada väiksemat maksutulu riigile, aga samas meil on tõesti nagu Heleri ütle s, vananev ühiskond, sotsiaal ja tervishoiukulud suurenevad. Me teame, et meilt oodatakse kaitsekulude suurendamist. Ja, ja see võib selle tuleviku ühest küljest ka htluse alla ja löögi alla seada. Et kui majandus ei kasva sellise tempoga, siis kust tuleb kate kõikidele nendele riigi kuludele ja, ja sellistele sotsiaalsetele hüvedele, mida me nii või teisiti tahame, vaata mata sellele, kas me oleme siin Eestis Paides või, või Tallinnas sotsiaal hüvesid tervishoidu me tahame võrdselt, kvaliteetset igale poole.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="801.04" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 13:21–15:35</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Noh, eks me oleme tegelikult juba ju selle lahenduse välja mõelnud, et see tuleb makse tõsta ja tuleb aina uusi makse välja mõelda ja kui koguda makse rohkem, siis on ju jälle gi võimalik kogutud raha valitsemise käigus suunata sinna kus ressursipuudus on. Ja kui meil endal raha piisavalt ei ole, siis saab ju laenata. Laenu saab ka ju võtta, et meil praegu vist riigireiting on päris hea, me saame päris hea protsendiga laenu. Alles siin võtsime, et rakette osta vist kolm või nelisada neli miljardit ja tasapisi see laenusumma siin koguneb. Muidugi noh, kõigil riikidel nii hästi ei lähe nagu Ameerikal on, et kes seal läheb A meerika käest riigivõlga tagasi küsima, keegi ei lähe. Et Eesti käest ilmselt hakatakse tagasi küsima ka ühel hetkel, aga noh, kui nüüd mõel da nagu sellele, mis see tulevik nagu tasaarengust toob. Tööhõives me väga suuri muutusi veel ei ole näinud, aga järjest siin lähevad inimesed , kes kandsid olulist rolli ettevõtetes ja kes tulid üheksakümnendatest ja kahe tuhande ndate algusest nendest majanduskriisidest siin ka kaks tuhat kaheksa on ju, üheksakümmend kaheksa, kaks tuhat kaheksa läbi, kellel on see kogemus, ettevõtjad ja inimesed, nema d hakkavad nüüd pensionile minema ja nad tegelikult tahaksid väärilist pensioni saada ja pensioni me maksame väga hästi Eestis. Ja me tahaks tulevikus veel paremini maksta, on ju. Et nüüd ongi küsimus, et, et needsamad pensionärid töötavad edasi, ega nad ei saa midagi pensionile, töötavad veel kümme aastat või viisteist aastat ja teevad natukene teisi töid ja siis me vähendame selle arvelt, kui nad töötavad, siis me vähendame nende pen sione selle võrra, et nad teevad tööd. Ja oota, mis meil s
