    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.2" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:11–2:23</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast meie arutelule ÜRO pagulasameti korraldatud teemal uus elu , uus, uued rollid pagulaste identiteet ja kuuluvus Eestis. Mina olen Egle Sander, ÜRO pagulasameti Eesti kontori kaitseametnik. Minuga on täna siin kommunikatsiooniuuringute professor doktor Triin Vihalemm. Tere. Siis on meiega tudeng Sharokan Suleiman. Siis on meil matemaatika õpetaja ja MTÜ Satu juhatuse liige, et selle ajal Lilder. Ja lisaks on veel ka Pärnu linna integratsiooni või lõimumiskoordinaator ja M TÜ Ukraina keskuse üks asutajaliikmetest Irina Sotovic. Paar päeva tagasi, kahekümne kaheksandal juulil oli meie jaoks oluline päev. Täpsemalt tähistasime siis ÜRO pagulasseisundi konven tsiooni seitsmekümne viiendat aastapäeva. Ühest küljest see oluline dokument sätestab, kes on pagulane, kes ei ole pagulane, kes mitte kunagi ei saa olla pagulane. Teisest küljest see loob rahvusvahelise kaitse saajatele ja andjatele õiguste ja kohu stuste raamistikku, mis võimaldab rahvusvahelise kaitse saajatel enda elu taas tu rvaliselt ja väärikalt uues riigis üles ehitada. Muidugi konventsioon on mitukümmend artiklit pikk, aga kõike see ei kata, näiteks ro lle, identiteeti, kuuluvust. Ja just see on meie tänane teema ja tänan, et te tulite ja kõigepealt tu tvustaksime veel korraks nüüd osalejate enda sõnadega, kes nad siis täpsemalt on. Ehk siis, kui te peaksite end tutvustama ilma mainimata enda päritoluriiki või rände kogemust, siis kuidas te ennast tutvustaksite? Vaba mikrofon, kes esimesena soovib sõna võtta.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="669.56" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 11:10–14:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">uma? Ja kui ma kolisin viisteist aastat tagasi, olukord oli absoluutselt teine ja eriti mitte keegi ei teadnud, kes sa oled, kus sa oled. No sõltub sellest, et näiteks kui mina kolisin, no esimene suhtluskeel oli vene keel ja loomulikult, et pole vahet, kust sa tulid. No venelane ja ongi kõik ja mitte keegi ei pööranud tähelepanu, kust sa oled pärit ja no ma olen võõra riigis, võõra kogukonnas ja siis no las olla. Ja pärast ja mitte keegi. No ütleme nii, et inimesed, kes tulid sellel ajal või varem või, või natuke hiljem, nende l olid absoluutselt teised eesmärgid, oli absoluutne, absoluutselt teine olukord ja põhimõtteliselt inimesed otsisid parema elu võib-olla ja. Nad väga palju ei mõelnud sellest, et säästa oma keelt, säästa oma kultuuri, traditsiooni ja see kooli kodus. See kõik on olemas, kõik rahulikult, kõik tore, aga see algusest mina nägi n ja tunnen seda ise, et see oli nii tugev tunne seda ühtsust, et keegi proovib võtta ära ja siis niisama lugu Ukrainas, nii need kõik ukrainlased, kes olid välismaal, nad hakkasid tuletada, tuletama meelde üks teistele, et me oleme ukrainlased ja meil on oma keel, meil on oma kultuur, traditsioonid ja mõned juba kohanenud teised välja just tulid, aga mina nägin, et see olukord muutunud ja pärast kõik hakkasid identiseerida ja enda, et mina olen ukrainlane ja ongi kõik, see on pu nkt ja mina räägin ukraina keeles ja õpin teie keelt ja mina näen, et ukrainlased kohanenud väga hästi sõja algusest ja nendel selline protsess käi b palju kiirem nagu minu ajal ja kui mina kolisin Eestisse, see on praegu palju li htsam ja. Nad no inimeste jaoks on väga oluline see, et kui nad tulevad võrra riiki ja hakka vad ka   <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent

          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
