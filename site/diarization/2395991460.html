    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.96" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:11–3:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere hommikust teile ja tegelikult on päris hea meel näha teid siin nii palju on sellise l, tahtsid juba pühapäeva öelda, laupäevasel varahommikul esimest paneeli kuulamas, mis näitab, et juhtimise vastu ikka meil alati huvi on. Ja millest me siis täna räägime, kõigepealt minu nimi on Ave Laas. Esindan ma siin täna Targa Töö Ühingut. Olen Targaühinguga toimetanud aastast kaks tuhat seitse ja see tähendaks tegelikult seda , et mul on olnud väga hea roll kõrvalt vaadata kogu aeg, kuidas töötamise maailm ja juhtimise maailm siis aegade jooksul muutunud on. Ühtlasi olen ma ka Tallinna Ülikooli ühiskonnateaduste instituudi nooremteadur, mis, mis annab mulle teise rolli jälgida, mis, mis siis ühiskonnas toimub ja, ja ka juhti mise valdkonnas taaskord, kuidas asjad edenevad. Ehk siis olen selline kõrvaltvaataja ja ma arvan, et moderaatorina seetõttu selline hea hea pilk siis tänaste osalejatega, kes meil siin on, asja arutada, mida me hakkame aru tama ja arutama ja arutama. Meie tänane pealkiri on, et kriis ei vabasta juhtimisest. Ehk siis me räägime küll peamiselt kriisist, aga läbi juhtimise, ehk siis mida tähendab juhtimine surve all ja oleme siia kutsunud meie arvates ühed tip-top tippjuhid ja toppjuhid, kes siis saavad rääkida oma kogemustest kriisi ajal juhtimise st. Ja ma arvan, et me hakkaksimegi siin otsast selles mõttes, ma nimetan teid ära ja siis ma annan teile igale ühele korraks veidi sõna. Ehk et meil on siin, nagu ka pildid näha, Martin Karro, Tallinna linnaplaneerimise a metist. Meil on Hanne Loore-Mööl, Hedman Liigel vandeadvokaat, nii. Aare Loode, Baltic restorants Estonia juht, ütlesin ma õigesti. Ja. See on õige, sa saad pärast korraldada. Ja siis meil on Tarmo Hõber täna tee ühe juhina siin kirjas, aga sinu karjäär on ka kindlasti nii-öelda minu lemmiksõnagaleidoskoopkarjäär, kus jagub nii mõndagi, et eks me siis sellega siin viime ennast kurssi. Veel korralduslikust küsimusest, küsimus korralduslik informatsioon veel nii palju, et ma kindlasti hakkan teie käest ka küsimusi küsima ja teil on võimalik kätt tõsta ja kui te tahate, meil on seal ka mikrofon olemas ja kui olge selles osas hästi julged oma mõ tteid vahetama ja te saate ka küsimusi, kui te olete siin selline laupäeva hommikuselt veel natuke unised, ei taha häält teha, et siis võite ka Slaido kaudu QR koodi skänni da ja sealt meile küsimusi saata. Aga hakkame siis järjest pihta, ma võtan ka siin istet. Et saame kõigepealt tõesti tuttavaks, et Aaro Martin juba läheb hästi. Martin. Ma arvasin kohe, et ma teid segamini hakkan ajama. Et räägi veidi siis endast kui juhist ja kuna me ikkagi keskendume kriisidest, et siis keda ja mida sa juhid ja võib olla, mis on see sinu viimane kriis olnud millega sa ole d silma pistnud?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="212.76" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:33–5:31</span></span><span class="segment-text">Tere kõigile, mina olen Martin Karro. Töötan Tallinna linna planeerimisametis, olen seda, juhin seda neljandat aastat. Väga-väga huvitav väljakutse on olnud see seal töötada. Kohe selliselt laupäeva hommikuselt mõnusalt kriisi teemad, aga miks ka mitte? Ette valmistudes siia mõtlesin, et kui pikalt olen juhinud, siis kunagi läksin kodakond suse migratsiooniametisse tööle ja kui ma olin kakskümmend kolm juristid läksid tööle sinna, siis tehti mulle ettepanek asuda juhtimist osakonda, et siis juba üle kahekümne aasta juhina töötanud olen avalikus sektoris erasektoris vahepeal SEB pangas, riigi tu giteenuste keskuses ja nüüd Tallinna linnaplaneerimise ametis ja kõik need teada-tun tud kriisid on jäänud sinna aega, et see on olnud niisugune väga mõ nusalt vormis hoidev aeg. Et ei ole hetkekski olnud sellist tunnet, et, et nüüd saab teha kõiki neid asju, mis on edasi lükatud selleks ajaks, kui seda kiiret kriisi ei ole. Et võtaks nüüd selle teise nimekirja ette, vaid kogu aeg on see kõige punasem nimeki ri asjadest, mis, mis peab tehtud saama. Ja mis ma arvan, et Eesti suuruses riigis, mis on ka väga kasulik, mis soovitaks abs oluutselt kõigile proovida töötada mõlemas sektoris. Et ma arvan, et meil on mõnevõrra võib-olla kunstlikult tehtud see vahe, et oi, tema on avalik sektor ja tema on erasektor ja tema tulgu, vaadake, kuidas peab kasumit tee nima ja tema, tulge vaadake, kuidas maksumaksja raha eest töötada. Mitte mingit vahet ei ole. Igal pool on inimesed, igal pool on inimlikud teemad, igal pool on eesmärgid. Kuskil võib-olla sa oled lihtsalt oma tegevustega rohkem nähtaval. Ootused on suuremad ka avalikustamisele ja teisel pool siis saad rohkem teha võib-olla sellise kasumi suurendavaid tegevusi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="330.64" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:31–5:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga mis see sinu viimane kriis ikkagi oleks, mis sa peaksid täna ütleb, et see, see oli viimane asi minu laual.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="461.84" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:42–10:04</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere hommikust ka minu poolt, et mina olen täna Edman Advokaadibüroos vandeadvokaat ja tööõiguse siis valdkonna juht. Ja täna veel advokaadibüroo juht ei ole, aga, aga vaikselt teel sinna ka ja advokaadi büroode kogemust on mul tänaseks üle kolmeteistkümne aasta. Ehk et ole, olemata ise nii-öelda faktiliselt juht, siis, siis tahes-tahtmata advokaadid ja eriti just tööõiguse advokaadid puutuvad selle juhtimise ga hästi tihedalt kokku. Ja paraku siis olen mina see nii, nii-öelda inimene. Ma kujutan ette, et, et paljudes advokaatides ka kõik tööõiguse valdkonna on siis sellised nii-öelda vaiksed käehoidjad nende juhtide kõrval, kes siis õige tel hetkedel aitavad anda õigeid soovitusi, seaduslikke soovitus i ja võib-olla nii-öelda natukene ka juhtida neid riske. Et, et, et seetõttu ma näen nagu enda töös nii sellist tööandja va adet ja, ja, ja neid probleeme, millega, millega suured juhid tegelikult korporatsiooni tööandjate kokku puutuvad, aga nii-öelda ka seda, seda töötaja vaadet, et, et, et me ju mitte ainult ei esinda ainult nii-öelda ettevõtteid, ainult tööandjaid, vaid meie poole nagu mitte küll väga suures mahus, aga pöördub ka ikkagi töötajaid, kes, kes siis on ühel või teisel hetkel nagu tundnud, et kas neile tehakse liiga või siis nad taha vadki mingisuguseid protsesse enda jaoks nii-öelda läbi mõelda, arutada, et kuidas seaduslikke samme astuda ja samamoodi ka nii-öelda ettevõtte tippjuhid, et, et on see siis mingi juhatuse liikme lepingu läbirääkimine, töölepingu läbirääkimine, et siis sellisel juhul nii-öelda tuleme meie, meie siin mängu.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="648.16" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 10:48–12:08</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja viimane kriis, millega ma kokku puutusin, leidis aset kaks minutit enne seda, kui me siit väravatest sisse astusin, sellepärast et lubasin, lubasin eile õhtul kliendi le välja saata ühe olulise dokumendi, talve ülevaatamiseks õnneks, aga aga kuna meie töö on ka selline, et palju kiiret tegutsemist, otsustamistähtaegu, kõik e seda, et ja meil ei ole ainult üks klient, meil on tihti kolmkümmend asja korraga la ual, et siis saatsin selle küll välja, aga öösel olid olnud siis mingi tehniline tead e või nagu tõrge ja öösel ei tulnud teade, et see kiri ei läinud välja. Sellepärast et seal oli vanuses mingi sipp valmis, mida ta ei tahtnud välja saata ja siis õnneks hommikul klient kirjutas, et kas ma ikka saadan selle talle ja saatsin tal le välja selle uuesti, aga aga, aga ütleme niimoodi, et sellist asja väga tihti ei juhtu , aga, aga ütleme, et sellised kiireloomulised asjad on nagu igapäevased, et kas on vaja tänase päeva jooksul midagi otsustada, midagi läbi rääkida, mingi allkirja alla saada , mingi dokument koostada. Juhtkonna mingi otsus nüüd kiiresti ära vormistada teha, et, et, et see nagu käib meie igapäevatööga küll kaasas, igapäevaselt.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
