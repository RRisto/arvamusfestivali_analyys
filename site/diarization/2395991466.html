<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="428.28" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:08–10:45</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja ma natuke täiendaksin. Kas ka? Töötab jah, et seda mikroettevõtete osa ka, et kui me vaatame uuri ngu Euroopast, siis tehakse ettevõtjate uuringuti ka viie aasta jooksul ka Eestis nii Ja seal nende uuringute põhiselt on välja toodud, et miks, või no nii-öelda esimesel kohal, et miks siis ettevõtted töötervishoiu ja tööohutusega tegelevad, on seadusenõ uded või seadusandlus, mida siis see nõuab. Ja eriti tuuakse välja, et haavatavas seisus on siis väiksed ettevõtted just selle koha pealt, et neil ei ole väga häid ressursse sellega nagu töökeskkonna teemadega tegele miseks ja seal ei süstemaatiliselt vahe peal vist kaob. Ja, ja ka seda, et tegelikult suund peaks olema see, et me peaksime toetama just väikse maid ettevõtteid rohkem ja ka järelevalve peaks tegelikult olema nendele nii-öelda suure m või, või me peaksime ka järelevalves rohkem nendele tähelepanu pöörama, arusaadavalt järelevalves on ka vähe ressursse ja täna Kaire võib mind muidugi parandada, aga noh , minu teada või mulle on jäänud mulje, et, et väikeettevõte puhtalt sellepärast, et on väike või mikroettevõte ei ole meil valimis, vaid pigem on just nagu need ohtliku mad ja suuremad ettevõtted prioriteet. Et selles mõttes me liigume nagu oma nende muudatustega teises su unas. Nüüd, mida ma pooldan, et kui me räägimegi sellest, mida tegelikult Siim juba ütles, see töötervishoiu olukorra analüüs, et seda osa siis kitsendatakse täna. No see muudatus siis jõustus aastal kaks tuhat kakskümmend kolm. Ja see on siis analüüs, mida siis kolme aasta jooksul kõik ettevõtted pidid tegema, ehk et tänaseks tegelikult peaks olema kõikidel ettevõtetel see tehtud, muuhulgas ka mik roettevõtetel, aga noh, ma ei taha siin olla nagu liiga kriitiline, aga lihtsalt, et mulle tundub, et see ei olnud nagu väga hästi läbi mõeldud just selle koha pealt, et tegelikult mikro väikestele ettevõtetel on vähe ressurssi sellise asja jaoks. Ja kui me mõtleme selle peale, et kes siis põhiliselt peaksid seda tegema, on töötervi shoiuarstid ja töötervisearstidel noh, ma ei tea, võib-olla vahepeal on toimunud mingi sugune puhang, et, et neid on tekkinud väga palju rohkem juurde, aga tegelikult ka töö tervise arste ja töötervishoiuristi ressurssi meil ka väga palju ei ole. Et seda sinna panna ja muudatus kui selline on siis noh, mõte on see, et, et siis mi kroettevõtted enam neid esitama ei pea. Mida ma ei toeta või noh, mis minu meelest on viga, ma ütleks selle koha pealt võib- olla üldisemalt natukene, et. Kui me vaatame neid nõudeid, et siis osad nõuded muutuvad nagu vähem konkreetsemaks, aga samas noh, minule tundub vähemalt ja mulle tundub, et ka majandusministeerium on öelnud seda, et vastutus tööandjatele kao. Samas jällegi mõnes projektis, mida me Taltechis oleme teinud, me oleme intervjueeri nud tööandjaid, me oleme intervjueerinud erialaliite ehk et tööandjate katuseorganisa tsioone ja tööandjad ütlevad, et nad tahaksid rohkem konkreetseid juhiseid, konkreetse id, et nad ei taha. Nii et selles mõttes natuke üldisem vastus, mida ma ei toeta, aga siis seal on neid mi</span></button>
