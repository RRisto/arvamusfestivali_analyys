<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="409.04" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 6:49–6:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Sest kui meie küsimus on see, et kuidas sellele tavakodanikule või sellele tarbijale , mis muutub talle paremaks?</span></button>

, sellepärast, et sa pea d vähemalt kümme aastat tegema seda lühiajalist majutust, et see käibemaks selle alg selt tagasi saada. Ja, ja siis nad on läinud seda teed ehk tegelikult meil on olemas erinevaid tulevasi üürimaju, aga need täna on lihtsalt lühiajalises majutuses, kuna käibemaksuseadus ei võimalda no ütleme, võimaldab, aga ebamõistlik oleks seda teistmoodi teha. Ehk siis on tehtud majad, üritatakse lühiajaliselt niikaua kuni kuni see käibemaksu ar vestuse periood kümme aastat ära lõpeb ja siis saab hakata käibemaksuvabalt neid välja üürima ja saab pikaajalist üüri tegema hakata nendes majades.</span></button>
