ku küsimustega võrreldes teie teie varas temate lähetustega?</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="279.04" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 4:39–7:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja tere minu poolt ka siis, kõigepealt suur tänu Marek, et meid siin nii juhid ja, ja küsimusi hakkad esitama, aga muidugi kõigile Arvamusfestivalil osalejatele ka. Suur tänu praegu siia tulemast ja meiega kaasa mõtlemast ja rääkimast, küsimusele vasta tes, et kui palju praegu räägitakse kaitsejulgeolekupoliitikast. Loomulikult on see teema number üks. Ükskõik kus meie välisesindustes, et me räägime oma partneritega, oma liitlastega, me peame rääkima ka nendega, kes võib-olla alati ei saa aru. Samamoodi nagu võib-olla meie, aga kui ma nüüd võrdleksin oma aega tagasi viis aastat , kui ma alustasin Oslos saadikuna, siis ka seal oli alguses narratiiv selline norra lastel, et tuhat aastat on meil olnud heanaaberlikke suhteid Venemaaga ja see on üks hea riik, kellega tuleks majandust ja kaubandust ja kõiki kultuurisuhteid edendada. Kuid nüüd me näeme, et see on muutunud ja väga tugevasti muutunud ja me räägime ikkagi praegu suurest võimalikust ohust, mis tuleb meie idapiiri tagant. Mis tähendab seda, et kõik meie liitlased, ennekõike muidugi NATOs, aga ka laiemalt, mõistavad üheselt, et Venemaa on meile ohuks ohuriigiks, mitte ainult konv entsionaalses mõttes ehk siis traditsioonilises sõjapidamise mõttes, vaid laiemalt. Aga ma usun, et me sellest ka täna räägime. Nii et kui ma vaatan ka Roomast hetkel, siis loomulikult, kui me räägime kõigepealt ilm ast ja, ja kõigest muust, siis me jõuame tahes-tahtmata väga kiiresti ikkagi nagu kaitse ja julgeoleku ja meie turvalisuse teemadeni välja. Aga noh, ma tahaksin muidugi öelda kõigile ka sissejuhatuseks, et et kui rääkida tava inimestega nagu ka Eestis, siis kõigepealt huvitab inimesi ennekõike muidugi, mis to <button type="button" class="segment-card" data-segment-id="segment-0004" data-start="425.36" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:05–11:05</span></span><span class="segment-text">Aitäh, aga lähme siis natuke täpsemaks ja, ja annaks kiire ülevaa te siis viimase, ütleme selle aasta jooksul, välismeedias tegelikult sedasama küsimust, mida ma alguses mainisin, kas Narva on järgmine, kuidas seda siis on kajas tatud, et võib-olla kõik siin kohalviibijad ei ole neid lugusid tähele pannud. Aga alustaks professor Karlo Mazalast Saksamaal üsna hästi tuntud õppejõu d ka siis Saksa Bundeswehris räägib seal nii, kui ma ei eksi nüüd luureidistsipliin, ega üldiselt julgeoleku küsimusi ja tema siis kirjeldas oma ilmunud raamatus stsenaariumi, kuidas Venemaa eriüksused imbuvad Eestisse ja rünnak sooritatakse siis omaaegselt koos konventsionaalsete jõududega nii Hiiumaal kui ka Narvas ja, ja mõne tunniga on need kaks kohta siis vallutatud. Saksa luurejuht Bruno Kaal läks hiljuti veel kaugemale ja, ja pani küsimärgi alla, kas Ameerika tegelikult Eesti ründamise korral täidaks artikkel viie kohustusi ja, ja tema sõnul piisaks siis NATO lõhkumise, lõhtu, lõhkumiseks ainult roheliste me hikeste saatmisest Eestisse. Nende mõlema, mõlema inimese seisukohtade vastu ma kirjutasin ühe arti kli, kus ma põhjendasin, et miks ei ole võimalik. Seda on võimalik lugeda diplomaatiast. Aga põhiline probleem on ju see, et need sellised hüpoteetilised stsenaariumid läh tuvad ainult väga kitsast nurgast, kus ei arvestata kõiki aspekte. Ekonomist kirjutas juunis, et Putini järgmine, järgmine sihtmärk on Eesti ja Eesti, Eestis elav venekeelne vähemus on muutunud rahutuks. Juulis oli NATO peasekretäri intervjuu New York Times&#x27;is, kus jällegi se ati kahtluse alla, kas Eesti ründamise korral NATO aktiveeruks ja NATO peasekretär kinnitas, et, et seda kindlasti tehtaks. Ja Saksa ajakirjanikud on, on juulis siin jälle käinud erine <button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="961.04" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 16:01–18:51</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja kui ma võin siit edasi jätkata, siis noh, me mõlemad oleme praegu riikides, nii Ma rika, Saksamaal, mina Itaalias, mis on G seitsme ehk suure maailma majandusega riigi d ja väga olulised riigid, nii et kahtlemata mõlema riigi jaoks on väga oluline, mis saab edasi majandusest ja see omakorda siin on väga tihedalt seotud kaitsetööstuse are nguga, kosmosetööstuse arenguga ja nii edasi. Küsimusele, Marek, et kas Narva on eksnarratiiv, on ka Roomas kuidagi kõne all või midagi ja siis nagu ma enne just alguses ütlesin, et kui tavainimestega rääkida, siis ma ka rdan, et väga paljud ei teagi, kus Narva on. Väga paljud jäävad mõtlema isegi, kus see Eesti täpselt on, et jah, võib-olla ollakse käidud ja nii edasi, aga sellist, et nüüd Venemaa ründaks kohe NAT O-t, Euroopa Liitu, sellist mõtet kindlasti ei ole. Kui ma räägin aga poliitikutega, räägin diplomaatidega, kaitseväelastega, siis nemad kindlasti teavad paremini, neil on oma otsekanalid ja suhtlus partneritega üle kogu Euroopa ja võrgustik on ka luureametitel, nii et kindlasti see teadmine, mis toimub siin pi iri taga, on neil olemas. Aga noh, samamoodi võiks ju küsida, et miks ainult Eesti, et Läti, Leedu, Soome, et kõik , kes on piiririigid, võiksid olla ju järgmised rünnaku ohvrid. Teisalt võiksin ma jälle küsida siin ka teiste --- kuulajate käest, et kas mitte Lamp edusa ei võiks olla next? Et me räägime NATO-s kogu aeg kolmsada kuuskümmend kraadi nagu vaatest ja kaitsest, et kui me oleme ühises peres, me peaksime aru saama kõikide riikide muredest ja, ja, ja vaatama, kuidas me saame olla toeks nendel rasketel aegadel, kui peaks midagi nüüd juhtu ma. Aga tihtipeale, nagu ma ütlesin, et me vaatam
