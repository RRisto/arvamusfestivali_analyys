<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="128.12" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:08–2:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Eks kindlasti meil on väga palju tervete ilusate hammastega lapsi. Aegade jooksul on inimeste teadlikkus tunduvalt paranenud. On väga hoolsaid, isegi mõnikord üle hoolitsevaid vanemaid. Aga on mingisugune hulk lapsi, kes sinna mustrisse nagu kuidagi ei, ei sobitu, sellepärast et nendega on hoopis teistsugused lood. Ja meil on võib-olla tekkinud hoopis uued mured võrreldes sellega, mis oli kuna gi ammu. Vot mul oleks neid pilte tarvis.</span></button>

ema või oli see perearst, kelle poolt oli saatekiri narkoosi sambaravile. Aga siis neile tundus, et ilmselt tasuta hambaraviaeg hakkab otsa saama ja nüüd on ta gumine aeg reageerida. Ütlen vahele, et seda probleemi esineb ka lihtsalt tava vastuvõttudes, kus viimasel hetkel reageeritakse. Näitaks seda viimast pilti ka, kui tal need hambad puhtaks said. Ma ei saanudki hambaid ravida, sest need igemed selliselt veritsesid, seal oli selline katukiht ja kivikiht. Lisaks vajasid seal osad hambad veel juureravi. Et nipit-näpet me saime ära teha, aga siis tuli ta edasi suunata, aga pigem, mis ma taha n öelda, on see, et seesama laps käis üheteist aastaselt seitse aastat tagasi ka na rkoosi sambaravil. Juba siis oli see ema jäänud hiljaks oma reageeringuga, sest siis sai tal eemaldatud kaks jäävammast, mis on ilmselgelt hilja reageeritud, sellepärast et neid ei olnud võimalik enam päästa ja nagu kõigile lastevanematele öeldakse pärast seda narkoosi sambaravi, et palun kaks korda aastas käia hambaarsti juures kontrollimas lapse suuõõne seisund it ja vajadusel teid suunatakse siis jälle narkoosi kui teistmoodi õnnestu, siis see ema ei olnud seitsme aasta jooksul mitte kordagi käinud selle lapsega hambaarsti juures Kui ma küsisin ta käest, miks? Ma ei saanud pädevat põhjendust. Küll oli probleem selles, et tüdruk ei tahtnud ja siis ta ütles mulle, et aga ma vaata sin talle suhu ja seal ei olnud ühtegi auku. Ja ta ei kaebanud ka midagi. Ma muide tegin needsamad pildid ja pärast seda selle lapse nii-öelda äravaatamist, siis läksin palatisse ema juurde, näitasin talle seda katust pilti ja ütlesin, et vaadake , milline on teie lapse suu, mille peale ema ütles, aga kaks tundi ennem oli ta mulle öelnud, et ta vaatab sinna suhu kogu aeg, et kõik on korras. Aga ehk siis ja lõpuks ta ütles, mul on isiklik elu ka, ehk siis see tähendab tegelikult seda, et see on nagu krooniliselt kellegi tegemata jätmine ja hooletus. Aga ütlen veel lõpetuseks, et meie kõige põhilisem probleem on näksimin <button type="button" class="segment-card" data-segment-id="segment-0012" data-start="550.44" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 9:10–11:24</span></span><span class="segment-text">Selles mõttes paremuse poole kindlasti on läinud, me saame väita seda, et meil teatud vanusegruppides on lapsed ikkagi jõudnud juba nii-öelda hambaarsti vaatevälja suuremas hulgas kui varasemalt. Kui meil varem oli kuskil viiskümmend protsenti lastest, kes on kuue-seitsme aastased , siis täna me saame öelda, et seitsekümmend viis protsenti nendest lastest jõuab, kui gi tegelikult peaks sada protsenti nendest lastest selles vanuses läbima hambaarsti kontroll i. Ja Tervisekassa poolt on ju rahastatud see laste hambaravi täna meil kuni üheksateist aastani ja, ja me lisaks veel rahastame ka ennetusprogramme nagu suu kooli projekt, mida siin ka kõrvaltelgis teil kõigil on võimalik uudistada ja, ja saada infot oma suud tervise kohta ja ja ka tõsta oma teadlikkust siis suu hoolduse osas. Need samad projektid on laiendatud ka meil lasteaedadesse, kus toimub lasteaedades ju hendatud suupesuprogramm, millega on võimalus kõigil lasteaiarühmadel liituda. Nii et lapsevanemad, kui teie lapsed on lasteaias ja teie rühmas seda programmi veel pole tehtud, siis utsitage oma lasteaia personali, et nad liituks selle programmiga, sest see on väga vajalik selleks, et lapsel tekiksid hambapesuharjumused ja hambapesu harjumustest saab elus kõik alguse. Lisaks sellele on Tervisekassa ka asunud tegema nii-öelda meeldetuletus kampaaniaid ka nii-öelda sihitud kui laialdasi kampaaniaid, et lastega käidaks vähemalt kord aastas hambaarstil. Lisaks veel sellele on ka sihtrühmade teavitused, et nad tuleksid kontrolli. Ja laialdasemalt, mida me saame öelda, on see, et et täna hõlmatus on iga aastaga tõ usnud, aga ta ei ole jõudnud sellele tasemele, mis meid rahuldaks.</span></button>
