    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.08" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 0:11–2:27</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast siis meie paneeldiskussiooni, kuidas reisida ta rgalt. Tore, et te kõik jõudsite kohale sellisel varajasel kellaajal laupäeva hommikul on ikka laupäev, laupäeva hommik. Minu nimi on Kristi Okpa ja ma siis modereerin seda vestlust väga to redat ja põnevate inimestega. Meil on siin tuntud reisihuvilised, Karola Madis ja Kristjan Prii ja siis ka Välisministeeriumi konsulaarosakonna juhataja Tiina Nirk. Alguses mina küsin omad küsimused, kindlasti kui teil on oma küsimusi, siis palun tõ stke kätt. Me võime seda ka suhteliselt orgaaniliselt teha, et kui noh, me ei pea isegi lõpuni oota ma, kui on selline väga, väga oluline küsimus. Aga alustame kohe, sest et ega meil on ainult poolteist tundi rääkida. Ja ma arvan, et neid kogemusi siin on väga palju, mida jagada. Et reisimine on selline teema, ma arvan, mis on hästi olulise ks muutunud eestlaste jaoks, eriti võib-olla tänu sellele minevikule, mis meil oli. Et võib-olla noored, kes sellel ajal ei elanud, siis noh, nemad ongi selle vabadusega kohe nagu noh, üles kasvanud. Aga, aga eks see soov ikkagi seda laia maailma nagu avastada on, mulle tundub iga lühel olemas ja, ja ma arvan, et sellest tasub ikkagi rääkida ka, et mis need võimalus ed ja kõik asjad on, aga ma tahaks äkki alustada just sellega, et et äkki te räägiks ite selle, selle, selle algusest nagu, et igaüks jagaks praegu oma esi mest reisikogemust või esimest reisisoovi äkki isegi. Et äkki alustaks sinuga, Kristjan?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="146.8" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 2:27–2:32</span></span><span class="segment-text">Tervist, no ma olen muidugi harjunud, et ikkagi leidis first, aga kui sa juba sõna and</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="152" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 2:32–2:33</span></span><span class="segment-text">sid.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="152.68" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 2:33–4:15</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Meid on kolm siin, nii et. Minu lapsepõlv nõukaajal oli selles mõttes natukene isesugune, et kui sa ütlesid, et nõukaajal oli piirid kinni, jah, tõesti olid. Aga kuna minu isa töötas kalanduse valdkonnas ja oli selline Eesti kalanduse põhimõtteliselt enam-vähem üks tippudest sealt, siis sõbralik Nõukogude Liit käis ju Aafrikas abistama s riike ja Angoola oli üks selline nii-öelda sõprusriik, et noh, kui A afrika oli laias laastus toona, siis ära jagatud, et pool oli jänkide oma ja pool oli siis Nõukogude Liidu hallata, siis Angola oli noh, nii-öelda siis nagu meie plokis. Ja tänu sellele avanes mul juba suhteliselt väiksest peast võimalus elada Angolas. Ja me käisime seal kaks korda, esimest satsi ma olin selline viieaastane, sain seal kuu eaastaseks ja teist korda olin siis kaksteist, sain seal kolmteist. Ja, ja toona ma olin siis juba koolipoiss, kui teist korda käisin siis oligi nii, et päeval siis Vene saatkonnakoolis käis rääkimine ja kogu suhtlus vene keeles ja siis peal õunal kohalike siis kohalike lastega Portugali keeles, nii et ma põhimõtteliselt sain kolmeteistaastaselt noh, valdasin mõlemat keelt juba. Noh, tänaseks on Portugali keel muidugi läinud, sest praktikat ei ole. Aga vene keel on siiamaani oli keskkooli lõpuni viis, siiamaani saan hakkama. Nii et niisugune, et ma, ma jõudsin Angoolas enne ära käia, kui Nuustakule jõudsin.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="254.72" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:15–5:18</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mina sündisin kaheksakümne seitsmendal aastal ja minu esimene reis oli Sotši. Ma ei mäleta sellest eriti palju, sest ma olin siis ainult mõneaastane. Aga rohkem mäletan seda läbi piltide, mida ma siis saan vaadata, et et selles mõttes ma ei saa nii täpselt oma esimesi reisikogemusi jagada, aga jah, see oli esimene soo jamaa reis. Aga võib-olla sinu esimene teadlik reis siis? No see on jällegi selline kahe otsaga asi, kas noh, vanasti sa käid reisidel kaasas lapse na, siis kui vanemad viivad sind kuhugi ja kui teadlik sa sellest nagu tegelikult ikka oled. Ma ise tunnen, et minu teadlikud reisid algasid alles umbes. Ma pakun, et mingi kümme aastat tagasi või nii, sest siis ma hakkasin teadlikult tegema otsuseid, et nüüd ma tahan reisida, ma tahan näha, ma tahan kogeda, ma hakkasin otsus tama, kuhu ma lähen, kauemaks ma lähen, kuidas ma lähen ja kuidas selle eest maksta. Et selles mõttes ma pigem jah ütleks, et mu teadlikud reisid algasid umbes kümme aastat tagasi ja enne seda oli selline, et kuhu elu mind viis.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="317.68" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:18–5:24</span></span><span class="segment-text">Aga äkki siis kuuleks ka sinu reisikogemusi enne, kui sa hakkad meile väga asjalikku</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="324.24" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 5:24–5:43</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">juttu siin rääkima, Tiina. Ja tere hommikust ka minu poolt, et minu esimene reis oli, kui ma olin kümnene ja siis ma reisisin koos vanematega Riiga loomaaeda ja see oli põnev. Aga Läti on tore ja mul siiamaani meeldib, Lätis väga reisida ja kaks mu lähetust on ka viinud mind Lätti.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="342.88" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:43–6:44</span></span><span class="segment-text">Nii, aga siis nüüd nagu on see küsimus, et, et kui inimesed tahavad reisida tavaliselt, siis mulle tundub, et, et väga paljud inimesed tegelikult ka kardavad üldse seda mõtet, et et kui nad ei ole nagu seda kogemust võib-olla noor elt saanud, nagu teie, siis seal tekib sihuke hirm, et kas ma üldse hakkama saan. Ma olen seda lihtsalt kuulnud nagu tuttavatelt, kes kuidagi tunnevad seda soovi reis ida, aga samas kuidagi ei ole sattunud ja ei ole ka ise valmis seda sammu teha, sest et nad tunnevad, et see on nagu hästi keeruline. Et, et, et kas teie arust see tõesti nagu nõuabki mingisugust julgust, et kui teie esimese d sammud võtsite, et et kas see oli natuke hirmuäratav, noh, teie enda reis enne, kui te pidite oma noh, vanematega käisite kuskil, et kuidas see tundus teile?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="403.56" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:44–7:27</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma arvan, et see võtab kindlasti julgust, aga rohkem võtab see huvi, et kas sul on huvi kuhugi minna ja ma olen ikkagi seda meelt, et kõik, mis sulle pakub huvi või kõik, mis sa tahad, sa oled ise võimeline seda tegema. Et oletame, kui sa ei ole veel piisavalt julge, et minna üksi kuhugi reisima, siis sa kindlasti leiad kas tutvusringkonnas kedagi, kes on julgem, et koos minna või siis lähe d mingisuguse pakettreisiga, kus keegi korraldab, on kümme inimest grupis ja käite kõik kohad läbi, et mida rohkem sa käid, seda julgemaks sa saad ja ma arvan, et see esimene samm on kõige raskem, aga kõik muud sammud juba lähevad palju lihtsamini ja siis sa tead ka rohkem, mida sa eelistad, mis reisistiili ja nii edasi, et saad vastavalt oma pla ane teha. Kuidas sulle tundub, Kristjan?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="447.36" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:27–8:10</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja ma olen täitsa nõus, et noh eks iga kõige pikem reis hakkab ka esimesest sammust ja ega siis ei pea ju kohe Uus-Meremaale sõitma esimese hooga. Et siin lähiümbruses on hästi palju põnevat. Eestis on hästi palju põnevat lihtsalt ütleme noh, see selline täpselt seesama, see esimese sammu astumise julgus, sest sealt edasi kõik sammud juba järgnevad iseloogilist rada pidi ja ja nüüd siis niisugune ütleme ma ei taha nagu öelda mingit ettevaatust, aga niisugust nagu tarka taju, talupojamõistust natukene kasutades, et just põhiline, et tuleks ära teha esimene samm.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="489.64" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 8:10–9:09</span></span><span class="segment-text">Aga rääkides siis esimestest sammudest, et tahaks nüüd kuulata, mis on see esimene re is, mille te piditegi ise täiesti nullist korraldama endale. Et kas on teil meeles, et kuidas te selle mõtte peale tulite? Mida te kõik tegite, et selle jaoks ette valmistada, et ma lihtsalt ütlen, et mulle tundub , noh, kui ma ise oma reiside peale mõtlen, siis noorus on väga huvitav aeg. Et see, kuidas ma noorelt reisisin, praegusel momendil ma ei tunne, et ma oleks valmis sellisel moel reisima, et mingisugust nagu nõuan rohkem nagu sellist mugavust. Aga siis, kui oli noh, just see nooruse aeg oli sihuke, et palju ma siis planeerisin , kas ma üldse planeerisin, et oleks huvitav kuulata, et kuidas teie need, see esimene teadlik ja kuhu sa ja kuhu te siis oma reisiga jõudsite?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="549" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 9:09–11:46</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma saan natuke üldisemalt rääkida, sest ma olen hetkel käinud üheksakümne ühes riigi s sada neliteist, kui arvest- arvestada ka neid asumaasid ja selle aasta lõpuks ma loo dan, et ma olen käinud üheksakümne seitsmes riigis ehk siis, et mul on raske meenutada , millal see esimene oli, aga üldiselt minu protsess reiside ettevalmistamisel on see , et ma kõigepealt vaatan, kus ma saan odavat lennupiletid, kui need satuvad minu info välja, siis ma pokin nad ära, vastavalt sellele, millal mul need kuupäevad sobivad, siis ma hakkan majutust otsima, sest mida varem sa majutust otsid, seda paremad variandid sul on ja kui tõesti tahta mugavust ja ei taha minna hostelitesse, siis tegelikult täna päeval on nii hea rentida mingisuguseid kortereid, kus sa saad ise süüa teha sellepärast , et kui sa hotellis oled, siis tavaliselt isegi kui hommikusöök ei ole hinnas, siis sa pead kaks-kolm korda päevas sööma väljas ja see läheb väga kulukaks, et enamus re isikuludest lähebki just toidu peale, et minu meelest kui sa tahad nagu kokku hoida, siis kõige targem on see, et, et sa teed ise süüa ja, ja minu meelest see kriitika, et aga siis sa ei koge ju kohalikku toitu, on vale, sest esiteks alati võid ju restorani ka minna, aga need toidupoes olevad asjad on ka kohalik toit, et kui sa teed natuke uuri mustööd ja vaatad, mis seal on populaarsed asjad, mida süüa sa saad ise neid valmistada , sa saad valmistada neilt just kohalikust toorainest. Et minu meelest see ei takista ja noh, väga oluline on ka uurida enne, et kuidas seal ringi saab liikuda, et kas on selline riik, kus on hea ühistranspordisüsteem või siis on targem rentida auto või võib-olla kui sa lähed kuhugi linna, siis sul polegi midagi vaja, sa jalutad ringi ja koged nagu omal jalal seda piirkonda. Ja üleüldiselt, kui ma reise ette valmistan, ma teen väga palju uurimustöid ette ära just sellepärast, et ma tahan teada, et kas seal piirkonnas lähedal on veel midagi näiteks kahe või kolme tunni sõidu kaugusel, et ei oleks nii, et kui ma tulen sealt ära, siis ma saan teada, et mingi tohutult vägev kosk oli poole tunni kaugusel ja ma ei läinud ki sinna. Et selle jaoks on mul ka nagu väga oluline teha seda uurimustööd. Aga kui sa lähed lihtsalt nagu puhkama reisile, et nautida päikest, siis nagu seda uuri mustööd nii väga ei pea tegema. Et siis juba hotellid ja kõik muud pakuvad sulle neid tuure, mida võtta ja nii edasi Aga noh, kokkuvõttes ma ütleks seda, et mida rohkem uurimustööd sa teed, seda teadliku m sa oled ja seda soodsamaid valikuid sa saad teha, kui sul on näiteks mingisugune eel arve, millest sa ei taha üle minna.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
