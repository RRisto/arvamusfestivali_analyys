    <div class="segments"><button type="button" class="segment-card" data-segment-id="segment-0001" data-start="11.36" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 0:11–0:48</span></span><span class="segment-text">Kell on viisteist viiskümmend, väga tore, minu mikker läks ka tööle ja algamas on siis arutelu pealkirjaga &quot;Mis on fosforiidi kaevandamise hind. Väga tore, et kuulajaid on juba siia kogunenud, et tõepoolest tegu on üsnagi päevakord se teemaga, kohati ka päris sellise tulise teemaga, emotsionaalse teemaga mõne inimese jaoks. Ja, ja päevakorras see teema tõepoolest on, sest Eesti Geoloogiateenistus on läbi vii mas uuringuid, mis on siis eelduseks, et me saaks otsustada võimalikku fosforiidi ka</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="48.28" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 0:48–0:50</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">evandamise üle.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="49.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 0:50–2:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja mul on väga hea meel, et väga mitmekesine paneel on täna siia tulnud. Tutvustan siis siit järjest, minu kõrval on geoloogiateenistuse direktor Sirli Sipku lli. Siis sealt edasi Ragn-Sells, Eesti juhatuse liige Alar Saluste. Ökoloog ja Tallinna Ülikooli keskkonnateadlane ja ka Euroopa kliimapakti saadik Mihke l Kangur, tere. Ja sotsiaal- , sotsiaalantropoloog Aet Annist, tere. Ja mina olen Ode Maria Punamäe. Ja ma ütlen veel siia lisaks, et kindlasti soovitan kõigil jääda siia arutelu lõpuni kuulama, sest et viimased pool tundi sellest on hoopis midagi teistsugust, ei ole selline paneelarutelu, vaid panelistid jätavad siis oma eksperdimütsid kõrvale ja liituvad pu blikuga ja toimub demokraatiamusklite treenimine. Aga seda, seda siis näete hiljem. Aga soojenduseks ma küsiks teilt kõigilt ühe ja sama küsimuse sellise hästi-hästi lü hikese. Palun öelge üks sõna või, või siis lühike fraas, mis teie jaoks selle tänase teemaga esimesena seostub ehk siis fosforiidi ja potentsiaalse fosforiidi kaevandamisega, alusta</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="124.72" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:05–2:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">me siit. Üks, üks, võimalused ja ohud.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="131.36" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 2:11–2:21</span></span><span class="segment-text">Ma teeks ühe paranduse ka, et ma ei ole Ragn-Sells&#x27;i juhatuse liige. Ragn-Sellsi tütarettevõtte juhatuse liige. Aga mulle seostub fosforiidiga ja fosforiga toit.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="140.92" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 2:21–2:29</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kõigepealt. Fosforiidiga minul seostub katkine fosforiringe.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="149.2" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:29–2:36</span></span><span class="segment-text">Minule vist seostub selline maha magamine või pimestamine. Ma loodan, ma saan seda seletada pärast.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="155.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 2:36–2:57</span></span><span class="segment-text">Ja väga põnev, väga erinevad mõtted juba kerkisid. Aga alustame ikkagi sellest, miks me täna siin oleme, on see, et geoloogiateenistuse l on juba juba pikalt tegelikult käinud väga põhjalikud uuringud sellel teemal, et ma küsikski Sirli, mis see värskeim seis on, kuhu tänaseks jõutud on, kas midagi saab juba tulemustest ka öelda?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="177.4" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:57–3:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Midagi tulemustest veel öelda ei saa, sest kui me midagi praegu ütleksime, siis oleks see selline noh, mäletate seal toas on üks elevant seal pimedas toas, et see oleks siis , et me näitaksime taskulambiga võib-olla siis elevandi kõrva või siis tema saba peale , et seetõttu me praegu veel niisuguseid vahetulemusi välja ei, ei paiska. Aga mis hetkel olukord on, on see, et kõik katsetused edenevad, selles mõttes on kõik korras. Kui keegi mäletab, siis pressis käis läbi, et meil võttis aega leida partnereid, kes oleks nõus tegema neid laborikatsetusi. Need on leitud ja tööd käivad, vabandust.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="213.12" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 3:33–3:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Häll läks ära.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="217.2" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:37–3:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et selles mõttes kõik on jah, korras.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="220.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 3:41–4:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja aga sellegipoolest arutada on ju igatahes oluline ka praegu, kuigi väga selgeid tule musi, uuringu tulemusi veel ei ole. Ma siin annaks kohe äkki publikule ringile, kui Sirli sa lubad fosforiidi ja kraptoli itargiliidi. Kui keegi aitab mul need liigutada kuskile. Jah, lihtsalt ringile, et. Et kes julgeb?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="246" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 4:06–4:49</span></span><span class="segment-text">Sellel teemal arutame. Ütlen äkki vahele, et kes, et võite rahulikult karbikesed lahti teha, suhu ei soovita panna, te ei omasta seda fosforit, mis seal fosforiidis on ja, ja fosforiidiga tuleb teil kaasa teises karbis siis selle keerulise nimega must kilt ehk --- liitargilliit , sa ütlesid selle nime väga ilusti. Mida geoloogid siis on nimetanud ka fosforiidivalvuriks. Selles musta mustas kivis või selles kraptoliitargilliidis siis on sees uraan ja vana dium, aga selles fosforiidis siis on sees fosfor. Nii et laske palun ringi käima ja vaadake seda, et see fosforiit on tegelikult ju lii</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="288.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 4:49–5:27</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">v. Ja aga lähme siis selle teemaga natukene laiemaks, et me teame kõik, et fosforiidi ka evandamise vastu on eestlased kunagi kaheksakümnendate lõpus väga tugevalt võidelnud Toona, vähemalt mulle tundub ajalukku vaadates nii, et oli see ikkagi väga tugevalt seotud ka võitlusega vabaduse, iseseisvus, iseseisvuse eest, et kuna kaevandaja tahtis ju N õukogude Liit. Aga kuidas see tähendus tänaseks muutunud on, et kui me fosforiidist või fosforiidi ka evandamist räägime, et kas seal on täna mingid teised tähendused küljes, aed, kuidas</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="327.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 5:27–7:39</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">sulle tundub? No väga kindlasti on ja võib-olla tulebki alustada sellest, et mis siis oli, et siis oli tõesti selline noh, Eesti oli selline ressursi needuse all ägisev riik mitmes mõttes , kuhu siis tuli väga palju tööstust ja sellega seotud erinevaid nii sotsiaalseid kui , kui ökoloogilisi tagajärgi. Nii et kaheksakümnendatel oli Eesti kõigist liiduvabariikidest kõige saastat um õhusaaste oli kõige kõrgem ja seda just siis transpordi ja tööstuse tõttu. Nii et inimesed olid väga teadlikud ja tundsid seda ise, ma mäletan ise lapsena hetki , kus tuled Tallinna ja tunned, kui hirmus hais igal pool on või liigud mingites muud es piirkondades, kus on tööstust. Et, et me olime väga teadlikud sellest tol ajal ja, ja Eestist oli saamas niisugune o hverduspiirkond, kuhu siis tuua veel juurde tööstust, kaevandust ja nii edasi ja nii edasi. Ja see teadlikkus oli väga kindlasti ka seotud just täpselt selle, selle keskkonnate adlikkuse ja selle looduse tunnetusega. Ja, ja seda niisugust pimestavat mõju, mis oli niisugu või mis tänaseks on niisugust el siltidel selle igasugustest sellistest majanduslikest võimalikest kasudest, seda oli palju vähem ja meedia kõneles sellest väga teistsugustel viisidel ja meediat oli ka vähe m sellist, mis tekitaks segadust. Nii et selle mõjul ilmselt on ka tänaseks muutunud palju olulisemaks just nimelt see majanduslik väärtus ja on kaotsi läinud see äratundmine. Noh, kui ohtlikku potentsiaalselt ohtliku asjaga me ikkagi tegeleme ja kuivõrd niisu gune nagu kriitilisus, eks ole, et see ei ole ainult see kriitiline maavara, vaid ka see kriitiline oht, mis sellel võib-olla meie veevarudele, et see on ikkagi natukene kuidagi tagaplaanile vajunud võrreldes tollase ajastuga, nii et ma arvan, et need on need põhipunktid, milles me, milles me oleme oma seisukohta muutnud ja see niisugune ökotsiidi äratundmine, mis ilmselt tol ajal muudele elementidele lisaks ka inimest käi vitas, see, seda meil praegu enam millegipärast niimoodi ära ei tunne, nii selgelt.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0016" data-start="458.68" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 7:39–8:00</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja no me teame, et tehnoloogia areneb ju väga kiiresti ja kaheksakümnendatest alates on see ka väga palju arenenud, meil kõigil on teistsugused telefonid taskus ja nii edasi Mihkel Kangur, kuidas sulle tundub, kas see tehnoloogia areng on fosforiidi kaevanda mise muutnud keskkonnasõbralikumaks?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="480.04" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:00–9:22</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma ei ole selles kindel, sellepärast et need loodustingimustest tulenevad riskid ei ole ju mitte kuskile ära kadunud. Nad on teatud mõttes süvenenud. Me teame seda järjest paremini, et, et meie põhjaveevarudega on olukord oluliselt võib -olla halvemaks läinud, kui see oli kaheksakümnendatel, kus kaevud põlesid ainult suur te sõjaväeosade läheduses, aga praegust me peame tunnistama, et seitsekümmend protsenti meie kaevudest ja allikatest ei väljasta enam nõuetele vastavat joogivett, et, et see põhjavesi on, on saastunud ja kogu maailmas on veevarud muutunud järjest kriitilisema ks. Et seetõttu, et, et me läheme, teeme kusagile nii tundlikule alale väga suure sügava augu sisse, see ükskõik missuguse tehnoloogiaga, kuidas me seda kaevandame, ega me ei saa öelda välistada, et, et sellega ei kaasne needsamad keskkonnamõjud, et, et see kindlasti on. Tehnoloogiad on muutunud, meie teadmised võimalused asja uurida on oluliselt muutunud , aga riskid ei ole kadunud.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0018" data-start="562.32" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 9:22–9:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja nendest keskkonnariskidest me kindlasti jõuame veel siin rääkida selle arutelu jooksul , aga Alar, ma pöörduks sinu poole, et sina esindad siin mingis mõttes natuke sellist alternatiivset võimalust, et teie ettevõte ehitab Saksamaale tehast, kus hakatakse fo sforit välja võtma reoveesetetest. Et kas tõesti me oleme selle tehnoloogia arenguga jõudnud siis nii kaugele, et põhimõtteliselt võiks kaevandamise asendada siis ringmajandusega?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0019" data-start="592.32" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 9:52–10:15</span></span><span class="segment-text">Aitäh ja ma täpsustaks seda, et me päris ei võta välja seda reoveemudast, vaid me võta me siis tuhast, mis jääb reoveemuda tuhastamisele järgi ja, ja miks seda tehakse, on see, et natuke seotud sellesama puhta joogiveega. Et reoveemuda on koht, kus mikroplastid igasugused raskesti lagunevad ravimijäätmed jõua</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0020" data-start="614.92" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 10:15–10:20</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">vad tegelikult tagasi ringlusesse ja niisugune Saksamaa on niisugune eesrindlik maa,</span></button>
