    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.04" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 0:11–1:23</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast kõigile täna siia Vinri tuuletuhina alale, mul on väga hea meel, et te olete soovinud alustada Marmu festivali just selliselt tulevikku vaatava teemaga, nagu on järgmise põlvkonna õpilasmalev. Täna me arutleme selle üle, mis on üldse õpilasmalev, milline ta on ajalooliselt olnud , milline ta on hetkel ja milline on meie tulevikuvisioon. Mina olen Annela, modereerin tänast vestlust. Olen õpilasmalev seotud aastast kaks tuhat üheksateist, kui tulin rühmajuhiks. Hetkel töötan staabis logistikuna ja igapäevaselt läheb mulle noorte elu samuti väga korda. Sest töötan koolijuhina. Aga ma loodan, et see oli nüüd minu kõige pikem sõnavõtt, sest et mul on siin niivõrd põnevad ja mitmekülgsed külalised, kes hakkavad kohe ennast ise tutvustama. Ja kuna meil on sellel aastal kuuekümnes juubeliaasta malevas, siis ma väga soovin, et meie panelistid räägiksid juurde ka mõne meeldejääva maleva mälestuse, aga hakkame si</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="83.2" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 1:23–3:12</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">it otsast. Tere kõigile, hea meel, et olete tulnud õpilasmaleva paneeli või õpilasmaleva teemat siia kuulama. Mina olen Külli Tatter, olen sihtasutuse õpilasmaleva juhataja. Malevas me loeme neid aastaid suvedes. See on minu neljas suvi siis, mida ma olen õpilasmalevas juhtinud. Olen, aga ma olen ka varasemalt olnud rühmajuht ja päris siis, kui sihtasutus Õpilas malev alles loodi kakskümmend kolm aastat tagasi umbes. Ja mina juhtisin sellist huvitavat rühma nagu Peterburi rühm, et Tallinna linnal oli siis sõprusrühm Peterburis ja õigemini sõpruslinn oli Peterburi ja meie siis saime ma levlastega minna Peterburi rühma tegema. Ja see oli kindlasti üks väga äge kogemus. Aga mis nüüd puudutab maleva nendest meeldejäävatest mälestustest, siis ma võiks üks i siin tõenäoliselt see poolteist tundi ära täita. Et muidu ma siin laval tõenäoliselt ka ei oleks, kui malev ei oleks niisugune koht, kus on väga äge, lahe ja neid mälestusi ja meenutusi tekib. Aga võib-olla üks niisugune nagu elamus või niisugune nagu erehetk on siis, kui minna näiteks nendele malevarühmadele bussi peale vastu, kuna ta on just malevast tulnud ja need emotsioonid, mis neid noori nagu siis valdavad, et ühest küljest nad seal nutavad lahinal, sest et nende malevasuvi on läbi saanud. Teisest küljest nad seal laulavad ja tantsivad oma neid tantse veel parklas, et lihtsalt see emotsioon, mida nad sealt saavad ja nagu see emotsioon, millega nad sealt maleva st tulevad, et see on võimas.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="192.24" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 3:12–6:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, Külli. Minu kord, aitäh. Olen Valter Parve. Ja esimene malevarühm oli mul aastal kuuskümmend üheksa päris ammu juba, see oli Rahnu sovhoosis Pärnumaal. Põhjus oli järgmine, õppisin Tartu Ülikoolis ja seal oli vaja pedagoogilise praktika sooritamiseks minna pioneerilaagrisse kasvatajaks, see mulle kohe üldse meeldinud ja siis sõbrad ütlesid ringis, ütles, et malev on sama hea või paremgi. Nii läkski. Ja anti siis Tallinnas kätte perfokaarte. Ma ei olnud ühegagi varem kohtunud, kolmkümmend õpilast ilusti keeleliselt võrdselt ära jagatud, mine ja tee. Järgmine rühm oli juba siis seitsekümmend Eesti Õmmi kaks esimest välisrühma , üks Läti Valeri Kisiga, mina Leetu. Jälle kolmkümmend ja mina üksi oli väga põnev. Ja siis tuli koolielu ja pereelu vahele. Aga aastast kaheksakümmend kaks uuesti malevas Pärnu piirkonna komandörina olin aasta ringne, kuna meil oli seal umbes ligi kolm tuhat malevlast ja, ja, ja, ja pooled olid ka linna majandi tööl, siis oligi aastaringi tegevust. Aga üks ere mälestus pärineb aastast kuskilt kaheksakümmend neli tõenäoliselt. Kuna meil oli nii palju ööbivaid rühmi, siis komandörid palusid mind, et ma tuleksin neid kontrollima, siis on neil kerge noori magama saada, hirmutades sellega, et kohe nad tulevad. Komissar oli kõrval Ats räägi koos sõitsime mööda rühmi, õhtul niimoodi kümne-üheteist kümne paiku, et noori voodisse ajada. Järgmisel päeval tööpäev. Ja siis, kui me kuskil seal kaheteistkümne ühe paiku hakkasime oma tiiru lõpetama, iga l õhtul sõitsin. Ja kui me siis hakkasime tagasi koju sõitma, tuli äkki niisugune tunne, et ühes omas oli kuidagi kõik liiga korras, liiga pestud, liiga vaikselt ja siis me läksime uuesti seda rüppe kontrollima. Ja oligi nii, et malevlased magasid vähirühma kommid magasid ja malevlased napsutasid . Nii oligi, no see on ikka negatiivne mulje, me pidime selle ühe alkohooliku välja vi skama, kes need õlled linnast kohale tõi, aga, aga suhteliselt positiivne on see jälle niimoodi ühel õhtul ringi sõites nägin tee peal malevlasi astumas rühma poole, Audru s oli olnud tantsupidu, nad olid seal peol käinud ja nüüd astusid sumedal, suveööl oma majutuspaiga poole. Neil oli minna, oli kümme kilomeetrit ja siis ma tegin oma tööauto, mul oli siis piru kas. Tegin tagaukse lahti ja kõik kaksteist mahtusid sisse. Ja siis uksed kinni siis kohale viisin. Ainult muidugi tagatagumine raskus velgedel oli nii suur, et tuled näitasid taeva sse, ta oli ka ikka nii tasakaalust väljas, aga vaikselt läksime ja kohe nad said vii dud. Nagu sa ütled, põnev oli, oligi põnev ja kõik need neli aastat seal piirkonna juhtida oli ikka väga põnev. Läheks jälle.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="400.4" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:40–9:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, mina olen Are ja minu kogemused malevaga algavad aastast kaks tuhat seitse, hommikul kontrollisin igaks juhuks üle, siis Tallinna malevas rühmajuhina. Seal sai tehtud mõned, mõned aastad rühmajuhi tööd, seejärel viis mind elu Viljandimaa le. Ja seal on tehtud mitmeid maakonnaüleseid rühmasid ja samal ajal siis hea d neli aastat Viljandi valla õpilasmalevat noh, natukene siis ergutatud, ütleme nii, et nad väheaktiivsemalt toimima hakkaks ja ja võib-olla siis lõuna pool juurutan ka tsunud juurutada seda, seda mõttelaadi, et malev ei ole ainult päevane töölaager, vaid et väga oluline osa on sellest, et minnakse kodust ära, veedetakse, elatakse koos ja , ja see õpimoment on isegi olulisem kui see töö tegemine. Et mis kõik sellega, selle, sellega õppida saab ja viimased, tänavu olen ise õppis ma levlastele tööandja, rõõmuga ja vahepeal katsunud siis kohaliku omavalitsuse struktuurides malevkorraldajatele võimalikult palju toeks olla . Et teinud olen, teinud erinevaid asju, aga kogu aeg malev käib nagu minuga kaasas. Aga lugu, mul tuli kaks lugu pähe, aga ma mõlemat ei räägi, aga ma räägin hoopis ühe loo sellest, mitte otseselt malevast, vaid sellest, kuidas malev võib mõjutada minge id täiesti muid momente, et ühel raba Lõuna-Eesti seal Läti piiri ääres oleval raba matkaraja jalutuskäigul jalutasid minuga koos üks seltskond ja, ja siis üks na isterahvas kõnnib juba mitmendat kilomeetrit ja noh, kogu aeg tuleb pisar niimoodi. Mina mõtlen, mis, mis, kas midagi on pahasti või ja siis ühel hetkel läksin juurde, küsi n, et kas noh, et kas ma saan kuidagi abiks olla või et kas noh midagi valutab või noh kuidagi aidata. Ja siis tegelikult naisterahvas ütles, et ei nagu õnnepisarad, et et pa ar aastat võib noh, ma arvan, see oli kuskil paar aastat varem oli käinud ta sealsama s matkaraja peal koos oma lapsega. Ja see laps oli rääkinud talle suure ja õhina ja uhkusega, kuidas tema koos kaasmaale vlastega selle laudtee sinna rajas, heina keset sinna seda raba ja seda paremat liigu tas kuidagi endiselt, et, et tema laps oli väga uhke selle üle, et ta oli midagi sellist selle paari nädalase maleva jooksul valmis teinud, et malevlased suudavad teha rohkem , kui ma arvata oskame.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="569.76" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 9:30–11:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No tere mina olen Hendrik, ma ei ole rühmajuht. Ma olen siin siis noor, ma olen alles veel malevlane, olen viimased viis aastat käinud malevarühmades, viimased kaks aastat olen tegelenud õpilasmaleva rahvatantsurühmas ta ntsimisega. Ehk siis olen nagu seotud malevaga ka rohkem ning siis see aasta malevasse ikkagi veel nagu natukene väheks vabal ajal. Siis see aasta ühinesin ka õpilasmaleva aktiiviga ja nüüd olen veel rohkem seotud ma levaga. Kui siis mõelda neid lugusid, mälestusi malevast, siis neid on oi-oi kui palju, neid ma võiks ka samuti rääkida. Tund-poolteist ma võiks isegi äkki kaks rääkida täis neid lugusid, mälestusi. Kõige eredamad, kõige eredamalt on meeles ikkagi selle aasta rühm, kus ma just tulin juunikuus, käisime Saaremaal. Käisime jaanipäeva ajal Sõnalõitu otsimas kogu rühmaga. Kahjuks ei leidnud, aga ma arvan, et kunagi äkki leiame. Aga lihtsalt see kogu see kogemus oma rühmaga. Ning siis kokkutulek, kokkutulek on asi, mis on igale malevlasele jääb meelde. See üks aasta, kui me olime rahvalause teemarühm, me saime esineda kokkutulekul, see oli nagu minu kõige esimene, kõige esimene esinemine. Ja ma võin öelda, nagu sealt algaski see minu rahvatantsu armastus. Nii et maleval on nagu minu südames eriti just nagu vägagi oluline koht ja roll.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="664.8" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 11:05–13:49</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No vot sellised väga mitmetahulised ja põnevad külalised täna. Ja mina veel muretsesin, et ei tea, kus me täis räägime selle aja, aga kõigil on nii palju mälestusi, et, et ilmselt jääks veel ajas puudu. Aga nagu ma mainisin, siis meil on sel aastal kuuekümnes juubeliaasta. Esimene rühm toimus kuuekümne kuuenda aasta suvel. Ja kui usaldada kümme aastat tagasi tehtud arvutusi, siis tänaseks on malevast läbi käi nud kuskil kakssada kaheksakümmend tuhat inimest. Kas siis malevlasena või tööandjana või rühmajuhina, seega väga suur osa Eesti kultuuri st, Eesti ajaloost ja Eesti inimestest. Ja selleks, et aru saada, kes meil täna siin publikus istuvad, siis siin on sellised toredad tuulikud, mida ma palun teil nüüd tõsta. Kui see väide käib teie kohta. Olen olnud malevanoor. On seal leeris, olen olnud rühmajuht. Siiani seal. Ma ei hakka nüüd seda küsima, et käisin malevas enne üheksakümnendaid, sest ma nägin , kes käe tõstsid. Olen olnud tööandja või koostööpartner, koostööpartner ja väga tore, äkki nüüd peale seda paneeli saab järgmine aasta rohkem käsi tõsta siin? Nii aga lähme edasi, avaharjutus ehk häälestus on selline, kus ma olen kõikidele pane listidele andnud kätte ühe plakati ja markeri. Ja me teeme sellist kuldvillaku harjutust ära naabrile näita oma vastust. Ütlen teile ühe küsimuse, teie kirjutate sinna suurte tähtedega, et teised ka näeksid oma vastuse ja siis korraga pöörame ümber, kui ma ütlen üks, kaks, kolm. Ja esimene küsimus on, kes vajab malevat? See muusikati, ma tegelikult ei tea. Nii valmis. Kolm, kaks, üks. Kõik inimesed, Eesti ühiskond, Eesti ühiskond, kindel, et see ei piilunud üksteise peale keskel ja kõik noored kolmteist kuni kaheksateist. Ehk siis katame ära terve riigi. Are, kas sa tahaksid avada, miks sa kirjutasid?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="829.24" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 13:49–15:11</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kõik. Ja muidugi võid, loomuliku rõõmuga. Noh, see, et noortel seda vaja on, kuna ta nagu noh, tegevus on kutsu- nii-öelda täna sel päeval ikkagi ellu kutsutud või, või toimib selleks, et anda noorele võimalust mis kit kogeda, areneda, vaheldust, siis see ei ole nagu küsimus, aga ma arvan, ülioluline on see, kuidas tööandja näeb, saab võimaluse näha noort läbi ma leva, kuidas, kuidas lapsevanemad näevad, mis toimub noorega, kui ta käib kaks nädalat kodust ära ja tagasi ei tule enamasti täpselt sama inimene, natuke teistsugune tuleb. Igas mõttes see panus, mille malevlased annavad oma tegemisega noh , väga paljud väiksemad malevad ja rühmad toimetavad ju näiteks kohalike omavalitsus te asutustes, allasutustes panustavad heakorda. Noh, see, see töötundide maht on väga-väga-väga suur, et noh, otsene kasu sellest juba tänaval kõndides selle võrra, et on ilusam noh, seda saab igaüks, et seda on vaja ikkagi kogu ühiskonnal.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="911.4" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 15:11–15:16</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja Hendrik sina kirjutasid kõik noored. Kas avaksid ka seda?</span></button>
