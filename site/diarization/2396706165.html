    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.84" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:12–1:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii, tere päevast, oleme jõudnud järgmise arutelu paneelini. Meil on kõik paneeli osalised laekunud. Järelikult paneel toimub. Ja me oleme ka rahvusvahelises telepildis, nii et ärme nina nokki ja käitume kõik niimoodi ilusasti, sest et Eesti ja kõik muud rahvad võivad meid näha. Ja see oli presidendikandidaadi debatt, aga meie paneelil on ka pealkiri, see on kas rohereform vajab ebapopulaarseid otsuseid. Ja tegelikult saaks selle paneeli ju üsna lihtsasti ja vastustega ära katta. Veiko ja ei, Keiu ja ei ja, ja</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="61" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 1:01–1:13</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jürgen ja. Nii, aga nüüd palun. Selles mõttes ei, et eesmärk ei ole ebapopulaarsus, vaid eesmärk on muuta vajalikud otsus ed populaarsemaks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="73.12" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 1:13–3:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Õige, aga nüüd palun tõstke kõik käed. Need inimesed, kes on varem elus kohtunud kõigi viie inimesega, kes siin laval praegu on. Nii, näen vähemasti kolme-nelja kätt, kes on näinud kõiki viit in imest ennem, ükshaaval muidugi, eks ole, aga siis võib-olla alguseks ongi hea, et saa me nende inimestega tuttavaks ja esimene siis, kellega ma teid tuttavaks teen, on Jürgen Ligi. Tema on Eesti Vabariigi rahandusminister ja minu isiklikul hinnangul on tegemist kesk konnasõbraliku inimesega ja isamaalise inimesega ka päriselt, ma arvan nii. Ja mida me sinust siis tegelikult teame? Ma proovisin seda uurida Tehis Aru käest, aga mis selgus, Jürgen Tehis Aru ei tea sin ust praktiliselt mitte midagi, vähemasti ta ei tunne sind. Aga ma selline vanakooli inimene ja siis ma otsustasin ikkagi, et ma guugeldan ja läks in seda töö teed mööda ja mis ma siis leidsin? Rahvaalgatus, ülbus ei ole poliitika, Jürgen Ligi peab lahkuma. Kogus kuus tuhat kaheksasada kuuskümmend kolm allkirja. Aga siis on üks, on sul saja neljateistkümne häälega ka ja siis on see plöögini oma, see on kaks tuhat seitsesada kolmteist allkirja, Jürgen Ligi peab tagasi astuma. Aga vaadake, tegelikult on olukord selline, et paljudele inimestele sinu arvamused meeldi vad. See on ka võib-olla üks põhjus, miks siin paneelid. Ühe koma kolmel miljoni arvates ma peaks edasi astuma. Nii ja siis viieteistkümnendal juunil käesoleval aastal menetles Riigikogu siis Jürgeni umbusaldusavaldust ja põhjus on ju väga inimlik ja arusaadav. Opositsiooni hinnangul ei ole Ligi valmis astuma samme mitte edasi, kui üheski suunas , mis parandavad elanike toimetulekut ja ettevõtete konkurentsivõimet ja mõlemad märk sõnad on tegelikult meil olulise, olulised. Jürgen, kas on piinlik ka?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="200.72" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:21–3:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ei ole. Ma ei taha nende inimestega sugugi sarnaneda, vähemalt sel hetkel, kui nad seda umbus aldust tegid, nii et ma, vaadake ülbus on tegelikult agressiivsuse üle, tehes ennast positsioonilt suuremaks, aga antud juhul oli see agressiivsus, kus küsijad tegid ennast pisi pisikeseks ja see oli väga mage.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="221.48" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:41–4:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga tõehetk on tegelikult märtsikuus ja siis Jürgen kogub allkirju ise juba, eks ole Digi ja siis neid tavalisi sedeleid. Aga millised on siis need õiged sammud, seda me jõuame rääkida, aga meie teise panelist i suhtes oli tehisharu palju nutikam. Ta on antropoloog, konsultant, teadlane ja tehisharu arvates ei piirduda jõulu de ajal sugulastega suheldes ainult küsimusega, kuidas läheb, vaid teeb alati süvain tervjuu. Daamid ja härrad, osaühing antropoloog, juhatuse liige ja antropoloogiakeskuse asutaja ja nõukogu liige Keiu Telve. Tere. Nii, kuidas siis sul on, kas sul on õiglaste ja sugulastega nagu kõik selgeks saanud , et kuidas siis taastuvenergeetikasse nad suhtuvad ja mis jagunemine on? Sarnane kui Eesti rahval üldiselt?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="276.92" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 4:37–5:23</span></span><span class="segment-text">Kirglik, ma arvan, minu käest tihti küsitakse, et kas ma olen see tuuleparkide kõige suurem pooldaja, et ma olengi see esiaktivist igas arutelus. Aga ma olen esiaktivist arutamises, mulle väga meeldib, kui inimesed väljendavad oma arvamust, mulle meeldib, kui see on vastandlik, mulle meeldib, kui kui tulevad sellise d vürtsikad sõnad ja käed ja kogu keha hakkab kaasa rääkima ja ma arvan, et meil eest lastena ongi vaja rohkem vürtsikaid ja tugevaid arutelusid ja võib-olla neid on liiga vähe olnud. Võib-olla me sellepärast olemegi ühiskonnaga, see ühiskonnana selles kohas, nii et ja need arutelud tulevad kaasa, lõunalauda, peolauda, vanaema sünnipäeval igale poole ja veel ei ole mind kusagilt välja jäetud nende pärast, nii et.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="322.56" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 5:23–5:42</span></span><span class="segment-text">Ma panengi kohe võrdse juurde. Muideks hiljaaegu saatsid mungad teateid nii Pirita jõelt kui Viljandi järvelt ja seal nimelt Viljandi kandis kurdetakse, et antropoloogiakeskus manipuleerib inimestega ja peseb nende ajusid. Millal see, millise teaduslikke meetodeid te kasutate selleks?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="342.16" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:42–6:47</span></span><span class="segment-text">Antropoloogilisi intervjuud, küsitlused, ma olen, ma arvan, et me oleme veetnud viimase aasta jooksul rohkem päevi Tallinnast eemal erinevates külades, rahvamajades, külate edel, rääkides absoluutselt iga inimesega, kes meile vastu tuleb. Ja ma olen tulihingeliselt sellelt poolt, et kui me saadame välja küsitluse, siis vasta vad kaheksakümmend protsenti vastavad naised, vastavad need, kellel on internetiühendus , need, kellel on aega, need, kes leiavad oma meilis selle lingi. Aga kui sa lähed külalt mööda külateed ja ütled, et ma tahan sinuga rääkida sellest pi irkonnast. Osad saavad pahaseks, muidugi saavad, aga teised inimesed räägivad mitu tundi ja nad ütlevad, et see on esimest korda nende kolmekümne aasta jooksul, kus keegi tuleb, küsi b, et mida sina arvad. Ja mõne jaoks on manipuleerimine minu jaoks normaalne viis, kuidas me riigi toimetule kus ja aruteludes edasi liigume, et peame andmesõna, me peame küsima.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="407.16" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:47–8:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Vallavanemal ei ole nende jaoks nii palju aega mõistetav. Nii, läheme edasi. Meil on kolmas panelist ka, tema nimelt on professionaalne omavalitsustegelane. Ta on olnud vallavanem, volikogu esimees, maakondliku omavalitsusliidu juht ja nüüd siis üle-eestilise linnade ja valdade liidu tegevjuht daamid ja härrad Veiko Luhalaid. Tervist. Ja tehisharu arvas tema kohta ka midagi, ta arvas, et tal on super või me tõlkida val lavanemate, linnapeade ja ministeeriumide keel vastastikku arusaadavaks või vähemalt nii palju arusaadavaks, et järgmine koosolek kokku leppida. Ja kui ma tahtsin Veiko, Veikkolt saada kinnitust, et kas ta on siia ikkagi tulemas, ta oligi just koosolekul parasjagu lõpetamas. Et järelikult oli tehisharu sinu suhtes õigel teel. Sina oled meil pärit Ida-Virumaalt ja minu meelest Ida-Virumaa on igati edurinnas , mis puudutab seda energeetika asjandust ka ja kui me võtame nüüd skaala sellise, et ühes otsas on null, mis ei ole null, nagu on põlevkivi, on ju ja teises otsas on siis seal kümne peal on kõik teised energialiigid, et kus selle skaala peal siis oma arengu tes Ida-Virumaa sinu arvates täna on ja ja kuhu poole teel?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="494.32" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 8:14–8:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No ühe skaala näitel on keeruline öelda, et, et, et üks asi, kus ta tehniliselt on, teise ks, kus ta õiguslikult on ja kolmas, kus ta antropoloogiliselt on, aga kui need kesk miselt keskmise välja võtame, siis ilmselt on ta kuskil viis-kuus.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="510.24" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 8:30–9:08</span></span><span class="segment-text">Mis on paljulubav tegelikult. Jah, on, sest kõik räägivad Ida-Viru potentsiaalist kogu aeg ja minu jaoks oli hästi kummastav. Kui hiljaaegu tekkis seal sinu kodukandis debatt, et kas Viivikonna asula, vana kaev uri asula peaks maha võtma või mitte. Et see nõukaaeg on tegelikult ikkagi sellist natukene tagasinõudmist, taganutmist väär t, aga mina käisin oma kaheaastase lapselapsega, kuueaastase ja lapselapsega ja kaheksa aastase lapselapsega. Ma kasvatan neist uue põlvkonna turiste. Neil on täitsa ükskõik muideks nõukogude aeg ja ma ei kavatse seda neile selgeks tegema hakatagi, mida see endast kujutas, noh vähemasti turismi võtmes mitte.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="548.16" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 9:08–9:13</span></span><span class="segment-text">Sa võib-olla ei mäletame sinuga kahekesi, käisime ka ükskord tsirkas ja Viivikonnas, kui sa minister oli.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="552.8" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:13–9:58</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See oli väga tore, tegelikult siin me avame. Et sellel peab ükskord lõpp tulema. Nii, aga meil on ka neljas panelist, ta on selle ala peremees, me oleme nimelt Pindri arvamusalal. Ja tehisharu muidugi arvas tema kohta nii ja nüüd tuleb tore. Räägib vahel nii, et kuulaja pole kindel, kas just anti elutarkus, lahendamata mõista tus või järgmise luulekogu esimene salm. Alles kolm päeva hiljem tabad end mõttelt oota, ta vist mõtleski seda. Ja tegelikult minu jaoks ka on nüüd küsimus, kas tehisharu mõtles Elot või Juhanit, ma pean silmas Viidingut, eks ole. Et tegemist on Marko Viidinguga ja mul on sulle lihtne küsimus, kas sa oled elus mõne luuletuse kirjutanud?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="597.68" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 9:58–10:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Koolispidi jah. Aga see tõenäoliselt oli vist jah, päris mitme Viidingu kirjeldus kokku pandud seal te hisõrus.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="606.52" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 10:07–12:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii et tegemist on siis tegelikult inimesega hoopis, võime öelda energeetika valdkonna st ja ma tahan teile öelda, et meie paneel on väga haritud, meil on viie peale kaks tead ustöö doktorit, nad istuvad seal kõrvuti kahekesti, Keiu ja Marko ja siis viies inimene siin laval, see on Marko Pomerants. Tema on juhtinud selliseid arutelusid Ruhnu saarelt kuni Paideni ja Lüganuselt Hääde meesteni, nii et palun nüüd tõstke käed, kes on midagi kuulnud kõigest viiest panelist ist, kes siin täna laval on. Me peaksime seda kordama veel sellepärast, et. Väga paljud inimesed meid ikkagi tundma ei saanud. Ja aga nüüd lähme vähaaval sisusse. Ja kui ma siin juba eile ringi käisin, siis minu meelest domineerivadki siin Arvamus festivalil nagu kaks sellist teemat. Üks on siis vaimne tervis ja teine on energeetika. Ja kui seda kõike nüüd kuidagi kokku panna, siis ilmselgelt valgusega on julgem, on ju Et tegelikult neid inimesi, kes tahaksid elektriga koos elada, neid on rohkem kui neid , kes tahaksid pimeduses olla. Aga me jõuame jälle selleni, et mismoodi ta tuleb ja kust ta tuleb ja keegi teda nii kuinii ära ei võta. Aga ma alustasin meie paneeli sellest, et on olemas rahvaalgatused. Et Jürgen Ligit neist puudutab kolm, aga siis vähemasti ja küll neid tuleb juurde. Aga ma vaatasin ka, millised on olnud energeetika valdkonna algatused. Ja tegelikult neid on olnud ka terve pinu, aga nüüd omaette küsimus on see, et kuidas neisse suhtuda ja ma toon mõne stiilinäited. Avaldame Eesti riigile toetust avamere tuuleenergeetika majandussektori väljaarendamise ks üheks allkirja. Eestile oma saja megavatine hüdroelektrijaam Narva jõe vesikonda, viiskümmend kaks all kirja. Task
