    <div class="segments"><button type="button" class="segment-card" data-segment-id="segment-0001" data-start="11.52" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 0:12–2:20</span></span><span class="segment-text">Mul on suur rõõm näha siin inimesi, kellel on huvi meie väga intrigeeriva teema vastu , milleks on, kuidas rääkida vähist ja tervise teemadest nii, et tõuseks teadlikkus, aga me ei muutuks ärevaks. Miks see teema oluline on? Ilmselgelt on vähk üks olulisemaid terviseteemasid täna siin ja praegu ja väh k on just nimelt selline haigus, mille puhul on siis ennetusel oluline roll ja ennetuse l siis läbi teadlikkuse ehk mida teadlikumad me oleme, kuidas vähki ennetada varajaselt avastada, seda enam me suudame, suudame siis seda rasket hai gust ära hoida endal ja lähedastel. Aga mida teha selleks, et tänapäeva infoühiskonnas, kus tervise teemadest räägitakse rohkem kui kunagi varem, ennetada ja olla teadlik ja teha ja tegu tseda nii nagu, nagu teadlikkus ette näeb, selle juures, mitte ärevaks muutumata, siis selleks oleme täna kokku pannud ühe vahva tiimi. EstCANi lahkel, lahkel loal on, on siis minuga, kes ma olen siis Kristina Seimann, Tartu Ülikooli meedia- ja kommunikatsiooni valdkonna doktorant nooremteadur ja minu uuri misvaldkond on just nimelt tervise kommunikatsioon kokku kutsunud praktiku d ja ja teadlased, kes siis oma värsketest uuringutest sel teema l on valmis lähemalt rääkima. Aga alustame tugevatest praktikutest ehk siis Kadri Saks, Tallinna lastehaigla hemat oloogia ja onkoloogia osakonna juhataja. Põgus, põgus seos teemaga oma läbi oma igapäevase praktika ja kogemuse.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="140.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:20–3:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere õhtust ja tõesti olen praktik, töötan iga päev patsient idega ja, ja minu patsiendid on mitmekihilised, ehk siis minu patsiendid igapäeval on lapsed, aga lapsed ei ole kunagi üksi, ehk siis nende perekond ja, ja, ja kui täiskasvanutega just seesama ärevuse küsimus on, et kui saadakse tõsine, tõsine ha igus, tõsise haiguse diagnoos, siis see ärevus on nagu normaalne, mis sellega kaasa käi b ja, ja, ja kui sa mõtled, et meil on patsiendiks laps, siis ärevus on nagu väga mitme kordne, ehk siis hõlmab kogu perekonda ja, ja ma arvan, et , et meie see, minu see töö, ma näen seda lihtsalt iga päev ja eks me siis arutame, et kas, kuidas, kuidas seda paremini hallata.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="200.8" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 3:21–3:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Järgmine tugev praktik Marianne Annion. Kes on Tallinna Tervishoiu Kõrgkooli õppejõud õenduse alal ja ka ise õena nii Eestis kui Soomes töötav.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="217.64" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:38–4:41</span></span><span class="segment-text">Ja aitäh, et ja vaimse tervise õendus, ma rõhutan just, et see on, et olen siis ise ka siis vaimse tervise õde, Tallinna Tervishoiu Kõrgkooli siis juhtiv lektor ja vaimse te rvise õenduse mooduli juht, seda nii magistriõppes kui ka siis põhiõppes. Aga mis on minu seos sellega, et ma olen tõesti Soomes siis kakskümmend aastat olnud psühhiaatriline õde. Olen siis ka siin vaimse tervise õde ka Eesti õppe läbinud ja mul on siis kolmkümmend aastat psühhiaatrilise töö kogemust, nõustamist nii akuutpsühhiaatri sõltuvushäiretega ja ärevuse ja depressiooniga, et Soomes ma olen olnud ka depressiooniõde, tervisekes kuses ja ka siis psühhiaatriline koduõde, nii et on, olen nõustanud, tean äreva id patsiente. Tean, mis mure on ka siis üldse terviseärevus ja tervisega seotud ärevus.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="281.24" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 4:41–4:50</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Aitäh ja läheme edasi järjekordse tugeva praktikuga, Kristi Paron.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="289.52" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 4:50–6:34</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere õhtust kõigile. Mina tõenäoliselt olen sattunud täna siia paneeli see, seetõttu, et ma igapäevaselt pa tsiendi õigustega tegelen, koolitan tervishoiutöötajaid ja Tartu Ülikoolis üliõpilasi , just lapspatsiendi õiguste teemal ja, ja, ja teadlasena kannan nagu kahte mütsi, et minu esimene taust on õigusteadus, et olen ka õiguspraktikuna tegutsenud eluaeg, aga aga viimastel aastatel siis läbi oma teadustöö sotsioloogias, kus ma siis tegelikult olen uurinud seda, et kuidas siis lapspatsiendi autonoomia tegelikult päriselus toimi b ja see on hästi palju õpetanud ja andnud sisendit üldiselt ka tä isealiste patsientide autonoomia toimimise kohta, sest et laste puhul võib-olla kõik needsamad teemad, mis tegelikult täiskasvanud patsiendil on ka olulised, lihtsalt või menduvad. Ja, ja, ja seetõttu siis hea meelega räägin kaasa ja võib-olla minu selline südamete ema on patsiendi autonoomia ja ma arvan, kui me räägime terviseteadlikkusest, siis tegelikult meditsiinieetikas ongi see põhiprintsiip, et nii-öelda autonoomne patsient on kompet entne patsient, aga kuidas ta saab kompetentseks, on see, kui tal on piisavalt inform atsiooni. Nii et ma usun, et me täna hästi palju räägime sellest info vahetamisest. Just nimelt mitte info edastamisest ainult, vaid info vahetamisest ja dialoogist, sest seeläbi kujuneb see patsiendi autonoomia ja, ja me jõuame selleni, et meil on nii-öelda sellised teadlikud patsiendid.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="393.96" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 6:34–7:05</span></span><span class="segment-text">Suur aitäh ja meil on täna kaasa rääkimas kaks värsket magist rit, kes on oma uurimustöö teinud just nimelt tervisekommunikatsiooni vallas, aga väga erineva külje pealt. Et Tartu Ülikooli Arvutiteaduste Instituudi magistrantuuri äsja edukalt lõpetanud Ve ronika Kukk, et, et Veronika, räägi, räägi lühidalt oma, oma, oma magistritööst.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="425" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:05–7:34</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et siis minu magistritöö valmis tähendusloome sotsiaalmeedias projekti raames. Ja ma siis uurisin ühte Eesti tervisefoorumit ja siis, mida inimesed räägi vad ravimitega seotult siis, et mis nende mured on. Ehk siis minu panus siia paneeli oleks siis selle tehnoloogilise poole pealt. Ma olen informaatik ja siis tervisefoorumite kohta. Oskar rääkida.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="453.96" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 7:34–7:51</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Suur aitäh ja Nette Junkur, kes siis Tallinna Ülikooli nüüdiskultuuri värske ma gistrina on samamoodi oma nurga alt tervisekommunikatsiooni uurinud või inimeste tervi sekäitumist siis kaasaegses maailmas.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="471.12" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 7:51–8:13</span></span><span class="segment-text">Ja tere kõigile, mina siis uurisin enda magistritöös tervisediskursuseid Eesti Tik toki fitnessi võrgustikus ehk siis minu seos selle teemaga siin puudutabki just nime lt sellist sotsiaalmeedia tervisekommunikatsiooni. Ja kuidas sotsiaalmeedias neid tervisesõnumeid konstrueeritakse.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="492.88" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 8:13–9:46</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Suur aitäh ehk siis meil on nii-öelda kaks värsket uuringut. Eesti empiirika peale, et mida, mida ja kuidas, kuidas tänapäeval inimesed oma te rvist juhivad ja infot leiavad, otsivad ja, ja otsuseid teevad. Aga kõigepealt siis küsiksime, küsiksime rahvalt, mida rahvas arvab, et kuidas te tunne te, kas tervis on täna teema, kas see on selline, selline teema, mis teid huvitab? Tõstke käsi, kes on nõus selle väitega. No kõik tõstsid käe. Ehk siis me võime öelda, et täna tervis on teema ja terviseteadlikkus on järelikult ka teema, ehk siis me kõik oleme huvitatud infost. Mis hoiaks meid tervena, mis aitaks haiguseid ravida, me otsime seda infot. Kõige selle aluseks, et me infot otsime ja et me tegelikult tahame ise teada ja, ja mitme test erinevatest allikatest püüame enda jaoks tervise teemat kokku panna ja tervise tead likumaks saada, et selle aluseks on ju tegelikult muutunud õiguskeskkond, et meil on nii-öelda õigus infot saada, anda nõusolek. Kristi, räägi, kuidas see on, on muutunud ja kuidas see, kuidas see mõjutab meie iga päevast terviseteenuse osutamist ja patsiendina käitumist, sinu meelest.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="585.64" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 9:46–14:43</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja, et see taust võib-olla on see, et üldiselt siis meditsiin on ju ikkagi, eeldab selliseid suurt hulka eriteadmisi, mida läbi aegade ja sajandite pa tsiendil ei ole olnud juurdepääsu sellele, eks ole, et ta sai seda infot siis, kui ta läks arstikabinetti ja arst talle rääkis. Ja, ja seda ja, ja seetõttu siis ka nii-öelda tervishoiutöötajal laiemalt oli väga suur autoriteet. Ja, ja seda siis meditsiinieetikas nimetatakse ka selliseks paternalistlikuks mudelik s, mis sajandeid toimis, et kui patsient läks arsti juurde, siis ta läks sinna tõde kuula ma ja saama teada, et et nüüd, kui sa siit välja lähed, siis sa pead tegema seda, seda ja seda. Ja kaasaegne, tänapäevane selline tervishoiu suhtekäsitlus põhi neb hoopis teistsugusel mudelil, mis siis ei ole selline ülalt alla paternalistlik mu del, vaid on koostööl põhinev mudel nii-öelda, mis siis seab esikohale patsiendi auto noomia. Ehk siis, mis autonoomia on, see on inimese õigus ise otsustada, kuidas oma elu elada , milliseid valikuid oma elus teha ja, ja, ja see on siis selline noh, tihti öeldakse kõige olulisem meditsiinieetika printsiip, et inimesega ei saa mitte midagi teha, vastu tema tahtmist. Ja selleks on ainult teatud erandid, siis ohtlike nakkushaiguste puhul või näiteks p sühhiaatrilises ravis, kui inimene ohtlik endale või teistele, jah, siis on teatud ti ngimused ja range kord, kui inimest saab tahte vastaselt ravida. Aga üldiselt saab siis inimest ravida ainult tema enda nõusolekul ja, ja, ja see pa tsiendi nõusolek ongi siis sellise patsiendi autonoomia praktiline väljendus ja mis veel gi tähtsam, kindlasti olete kuulnud, et räägitakse informeeritud nõusolekust, et see nõusolek on n
