  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const search = document.getElementById("search");
    const count = document.getElementById("count");
    const cards = [...document.querySelectorAll(".cue-card")];
    let active = null;

    function selectCard(card, seek = true) {
      if (!card) return;
      if (active !== card) {
        if (active) active.classList.remove("active");
        active = card;
        active.classList.add("active");
      }
      if (seek) {
        player.currentTime = Number(card.dataset.start);
        player.play().catch(() => {});
      }
      nowPlaying.textContent = card.querySelector("strong").textContent + " · "
        + card.querySelector(".timestamp").textContent.replace("▶ ", "");
    }

    cards.forEach((card) => card.addEventListener("click", () => selectCard(card)));
    player.addEventListener("timeupdate", () => {
      const time = player.currentTime;
      const match = cards.find((card) => time >= Number(card.dataset.start)
        && time < Number(card.dataset.end));
      if (match) selectCard(match, false);
    });
    document.getElementById("jump-problem").addEventListener("click", () => {
      player.currentTime = 1760;
      player.play().catch(() => {});
      const match = cards.find((card) => Number(card.dataset.end) >= 1760);
      if (match) { selectCard(match, false); match.scrollIntoView({ behavior: "smooth", block: "center" }); }
    });
    search.addEventListener("input", () => {
      const query = search.value.trim().toLocaleLowerCase("et");
      let visible = 0;
      cards.forEach((card) => {
        const show = !query || card.dataset.text.includes(query);
        card.hidden = !show;
        if (show) visible += 1;
      });
      count.textContent = `${visible} cues`;
    });
  </script>
