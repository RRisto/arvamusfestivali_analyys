    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.04" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 0:11–3:42</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere õhtust. Järgmine paneel siis tervisealal on, et iduettevõtete finantseerimisest. Et siin ja noh, mitte ka ainult, et ilmselt ka läheb jutt natuke laiemaks ja tervisho iu taastamise peale ka. Et noh, raha nagu me teame, meditsiinis on ikka puudu ja noh, tõenäoliselt ongi. Aga võib-olla, võib-olla ma eksin, eks pärast on näha, aga mulle endale tundub, et nii -öelda tehnoloogia ja selle võimalused võib-olla saavad vähe tähelepanu Eestis just selles võtmes, et kuidas on võimalik tehnoloogia abil tegelikult noh, üks asi on efektiivsus , aga teine asi on ka puhtalt nii-öelda meditsiinilist kasu, on see siis ennetuses või , või kusagil mujal. Et noh, tegelikult me teame, et noh, mu enda taust on nii-öelda biotehnoloogiad, sest ma olen selle peale nagu selgelt rohkem mõelnud. Et noh, AI on siin küll nagu evolutsiooni toonud, et mitmed tuttavad on Eesti st ja mujal on pidanud oma asju ümber profileerima just sellepärast, et neil tegelikult ei ole enam midagi teha. Tänu AI-le ja ma ise olen ka siin katsetanud erinevaid kloodi Amazoni ja Google&#x27;i võimalus i. Ja noh, tegelikult on nagu veits nukke teha, võib-olla ka hea meel, nii ja naa, et kümme aastat tagasi sai doktor kaitstud ja ma vaatasin, et ma sain, saan oma doktoritöö ja otada nii-öelda kolme ossa. Esimest osa ei ole üldse täna vaja. Seda teeb AI suurepäraselt. Teise osa ma olen võimeline tegema nädala ja läptop&#x27;iga ja ütleme ka kahekümne tuhande ga ja noh, kolmas osa on siis see, mis on endiselt vast okei. Et noh, kümne aastaga on maailm tegelikult edasi läinud päris kõvasti, mis on tegelikult ju hea. Aga noh, tänane paneel keskendub noh, vaevalt et väga biotehnoloogiale, aga noh, see näide oli lihtsalt see, et, et mida on tehnoloogiaga võimalik teha. Aga räägime siis meditsiinivaldkonna ettevõtlusest, väljakutsetest, finantseerimisest Ja noh, tegelikult, kui me vaatame Eesti, Eesti teadust. Et kui, kuidas seda finantseeritakse, kus me, kus me head oleme, siis meditsiin, nii -öelda loodusteadused, biotehnoloogia, keemia, need on tegelikult meil suhteliselt hea l tasemel maailma mõistes. Ja pikalt on olnud juba ja tegelikult tehakse väga ägedaid avastusi. Väljakutse võib-olla on see, et majanduslik mõõde sellel on täna suhteliselt tagasiho idlik. Ja seetõttu ongi hea, et selle paneeli ellukutsujaga noh, laiemalt valdkonna edendaja Health Faundas Estonia on asja nii-öelda tõsiselt kätte võtnud. Et noh, ilmselt on tuntud selle poolest, seda on väga edukalt suudavad käivitada uus i iduettevõtteid ja neid toetada ja nii edasi. Aga noh, nüüd on nad võtnud ette ka selle valdkonna nagu laiemalt ja, ja tänane pane el ja sellele eelnev töö ja sellele järgnev töö, selle tulemus nii-öelda white paper , mis võiks, mille abil nad siis loovad koostöös panelistide ja, ja teistega nii-öelda visiooni. Milline see Eesti ettevõtlus selles valdkonnas võiks olla. Paneeli jagame nii-öelda kolm suuremat teemat on. Aga, ja kindlasti publikul on võimalik küsimusi küsida, tõstke käsi ja sobival hetkel me anname teile võimaluse. Aga ma ei tea, alustaks nii nagu ikka paneel alustuseks, et alustame tutvustustest, et ma ennast põgusalt tutvustasin, et palun mõni sõna.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="222.48" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:42–4:12</span></span><span class="segment-text">Jah, tere, Eva Palma, et suurem osa oma tööst olen tegelikult veetnud Ameerika Ühend riikides, aga nüüd viimased aastad olen olnud Tervisekassas kõikide valdkondade üleselt raviteekondade arendamise peal ja sellest sügisest siis astun uude rolli, mis puudutab laiemalt rahastusmeetmeid ja teenusmudelite arendamist ehk siis ka tulemuspõhiste raha stusmudelite rakendamist, mis on selline moodne sõna. Nii et toon täna Tervisekassa vaate siin paneelis.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="252.4" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:12–5:08</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mina olen Kiti Kufo ja olen hetkel siin sotsiaalministeeriumi esindajana, aga tervis hoiu poole peal innovatsiooni nii-öelda erinevate nurkade või erinevate tasandite alt tegelenud oma viisteist aastat, et alates sellest, et, et koos osapooltega kirjutanud Eesti esimese teadus-arenduse innovatsiooni strateegia tervishoiu valdkonnale. Siis connectid Hels klastris mitu aastat tervishoiu ja, ja startup ettevõtete koostöö d teinud ja, ja samamoodi siis mõelnud selle peale, et, et kus need barjäärid ja, ja karid on ja täna olen rohkem siis liikunud sinna, et tervise ja hoolekandetehnoloogi aid siis tervise sotsiaalsüsteemis kiiremini kasutusele võtta. Olemasolevaid tehnoloogiaid lihtsalt teenusmudelitesse juurutada kiiremini, et need jõua ksid inimesteni kiiremini.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="308.12" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 5:08–6:04</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, mina olen Helen Maidre. Täna esindan siin EstBANi, aga kui ennast tutvustada, siis võin ma alustada sellest, et ma olen hetkel Tallinna Tervishoiu Kõrgkooli tudeng, aga vaatamata mu palun dokument i näo nahale, see ei ole mul esimene kord ülikooli astuda. Lisaks olen Äripäeva juhtimisraamatu autor, mida võite leida praegu kõiksuguste raamatu poodide lettidelt, töötanud viisteist pluss aastat erinevates start-upides just nagu põhiliselt fintech&#x27;is Eestis, Jaapanis, kus iganes mujal. Täna juhin Tervise idu, mis tegeleb tootmisega. Tulge palun siia kõrval telki, saate proovida kanuleerimist ja verejooksu peatamist, et teeme niisugust tootmist. Aga siin olen, kuna olen viimased viis aastat olnud EstBAN-i singelinvestor. Aga jagan ka tervise ettevõtlusest.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="363.6" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 6:04–7:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, Andres Kotšiuba olen mina. Et mina tulen siis selle ettevõtja vaatega siia laua peale ja minu taust on see, et ma kunagi alustasin oma karjääri pangandusfinantsadvokaadina. Ma liikusin sealt edasi, et ühte finantsettevõtet asutada ja ehitada ja seda ma tegi n umbes seitse, kuus-seitse aastat. Ja pärast seda asutasingi siis Salu, mis on siis see alguses see probleem, mida me hakkasime lahendama, on välismaalane, kes tuleb Eestisse. Tal ei ole perearsti või perearstiteenuseid ei saa kätte. Me tegime kuutasu põhise kliiniku, inimene tasub meile ise kuutasu, saab onlainis mu gavalt kiiresti arstiabi kätte, aga me katame Coughline teenuseid. Tänaseks on meil, oleme Eestis, Hispaanias, Soomes. Me oleme, kui me räägime rahastusest, oleme tõstnud Kesk-Euroopast, Eestist seitsmeko halise summa investeeringut. Meie käive oli eelmine aasta seitsmekohaline ja meil on umbes kolmandik on välismaala si, kaks kolmandikku tegelikult kohalikud. Ja ma arvan, et kui, kui võib-olla taustast ka, et kui me räägime tervisetehnoloogia st, tegelikult meil on, siin on ravimid, teenused, diagnostika ja nii edasi. Ma vaatan selgelt teenuse poolt, proovin ka teisi hääli sisse tuua ja, ja kindlasti see taust, et me oleme, ma arvan, mõlemad ka finantstehnoloogiast pärit. Et selle paneeli käigus ma ise vähemalt tahaks tuua nagu mitmeid paralleele, kuidas fi nantssektoris on see innovatsioon ja regulatsioon ja rahastus on toimunud ja võib-olla mida me saame õppida siit tervishoius, see on kõik.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="461.08" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 7:41–8:14</span></span><span class="segment-text">Jah, aitäh, et esimene plokk keskendubki nüüd uute lahenduste kasutuselevõtule. Et siin, noh, sageli mõeldakse nii-öelda meditsiiniseadet või mingit molekuli või ta bletti, eks ole, et see teenuse. Vaade, et võib-olla siis alustame sellest, et kui sa, sul on, sa ütlesid, et sul on ko gemusi Eestist ja mujalt Euroopast teenuse müügile toomisega, et kuidas, kuidas sa hi ndad, kas see on täna Eestis kuidagi parem või halvem kui mujal maailmas või on meil</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="493.96" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 8:14–9:45</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">mujalt õppida? Kas teenuse turule toomise, toomine või? Jah, just. Ma arvan, et see meie põhiline nagu õppimine oli nagu see, et nagu iga toote või sellise ettevõtte asutamisega sa pead väga selgelt aru saama, kellel mis probleemi sa lahenda d ja kellel see valu kõige suurem on. Ja meil nagu aitaski see, et kuna me oleme teenusepõhine ettevõte, me pakumegi siis nii -öelda seda online meditsiiniteenust. Siis turule sisenemine oli meil, ma ütleks sama, sama keeruline või lihtne, sest me läks ime seda lõppklienti jahtima, kes meile maksis ise selle raha kinni. Meil ei olnud vaja Tervisekassat ei Hispaanias või kuskil mujal, meil ei olnud vaja kind lustusi, suuri ettevõtteid. Et see esimene validatsioon, kas me teeme üldse õiget asja ja kas sellel teenusel on üldse turgu ja vajadust, oligi see, et kas nii-öelda Malle, on see Eesti, Jose, Hispa anias on valmis käima oma, ma ei tea, kakskümmend eurot, kolmkümmend eurot oma tasku st välja ja usaldama seda teenust, et saada arstiabi meie kaudu. Et, et ma arvan, et me räägime nagu minu jaoks on see see ka see paneel on nagu kahe s faasis, et üks on see, et kuidas ma saan nagu esimese signaali. Kas sellel asjal on mõtet, mida ma, millega ma tegelen ja teine on see, kuidas seda suure ks kasvatada. Et see meie vaade oligi see, et me saime otse. See klient, see patsient, see, kellel on see valu, tema maksmine ise raha, et see tu rule saamine oli tunduvalt nagu kiire või lihtne, aga ma saan aru, et näiteks meditsi iniseadmetes, kui ma müün vererõhuaparaati, see võib olla teistsugune.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="585.04" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 9:45–9:48</span></span><span class="segment-text">Helen, kuidas on sinul kogemused sellel?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="588.32" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 9:48–10:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No ma võin seda öelda nii ettevõtja kui investori vaatest, ettevõtja vaatest on see, et mul on maksvad ostjad olemas Eestis, mul on vaja neid saada väljaspoolt, eks ju, ja selleks ma tahaks kaasata investorit, et aidata mul laieneda. Investorina, kui ma vaatan, et me tahame laieneda, meil ei ole mingit konkreetset pla ani. Keegi meilt midagi veel ostnud ei ole, ma ei usu sellesse, mina ei taha oma raha sinna panna. Aga kui ta suudab mulle näidata ette, nagu Andeas just rääkis, et Malle ja Je on nõu s raha panema, siis ma näen, et okei, seal võib midagi tagasi ka tulla. Et ma ei pane oma raha lihtsalt selleks, et aitame Eesti ettevõtetel eksporti teha, vaid see on selleks, et toimiv lahendus jõuaks rohkemate inimesteni ja tooks mulle kunagi midagi tagasi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="637.24" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 10:37–12:02</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nojah, siin on, ütleme teenuste puhul jah, sa ise ütlesid väga õigesti, et sul on see nii-öelda lõppklient, eks ole. Oma taskust maksab ja kindlustusteenuse pakkujad, ükskõik, kas see siis on Eestis või kusagil mujal, vahel ei ole vaja. Aga noh, ütleme sageli siiski, kui me vaatame maailmas ringi, siis väga paljud lahendus ed siiski ei ole nagu lendu läinud, sest noh, ütleme ikkagi käib läbi läbikindlustuse Ja siin on, noh, kui seda wide paper&#x27;it või seda health founders Estonia tööd on nagu ette valmistatud siin, et siis. Üks väide, mis sealt nagu meie diskussioonidest kõlama jäi, oli see, et nii-öelda ha iglatel ja võib-olla ka laiemalt tegelikult meditsiinisüsteemis noh, see kõik on Eesti -keskne, eks ole, meie diskussioonid see puuduvad nii-öelda sisemised, ma ei tea, protsess id, valmisolek, motivatsioon uute lahendustega tegeleda. Ja see kipub sageli jääma nii-öelda niisuguseks õhinapõhiseks, sõltuma üksikutest in diviididest, ma ei tea juhuslikest kohtumistest, kus iganes ja noh, nii edasi. Et nüüd võib-olla kui avaliku sektori poole pöörduda, et, et kui palju neid meditsiiniseadmeid on siis nii-öelda digitaalsed või hübriidsed või füüsilised, et kui palju neid täna kindlustusega kaetud on? Ja ütleme võib-olla ei taha sul sõnu suhu panna või teile, aga miks neid täna nii vähe on? Rahastatud Tervisekassa poolt.</span></button>
