<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="15.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 0:16–3:28</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Oh teine asi, muidu juba mõtlen, et tukuvad ja ja siis mul pole kellegagi siin a studa arutellu, ütleme nii, sellepärast et minul on selline komme, et kui mina mõnda sellist sündmust nagu see täna, mis siin on modereerima satun, et siis ma proovin mitte ise saadet täis rääkida. Et saate teie ise ka täna kaasa mõelda, kaasa rääkida ja loomulikult meil on siin to redad inimesed, kes seda kõike teha saavad. Minu nimi on Tanel Talve. Mul on väga suur au tänast paneeli ja arutelu siin juhtida ja natukese ohjes hoi da. Ja muidugi, kui mulle pakuti sellist teemat, et töö kius otse laval, siis võttis veid i jahedaks ausalt öeldes, et. Et aga kuna ma natukese tean Tööinspektsiooni inimesi, siis ma nüüd liiga palju ka ei karda, sest et tegemist on hästi toredate inimestega ja ma väga loodan, et nad mind siin kiusama ei hakka ja ma juba lubasin siin osadele panelistidele ka, et ma neid ka väga palju ei kiusa. Et oleme kõik sõbrad ja loodetavasti saame täna siin ära minnes mõelda ja öelda, et me oleme natukese targemaks saanud mingi kogemuse võrra rikkamaks ja nii edasi. Aga jah, töökius otse laval, tõepoolest siis täna on meil arutelu all on ja ma juba jõudsin, siin ma tulin nõksu varem kohale siia, et osade inimestega arutada selle töökiusu kui sellisel teemal. Ja mul oli täitsa juba tore selles mõttes, et inimesed läksid omavahel vaidlema, et kas töökiusust kui sellisest on meil juba piisavalt räägitud või vastupidi, on sellest lii ga vähe räägitud, sellepärast et üks inimene ütles, et noh, ütleme, et koolikius mõis tena on temale nagu tuttav, ta on kuulnud sellest, ta saab aru, millest seal see probleem ja, ja, ja kuidas see olukord on, aga vaata, et selles töökiusust nagu ikkagi liiga palju räägitud ei ole. Nii et ma loodan, et täna saame ka sellele siis vastused, aga ma küsin kohe kõigepealt teie käest, nagu ma lubasin, et ma siin üksi rääkima ei kuku, et kes teab, mis asi on töökius, võib käega märku anda. Ikka teatakse, jah. Kes ei tea üldse, mis on töökius? No vot, ega mina võin ka tegelikult käe tõsta, ma olen selline nii ja naa. Et ega ma ei ole väga palju, võib-olla ka kokku puutunud ja võib-olla ma ei, mis on ju hea selles mõttes vist, aga teine on küsimus, mis mulle endale hakkas tekkima, et äk ki ma ei tea, et mind on eluaeg kiusatud seal töö juures ja, ja see võib täitsa vaba lt ka nii olla, aga ma tutvustan nüüd ka teisi toredaid inimesi, kes minu kõrval siin on, et ma siin üksi tõesti ei targuta ainult Merle Raun, level läbi tegevjuht ja töö tülide lahendaja on minul siin ametinimetuseks pandud. Võib julgelt öelda ka tere. Tere kõigile. Siis on Johanna Rähn ja tema on Lidli Tööõiguse ja personali vastavuse Baltikumi tii</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="264.4" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 4:24–4:37</span></span><span class="segment-text">Ei muidugi, loomulikult ma selle võimaluse annangi alati, mõnikord võetakse minu küsimus t, kui nagu hakatakse õigustama ennast, aga see ei ole üldse nii mõeldud. Johanna, teie seal lillides ikka kiusate ka enda töötajaid ja?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="276.92" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 4:37–5:04</span></span><span class="segment-text">Me üritame mitte, ei jah, ei kiusa, üritame mitte ja, aga elu on elu ja et pigem ma arvan, on tähtis leida viise, kuidas seda vähenda da või kuidas seda leida, kuidas seda ennetada. Et mitte öelda, et ei, see meil siin kunagi ei juhtu, ei ole kunagi juhtunud, et pigem nagu vaadata olukorrale realistlikult otsa. Meeskondi on palju ja kõike tuleb endal.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="304.32" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:04–5:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kas see, et ettevõte on noh, piisavalt suur või piisavalt väike, et kumb see võiks so odustada rohkem seda töökiusuteemat?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="313.8" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:14–5:40</span></span><span class="segment-text">Ma isegi ei oska öelda, et mõlemat pidi võib, võib noh, nii-öelda suures ettevõttes ma kujutan ette, et on lihtsalt nagu juhtumeid võib-olla rohkem, sest inimesi on rohkem Aga kui on niisugune väga väikene tiim, on ju väikene meeskond ja tuleb mõni uustuli ja näiteks, et siis võib jälle tekkida niisugune noh, võimudünaamika teema ja et et mõ lemal on oma võlud ja valud näiteks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="340.12" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:40–6:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja mis ma küsin seda tegelikult, et kui me toome näiteks digitaliseerimise või automa tiseerimise, mis on palju räägitud teema ju samamoodi ja just, et eraettevõtlus võib -olla võiks veelgi suuremate sammudega sinnapoole astuda, siis tihti ma olen märganud , et just nende väikesemate ettevõtetega on rohkem probleeme, sest et suurematel on lihtsalt rohkem raha. Et noh, ütleme olla nagu selles mõttes eesrindlikum, et võib-olla see on ka tänase teema vahel samamoodi.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0014" data-start="365.76" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 6:06–6:31</span></span><span class="segment-text">Selles mõttes ma olen täiesti nõus, et kui on nii-öelda, meil on ka hästi suur person aliosakond ja meil on hästi suur nii-öelda sihukene, noh, ongi minu üks tööülesannetest , mis võtab suhteliselt palju aega, on ka, et kui tuleb kaebusi selle kohta, et siis neid uurida, et võib-olla kui on, kas siis väiksem ettevõte või siis on vähem ressur ssi selle peale panna, et siis need juhtumid lähevad rohkem tähelepanuta.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0015" data-start="391.4" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 6:31–6:35</span></span><span class="segment-text">Aga teil tuleb neid kaebuseid siis ikka ja neid lahendatakse?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0016" data-start="394.52" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 6:35–7:24</span></span><span class="segment-text">Ja täiesti tuleb, et õnneks võib öelda, et enamik kaebusi ei ole nii-öelda selline noh, õiguslikus mõttes töökiusamine, aga me leiame ikkagi nii-öelda meetmeid ja asju, mida teha, leiab ikka, tuleb küll kaebusi ja me siin sa mainisid ka enne, et, et nii-öelda, et kas sellest on piisavalt räägitud ja et kas ikka peab veel rääkima, et noh, meie märkame täiesti selgelt, et kui on olnud. Me oleme teinud näiteks mingi uudise teavituse, et siis nii-öelda kaebuste arv tõuse b. Et noh, mis võib järeldada, on ju, et need teavitused tekitavad töökiusamist on ju, et tegelikult, tegelikult siis ongi inimestel tuleb jälle meelde, tuleb meelde, kuhu tea vitada ja, ja võetakse nagu asi ette.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="443.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:24–7:54</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mitte kiusajal ei tule meelde, et pahad ma pole ammu kiusanud. Ma loodan, et see ka nii on, aga Elina, kui suur probleem see ütleme Eestis või ka vabandust ja näe juba läks sassi. Merle tahan teada, Helnalt juba küsisime, et te teete igasuguseid uuringuid ja, ja on võib-olla sellist üldisemat pilti ka, kui suur probleem see Eestis on või kas saab rääkida ka maailmast, Euroopast, et kuidas Eestiga võrreldes meil see olukord on Euroopas näiteks</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0018" data-start="474.92" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:55–10:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja ma kõigepealt võib-olla vastaks sellele eelmisele küsimusele ka, et, et uuringute järgi tegelikult kõige rohkem töökiusamist on sellistes organisatsioonides, kus on sa da kuni viissada töötajat. Et see tulenebki töökorralduslikest probleemidest, info kommunikatsiooniprobleemidest ja nendes organisatsioonides võib-olla ei ole see ennetus ja sekkumine alati kõige parem ini korraldatud, et veel suuremates organisatsioonides on need, on need reeglid juba rohkem paigas ja väiksemates organisatsioonides lihtsalt ei julgeta või ei tulda ka alati nende teemadega nii palju välja või lahendatakse need madalamal tasemel ära. Põhjused, miks suuremates on töökiusamise küsimused, tullakse nendega välja, on, on võib -olla erinevad väiksematest organisatsioonidest, suuremates ongi töökorraldus ja, ja väiksemates siis vähesem teadlikkus ja, ja ennetuse puudumine. Aga nüüd tulles selle, selle küsimuse juurde, siis ma pean alustama kaugemalt, et võib -olla Eesti üle-eestilisi uuringuid viimastel aastatel ei ole tehtud. See, mis mina oma doktoritöö raames tegin kaks tuhat kümme, kaks tuhat üksteist, siis oli, vastas ligi kahe tuhandese küsi- küsitlejate hulgast, et töö, töö kiusatud on umbes kümme protsenti vastajatest ja, ja hiljem kaks tuhat üheksateist sama metoodikaga, kui uurisime töötajate hulgas, et, et kui palju siis töökiusamist esi neb, siis oli üheksa protsenti tundsid, et negatiivseid tegevusi ja töökiusamist esi neb. Nii et, et see palju vähenenud ei olnud, aga kui nüüd Euroopa juurde tulla, siis kaks tuhat kakskümmend kaks näiteks tööohutuse ja, ja töötervishoiuagentuur tegi selgeks, et seitse protsenti keskmiselt kannatab töökiusamise all, naised natuke rohkem, kaheksa , mehed vähem, kuus protsenti, aga noh, keskmine ütleb ka seda, et et erinevates riik ides on see väga erinev. Et seal, kus on võib-olla maskuliinsem kultuur ja, ja selline ütleme siis juhi alluva vahelised sellised distants on, on suurem, et riik ides, kus on näiteks Lõuna-Euroopas on see madalam, sest et töötajad ei julgegi välja tulla töökiusamise kaebustega, seal on natukene rohkem harjutud sellega, et nii nagu juht ütleb, nii on, autokraatlikum juhtimisstiil. Aga, aga siis Põhja-Euroopas, kust on töökiusamise kontseptsioon või ütleme siis uuri ngud alguse saanud, kaheksakümnendate lõpus, üheksakümnendate alguses, seal on teadlikku s kõrgem ja seal julgetakse ka välja tulla, kui, kui ikkagi tuntakse, et on kiusamine</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0019" data-start="647.08" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 10:47–10:56</span></span><span class="segment-text">Aga seda varianti ei ole, et ei olegi kiusamist, et peab kuidagi nagu praegu tundub, et lihtsalt, et, et kui ei ole ühtegi kaebust tulnud, siis nad ei julge.</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0021" data-start="672.32" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 11:12–11:16</span></span><span class="segment-text">Ei no riikide põhiliselt loomulikult ja ma loodan, et meil on ikkagi.</span></button>

          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
</body>
</html>
