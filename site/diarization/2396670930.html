vastu võetud, on kohustatud ühiseid reegleid jä lgima. Veel kord ÜRO konventsioon on liikmesriigi õigussüsteemis hierarhia tipus, mis tähendab sedasama õiguslikult sidevat, siduvat põhimõtet. Kui aga tulla tagasi ÜRO räbala seisu juurde, siis on tõsi, et kui Kofi Annan ÜRO kuu ekümnenda aastapäeva puhul vaatles ja vaatas tulevikuentusiastlikult, siis sedasama ei saa öelda Antonio Guterrese kaheksakümnenda aastapäeva puhul tehtud kõne puhul, see ei olnud optimistlik. Ennekõike piinab maailma suurimat organisatsiooni rahahäda, sest ÜRO kaks kõige võim samat turgu mängivad ainult liikmemaksude maksmist. Üks viiendik töötajatest on koondatud või ootab koondamist. Inimpõlv tagasi ellu kutsutud ÜRO reform pole suurt kuhugi jõudnud. Julgeolekunõukogu tegutseb ikka mitte kahekümne nelja, vaid viieteistkümne liikmelise na ja võib blokeerida ükskõik millise suurepärase algatuse võrdselt ÜRO Peaassamblee emaga, peaassambleega. Loota Ukraina sõja lõpetamise resolutsioonile julgeolekunõukogus on sama, kui vaadel da oma kõrvu. Ja siiski märkisin ÜRO inimõiguste nõukogu, Eesti on üks neljakümne seitsmest selle nõu kogu liikmest. Meie naisdiplomaadid teevad erakordselt tõhusat tööd Genfis. Kahjuks Eesti ajakirjandusel puudub igasugune huvi seal toimuva vastu. Naiste õigused on inimõigused, praegu on ÜRO silmitsi uue peasekretäri valimisega ja ma arvan, et vähetähtis pole märkida, et kuuest kandidaadist hetkel kaks kolmandikku on naised, kusjuures väga võimekad naised ja lõpetuseks jutud ühinenud, ühinenud rahva ste organisatsiooni surmast on enneaegsed, aitäh.</span></button>

tub enamasti, enam-vähem kolme suurematesse potti ja , ja humanitaarpott sellest on, on, on üks suuremaid, meil ongi kõige suurem kolmkümmend viis miljardit dollarit sel aastal, millest nüüd augusti esimeste päevade seisuga on rahastatud kolmkümmend kaheksa protsenti, ehk siis suurem osa aastast on möödas, aga tegelikult me ei ole kaugeltki veel seal, et katta neid humanitaarvajadusi, mis, mis maailmas hetkel on ja see ei ole sekretariaadi haldusprobleem. See on ikkagi liikmesriikide probleem, mis moodustavad ÜRO tervikuna. See reeglitel põhinev maailmakord, mille lõpp on siin juba pikalt ette kuulutatud, eri ti nüüd Trumpi ajastu ei ole olnud pettus, see on päriselt toiminud, sellel on päris tulemused. Aga nagu öeldud, juba siis me tegelikult vaatame vastamisi ka sellega, et selle süsteem i kõige nõrgem lüli on lõpuks ikkagi see riik, kes peab neid reegleid järgima ja tema vastutusele võtmine selle riigi, kes neid reegleid ei järgi, vastutusele võtmine on pe hmelt öeldes noh, mitte võimatu otseselt, aga noh, põhimõtteliselt kudlak. Nii et see igasugune ÜRO reformimine ei saa toimuda lihtsalt nii -öelda sekretäriaadi reformimisena, vaid see peab puudutama ikkagi kõiki liikmesriike , kellest ÜRO koosneb, see on muuhulgas julgeolekunõukogu reform, pea assambleele suurema võimu andmine, konfliktiennetusega tegelemine nii-öelda päris me hhanismide kaudu ja, ja ka tegelikult humanitaarvaates siis komplementaarsuse toomine tugevamalt sellesse, et kuidas ÜRO üldse ennast mõtestab ja, ja ennast mõtestab selles humanitaarsüsteemi sees. Ma arvan, et Eestil on ka väikse riigina siin oma, oma roll, mida Eesti saab teha selle reeglite põhise reeglitepõhise nii-öelda korra säilitamisel ja alal hoid misel. Nii et lõpetuseks, Rahvasteliit kukkus kokku sellepärast, et riigid tegelikult ei, ei soovinud Rahvasteliitu enam ja ma arvan, et ÜRO saatus ei saa olema samasugune, sellepärast et niikaua, kuni meil veel on kriitiline massriike, kes, kes näevad selles väärtust, siis siis seda e   <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);

        cards.forEach((item) => item.classList.toggle("active", item === card));
