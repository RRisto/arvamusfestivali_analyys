    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.88" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 0:11–1:08</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast kõigile siia siis arutlema väga palju kirgi nii meedias kui kui ka hambaarstide kui ka tavaliste inimeste seas tekitanud teemal milleks on siis uue d hambad Türgist, kes parandab, kui midagi läheb valesti. Ja meie diskussioonis siis on oma ala tugevad eksperdid. Mina ise olen Elo Mõttus-Lepik. Ma töötan Kanal kahes ja ka teen kaastööd Postimehele ning Türgi hammastega on mul selline siis kokkupuude, et ma olen seda teemat kajastanud siis mõlemas kanalis, uurinud, rä äkinud inimestega, kellel on olnud probleeme Türgis tehtud hambaraviga. Aga meie eksperdid siin, kui sobib, et kui te ise ütleksite enda kohta paar sõna, kõige pealt siis doktor Kristjan Kutmann.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="67.64" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 1:08–1:35</span></span><span class="segment-text">Ja minu nimi on Kristjan Kutmann, ma olen hambaarst, Eesti Hambaarstide Liidu asepre sident ja igapäevaselt siin tegelen siis nii-öelda nii hammaste raviga kui ka kui ka proteesimisega, nii et, et selles mõttes olen, olen näinud igasuguseid töid ja olen siis näinud ka samamoodi nagu mu kolleeg siin, olen näinud neid patsiente, kes siis on pöö rdunud tagasi edukalt või vähem edukalt reisilt siis kuhugi teisele maale.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="95.2" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 1:35–1:37</span></span><span class="segment-text">Nii doktor Martin Martma.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="97.08" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 1:37–2:08</span></span><span class="segment-text">Ja tervist. Mina olen siis ka proteesiarst sellises interdistsiplinaarses hambaravikliinikus, kus me siis lahendamegi selliseid keerulisemaid juhtumeid ja teeme põhimõtteliselt sa rnaseid asju siis, milleks inimesed sinna Türki lähevad, aga aga jah, võib-olla lähtume natuke rohkem patsiendi tervisest kui, kui sellest nii-öelda välisest fassaadi st, et aga sellest räägime.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="128.12" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 2:08–2:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Triin Randma, Triin Randlo. Mina olen Triin, mul on hästi hea meel siin olla lõpuks ka Eesti doktoritega ühe pane eli peal istuda. Ühisnimetaja on Interim ehk siis ma olen äristrateegia, üks mu klient, kus ma olen pa lgal Interim, antentake. See on siis, mina olen siin selleks, et valgustada, kuidas asjad Türgis käivad just seda väga hullu poolt ja ka seda väga head poolt, et mündil on kaks külge.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="161" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:41–2:45</span></span><span class="segment-text">Ja Karin siis London.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="164.8" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:45–3:11</span></span><span class="segment-text">Ja tere, mina olen siis oma patsiendilooga ja just nagu ma aru saan, et mi nd ei olnud varem nii-öelda välja kuulutatud, ma olen ootamatu külaline, kui hambaar stide liit mu poole pöördus, siis ma mõtlesin tükk aega, kuidas seda serveerida, sest see on delikaatne lugu, kuidas jagada oma seda kogemuslugu, nii et mina siis jagan, mul on kaks lugu, üks on halb, võib-olla isegi väga halb ja teine on hea lugu.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="190.76" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:11–4:12</span></span><span class="segment-text">Ja suur aitäh Karin, sest tõesti kogemuslood on alati need, mis väga palju annavad juurde Ka ekspertide ja kõigi teiste jutule. Et maailmas ongi siis praegu lahvatanud selline tõeline buum, kus siis inimesed sõida vad Türki, et saada endale selline tõeline Hollywood&#x27;i smail, naeratus siis ja seda re klaamitakse tegelikult päris massiliselt meie sotsiaalmeedias ja ka tavalises meedias Seda siis ka meie kuulsuste kaudu, kes on seal käinud siis ja oma hambaid ravinud ning paraku meie hambaarstid näevad siis tõesti selle Türgi hambaraviga varju külgi ning nendest me siis nüüd siin kõigest rääkima hakkamegi. Aga kui tohib, alustaksime üldse eestlaste endi hambatervisest, et et ha mbad on Eesti inimestel suhteliselt halvas seisus.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="251.68" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 4:12–5:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Miks see nii on? Sellele on nüüd võib-olla niimoodi ühe lausega või isegi isegi niimoodi mitme lausega kiirelt vastata, päris keeruline, eks kindlasti iga inimese lugu on nagu erinev. Aga kindlasti on kaks põhilist põhjust, mikspärast hambad on sellises seisus, nagu nad on. Esiteks on see, et, et meil kõigil on või väga paljudel meist on taga ikkagi selline pikk ajalugu sellises riigis, kus kohas võib-olla meditsiiniteenuste kvaliteet ja me ditsiiniteenuste ja hambaraviteenuste kättesaadavus ei olnud parim võimalik. See on kindlasti üks põhjus. Ja teine asi on ikkagi see, et, et kuna Eestis ikkagi selline hambaravi täiskasvanute le võiks öelda, et on sisuliselt patsiendi enda kanda sada protsenti, siis ikkagi ma arvan, et teenus, ütleme eriti selliste kallimate protseduuride teenus, mida on vaja lik siis, kui hambad on juba päris lagunenud, nende teenuste hind kipub olema üsna ka llis ning kui seda kõike on korraga vaja teha, siis võib-olla tekib tõesti selline k äega löömise tunne, et, et ma siis pigem ei tee üldse mitte midagi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="320.96" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 5:21–5:45</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Siis kui me tegelikult vaatame statistikat, mida on näiteks teinud Tervise Arengu In stituut siin Tervisekäitumise uuring, siis selgub, et igal kuuendal tööealisel Eesti elanikul on suust puudu kuus või enam hammast, et ja et veel selline päris šokeeriv, et kolmteist koma seitse protsenti Eesti inimestest on viimase kolmekümne päeva jooksul kogenud hambavalu.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="345.04" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:45–6:30</span></span><span class="segment-text">Ja et, et noh, mina küll enda praktikas näen seda, et inimeste hammaste tervis on ikkagi võtnud suuna paremuse poole ja hästi oluline seal juures on just see nii-öelda teadlikkus, et millest need probleemid suus tekivad. Et meie hambaarst ja, ja võib-olla ka koolide ja üldse nagu haridusasutuste ülesanne ongi tegelikult inimestele rääkida, õpetada seda, et milline on suu tervislik käitumine, sest et enamus neid probleeme me saame väga lihtsate käitumuslike nii -öelda harjumusmuudatustega nii-öelda ära jätta.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="389.96" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:30–6:40</span></span><span class="segment-text">Aga mis see siis on, kas inimesed pesevad oma hambaid liiga vähe või, või mis see põhi probleem on, et kui me ka natuke statistikat saame näidata siin.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="400.04" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 6:40–7:26</span></span><span class="segment-text">Et hammaste pesemine on hästi-hästi oluline kindlasti, aga üks asi võib -olla, millele inimesed tähelepanu ei pööra, on toitumine ja tegelikult ütleme, kui me räägime hambakaariesest hambaaugust, siis toitumisel on isegi sellega suurem seos. Et hästi oluline, et, et oleksid konkreetsed toidukorrad, et ei oleks toidukordade vahe list näksimist, et siis hambavaabal oleks aega oma tugevus uuesti taastada, et siis järgmise toidukorrale vastu panna. Ja kõik muud harjumused nagu happelised, toidud, happelised söögid, tubakas, kõik, kõik need asjad, mis siis mõjutavad seda suu, kes keskkonda.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="445.68" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 7:26–8:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja muidugi, mida alati öeldakse, on see, et ei ole raha Eesti inimestel minna hambaar sti juurde, et jah, kuni kaheksateistkümnenda eluaastani on ju see kõik õnneks korva tud ravimikindlustuse poolt, aga edasi ravikindlustust ei ole, on kuuskümmend eurot aasta s ja, ja, ja noh, seda natuke vähevõitu, et kui, kui siin näiteks tuua lihtsalt võrd luseks, et Euroopas on keskmine selline avalik süsteem, katab siis kolmkümmend kolm protsenti hambaravist. Saksamaal avalik süsteem seitsekümmend kolm protsenti, Prantsusmaal kuuskümmend viis protsenti. Noh, sealt tulevad ka paremad hambad tõenäoliselt lõppkokkuvõttes.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0015" data-start="486.8" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 8:07–9:18</span></span><span class="segment-text">Ja et noh, kui vaadata nüüd antud kontekstis, kus siis inimesed lähevad Türki hambara vile, siis tegelikult Türki ei minda ju hambaauku ravima, Türki ei minda hambakivi e emaldama, et sinna ikkagi minnakse tegema suuremaid töid ja tihtipeale jah , ütleme, patsient ütleb, et tal on hambad katki ja ta tahaks nagu need terveks saada , aga tegelikult see suurem eesmärk on saada ilusat Hollywoodi naeratust, eks ole, ja , ja noh, need ütleme keerulised tööd, mida minnakse sinna Türki tegema, on muidugi Eestis kallid, sest et need võtavad aega, need tahavad meeskondlikku lähenemist, seal on väga palju detaile, seal on väga palju eeltööd, seal on väga palju järeltööd, et see, see ei ole nii lihtne ja mis selle nagu Türgi hambaravi puhul mind häiribki, ongi see, et seal on oluline kiirus, tehakse hästi palju protseduure hästi kiiresti selle tõ ttu tehakse väga palju kompromisse ja need kompromissid tulevad enamasti patsiendi ha mmaste tervise arvelt.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0016" data-start="557.8" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 9:18–10:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja nüüd jõudsimegi põletava teemani Türgi hambaravi ning paraku jah, sellest on saanud suur terviseturism, sellest on saanud tegelikult ka Türgis väga suur busin ess. Kõik on siis segamini nii terviseteenused kui tõeline äri business, mille eesmärk on siis see, et võimalikult kiiresti inimestele maha müüa kõik, mis vähegi võimalik ja nad kohe kodumaale tagasi saata. Ja kus nüüd teha vahet, mis on päris hambaravi, mis on lihtsalt business ja, ja soov siis raha teenida ja tagasituled väga hullus seisus, et Randlo, Triin Randlo, me, kuidas teha vahet?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0017" data-start="601.44" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 10:01–12:45</span></span><span class="segment-text">Ma olen eelkõnelejatega nõus, sellepärast et olen ka ise näinud neid lugusid, mis on juhtunud, aga kui me nüüd lähme, vaatame korraks üldpilti, siis Türgis ongi kaks äärmust. Ise Türgi riik annab välja statistikat, seitsekümmend protsenti sealsetest kliinikutest on need, kus ei tohiks käia ja kolmkümmend protsenti on need, mis siis on kontrollitud ka Türgi riigi poolt ja see protsentuaalne vahe on tegelikult väga suur. Türgi riik tegelikult ise võitleb ka selle seitsmekümne protsendi vastu, aga mis on juhtu nud, ongi see turismi osakaal on tulnud, seal pole sellist asja nagu ettevõtu keeldu , et igaüks võib panna endale putka püsti, rentida aparatuuri ja sisse osta endale ar ste ja tavaliselt, mis juhtub, on see, et ei kontrollita ka, mis on selle arsti taust , eks ju. Ja nüüd me läheme sinna teisele poole ja siis on meil see teine pool, mis on tipptase ja me ei hakka praegu siin nimesid nimetama kliinikute koha pealt, aga küsimusele vastu s, et kuidas siis leida ja selekteerida see õige koht. Number üks on kindel, on see, et igal korralikul kliinikul on T ürgis enda laborid, ehk siis tänu sellele, et just mainiti ka, et protsessid on hästi kiired, siis ma tean, et Eesti kliinikutel ei ole laboreid nii palju, nagu on Türgis korralik, et korralikes kohtades. Teine asi on see, et on sertifikatsioonid ja akrediteering, üks kõige parem turvalis use näitaja on JCI, rahvusvaheline akrediteering, mida antakse plastika ja hamba kliinikutele. Türgis on ainult ühel kliinikul see akrediteering ja mida see tähendab, on see, et pea kontor on neil USA-s, aga nii Euroopas, Aasias, USA-s on siis vahekontorid, kus teha kse kliinikutele kontrolle, inimesed tulevad kaheks nädalaks kliinikusse nii haiglasse kui kliinikusse ja käivad läbi siis kõik protsessid, kuidas algusest lõpuni välja näe b, et nad vastaksid standarditele. Kolmas asi on see, et Türgi riik peab ise toetama kliinikut ehk siis kuna me teame, et Türgi on turismiriik, loomulikult ju riik teeb kõike seda, et saada rohkem inimesi sinna riiki, siis on see, et kontrollitud turvalistele kliinikutele nii plastika kui hambad annab Türgi riik tuge, olgu see siis materjalide soetamiseks, originaalmaterjalide või siis erineva aparatuuri tehnika ostmiseks, et need on need põhiasjad.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0018" data-start="765.44" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 12:45–13:09</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh, Triin ja me vaatame nüüd korra ühe hästi lühikese kogemusloo ühel nai se loo, kes käis Türgis ja tema iseenesest on tulemusega väga rahul. Palun. Uusi hambaid saama Hillary. Kureik, vabandust, paneme selle teise loo. Aga siis niikaua, kuni see veel ei käi, ma korra küsin.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0019" data-start="789" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 13:09–13:13</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Türgis oma hambad vahetada välja kroonide vastu.</span></button>

  <script>

      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
