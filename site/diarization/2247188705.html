    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.92" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:11–1:57</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast kõigile vaid arvamusfestivalile. Ja tere tulemast siia telki, kus me kohe-kohe hakkame rääkima ühel väga praktilisel teema l. Mis puudutab nähtavasti teid kõiki ühel või teisel moel. See on töö, tööõigus, me räägime sellest millega me kõik oma profes sionaalses töös aeg-ajalt kokku puutume, on see, et tekib konflikt, vaidlus, erimeelsus oma tööandjaga. Ja siis tuleb hakata seda olukorda kuidagi lahendama ja, ja on täiesti iseen esestmõistetav, et töötajal ja, ja tööandjal on teatud mõttes erinevad huvid. Nii tervist, herilane, töötaja tahab rohkem palka, tahab paremaid töötingimusi, pike mat puhkust. Ja töötaja või tööandja siis vajab efektiivsust ja, ja seda, et tööta jad kasutaksid neile ette nähtud aega kõige paremal moel. Ja kui siis tekivad mingisugused probleemid, siis mismoodi neid lahendada, missugused on õiguslikud hallid alad ja, ja, ja ka konkreetsed lood, sest täna me püüame vältida sellist mustvalget vastandumist, aga me räägime päris eluolu kordadest. Need on konkreetsed näited elust enesest missugused siis tegelikult seal töökeskkonna s võivad tekkida. Ja mul on väga hea meel tutvustada meie tänaseid arutelus osalejaid Helen Tonks</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="117.48" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 1:57–1:58</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">on.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="118.08" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 1:58–3:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere. Töövaidluskomisjoni juhataja. Tööinspektsioonis. Tervist. Heli Raidvee. Tere. Kes on tööõiguse ekspert ja lektor. --- Ja Kaido Padar, kes on Tallinna linna transpordi juhatuse liige. Ta vastutab ettevõtte eest, sest et väga palju inimesi, umbes kaks tuhat. No vot. Ja. Teeksin sellise lühikese konkreetse sissejuhatuse, et, et kui selle paneeli peal kiri on, et kas töötaja on alati nõrgem osapool, siis võib-olla alustaks sellest, et küsiks lihtsalt teilt kõigilt, et kui paljudel teil töötajana on tekkinud oma karjääris selliseid olukordi, kus on tekkinud, puhkenud mingisugune konflikt töötaja , tööandjaga. Võite käega täiesti näidata, et ütleme, et vähem kui ühel kaheksandikul, ma arvan, siin kuulajatest. Väga huvitav, kas olete valmis jagama ka, mis see, mis see küsimus oli? On meil mikrofoni näiteks, jagada. Et võib-olla, et saaks nagu hooga käima, et üks praktiline näide siit kuulajate seast</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="197.12" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 3:17–3:54</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mul on küll väga vana kogemus. Kaheksakümnendatest. See vist oli üheksakümmend kaheksa. Aeg oli raske ja, ja meil oli tegemist sellise alustava koolitusfirmaga ja ei läinud väga hästi, kõik olid kõikidele võlgu ja siis lihtsalt ühel päeval teatati, et me oleme kõik vallandatud. Ilma igasuguste hüvitiste, igasuguste paragrahvideta ja noh, mina siis ei olnud sellega nõus. Nii et ma natuke seisin enda eest, võiks siis öelda.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="233.72" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:54–5:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Absoluutselt väga praktiline olukord elust enesest, mis võib juhtuda. Ma tahan öelda, et siin ees on veel kohti, kes seisavad seal tagapool, võtke julgelt istet. Ja ütlen kohe ära ka, et teil kõigil on võimalus selles arutelus osaleda. Kas tõstes kätt, võite sekkuda või siis kui te kasutate neid QR-koode, mis siin kohe ekraanile tulevad ja mis on ka telgi siseseintel, et kui te seal telef oniga pilti teete sellest QR-koodist, siis te jõuate ühte sellisesse keskkonda nagu s lido ja seal on võimalik täiesti. Väga lihtsal moel oma küsimust kirja panna ja loodetavasti jõuame ka kõik küsimused aru telus osalejatelt küsida. Heli, miks me sellisel moel üleüldse räägime sellel teemal, et, et, et kas töötaja on alati nõrgem pool, et kui praktiline küsimus see tegelikult on, et ma saan aru, et selle pealkirja selles peitub nagu ridade vahel selline, noh, mingi häälestus, eelhä älestus, et, et kuidas see tegelikult praktilises elus välja näeb. Kui tihti on selliseid olukordi, kus üks väike inimene nii-öelda jutumärkides võib suure ettevõtte juhid ikkagi väga räbalasse olukorda panna?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="319.4" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:19–5:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No ma kõigepealt vastaks esimesele küsimusele, et siin oli kolm küsimust, aga et kas tõde on alati nõrgem osapool? Jah, teadusest tulenevalt Riigikohtu selgitus, tõuseme püsti, lähme laiali, vastatud Aga et nüüd, et kui tihti tuleb ette seda, et kas nüüd on nõrgem osapool on ju, ma ä kki räägin oma esimese loo soojenduseks ära? Mis see riigikohtu lahend nagu. Nõrgem osapool.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="344.08" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:44–5:47</span></span><span class="segment-text">Et põhimõtteliselt riigikohtunikud leidsid, et see on faktiliselt nii, et.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="347.4" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:47–5:57</span></span><span class="segment-text">Töö suhtes on töötaja nõrgem osapool ja vajab seaduse kaitset. See on nii-öelda tööõigus üles ehitatud ja, ja nii on ka Riigikohtu otsus.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="356.72" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:57–6:05</span></span><span class="segment-text">Ja nüüd, et seda nii-öelda kaalukaussi natukene kallutada töö, töötaja kasuks, siis tule vad mängu seadused.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="365.12" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 6:05–6:49</span></span><span class="segment-text">Jah, sest me oleme kokku leppinud, et lisake Ford seal kusagil tuhat kaheksasada plus s on ju, sest töötan kapitaliühik on ja läks aega natuke edasi, me leidsime, et tööta ja peab seda kapitaliühikut peab kaitsma, et ta võimalikult kaua kasumit toodaks ja ma kse maksaks onju, ehk siis ja siis me leppisime kokku ühtselt Euroopas, me kaitseme a laealisi, me kaitseme rasedaid, me kaitseme puuetega, puuetega isikud tulid hiljem, et aga me kaitseme töö suhtes töötajat, et oleks võimalikult kaua terve ja astuks sealt tervelt välja, et siis me tõmbame kollased-punased jooned maha, ütleme tööaeg võib olla üldiselt nelikümmend tundi nädalas, ta peab teadma, mis ta teeb, teda tuleb instrueerida , ta tuleb võõrale territooriumile. Nii et ta ongi, päriselt ongi nõrgem osapool jah.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="408.56" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:49–6:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kuidas teile tundub, Kaido, praktikas ka on nii, et ikkagi tajute nagu seda ülekaalu</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="416.64" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:57–8:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma olen umbes kakskümmend viis aastat inimesi juhtinud ja, ja tegelikult on maailma hästi palju muutunud vahepeal. Et inimesed on kindlasti hästi palju teadlikumaks muutunud, aga ma arvan ka tegelikult ühiskond on reeglid rohkem paika pannud. Ma võib-olla esimese näite ka, me leppisime jälle kokku, me tegelikult saime eelmine aasta samal ajal umbes samas kohas kokku ja. See on juba selline väike traditsioon. Ei no siis öeldi, et tulge tagasi, jube äge on ju, noh nüüd, kuidas see nüüd nagu la tti siis ära madalamale paneb davai, hakkame päris lugusid rääkima. Esimene lugu on see, et, et me noh, mina, mul sai kolm aastat täis Delt juhina ja, ja , ja noh, mul käib iga üle päeva käis mõni bussijuht, käis seal, ütles, et teate kus , keskastme juhib meid, meid piinavad ja kiusavad, et ma ei saa sellist graafikut, ma ei saa siis arsti juurde minna, ma ei saa siis seda teha. Vaatasime sisse, jõudis ka sellele naisterahva lauale hästi palju case&#x27;e, tänaseks ei jõua enam väga palju, võib-olla üks tuleb, no võib-olla kaks aastas, meil on kahe tuhande inimese. Ja. Ja hakkasime vaatama, et milles nagu asi on ja päriselt oligi nii, et kuna sellest kahe tuhandest on tuhat viissada umbes sõidukijuhid, siis iga grupijuht või osakonna juht vaataski natuke oma nurga alt. Tänaseks on kehtestatud reeglid, me kutsume kvali-, me ei ütle, et need on karistamis kriteeriumid, need on kvaliteedikriteeriumid, kui me ütleme, et kuidas sa käitud, kui sa oled hommikul kogemata tulnud väikse lõhnaga tööle. Neid on meil viie kuuga tulnud nelikümmend juhtumit olnud, aasta tagasi oli neid üheksa kümmend kaheksa.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="517.12" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:37–8:44</span></span><span class="segment-text">Üheksakümmend kaheksa. Oota, kuus, kümme bussijuhti Tallinnasse mõtleb, et väike sihuke vine on okei hommiku</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="523.68" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 8:44–9:32</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">l. Ei, see ei ole, ta ei saagi, ta peab puhuma enne, kui ta läheb, aga siis ta läks möö da sealt, siis ta tuli, ütles juba ei mind kiusatakse, ma unustasin ära, et kuidas see võimalik on ja täna reeglid on ja täna on paigas. Nii et ma tahan nagu seda poolt öelda, et, et kui sul on hästi palju sellist. Üheõlbalist tööd, nagu ma niimoodi natuke halvasti öelda, siis hästi palju aitab seal see, et kui sa paned mingisugused kriteeriumid paika ja sa käitud hästi inimlikult. Ja kui see on probleem täna juhi poolt vaadates, siis sa tunnistad seda, keerad selle juhtumi tagasi ja, ja sul on tegelikult pool mure murtud, nii et alati sellist lihtsa t mängureeglid, mida sa pead vaatama iga aasta korra parandama, see alati aitab nagu elu sul lihtsamaks teha ja siis nad advokaatidele vähem maksma.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="572.44" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 9:32–10:10</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Maksumaksja raha. Vaatasin täna hommikul tööinspektsiooni aastaraamatust järele, et aastas on nüüd suur usjärgus kaks pool tuhat töövaidlusavaldust ja, ja, ja see rahasumma, mida siis kokku nõutakse, on kuskil kaheksateist pool miljonit eurot. See ei tähenda seda, et see kõik välja mõistetakse, eks ju, teie seal otsustate, kelle l on õigus. Aga mida teie oma praktikas näete, et kas töötaja on siis alati nõrgem pool ehk et mis nende asjade sisu enamasti on, kui me räägime sellistest nagu hallidest aladest.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0016" data-start="609.92" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 10:10–10:37</span></span><span class="segment-text">Nojah, ütleme, et töövaidluskomisjon siis on seal keskpõrandal, eks, et meie peaksime siis tegema selle otsuse täiesti nagu neutraalselt, vaadates siis kõikidele asjadele otsa, et mida töötaja on teinud, mida tööandja on teinud ja tõepoolest neid vaidlusi iseenesest on kuskil kaks tuhat viissada kolm tuhat ja meid on kokku kaheksa, kes neid lahendab üle Eesti, nii et igaüks saab lahendada seal üle kolmesaja asja aastas.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="636.84" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 10:37–10:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ristsõnu ei pea ostmagi.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0018" data-start="638.12" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 10:38–11:09</span></span><span class="segment-text">Ristsõnu tõesti ei pea ostma jah, et igav meil ei ole, et elu on üsna-üsna värvikas. Aga kui nüüd öelda, et kas töötaja on, on alati nõrgem pool seaduse vaates ilmselt on , aga ma ütlen ka alati seda, et tegelikkuses ka tööandjal on piisavalt seadusevaates võimalusi oma positsiooni kindlustada. Et ei saa alati öelda seda, et, et kõik võimalused ja, ja hoovad on, on alati töötaja</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
