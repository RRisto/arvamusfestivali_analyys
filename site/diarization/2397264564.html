überkaitse to etu meil vaja selleks, et andmeid kaitsta. Ja see oli kõigepealt võttis teema üle sotsiaalministeerium, kaks tuhat viisteist, kuusteist, seitseteist või mis iganes, kui õpetaja teadlikumalt ka küberturvalisusest. Ja siis me koostöös Riiaga Eesti Perearstide Selts, kõigil ka niisugused baasturbeme etmed, mis räägiti läbikassaga ja meile pandi mingit isegi mingit rahanu mbrit tagasi ja teie see perearstide teenuse lepinguga ja need me siis hakkasime, hakkasime rakendama ja siis tuli siis laua peal küberturvalisuse seadus , siis tuli sotsiaalministeeriumis meile vaidluste otsus, et me nagu ei lähe selle seaduse alla, vaid meile tehakse valdkonna spetsiifilised reeglid, mida siis juhib sotsiaalministeerium ja sellest me siis elasime ja tegelastega koolitati siis. Nii ja siis tuli, siis tuli see langes meie peale ja millest me ei saanud aru, mis lämmatas meie tegevust osas me ei osanud mitte kuskilt nagu pihta hakata ja paljud kulutasid väga palju raha selleks või ei osanud seda üldse teha, siis tuli see järelevalve, järelevalve oli väga karm ja, ja perearstide meeleolu umbes üsna oluliselt. Et enamus perearste niisugused keskealised on pensioniealised ja kui nad on pensioni ealised, siis nad ei hakka ülemääraselt nõudeid nõudeid endale võtma, mis neid nii palju unustab. Ja siis me istusime üle laua taga ja teise laua taga jätsime sama asjadest aru meile nagu neid lihtsamaid nõudeid ja ma olen väga tänulik, et kui nüüd te küsite kaugel me sellega oleme, kui nüüd arutame kõik need oleme nüüd siin aasta ni jõudnud ennem ära rakendama, siis ajalugu on selline, et kõigil midagi nagu on, mõ ned rakendavad siiani neid baasturge meetmeid, teised on natuke kallimad, odavama raha eest ära rakendanud endale litsi ja kolmandat on see kodus ühesõnaga, et olukord on selline nagu selline asi, et aga meil on nagu mingisugune plaan, mida me nagu praegu</span></button>

        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
</body>
</html>
