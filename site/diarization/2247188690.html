    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.04" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:11–3:23</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mikrofonid on sees, aeg on sealmaal, et alustame tööelus järjekordset väga huvitav at arutelu ja pealkiri intrigeeris mind nii, et ma hüüdsin modere erimisele kohe ja ehk siis mitte lihtsalt, mis on kiusamine või et kas on kiusamine või millal on kiusamine, vaid et kas kõik on kiusamine. Ja seda fenomeni me siin täna püüame lahata, mul on väga toredad ja pädevad aruteluka aslased, hea meel tutvustada Mittendorf ehk siis näete siit ka Tervise Arengu Institu udi poole pealt ja, ja aitab meil vaadata just seda nii-öelda kiusamise noh, si su ja mõju vaimse tervise poole pealt. Siis on Kaili Rätsep, meie juriidiline nõustaja ja erinevate siis hagide, vaidluste ja, ja õigusliku poole asjatundja. Meil on Lülisimaste, kes esindab tööandja poolt siis, aga ka töötaja poolt Eesti Energia praegu töökohaks ja meil on Tarmo Kase, kes esindab juhti ja samuti, kuidas sa väga hästi ütlesid, sa võid ennast ka niiviisi täna tutvustada. Et juht ja, ja samuti praktik tööelust ja mina ise samuti pea kolmkümmend aastat per sonalijuhina töötanud ja praegu viimastel aastatel üha enam tegev sellises rollis nagu töölepitaja või töökoha lepitusi läbi viimas. Ja, ja kuna see väga sageli sisaldab ka seda töökoha kiusu või töökiusu teemat, siis mul on väga hea meel siin teistega ja, ja kuulajatega seda arutleda, et millised on meie vaated sellele olukorrale praegu ja kas ja milliseid uusi huvitavaid aspekte me leiame juurde. Aga kõigepealt me siin, me siin ikkagi nii-öelda teeme. Teeme veidi selgemaks seda ainest, milles me täna rääkima hakkame. Ja, ja me keskendume siis töökiusule, mitte lihtsalt konfliktidele, inimeste vahel, vaid eelkõige ikkagi meeskond, juhtimine, organisatsioon, inimene selles keskkonnas, kus ja millal siis tekib see tunne või see ülekohtu tunnetamine, et on kiusamine, ke da kiusatakse, millisel moel. Aga kas me tunnetame õigesti, et see on juba jõudnud selliseks ühiskondlikult tähtsa ks teemaks, siis iga minu kaaskõneleja annab siin natukene trendi va adet oma valdkonna pealt, et kõigepealt alustame Airi sinust, et terviseuuringu insti tuut, kas te teete uuringuid ja mida näitab see selline vaimse tervise seisukord ül diselt, kui me nüüd vaatame mingisugust viimast, noh, ma ei tea, sa oskad ise öelda, mitut aastat oskate hinnata, kas see on süvenev trend, et inimesed tunnevad ennast töö kohal kiusatuna?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="202.88" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:23–4:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tervise Arengu Instituudis otseselt ei usu uuringuid sellest vaatenurgast üksinda ei ole teinud, et aga kui me räägime Eesti rahvastiku terviseuuringust, vaimse tervise uuri ngust, vaimse tervise, ka sellest inimarengu aruandest, siis me loomulikult näeme , et ärevus, selline tööalane ärevus, tööalane surve, töökohal on nagu kasva vas trendis, ehk siis nagu selline, nagu üldiselt vaimse te rvise probleemid, mured, kuidas selle kohta öelda, on väga tõsine probleem. On selgelt probleem. Et kius, vaimse tervise häired kandub.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="257.08" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:17–4:24</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Selge. Kaili, kuidas on meie õiguspraktikaga, kas sina näed inimesi kaebamas?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="264.12" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:24–5:49</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja ütleme siis nii, et tegelikult sellist ametlikku töökiusu statistikat minu teada ka ei ole, aga varasemalt ma töötasin töövaidluskomisjoni juhatajana, siis ma puutusin ikkagi selliste vaidlustega pidevalt kokku, kus töötajad tõid siis kas põhiargumendi või kõrval argumendina välja selle, et nad on tundnud ennast kiusatuna. See muti praegu siis advokaadina töötades on ka meil kliente siis, keda esindame või siis ka nõustame samas samades küsimustes. Et noh, tõenäoliselt selle nagu just töövaidluste koha pealt ongi see eripära, et kõik töösuhted on töötajate jaoks hästi emotsionaalsed, isiklikud, et kui juba me räägime sellest, et minnakse töölt ära siis erakorraliselt või siis ka tööandja lõpetab erako rraliselt töölepingu, siis ikkagi on seal sees see solvumise moment ja hakatakse siis ka meenutama ja esile tooma, rõhutama neid selliseid nüansse, mis on siis töötajatel olnud töökiusuna tõlgendatavad. Kindlasti see on märgatav ja, ja seda tuleb ette. Aga muidugi nüüd konkreetselt kohtuvaidlustest või siis ka töövaidluskomisjoni otsus test, selliselt, kus nagu konkreetselt tuvastatakse töökihus, neid on ikka väga üksi kuid, aga see teema on väga aktuaalne.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="348.8" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 5:49–6:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Hari, me oleme sinuga mitu puude soola koos ära söönud Eesti personalivaldkonnas, et alustasime aastakümneid varem. Kuidas sina tunnetad, mis, mis personali juhtimises on muutunud, kui me peame silmas just seda inimeste tundlikkust?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="365.64" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 6:06–7:39</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No eks uued põlvkonnad, mis peale tulevad, on hoopis teistsuguse vaatega ja tegelikult noh, me siin omavahel oleme arutanud, et töökius on kogu aeg olnud. Lihtsalt teda ei ole defineeritud, inimesed ei ole endal seda teadvustanud ja ei olnud ka selline tava, et ma toon nüüd selle töökiusu teema välja ja tegelikult ma olen nagu Kailiga nõus, et töövaidlustes on hakanud nagu trendina levima, et pigem kui on mingi sugune probleem, siis seda tahetakse ka töökiusuga siduda, kuigi võib-olla sisu ei ole gi. Ja need, kes päriselt on need töökiusatavad, need ei julge tulla välja selle teemaga , et personalijuhid on taga, tavaliselt need inimesed, kelle juurde tullakse, kui us aldus on olemas. Aga noh, mina olen näiteks isegi suurorganisatsioonides mõelnud selle peale, et kui noh , meil on tegelikult hästi nagu selline tavapärane ametiühingud, siis tegelikult võiks olla töö juures tööpsühholoogid, kes on ise ka töötajad, kes tunnetavad töötajat parem ini ja neid usaldatakse rohkem, sest noh, personaliinitöötaja esindajad, eks ju. Aga abi on otsitud mulle erinevates organisatsioonides on see teema olnud tegelikult väga teadlikult sees. Et ta on seotud hästi palju vaimse tervisega ja, ja noh, eks teadus inimestel kogu aeg areneb. Aga lihtsalt see töökiusu defineerimine, millest me täna juttu teeme, et see on hästi vajalik, et inimeste teadvusesse viia, mis asi see töökius on tegelikult. Või mis ta ei ole.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="459.08" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:39–7:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mis ta ei ole jah ja Tarmo, kuidas juht tunnetab?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="464.04" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:44–10:10</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma siis ütlen selle ära, et tere, mina olen Tarmo ja ma olen töökiusaja. Ma arvan, et nii võib öelda iga juht enam-vähem. Sellepärast, et juhina sul on see natukene sisse kirjutatud, et ma eeldan, et inimesed käivad tööl ja ma eeldan, et nad teevad tööd. Aga kõik ei saa sellest niimoodi aru, et mõni ei arva, et saab tagumiktundide eest raha ja, ja mõni kuidagi teistmoodi üldse mõistab. Ja siis, kui tekivad mingisugused arusaamatused selle koha pealt või mis iganes, siis asi väga nagu omada töö kiusamise ilminguid. Aga, aga kuna ma olen nagu juhtunud alates kahekümne esimesest eluaastast, ma sain kuna gi ja selle jooksul on pikk areng olnud ja ise nagu liikunud ja ainult. Et selle kohta räägin kõvemini. Et mina arvan, et see on viimasel ajal moodsa, moodsad. Eesti suurima panga juhtkonna liikmetega. Et rääkisin ühe Eesti suurima panga juhtkonna liikmetega, ma küsisin, kuidas teil on pangas töökiusuga. Ja kuidas teie seda näete. Ja, ja hästi huvitav, nagu, nagu, nagu, nagu asi toodi välja, et see on see uue gene ratsioon, kes on nagu rohkem nagu hea ühiskonna lapsed, rohkem pehmemate väärtuste lapse d, rohkem nagu märkavad sellist asja võib-olla ja oskavad märgata, et, et see asi võib -olla, kus see alguse saab. Et see asi saab alguse tegelikult juba koolist, võib-olla, et meie seas on kindlasti kuskil õpetajad, me tunneme õpetajaid. Ja minu arust on täna kõige niisuguse kiusatavam seltskond, ma olen sellega täiesti nõu s nende pangainimestega on õpetajad, kes saavad töökiusamist laste vanemate poolt. Ja kui lapsevanemad tunnetavad, annavad lastele sellise tugeva õiguse tunde juba nagu väikesest saati ja kui nad ühel hetkel jõuavad nüüd meile tööjõuturule ja ma arvan, et ka nendega tööle. Ja täna on nagu Eestis selline huvitav olukord, kus sul on nagu tööl võib-olla kolme erineva generatsiooni inimesed ehk et vanaisa, isa ja laps, selliseid asju tuleb ette ja nad kõik vajavad erinevat lähenemist ja kõik on erinevate ajad kasvanud erinevate väärtushinnangute, väärtusruumidega, siis seal on nagu nii palju konflikte juba sisse kirjutatud.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="609.64" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 10:10–12:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga jah. Ma mõtlesin, et ma selle tutvusringi lõpus teen nagu reegleid selgeks, et, et, et me saame siin täna kõik rääkida ja me väga nii-öelda palume, et ka, et ka nii-öelda pub liku hulgas, kui keegi tunneb, et tal on sõna sõna sekka öelda, siis seda teeks. Ja, ja minu kui moderaatori ainus õigus tegelikult on tagada see, et kõikide arvamused jõuavad nii-öelda pildile ja, ja see, et, et keegi jällegi ei tee sellest võib-olla oma sellist nagu isiklikku kõnetooli, et arutelu üks väärtus on see, et kõnelejad ja, ja sellised nii-öelda arvamused põrgatavad üksteist üsna nii-öelda ruttu, siis on meil tore, siis on teil põnev kuulata ja seepärast, kui mulle tundub, et, et nii-öelda kellegi üks sõnavõtt, ta võib selle saada uuesti, läheb natuke liiga pikaks, siis on mul siin selline väikene kellukene, mis ma seda eelistan. Aga muid reegleid väga meil tegelikult täna ei olegi, et enne kui me nüüd defineerima aume seda, seda kiusu teemat, siis mul on võib-olla nüüd õige küsimus pöörduda publiku sse, küsida, kas meil täna on ka neid inimesi siin, kes, kes otsivad mingile enda kon kreetse tööküsimuse või konteksti lahendust, et tahate võib- olla näiteid tuua, tahate võib-olla siin peegeldada asjatundjatega. Igal juhul, kui teil veel sellist mõtet ei ole, siis julgustan, et kui teil on, siis see on väga õige koht, kus üsna anonüümselt seda teha saab, eks ole. Ja loomulikult, kui teil on arvamusi, siis aitab meid. Annika sealt mikrofoniga ja käib ja annab teile sõna, nii et tõstke julge kätt ja, ja , ja võtke, võtke arutelust osa. Me lubasime, et me katsume selle töökiusuga kuidagi ära raamistada. Et tänapäeval ju vabas ühiskonnas vabad valikud, kõik me oleme õigustatud omama emotsioone, tundeid, kaitsma oma õigusi. Nüüd katsume siin raamistada, mida me antud arutelus tegelikult nagu töökiusuks ei peaks Ma arvan, et võib-olla teeks seda läbi negatiivi, ehk siis ütleks, et seda ei ole tea tud nii-öelda tõepoolest seaduse poolt keelatud tegevused töökohal või juhtimises, nagu näiteks diskrimineerimine, eks ole.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="761.12" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 12:41–14:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja no ma arvan, tänase arutelu kontekstis me pigem seda diskrimineerimisele päris ei laienda, sest diskrimineerimine on siis hoopis midagi muud ja palju olulisem ja me ei saa öelda vähem olulisem, rohkem. Aga siiski diskrimineerimine juba vaidlustes tähendab seda, et seal on ka pööratud tõ endamiskoormis ja, ja see on hoopis midagi muud, et tänases kontekstis see töö kius on siiski selline olukord, kus siis keegi, kes on töö suhtes näiteks jõupositsioonil pikaajalisel süstemaatilisel, nii-öelda kiusab, alandab alavääristab teist poolt ja see teine pool siis ei ole suu teline ennast kaitsma, et ta ei saa seda teha, et ta on nõrgemas positsioonis või ta kardab või, või on mis iganes muud põhjused. Aga ta kannatab selle all. Et aga just selline nagu pikaajaline süstematiseeritud käitumine, pigem on see tööki us- , mitte siis ühekordsed konfliktid või kord hääletõstmine koosolekul või töötaja hoiatamine või temale selgitamine, et sinu tööleping lõpetatakse ära, kui sa sellist tegevust jätkad. Sellised ühekordsed konfliktid mitte siis, vähemalt minu hinnangul.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent

          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
