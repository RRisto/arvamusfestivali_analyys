<button type="button" class="segment-card needs-review" data-segment-id="segment-0102" data-start="5334.6" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 88:55–90:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See on päris selline trikiga küsimus, et. Kuna ma sellele otseselt niimoodi vastata ei oska, et mida ma teile soovitaks, siis ma lihtsalt reflektreeriks korra veel selle peale, et kas me peame välja valima ühe või kaks või kolm teemat, et see jäi mind mulle väga kripeldama. Et olles ise olnud nende arutelude juures, kui tulised need olid, kui kriitilised nad tegelikult kõik on siis see valik on juba päris verine. Et sealt on kõvasti --- nagu nurki maha võetud. Et et kui me, kui meil oleks mingisugunegi lootus, et näiteks noh, ühte de valimistega me valime ühe ja läheme, paneme kõik sellele ühele kaardile ja mingi asi liigub natuke edasi, siis võib-olla meil oleks südant seda teha. Aga, aga kuna päris paljud teemad kultuurivaldkonnas on maa ja taeva vahel juba päris pikalt, siis nende valikute tegemine on sü dame-vere hinnaga käib. Vot ja ma olen ka väga uhke, et lõpuks viskan soojendusdressi maha, mul on siin T -särk seljas, et, et loodan samamoodi, et oleme ühtsed, aga vot seda küll ei julge lubada, et me ainult ühe teema nüüd siin lipule tõstame ja sellega ainult lõ puni läheme, et küllap te peate meid välja kannatama mitme teemaga.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0103" data-start="5444.04" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 90:44–92:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No see oligi vihje nüüd praegu kultuuritahe koos olemiste ja koosolekute raames toimu nud aruteludele, sest kui meid on nii palju laua taga, mis siis pretsedent, siis tuleb teha kompromisse ja kõigile meile endale ka need kompromissid ei, ei ole meeldinud, aga mis parata, nii see on. Koostööl on oma hind. Ma tänan kõiki teid täiesti teistsuguse tavapärasest paneeli, paneeli eest. Enamus küsimusi jäi arutamata, aga väga olulised küsimused said arutatud meil kultuuri valdkonnas on selline komme, et kuna meil raha ju on vähe või pole üldse, siis me ma ksame töötasu naturas, nii et teid ootab kõiki kultuuritahte T-särk. Juhul kui te seda soovite peale ei suru näitlejate liidu esimees Reimo juba läks nende särkide suunas. Nii et võite tema poole pöörduda ja, ja nüüd kahjuks enam seda aega ei ole, et publiku käest veel küsimusi küsida. Aga kuna tegemist on ju nii poliitikas kui ka loomevaldkonnas tõeliste staaridega, siis kõik on nad lihtsalt leitavad siis jätkuküsimused on ilmselt teretulnud siis personaal selt. Aga suurimad tänud nii publikule kui ka teile.</span></button></div>
  </main>
  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
