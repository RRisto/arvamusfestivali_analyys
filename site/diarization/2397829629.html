    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.04" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:11–1:45</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Lugupeetud publikum, meil on täna usu küsimus, usu küsimus on isegi see, et kas see on ikka täna midagi toimub või ei toimu. Toimub küll. Ilma usuta me elada ei saa, ma ei mõtle siin mitte ainult religiooni, vaid üldse, kui inimesel usku ei ole, ta ei usu ei homsesse päeva, ei minevikku, ei sõpradesse, ei pere sse, ei üldse mitte millessegi. No siis jääb üle küsida ainult, et kas on ikka nii väga inimloomaga tegemist, ehkki me edikud võib-olla ütleksid, et ilmselt on küll, sest vastab kõikidele tunnustele, vähemalt välistele. Tore, aga meil on täna kolm külalist, kutse oli saadetud ka juutidele, neil on sabad täna ja budistid ütlesid, et neil on nii palju te gemist kogu aeg, et lihtsalt ei ole kahjuks võimalik tulla. Budistidel teadupärast on põhi noh, selline doktriin seisneb selles, et naudime päeva , võtame hetkest, mis seal võtta on ja selles mõttes võib-olla ei taheta seda la sta minna. Tore, aga sissejuhatuseks võib-olla teeme niimoodi, et igaüks tutvustab kolmest küla lisest iseennast hakkame siitsamast Urmas Viilmast pihta P aides kuulevad? Mina kuulen, meie kuuleme, me kuuleme siin igal juhul.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="104.8" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 1:45–2:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii et, nii et olge hea, Urmas Viilmast alustame. Nimi juba kõlanud, mina olen Urmas Viilma. Täna võib-olla siin kontekstis ei olegi neid ametit kõige olulisemad, võib-olla siis lihtsalt, kui me räägime niimoodi erinevate uskumuste religioonideüleselt, siis mina esindan täna siin grupis, võiks siis öelda kristlasi. Aga noh, amet luteri kiriku juht ja Eesti Kirikute Nõukogu president ühtlasi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="137.16" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:17–2:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et mina olen Aivar Loopalu, esindan siis Eesti mosleme ja üldse ei ole minu a met kuidagi usuga seotud, ma olen IT-mees.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="156.24" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 2:36–4:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Karmo Kalda ja mina siis olen Karmo. Olen Vranti raamatu lugeja, seda olnud juba viimased vähemalt kakskümmend viis aastat vist täna siin siis esindan Orantia raamatu lugejaid ja pean mainima, et kuna meil mingeid dogmasid ei ole, et siis, siis ma, noh, esinda n küll Ronanti raamatu lugejaid, kuid, kuid siiski oma mõtteid, mida on, on kujundanud kindlasti Urantia raamat kui keegi teine minu asemel siin oleks, siis kindlasti räägi ks ta või avaldaks mingeid hoopis teisi mõtteid ja ja see oleks, oleks ka väga hea. Kui räägit- , rääkida uskudest, et siis enamasti arvatakse, et et neid uske siin maailma s on noh, selliseid peamisi võiks üle lugeda ühe kahe käe sõrmedel, siis mina arvan , et tegelikult on religioone täpselt nii palju, kui on maailmas inimesi. Sest igal inimesel on taevas isaga harukordne kon takt ja, ja sealt see religioon siis tulebki. Et me kõik oleme erinevad.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="241.08" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:01–5:07</span></span><span class="segment-text">Jah Oskar Loorits muide oma ühes raamatus Eesti Eesti us unditest kirjutas niimoodi, et et kui Setu käest küsida, mida tema usub, siis tema lihtsalt ütleb, et tema usub. Ja kui küsida, mida tema usub, siis hakkab ta looma meeleküllaseid pilte sellest, kuidas kõik peaks olema ja kuidas kõik on hästi ja kuidas siiamaani ei ole midagi olnud nii nagu parasjagu setule tundub. Ja tema lihtsalt usub filosofeerimine või mingi üldistamine sünteesimine, analüüsimine ei ole kahjuks setu kõige tugevam külg. Me katsume siin kuidagimoodi oma jutuga ühele poole saada, ehk ehkki see on noh, natukene keeruline, ta tõotab tulla. Aga hakkame ristiusu kirikus pihta. Mis roll on ristiusu kirikul praegu ühiskonnas? On ta, on ta mingisugune ühendaja või on ta mingisugune alternatiiv kõigele muule või</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="306.68" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 5:07–8:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">, või mis ta on? Kui me räägime Eesti kontekstis, siis, siis siis saab asjal küsimusele vastata natukene teistmoodi kui, kui võib-olla globaalsel tasandil ehk siis mis on ristiusu roll. Ma arvan, et kõik suured maailmareligioonid tahavad esindada inimest tema te rvikuna võin sellise holistlikus vaates ehk siis inimene kui tervik, tema elu kui te rvik kogu tema elukaar sünnist või isegi sünnieelsest ajast ja, ja, ja surmajärgsesse aega. Ja küsimus ei ole mitte ainult, et me esindame ühte religiooni, vaid me krist lastena räägime inimeste elust, aga ma usun, et annan mikrofoni üle täpselt sama , sama rolli täidab täidab ju islam. Nüüd kõikide nende religioonide või suuremate maailmavaadete roll hakkab väga palju ka mõjutama konteksti ja kontekst samamoodi ka seda religiooni ennast , et kui me tuleme nüüd uuesti Eesti konteksti tagasi, siis Eesti inimese jaoks on tõ enäoliselt kristluse osa kultuurist, aga see on juba nii loomulik osa ristiusk inimeste kultuurist, et nad enam ei erista, mis osa nende kultuurist on seotud tingimata krist lusega. See, et noh, sa ütlesid, et juutidel on täna sabat. Millegipärast on meie seadustes kirjas, et puhkepäev on ikkagi pühapäev. Ehk siis keegi enam ei seo seda, et me pühapäeval reeglina on meil puhkepäev ja meie ka riigipühad on seotud endiselt kristlike suures osas kristlike pühadega. Me tähistame, me elame, ega Eesti inimene elab selles kristlikus kultuurirütmis, ilm a et ta enam seostaks seda tingimata kristlusega. Aga noh, ma ei tea, kui tuleks ettepanek, muudame püha, pühapäevaks, ma ei tea, siis nelja päeva kuna kuskil on seesama Loorits on kirjutanud kunagi, et eestlased käisid neljapäeval tähistasid, tähistasid, ma ei tea siis oma, oma puhkepäeva ma ei ole kind el, et Eesti ühiskonnas inimesed valmis oleksid neljapäeva hakkama pühapäevana või vaba päevana tähistama, ehk siis see, see kultuur kristluse roll on, on, on olla osaliselt nagu Eesti kontekstis, kus me oleme kristlusega tuhat aastat kokku puutunud, on osa olla meie vereringest juba, nii et teda nagu lahutada ja filtreerida sealt välja on võimalik nagu ainult väga kontsentreeritult ehk siis need, kes juba käivad pühapäev iti kirikus, siis nemad on kristlased, aga tegelikult me elame ikkagi kristlikus kult uuriruumis, paraku kui me läheme pisut lõuna poole, siis täpselt sama juttu me võiks ime kuulata, kuulda näiteks noh, ütleme moslemite suust, et nende jaoks on, on islam kuskil nõndanimetatud Araabia riikides on nagu osa nende vereringest ja see on kultuuri line küsimus juba paljuski, filtreerida välja on, on, ma arvan, päris keeruline. Teadvustama peaks, ehk siis õpetama meid asju peaks, inimesed võiksid teada, kustkoha st nende juured tulevad. Sellepärast oleks õpetamine oluline, aga lõpuks valib inimene ise oma oma usu.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="523.96" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 8:44–9:01</span></span><span class="segment-text">Aga samas on see usk, usk on ikkagi selle DNA tasemel ikkagi juba sees, näiteks praegu stes olukordades, kus mitmel pool maailmas käib sõda ja mitte asjata ei öelda, et ka evikutes ateistid puuduvad, siis lööb see kuidagi välja.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="540.8" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 9:01–11:08</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No kui, kui see nüüd on vestlus endiselt minuga, et ma veel mikrofoni edasi. Läheme kohe siit edasi ehk siis tegelikult antropoloogid, kes tingimata ei pea ise olema ühegi konkreetse religiooni järgijad, antropoloogid on üldiselt ju täheldanud, et kui et inimene on nii-öelda ladina keelt kasutades homoreligioossus ehk siis religioosne inimene loomupäraselt. Ehk siis kui lasta inimesel loomupäraselt mingis keskkonnas kasvada, on see siis džun gel või, või Lasnamäe või Annelinn Tartus, siis ta loomulikult kas vades kasvab religioosseks, mitte ateistiks. Ainult et see religioon, mis temas on, ei pruugi olla ei islam, kristlus, budism, vaid vaid kui ta ei ole mõjutatud, siis ta kasvab ikkagi religioosseks, sest ka ateism on paljuski mõjutuse tulemus. Ta kasvab religioosseks, aga ta kasvabki selliseks nagu enamasti eestlane on, ehk siis teda ei ole mõjutatud koolis usundiõpetust ei ole, ta ei kasva ateistiks, Eesti ateist ide arv Eestis viimaste küsitluste järgi on väiksem kui väga paljudes Euroopa riikide s. Ehk siis ta kasvab religioosseks, aga see religioon ei ole selline, mida ta oskaks määra tleda. Ta ei oska määratleda, kas ma olen kristlane, kas ma olen midagi muud. Ta teeb ise endale selline homemater religion või, või kodukolde jumal. Ta paneb sinna ise inglit, ta võtab igalt poolt need komponendid, mis talle meeldivad , inglid, kristallid, kummitused, vaimud, astroloogia ja ta teeb endale selle religi ooni. Ehk siis loomupäraselt inimene on paraku religioosne. Ja, ja, ja siis hakkab kontekst mõjutama, Eesti kontekst on see, et meil ei ole mõju tusi näiteks koolis. Inimesed kasvavad religioosseks, aga kui nende käest küsitakse mõnel küsitlusel, kes sa oled, siis ta ei oska öelda, kes ta on. Siis ta ütleb, ma olen eestlane, nii et tegelikult on peaaegu et eestlus meil nagu re ligioosne tunnistus. Nii naljakas kui see ka ei ole.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="668.2" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 11:08–11:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No nii, islami kohta, mis roll on islamil ühiskonnas?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="674.08" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 11:14–13:04</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Samamoodi tuleks nagu eristada, kas siis räägime globaalsel tasemel või Eesti taseme l Eestis on islam suht uus, kuigi juba Liivi sõja ajal tulid esimesed tatarlased Eestis se. Aga eestlaste mõttes võib-olla paarkümmend aastat oleme siin eksisteerinud moslemite na. Aga kui võtame lõunariigid, Araabia riigid, Malaisia, sellised kohad, seal on see osa juba kultuurist. Et ongi sellest, et millisele tasemel me räägime, et kui räägime usu tas tasemel, siis on islam nagu moraalne kompass. Et mis nagu mõtestab inimese olemuse nii tema sisemuse kui ka jumala vahel ja nii materiaalse elu kui ka religioosse elu vahel. Et ta on selline tasakaalus tasakaalustav jõud. Kui võtame Eesti Eesti kontekstis islam on võib-olla õpetaja ro llis, et kasvõi see, et ma siia nüüd kohale tulin teile rääkima islami vaatenurgast on see, et ma nagu üritan võib-olla harida sellest teemast natukene. Et eestlase jaoks on islam ja moslemid suht uus teema, võib-olla vaatad vaadatakse telekast nagu, mis toimub kusagil Palestiinas või Süürias või mis iganes, aga see ei ole nagu Eesti, et siis ongi, et Eesti kontekst on täiesti teistsugune, võib-olla sellest, mis võib olla inimese jaoks, kes on elu, kogu elu elanud moslemina.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="783.52" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 13:04–13:09</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii Karmo Valda, orant ja raamat suhteliselt vähetuntud.</span></button>

  <script>
