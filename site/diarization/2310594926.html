    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.96" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 0:11–4:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, enam mitte hommikust, tere keskpäeva, tere tulemast hariduse tulevikualale. Minu nimi on Annika Räim ja olen tänase ja homse hariduse tulevikuala ku raator, mis on tähendanud minu jaoks juba päris pikki kuid selles teemas praktiliselt igapäevast olemist ehk alates talvekuudest, kus sai erinevate inimestega arut ledes paika pandud need teemad, mis võiksid olla hariduse tulevikualal aruteluks järe lduste tegemiseks, ettepanekute tegemiseks edasi kuni siis selleni, et meil on tänase ja homse peale kokku kuus. Mina usun küll, et väga huvitavat vestlusringi teemadel nagu täna näiteks, et mis on Eesti hariduse eesmärk, millega me kohe alustame võib-olla, kus ei ole kõige lihtsam jõuda väga praktiliste väideteni, Indrek raputab pead, mis ongi hea, et ma usun, et poole teist tunni pärast me suudame vastupidist tõestada. Ja ma väga ootaks teid siia alale täna kogu päeva jooksul ja ka homme. Et lühidalt siis ette ette siis tutvustades võib-olla kellaaegu ma igaks juhuks peast ei ütle, sest võin äkki midagi valesti öelda, aga et me jah, hetkel alustame siis esimese vestlusringiga teemal, mis on Eesti hariduse eesmärk. Seejärel täna räägime me sellest, mis on koolijuhi roll koolijuhi ootused oma tööandjale ja, ja tööandja ootused koolijuhile, et seda järgmist vestlusringi ju hib siis Eesti koolijuhtide ühenduse juhatuse esimees Urmo Uiboleht ja täna viimane ve stlusring siin saab olema sellisel teemal nagu Eesti koolivõrk või me laiendame haridus võrguks, et selline üsna-üsna laetud teema, mis siis tänase päeva lõpetab ja homme on meil juttu siin Eestis tehtavast teadusest ja meie võimekusest ja võimalustest seda raha ks teha. Me räägime homme siin sellest, mida siis T-hüpe reaalselt on tähendanud ja tähendamas , siia võib täiesti tulla, näete. Ma annan teile padja ka. Ja, ja, ja homse siis päeva viimane asi, mis siin toimu b, vot siia see on nagu noh, ma olen kohe silm näeb eriliselt särama, kuigi kõik need teemad on tõesti hästi südamelähedased, on selline pisut teises formaadis kui, kui ve stlusringid ehk me teeme sellise õpetaja potentsiaalse rolli ja profiili töötoa , mida juhendavad Eesti Tuleviku-uuringute Instituudi inimesed. Meil on neli tõenäolist stsenaariumi, mida nad siis ette annavad koos tööriistadega ja osalejad on oodatud siis nende stsenaariumite põhiselt neid rolle kujundama. Nii et loodan, et te leiate põhjus siin alal olla täna ja homme, võib-olla terve päeva , aga loomulikult ka, kui on teisi huvipakkuvaid sündmusi paralleelselt, siis täiesti arusaadavalt ära käia, aga ikka jälle tagasi tulla. Ma juba väga pikalt räägin, aga see on mu esimene võimalus täna, mis ma veel soovin kindlasti mainida, on see, et hariduse tulevikualal nii nagu ka majanduse tulevikuala. Meil on selline kindel midagi kukkus. Kindel eesmärk ka, et ideed, küsimused, kui soovite ülesanded, mis nendest diskussioonidest ja homsest töötoast tekivad ja millel on selline sisukus ja väärtus neid edastada homme hilisõhtul toimuvale siis poliitikute debatile, siis need siit-sinna liiguvad, nii et teie kaasamõtlemine, teie julged küsimused, ideed enne koha like omavalitsuste valimisi on kindlasti sellel alal neil kahel päeval väga oodatud, kaasa arvatud siis kohe alustaval vestlusringil on, on see võimalus siin kaasa rääkida , kõlada ja julgelt välja öelda. Nii et meil on siis esimene poolteist tundi, läheb käima. Veel üks tehniline asi, et minu käes on mikrofon, minu kolleeg targa tuleviku fondist , Triin on ka sellise publiku mikrofoniga, et kui Indrek annab vahepeal märku meile, et publikule sõna anda, siis, siis meie otsime pilguga siis teid, kes te annate meil e omakorda märku, et te seda teha soovite. Et tehke seda siis julgelt. Aga aitäh meie esimese vestlusringi osalejatele juba ette, aitäh osalejatele siin teise l pool ja lähme teele.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="287.84" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 4:48–7:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Lähme teele, tervist. Kõigepealt, kuidas siin siis asjad käima hakkavad, teeme väikse sissejuhatuse avaringi , siis annan sõna ka teile, publikule arutlemiseks omavahel. Ja siis seda, mille üle te arutlete, proovime siin natukene mõtestada, reflekteerida selle üle ja, ja siis läheme, proovime teemasse veel erinevate tahkude pealt süvitsi minna. Kõigepealt, miks see teema üldse? Selles mõttes, et mis on Eesti hariduse eesmärk, see on, ma arvan, arvamusfestivali põhi teema, et see arutelu sellel teemal käib siin tegelikult homse õhtuni, mitte täna ke lla kaheni. Ja ma ise olen mänginud seda mängu aastaid juba arvamusfestivalil, et ma olen käinud eri lavadel ja püüdnud ja, ja korjanud üles ideid, mõtteid, mida siis inimesed ütlevad , et mis peaks koolis tehtama või mis peaks hariduse sihid olema. Ja soovitan mängige seda mängu, et see on, see on päris hirmutav mäng või selle tule mus on päris hirmus, et ma võin mõned aastad siin kirjutasin, käisin märkmikuga ringi , kirjutasin ka ideid üles. Et näiteks kooli sihiks peab kindlasti olema lahendada ettevõtlikkuse, integratsiooni probleeme, ülekaalulisuse, vaimse tervise ja sõltuvusega seotud väljakutseid. Kool peab õpetama rahatarkust kujundama liikumisharjumusi, tegelema vähiannetusega k liima ja keskkonnaprobleemidega, kujundama tugevat kodanikuühiskonda, õpetama programm eerimist, kasvatama enesekindlust, lugemis- ja ligimesearmastust, harima lapsevane, laste vanemaid. Muidugi kõike traditsiooniliselt akadeemilist ja, ja seda näidet ma olen tihti toonud minu vaieldamatud lemmiknäide, ma ikkagi julgen seda veel kord tuua, et see nüüd ei ole Arvamusfestivalilt, aga ühest ühest Eesti meediaväljaandest, et Eesti metallitöö stuse probleemid algavad põhikoolist. Ja veel enam lisan siia siis juurde väljavõtte ühe hiljuti loetud ühe kooli põhimäär usest, päriselt Eestis toimiv kool, ma igaks juhuks ei ütle, mis kool see on ja selle kooli põhimääruse järgi on selle kooli esmane eesmärk võimaldada õpilastel täita kooli kohustust. Nii et metsikult segane teema ja meie peamine siht siin ongi küsida, et kuidas selles mässus üldse peaks orienteeruma. Et kuidas üldse haridussüsteemile sihte seada, kel, keda peaks kuulama, missugused otsus te langetamise protsessid peaks olema. Aga veel enam, et kuidas ka öelda või kuidas otsustada, et mida mitte sihiks võtta. Paar aastat tagasi ma pidasin siin Arvamusfestivaliga ühe arutelu teemal, et mida kooli s mitte õppida ja ütlen ausalt, et kõik teemad, mis välja pakuti, leidsid kõvasti ka vastuhääli. Et ühtegi otsust vastu võtta ei õnnestunud, mida koolis ei peaks õppima. Nii et see on see kontekst, milles me siin täna toimetama hakkame. Ja mina püüan kõike seda vaos hoida, aga meiega on siis arutlemas siin Margit Sutrop , Riigikogu liige ja jätkuvalt ka Tartu Ülikooli praktilise filosoofia professor ja Tartu Ülikooli eetikakeskuse juhataja.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="475.6" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:56–7:58</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere kõigile. Tere kõigile.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="478.24" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 7:58–8:51</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Siis Kordeli ja Paap, Pelgulinna riigigümnaasiumi, nüüd siis kohe kaheteistkümnenda klassi õpilane ja, ja muidu koolisvärina aktivist ja eestvedaja. Ja Taavi Kotka, ettevõtja, tüdrukute nüüd vist mitte ainult tüdrukute tehnoloogiakooli Unicon Squad&#x27;i eestvedaja ja ka näiteks aasta hariduse sõber kaks tuhat kakskümmend neli Tere. Ja ma alustaks, kuigi me oleme hariduse tulevikualal, et ma alustaks minevikku vaata misega ja, ja küsiks alustuseks Margitilt. Et kuidas seni üldse meil Eestis haridussüsteemile sihte on seatud, et kes neid sihte on seadnud, meil on suured strateegilised dokumendid olemas. Kuidas, kuidas see protsess toimi- , toimunud on?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="530.68" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 8:51–12:22</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja aitäh selle küsimuse eest ja mõnedes nendes ettevõtmistes oleme me ka koos osalenud samamoodi ka hariduse eesmärkidest rääkinud ja mina pean ütlema, et ma olen, võib-olla nii viimased viisteist aastat või kakskümmend aastat neid suuri dokumente koostanud ja see on olnud tegelikult väga huvitav, et kõlab küll nagu kunagi loeti kokku, et mitu t dokumenti siis täidetakse ja need ei olnud väga palju. Aga ma siiski tõeliselt ise usun, et sellised suured arutelud ja ka väga abstraktsete filosoofiliste teemade jaoks nagu, mis on üldse hariduse eesmärk ja mis on õnn ja ma arvan, et need ei ole üldse mõttetud arutelud ja sellisel tasemel on võimalik ka tea tavas mõttes konsensust saada, kus me lahku läheme, on see, et mida siis tegelikult tegema peaks. Ja kuidas peaks tegema selleks, et nende eesmärkideni jõuda ja nüüd just siin on küsimus selles, et kuidas need strateegilised dokumendid on sündinud, no üks väga huvitav do kument, millele me võib-olla ka täna siin natuke viitame, oli kui kaks tuhat neliteist hakati koostama haridus niisugust elukestva õppe strateegiat, mis kahe tuhande kahekümne ndaks pidi valmis saama ja nüüd see uuem on kuni kaks tuhat kolmkümmend viis. Aga ma tooksin välja sealt võib-olla ühe kõige nagu suurema nagu muutuse, sest enne seda oli õpi Eesti ja palju erinevaid selliseid dokumente, mis ka väga hästi sellest haridus est rääkisid. Aga üks nagu suurem muutus oli see, et öeldi, et hariduses me ei peaks ütlema, kuidas me jõuame nii-öelda tööturuni ja kuidas me jõuame ühelt astmelt teiseni, et enne oli tõesti nii nagu sa ütlesid, seda metallitööstuse näidet, et see vahe oli see, et enne öeldi, et laps läheb lasteaeda, ta peab olema nii-öelda laste ja küps siis kooliküps , sealt edasi liikuma tööelu ja siis pensionile ja siis sureb. Et see oli alati nagu eesmärgistatud järgmisele tasemele ettevalmistamiseks. Aga mis see siis on, milleks me tegelikult ette valmistame ja, ja ma arvan, et lapse d elavad praegu ka, nad elavad koolis käies, see ei ole ainult see, et nad kogu aeg a stuvad ellu ja teevad midagi ja see suurem muutus oli see, et me hakkasime rohkem nagu mõtlema selle peale, mida tähendab elada ja mida sul vaja on selleks, et elada ja et see elu ongi see, et sul on mitmed erinevad rollid ja sa pead nendes rollides hakkama saama, elu kogu aeg muutub, aga see kool või see õppimine peab toetama seda hakkamasa amist oma rollis, olgu siis nii-öelda isiklikus elus oma sõbraga toimetamiseks, oma ar mastuse leidmiseks, oma elukaaslase leidmiseks. Sa pead mingi töö leidma, mis sind aitaks õnnelikumaks teha ja sa pead ühiskonnaelus osalema ja mida kool saab teha, mitte õppeainete kaupa, vaid just nimelt, kuidas ta saab seda toetada, et sa sel, nendes selles raskes ja keerulises elus, kus nii nagu sa ke nasti ütlesid, neid väljakutseid on järjest rohkem, kõik vaatavad hariduse, kõik vaata vad kooli poole, et kuidas sa selleks siis nagu valmistud, olgu mis iganes kriisidest me räägime, aga ka igapäevaselt, kuidas sa õpid üldse, ma ei tea, apelsini koorima, pu delit avama, puhast vett hoidma ja nii edasi ja ma arvan, et selle mõtlemisega me oleme jõudnud nagu kaugemale, et see ongi hariduse eesmärk, aidata noorel inimesel siis nii -öelda ellu sattununa leida see enda koht selles elus kuidagi selle pusletükina suhe studa, selle maailmaga, mis su ümber on ja muidugi seda maailma muuta ja muuta pigem niisuguses heas suunas, et ka teistel oleks selles maailmas õnnelik elada ja, ja hea elu ja ka kõik see raskus algab siis, kui me hakkame nüüd seda teostama, kuidas me seda siis teeme?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="742.16" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 12:22–12:45</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No aga jätame siis korra need dokumendid ja, ja küsime, mis, mis siis päriselus toimu b, et kord eil ja õpilasena sa võib-olla ei ole neid ilusaid strateegilisi dokumente kunagi lugenud ja võib-olla, võib-olla on see olnud mõistlik valik. Aga mis, mis päriselt toimub, mis sulle tundub, et, et mis on Eesti hariduse sihid, mida Eesti kool annab? Millega Eesti kool tegeleb?</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0081" data-start="5120" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 85:20–85:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Üks konkreetne asi. Ei, mina usun sellesse, et kus viga need laitasid, mine ei aita, et kui sa mind ikkagi väga häirib, siis mine tee ära, et ära käi siin Paides tuututamas, vaid pane käed kü lge ja tee ära ikkagi, et mina olen seda usku. Või siis tee mõlemat jah?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0082" data-start="5136" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 85:36–85:58</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii, kord veel ja. Mul veel käib jah. Kiirelt ja konkreetselt, ma nüüd ei tea. Ma nõustun täiesti, et võiks lihtsalt minna ja teha ja võiks võimestada noori rohkem , et neil on ka võimalus minna ja teha. Et julgustada hästi palju.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0083" data-start="5157.84" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 85:58–86:56</span></span><span class="segment-text">No no tundub, et siin on täielik konsensus, sest mina oleks mõelnud ka ütlema, et mõtle kõigepealt, mida mina saan teha ära, et, et see asi muutuks ja tee seda, olgu see mingi väike asi, õpetada ühte tundi paremini või õppida seda paremini või, või nii-öelda vii a ellu. Aga nagu oma valdkonna juurde uuesti tuleksin, et ma selle märksõnana viskaks, et pa lun paneme rohkem nagu jõudu ja leiame need inimesed, kes tegelevad didakti kaga, kes õpetavad teistmoodi, sest muidu, kui me lihtsalt paneme juurde kõiki neid asju , mida pead oskama või teadma, siis meie lapsed lihtsalt tajuvad kokku. Et, et sel, see on nagu see, kus öelda, et natukene vähem, aga paremini ja mõelda kogu selle hariduse asja juures mitte, mida nii palju, vaid kuidas. Et see sõna oleks, kuidas, kuidas seda teha, kuidas seda teostada, mida me minu meele st oleme juba kokku leppinud ja mida me teame, seal on suur ühisosa, aga kuidas on tegelikult alles diskussiooni küsimus?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0084" data-start="5215.76" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 86:56–87:06</span></span><span class="segment-text">Aga no kui puudutamise tulemus on see, et me läheme teeme, et siis on ju vist hästi tu ututatud, Taavi. Jah, nii et aitäh teile kõigile kaasa mõtlemast ja lähme siis teeme.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0085" data-start="5225.64" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 87:06–87:18</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Suur tänu kõikidele.</span></button></div>
  </main>
  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
