    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.64" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:12–0:49</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Meie panilist on siis Dmitri Jagunin, kes on ka meie noorteühenduses ja praegu õpib Tallinna Ülikoolis sotsiaaltööd, siis on meiega Heidi Maiberg, kes on siseministeeriumi nõuni k ja Gregor Taul, kes on semiootik ja kunstiteadlane. Alustame siuksest nagu sissejuhatavamast küsimusest, et isiklik või siis töö alane kogemus äärmuslusega, et võib-olla igaüks annaks siis sellise.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="49.36" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:49–2:02</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Võtan, võtan alustamise enda peale. Mina olen igapäevaselt äärmuslusega tegelenud aastast kaks tuhat kaheksateist. Siis mitte küll praktiseerinud, aga uurinud, et õppisin Tartu ülikooli us uteaduskonna religiooniuuringuid ja mind huvitas siis religioosne äärmuslus. Ja ühel konverentsil läksin õppejõu juurde, ütlesin, tahaks uurida radikaliseerumist , siis õppejõud muidugi lükkas kohvi ja juba ütles, et mul on vaja hiljaks, aga et kõik uurivad radifitseerumist, et keegi ei uuri tee radikaliseerumist. Ja siis ma otsisingi magistritöö teemat ja siis ma heas mõttes harmusin sellesse teema sse. Sest radikaliseerumine, armastus on maailmas väga tõsine, vastik probleem. Me täpselt ei tea, kuidas siis neid inimesi, kes on juba radikaliseerunud tagasi tuu a, aga, aga, aga on viise ja, ja siis ma olengi uurinud, et kuidas seda tehakse ja kuidas siis praktikud aru saavad, et nende. Ja nüüd viimane aasta olen siis siseministeeriumis aidanud kolleegidega Eesti, eest ve dada radikaliseerimise ennetamise tegevuskava koostamist.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="121.92" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 2:02–2:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma korraks räägin siia jällegi, et meil tegelikult selle arutelu jooksul me ikka pastakaid, et te saate mingeid, kui talle jääb mingi mõte nagu silma, et palun kirjuta ge need sinna kleepsede peale ja siis arutelu lõpus mul on siin tahvlid ja me saame kõik need mõtted nagu ühtedele tahvidele kokku panna, et siis need nii-öelda mõtted või lahendus ed või mingid tegutsemisplaanid, mis meil on, me võime need ühte kohta kokku tuua.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="160.08" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 2:40–3:29</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mina olen äärmustusega puutunud rohkem isiklikul määral, kuna olen varasemast east interneti kasutanud ISIS, vaadanud seda, kuidas mu klassikaaslased ja sõbrad hakkavad rohkem parempoolsele või vasakpoolsele poliitilisele identiteedile minna. Olen aastal kaks tuhat kaheksateist, kaks tuhat üheksateist uurinud ka isiklikult seda , kuidas käitub samal ajal ka inglisekeelne YouTube ja kui palju parempool set kontekti seal on, kui palju vähemuste vihkamist seal on.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="208.72" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_10</strong><span class="timestamp">▶ 3:29–3:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="213.2" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:33–6:12</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh kutsumast. Minul on niimoodi, et ma pean tunnistama, et mul on endal olnud vähe kokkupuudet parem äärmuslusega. Ma olen olnud ka läbi elu väga laisk internetikasutaja. Ja enamasti ei ole jaksanud meili lugemisest kaugemale minna, vaid lihtsalt aeg veeta internetis. Nii et olen kuidagi kas vaistlikult säästnud ennast. Ja nüüd teine aspekt see, et me ehitasime siin nädal aega tudengitega lava ja ma siis küsisin tudengitelt ja meil oli siin tudengeid Eestist, Lätist, Leedust, Soo mest, Singapurist, Jaapanist, Nigeeriast. Kuidas neil on? Ja oma üllatuseks sain ma samamoodi vastuseid, et neil ei ole kokkupuuteid või siis tuli neid urgitseda, mis minu mõtted viisid kohe selleni, et okei, et ilmselt on siin defineerimise küsimus ja me kohe läheme sinna, et kus on sellise igapäevase ras sismi või vaenu ja siis päris äärmusluse piir. Aga kui sa lubad, ma natukene pikendan oma vastust, et siis ma nagu püüdsin mõelda sellest vaatepunktist, kus ma ise olen olnud sellises punktis, kus ma olen astunud paar sammu ise, kas siis vaenukõne suuna, vaenukõne suunas või ise nagu ennast tabanud, et ma okei siit paar sammu veel edasi, ma olen midagi imelikku, aga ma tooksin mõ ned punktid välja, mille pärast mul on piinlik tagantjärele. Aga kui ma olin nii kümme, üheteistaastane, olime jalgpallimeeskonnaga Tartus ja me ööbisime ühes kristlikus koolis ja meid siis poiss ajas väga närvi see, et seal olid kristlik ikonograafia, mis me siis tegime, me sodisime terve kooli haa kristi täis. Isa aru andmata endale, miks me seda teeme, aga väga tugev vaistlik tunne oli see, et niimoodi me teeme paha. Ja, ja see on midagi, mis on jäänud kummitama, aga teiselt poolt ka mingisugune empa atia harjutus, et väga palju, mida me näeme paremäärmuslikku selliste ikonograafiat, et ta ei pruugi olla nagu tähendusväli on niivõrd lai. Aga ma tooksin veel ühe väikese koha, mis nagu paar nädalat tagasi laulupeole. Ma juba liiga pikalt, ma tulen selle juurde tagasi, aga see on näide.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="372" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:12–6:22</span></span><span class="segment-text">Lähmegi siis äkki selle definitsiooni juurde, et mida me üldse äärmuslusena selles aru telus mõistame või siis ka täpsemalt, et millest endast ette kujutada näiteks paremal</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="382.4" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 6:22–7:49</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">sus. Nii teadusmaailmas kui ka riikide vahel ei ole sellistes definitsioonides kokku lepi tud, ehk siis mis asi on terrorism või äärmuslus või radikaliseerumine, et siis iga tead usartikkel nagu vähemalt kolm lehekülge nagu pühendab siis sellele, kuidas siis mingi asi on defineeritud. Mina ise pean ka osa testi praktikud lähtuvad siis teadlasele, kelle pereni on Berge r. Arusaamast, et, et on meie grupp ja on nende grupp, on ju ka see, kes meie oleme ja siis need, need nemad ja need nemad, see välis- on siis ohuks meile, ohu ks meie eksistentsile. Ja nüüd see sõltub hästi konkreetselt kontekstist, et kus me paikneme, et mis ohtu nad pakuvad, et kas nad, kas nad on ohuks meie kultuuri kestmisele, kas nad on ohuks meie keele keskmisele, kas nad on ohuks meie rassi kestmisele ja, ja äärmuslus ongi, ongi siis see arusaam või ideoloogia, kus seda teist, neid, neid võibki siis va enata sealhulgas see teod võivad viia vägivallani, et sa võidki neid hävitada. Et sinu õnn ja eksistents sõltub sellest, et, et, et need, neid, neid peaks hävitama, et need, see teine grupp siis, siis mõjutab sind nii hullusti, et, et siis sa peaksid neid hävituma.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="468.52" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:49–7:54</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">On kellelgi veel midagi lisada sellele küsimusele?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="473.92" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:54–9:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma arvan, et see meie, nemad, see on hästi-hästi sügaval inimese sees. Ja, ja see meie nemad toimib, nii on ju negatiivselt, ohtlikul tasandil, aga ka vaist likult see võib olla väga oluline või noh. Ma ei tea, inimene tunneb ära, et see, millega ta vastu seisab silmitsi ees, ei ole inimene , see on midagi muud, see on tont, see on loom ja, ja see ongi meie nagu käitumine, parem -vasak üleval all, et see on, aga mis on minu jaoks väga huvitav näiteks, kuidas Dima sissejuhatuses selle juures, et on nagu teaduslik definitsioon, aga samas Dima sina ilmselt tunned nagu selgrooga kui sa internetis käid, sa tunned ära, kus see, kus see piir läheb Ja seal on teinekord väga keeruline nagu näpuga peale panna, et kirjeldada, et see oli see roll, see oli teine olukord, aga nagu kultuuri situatsioonis, kui sa oled selles kontekstis, sa tunned selle väga ära. Mina, mina omalt poolt lisaksin, et nagu ma arvan, äärmusluse defineerimisel on oluline see mingisugune selline vertikaalne topograafia. Et äärmusluse sees nähakse mingisuguseid selliseid olulisi suunasid üleval all suunas ja teine veel, et mis ma välja tooksin, on see sõna ise ütleb nagu ta on äär es. Aga et tal ei ole seda keskpunkti ka, et kahel pool on mingisugused kuristikud ja, ja see on, see on see oht vist, et kus see nagu äärmuslik see saar kätte saada veel.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="569.76" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 9:30–10:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Võib-olla täiendaks lihtsalt, et äärmuslus kui sellist terrorismi on alati olnud. Et see ei ole mingisugune uus nähtus, et võib-olla kui sa ise koged, et oh issand nii palju oma ümber, siis et see on midagi, mida sa koged, aga kui me vaatame ajaloos, siis loomariigi ajal oli äärmuslus olnud vägivaldselt äärmuslust, šingis-Kaan kasutas ter rorismi noh, sõna terrorismi üleüldse tuleb suurest Prantsuse revolutsioonist, et selles mõttes, et see on midagi, mis inimkonnaga on alati kaasas käinud ja mis on just see, kui me räägime, et mis on see oht, et, et siis ennekõike me peame vaatama, et, et et see oht on vägivaldsus, et see viha, mis võib viia vägivallani ükskõik mis liiki vä givallast me siis räägime.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="618.52" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 10:19–11:19</span></span><span class="segment-text">Ma tahaks lisada. Ma tahaks lisada ka selle interneti definitsiooni nagu pipeline. See ongi see põhjus, kuidas väga paljud noored satuvad ka internetti nagu parem äärmus lusesse. Ongi nii, et mingi sotsiaalmeedia algoritm paneb inimest vaatama mingi suht poliitiliselt kesksed kontenti ja siis va ikselt läheb rohkem ja rohkem radikaalsemaks. Ja siis ongi, et nagu kui sa oled see inimene, kes vaatab seda kontenti, sa ei näe ju kuidas see satub nagu rohkem sügavamale. Aga kui sa oled lihtsalt inimene, kes seda väljaspoolt näeb ja sa saad näpuga nä pud peale panna ja näidata, et noh see on rohkem või see on ohtlik, see</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="678.64" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 11:19–11:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">pole ohtlik. Võib-olla mõeldagi, et siis, et kui sa näedki väljaspool, et näiteks su sõber läheb sellise le äärmuslusele teele, et mis, mis sa sel juhul teha üldse saad või kuidas sa saad seda ka nagu noh, kuidas saad neid ohumärke näha.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0014" data-start="698.4" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 11:38–14:22</span></span><span class="segment-text">Võib-olla jah, võtan siit ette. Natuke spikerdan, et britid on päris hea juhendi teinud, et ja see kehtib tegelikult igasuguse äärmuslusega, et äärmuslus sõltub kontekstist ja see on niisugune meie ajal e vastav on ju, ja need erinevad mõtted, need lood, need narratiivid, need on ajas muutu vad. Aga mida siis soovitaksegi, et noh, et mis on võib-olla need märgid, et kui inimene on näha, et on mõne näiteks grupi mõju all, et see on selline potentsiaalne ohumärk. On see siis mingi liikumine, on see siis netis või on see füüsilises, füüsilises elu s. Kui inimesel on väga suur soov millelegi midagi ära teha, et selline nagu väga suur, et ma pean midagi muutma, olukord vajab muutmist ja tema on see, kes peab seda tegema , et see sageli võib olla selline nagu märk, aga noh, ei pruugi, jällegi peab konteks ti vaatama. Sest noh, kõikides noortes on see soov sees ja see ongi väga arusaadav soov. Sotsiaalmeedia puhul, kui näiteks inimene varasemalt ei ole aga tihedalt kasutanud nüüd väga kasutab ja jagabki sellist sisu, muutub, et tahab mingisuguseid sõnumeid, mis h õlmavad viha, kutsuvad üles vihale, et siis see on ka selline suur ohumärk. Aga sageli inimesed, kes radikaliseeruvad, muidugi võib-olla ka neid, kellel on elu väga hästi, kõik on väga korras, aga näiteks need, keda mina olen intervjueerinud või, või kellest praktikutega olen rääkinud, et siis neil ei ole elus väga hästi. Et sellised sisemised kriisid, vaimse tervise kriisid, identiteediga seotud küsimused on midagi, mis võivad kaasaksid nii-öelda punased lipud olla, mida natukene tähele panna Ja noh, nagu ma selle definitsiooni juures välja tõin, siis, et teiste süüdistamine probleem ides, et on probleem ja vot nemad on süüdi ja kui me nad näiteks ära hävitame,
