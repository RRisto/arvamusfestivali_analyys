<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="32.48" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:32–10:26</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast alushariduse alale. Super aplaus. On suur rõõm, et tänu väikse päiksele Eesti Lastehoidude Liidule on täna siin avatud alushariduse ala ja suur tänu, et te olete siia tulnud. Mina olen Maili Liien, mul on väga hea meel viia läbi esimene töötuba, ärge üldse eh matage, et oi jumal töötuba, tulin arvama ja kuulama ja nüüd mingi töötuba, sest või n kohe ette öelda, et see on selline töötuba, kus sa saad teha kõike seda, mida sa mõ nusalt tahad, sa saad ise valida ja sa saad tunda mängimisest rõõmu ja lõbu. Nii et mina teen kõik selleks, et sul oleks väga hea ja mõnus siin olla. Ja kuna minu kätte anti nüüd mikrofon ja on Arvamusfestival, siis enne, kui me lähme töötoa juurde, siis ma tahaks ühte asja arvata. Ma loodan, et ei pane pahaks. Te jõuategi natuke istuda ka ja puhata ja siis tulevad need kõik toredad mängud ja tead site ikka, et tulite liikumismängude alule? Ärge jookske ära, selles mõttes ei juhtu midagi hullu. Sest alushariduses me mitte ei räägi, vaid me teeme, on ju niimoodi jah? Aga ma siis arvaks ühte asja. Üks selline kujutlusmäng. Kujutage ette, kui Eestis kõik inimesed, absoluutselt kõik inimesed, kõige tavalisem inimene tänaval kuni nendeni, kes asjade üle otsustavad, arvaksid päriselt ja südame st, et alusharidus on oluline. Kujutage ette nagu päriselt kohe, nagu nagu saaksid kohe aru südamest, et, et see on päriselt oluline. Kujutate ette jah, kas läheb süda rõõmu täis ja võib-olla kerkivad ka silme ette need hetked, kus on see tunne, et no kuidas nad aru ei saa, no kuidas see niimoodi on. Ja mis siis muutuks, mis oleks teistmoodi. Teistmoodi oleks kindlasti see, et meil oleks väga palju rohkem õnnelikke lapsi ja pere s sionaalsus, et me jätkame. Ja lapsevanematele, kui keegi siin on mõni lapsevanem, siis ma ka hästi hästi ho ian pöialt, et oleks seda jõudu, jaksu, kui tulla lasteaeda, lastehoidu oma lapsega, olla avatud, sõbralik, olla ka siis sõbralik edasi, kui võib-olla see õpetaja, see ei tundugi nagu nii tore, kui ma arvasin. Aga tegelikult nad on kõik südamega inimesed. Nii et kõige olulisem, millest me täna siis hakkame siin rääkima, on see, et me oleks ime ise täiskasvanutena kohal. Et me oleksime siin, et me annaksime enda endast parima. Ja kui nüüd me mäletate ikka jah, töötuba, ikka on niimoodi meeles jah, aga töötuppa ei saa kohe niimoodi hopsti minna, sellepärast et on kindlasti, oli suvi, mäletate? Oli teil suvi vahepeal jah, et suvi ja suvest tööle tuleb tulla väikeste rahulike sa mmudega. Nii et nüüd on niimoodi, et me hakkame tegutsema, alguses teeme sellise asja, et me natukene soojendame ja siis tulevad siia väikesed pesad, kus te saate ise mängida ja toimetada , aga kõigepealt tuleb siis soojendus. Ja miks läbi liikumismängude? Me võtame täna lapse arengus fookusesse just siin töötoas selle keele ja kõne. Esiteks me oleme ju hästi huvitavas ajaloolises kohas alushariduses, meil on toimunud üleminek eestikeelsele õppele, aga see ei ole ainult ju keele mõttes üleminek. Olete nõus, eks ju? See on ju mõtteviis, see on see, mida, mismoodi me asju teeme. Ja, ja kui oluline on see, et me saame aru, mis see tähendab see lapsest lähtumine. Üks kõige hullem asi, mis ma olen kuulnud, andke käega märku, kes on keegi kuulnud, et lapsest lähtumine tähendab seda, et lapsed teevad, mis tahavad, tõstke käsi on vabaka svatus, ainult üks oli kuulnud, issand. Olete kaks inimest jah, et umbes niimoodi, et hommikul tulevad ja teevad, mis tahavad , väga oluline on kokkulepped, piirid. See kõik on väga oluline ja aga kui me nüüd mõtleme selle peale, et kõige olulisem , kui me kohe hakkame mängima, siis kas te olete nõus minuga, et ikkagi oluline on see keskkond, mis lapse ümber on, on
