    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.88" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:11–2:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tervist meie paneel arutelule siis. Teemal tehisintelligentsi keskkonnamõjud. Ja võib kohe ära mainida, et me oleme Vindre alal. Et tuule, tuule, tuul. Tuuleenergia. Ja võib-olla põgusalt enne ka räägin umbes, millest siis juttu tuleb täna. Mina olen tänane moderaator, Maar Richard, ma olen siis Tartu Ülikooli doktorant-geoloogi a ajal. Ja mis me keskkonnamõjudest räägime? Ilmselt me kõik teame, mis on tehisintelligents. Ta on niisugune tore asi, mis sa kirjutad ja siis ta teeb su töö ära. Kahjuks ka tema tahab töö eest midagi ja peamiselt on see energia. Ja energia tootmine on meil niisugune lõputu kadalipp inimkonna jaoks, kus me seda iga vesti aina rohkem peame tootma. Ja täna me rohkem, enam-vähem arutamegi siis, kas on AI jaoks energia tootmine on väär t, seda ja mis on kaasnevad keskkonnamõjud nii vee kasutamise, CO2 kvoodi ja muude infrastruktuuri esi ehitamise mõjud siis eluskeskkonnale. Ja selle jaoks ma nüüd palun tutvustada panelistidel, sest ainult nemad suudavad ennast kõige paremini tutvustada ja küsiks teilt, et siis, kes te olete, millega te tegelete Kuidas see on seotud kas tänase teemaga ja kui tihti teie kasutate AI-d, kas iga päev , iga nädal, mitte kunagi või iga sekund?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="127.04" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:07–3:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii, aga alustaks Madisest, palun. Tere, mina olen Madis Vasser. Ma töötan Tartu Ülikoolis arvutiteaduse instituudis teadurina ja ma olen sellises la boris nagu Loomuliku ja tehisliku mõistuse labor. Kus me uurime tehisharu ja uurime päris haru ja mis neid omavahel ühendab ja, ja mis neid eristab. Ja siis mul on sihuke kõrval edu on vabatahtlik töö on keskkonnaühenduses Eesti rohe line liikumine, kus ma olen energeetika ja kliimateemadega pikalt tegelenud ja need teema d nüüd omavahel hakkavad päris kõvasti põrkuma. Ja ma tööalaselt olen sunnitud kasutama tehisharu. Sagedasti, aga mitte palju. Ma käin teda niimoodi testimas ja torkimas ja siis lähen jälle ära. Et mul on teda otseselt väga vaja ei ole ja ma üritan ja teades seda keskkonna poolt , ma väga ei taha kasutada. Jätame selle praegu nii.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="184.8" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 3:05–4:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Võtan jutujärje üle, tere, mina olen Kaarja Laus, sõbraliku taastuvenergiaettevõtte Sa nly energiakeskuste arendusjuht. Ja ilmselt, miks ma siin olen, sellepärast et muuhulgas üks mu projektidest on risti le planeeritav Baltikumi suurim andmetöötluslinnak. Minu kokkupuude tehisintellekti või erinevate keelemudelitega on selline, et kasutan seda igapäevaselt, iga päevaga piitsutan ja sunnin ennast seda rohkem tegema just selle jaoks, et saada aru, mida sellega tegelikult on võimalik teha. Mis ka väärtust loob, mitte ainult sellist nii-öelda mängimist ja piltide koostamist sellega teha. Iga sekund veel ei kasuta, et agentide rakendamine on asi, mille peale ma tõsiselt olen mõelnud, aga ma ei ole leidnud veel siiamaani ühtegi sellist nii-öelda tegelikult väär tust loovat rakendust, mida ei oleks võimalik väiksema energiakuluga teha, et see oleks jällegi sihuke. Mängimine rohkem, on ju, aga jah, annan sõnajärje üle.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="247.36" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 4:07–5:24</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh Kaarel, tere, minu nimi on Merilin ja mina olen Bisley&#x27;st ja ma olen är iprotsesside juht seal. Mina puutun siis tehisintellektiga kokku üsna nagu füüsilisel tasemel, mis tähendab, et see toimub siis läbi nagu hoonete ja hoonete konteksti on ju, et hooned oma olemu selt on nagu väga suured energiatarbijad, onju. Ja hoone automaatika, mida siis Pisley arendab meie noh, see suurem nagu eesmärk seal ongi see, et koostöös siis nagu tehisintellektiga oleks võimalik seda energia nagu ku lu optimeerida läbi siis ventilatsiooni, küttejuhtimise, läbi nagu rikke tuva stuse kaugelt, nii et see see suur ideaalmaailma plaan on, onju. Minu enda AI kasutus, noh tulenevalt tööst, ma pean ütlema, et ma ikkagi kasutan iga päev. Nagu kui ma mõju peaksin hindama, et ma ei taha nagu öelda, et on nagu negatiivne või positiivne, et minu jaoks AI on pigem nagu võimendi. Et, et ta võimendab midagi nagu, mida ma tahan teha kiiremini või paremini või optime eritult ehk et ma nagu muudan ennast siis läbi selle nagu lihtsalt rohkem nagu efektiivse maks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="323.72" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:24–9:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah. Ja tere. Tere kõigile, minu nimi on Margit Sutrop ja mul on siis väga palju erinevaid mütse. Ma, minu põhitöökoht täna on riigikogus, aga ma olen ka Tartu Ülikooli professor ja tegelen natuke, juhin ühte MTÜ-d, kus ma väga palju AI-d kasutan, et võib-olla nagu selle seletus on see, et, et mul on ta ühelt poolt uurimise objekt, sest ma tegelen AI eeti kaga, sellega, kuidas AI-le anda väärtusi, mis, ütleme, kriitiliselt pigem siis, kuidas arvutiteadlased loodavad seda probleemi lahendada ja mina räägin, et väärtuste asi on väga keeruline, et see nii lihtne ei ole. Aga ma olen ka Eesti tehisintellekti tippkeskuse eetikanõukogu juht ja seal siis rahvus vahelise kuratooriumi kaudu saan anda tagasisidet kõigile Eesti teadusprojektidele, et kuidas seal lood eetikaga on. Ja lõpetasime just juuni lõpuks ka Eesti tiihüppe eetiliste, sotsiaalsete ja juriidi liste riskide analüüsi koos väga interdistsiplinaarse tiimiga, nii et väga põhjalikult vaatasime, mida täna siis AI koolis teeb, et mida tehisarv siis tehisharu, siis haridus es korraldab. Aga võib-olla mõni praktiline siis kasutus, et kuidas ma ise kasutan, et ma kasutan te da palju. Kindlasti keskkonna seisukohalt võib-olla isegi liiga palju. Aga mulle tundub, et nüüd siin tulebki see, mis meie tänane debatt ka on, et kaaluda , mis me sellega siis võidame ja mis me kaotame, sest minu nii-öelda filosoofiline po sitsioon on, et me oleme pluralistid ja erinevad väärtused alati on korraga kaalukaus il ja vaadata siis, mis rohkem kaalub ja mis antud olukorras vähem. Et mida ma sellega teen, et eelkõige ma siis võib-olla ise ütleb ka minu siis peamine kasutus on JetBT mudelid, siis tasulised mudelid, sest nende kva liteet on tõesti väga palju parem ja ta ütleb, et ta on minu mõttepartner ja ma arvan , et see oleks võib-olla kõige täpsem kirjeldus, et ma saan temaga testida oma erinev aid ideid, olgu siis loengute jaoks, kõnede jaoks, raamatute koostamisel või ka mingi te probleemide lahendamisel, analüüside tegemiseks. Et üks selliseid noh, nagu niisuguseid päris nagu ma arvan, kõige asju, millest on vähe m räägitud, aga millest minul on tema puhul kõige rohkem kasu, on see, et ta on super hea konfliktide lahendamisel. Et ta aitab leida, kui tekivad kas erinevad lahkarvamused siis teoreetiliselt, olgu fi losoofiliselt või siis ka päris praktiliselt ka minu näiteks MTÜ juhtimisel, kui mul on kliendid, kes pole rahul millegagi, siis tavaliselt, kui ma räägin nende protesti ära, siis see viis, kuidas ta aitab mul selle nii-öelda kirja vastu formuleerida, see ma ei ole leidnud ühtegi kohta, kus ma seda konflikti ära ei lahenda, just täna hommi kul Euroopa Komisjoni ühes raskes paneelis, kus prantslane ja sakslane olid juba, pi did tunni ajaga asi ära lahendama, aga olid kaheksa tundi juba arutanud ja mina pane elijuhina ei saanud seda enam pealt vaadates, küsisin, mis ma nendega teen, ütlesin mõ lema nii-öelda argumendid, milles nad ei nõustu. Ja see kiri, mis ma mõlemale saatsin, viis lepituseni, nii et ma arvan, et see on üks parimaid asju, aga hästi kiiresti ütleme, et praktilised kasutused, kus ma kindlasti saan temalt abi, on, on erinev tervisenõu olgu oma ema või koera ravimiseks, et mida esmaselt teha, mitte ma ei usalda seda täielikult, aga see on hästi kiire ja nii-öelda aitab ja teine on disainimine. Et suurim kompliment tuli eile, kui arhitektuuribüroo ütles, et nad on valmis mind töö le võtma, et seal mängida koos AI-ga, kuidas erinevaid maju objektid --- siis looduse sse paigutada. Noh nii naljaga, aga, aga mul on halb ruumiline mõtlemine ja temaga koos on võimalik nii tube kujundada, erinevaid maju ehitada kui ka selliseid asju teha, et selles ma olen väga temast vaimustatud iga kord ütlen vau, seda ma varem ei saanud teha.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="557.2" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:17–9:20</span></span><span class="segment-text">Saate veel ühe ühe töö juurde, siis.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="559.76" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 9:20–9:41</span></span><span class="segment-text">Just, et see oli nii-öelda naljaga öeldud, siis minu neljas amet, aga igal juhul oli see kompliment ja, ja, ja tõesti noh, ma näen seda metsikult suurt kasu, et samamoodi ka arhitektuuribüroo ise ütleb, et täna see töö, mis ta ära teeb, ennem oli võib-olla nädalate ja kuude küsimus, nüüd saab seda teha üksikute minutitega ja ma arvan, et see</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="581.32" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:41–10:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">hoiab energiat ka kokku. Nii et meil üldiselt tundub, et kasutame kuni professionaalselt kui eraelus suhteliselt palju AI-d, võib-olla Madis natuke vähem ja natuke nii-öelda eksperimentaalsel eesmä rgil. Aga Madis, võib-olla sinult küsikski nihukest ka nihukest põgusat kokkuvõtet pigem pu blikule just, et millest siis tehisintelligentsi keskkonna mõju tuleb, mis on nõnda viie lausega kõige suuremad mured? Et me saaksime kõigile samale lehele?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="619.32" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 10:19–12:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Viie lausega või? No kuus. No üldiselt, lihtsalt enne, kui ma nüüd viis lauset ütlen lihtsalt see üldine konteks t on äge, tavaliselt räägitaksegi asju niipidi, et räägid kõik need imelised asjad, mida tehisvara suudab teha ja lõppu maini midagi keskkonnast. Et mul on väga hea meel, et me siin teeme tagurpidi, et me räägime kõigepealt sellest keskkonna aspektist ja võib-olla ei jõuagi kaugemale. Sest see on tegelikult oluline, aga ta jääb tihti nagu varju kuhugi. Sest see tundub meile tõesti nagu varjatud, et sa lähed chat&#x27;i pidi veebilehele, seal on sihuke aken, mis ütleb, et noh, mis me nüüd täna ehitame kõik koos. Siis sa trükid sisse ja saad vastuse, põmm olemas läinud. Lähed eluga edasi, aga mis seal taustal toimub, on, on mitu etappi. Tehniliselt, et üldse kogu see teenus oleks saadaval. Keegi peab selle mudeli kusagil treenima, treenimine tähendab siis seda, et sa võtad mõõtmatus koguses andmeid ja söödad nad algoritmile ette, et. Et arvuta sealt need tõenäosused välja või, või seosed erinevate andmepunktide vahel See on sihuke esimene suur samm ja nüüd kogu see info, mis ma annan, on hästi hägune , sellepärast et need ettevõtted, kes treenivad neid mudeleid ja, ja pakuvad neid mu deleid, ei pea ja ka ei avalda, mis see energiakulu on, et kõik see info, mis meil on , on teadustöödest, mis ütlevadki, et noh, me nagu üldiselt umbes arvame, et see kulu on umbes selline, aga me ei tea, sest nad ei ütle pagan, et see on nagu siukene natukene info varjamise läbi nagu on tehtud see diskussioon juba keeruliseks. Aga ütleme, et nii palju kui on teada näiteks siuksed avalikumatest mudelitest on see , et, et kuidas see progressioon on läinud ja see noh, kui me räägime tehisharust siin juba paneelis oli juba esimene küsimus oli, et kes, millist tehisharu kasutab, et on generatiivne tehisharu, see, mis mõtleb sulle uue vastuse välja, paneb sulle selle e -kirja kokku ja ma eeldan, et kas Pisley kasutab lihtsalt masinõpet, kus sa vaatad hästi palju andmeid ja ütled, et pane see aken kinni, siis sul on vähem, vähem energiakulu või teil on ka generatiivne tehisharu, mis paneb ise akna kinni ja lukustab inimesed tuppa, et mis see vaheküsimus.</span></button>

  <script>
    const player = document.getElementById("episode-audio");

    const cards = [...document.querySelectorAll(".segment-card")];

      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;

        cards.forEach((item) => item.classList.toggle("active", item === card));
