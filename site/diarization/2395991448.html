    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.04" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:11–3:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mulle tundub, et kell on vist saanud pool kolm, see tähendab, et me võime alustada järje kordse paneeliga teemal &quot;Töö ei küsi vanust. No kui rääkida tööelust, siis ma pean teile ütlema, et vanus on selline huvitav nähtus , et ühelt poolt ju öeldakse alati, et vanus tööturul ei peaks nagu midagi lugema, aga , aga meil on ikkagi väga palju lugusid inimestes, kes tunnevad, et mina olen mõne töö jaoks liiga noor või liiga vana. Et ühtedel öeldakse, et sul ei ole piisavat kogemust veel, et me ei saa sind sellepärast tööle võtta. Teistele öeldakse jälle, et ah, sa ei sobi meie noorusliku kollektiivi kahjuks, et meil on selline noorte kamp siin ja, ja võib-olla kolmandatele neile ei olnud üldse midagi , et kandideerivad ja kandideerivad, aga vastust kunagi ei tulegi. Seega vanus ei tohiks ju tööelus lugeda, aga millegipärast on nii, et see ikkagi loe b, elu on näidanud, et see loeb, et milles on siis probleem, et kas probleem on tööand jates või on probleem töötajates või on probleem mingites meie eelarvamustes või selles , kuidas tööelu on üldse üles ehitatud. Et ma loodan, et tänase arutelu lõpuks meil ei ole ainult nii palju küsimusi, vaid loo detavasti ka mõned sellised praktilised mõtted, mille me saame oma tööellu kaasa võtta Aga, aga võib-olla nüüd on siis sobiv hetk kohe siin alguses tutvustada ka, et kes meil täna siin laval on, et ma võin alustada iseendast, minu nimi on Birgit Ruunik. Võib-olla mõned teist teavad mind sotsiaalmeediakonto palgajutud eestvedajana, aga meil on laval täna veel neli inimest. No ma hakkan siitpoolt peale, et meiega on Kärt Kinnas, kes on SMIT-ist, tema on pea direktori asetäitja inimeste ja kultuurivaldkonnas. Teeme väikse siukse julgustava aplausi ka, et siis inimesed tunnevad, et nad on ooda tud. Jüri Ross on aktsiaseltsist Infotark büroo maailm. Juhatuse esimees Emerke Sokkenbits, Raudmeedik Estonia juht. Rahumeedik ja Henri Igge tööinspektsioonist, vaimse tervise konsultant. Tere. Ja publik, mul on teile ka üleskutse, et rääkige julgelt kaasa, küsige küsimusi, ava ldage arvamust ja kõige mugavam seda teha on läbi Slido, et kui te skännite seal ekra anil seda QR-koodi, siis saate sinna jätta oma mõtted ja ma luban, et ma vahepeal te lefonist vaatan, mida on sinu küsitud või öeldud ja siis saame arutada sellel teemal koos. Aga, aga alustuseks võib-olla võikski korraks publik tegelikult teie käest küsida natuke kraadida, et mis inimesed siia täna on kokku tulnud kuulama, et teeks sellise väikese käe tõstmise harjutuse, et mina nagu küsin midagi ja siis, kui sa tunned, et sinu kohta see käib, siis anna käega märku. Ja minu esimene küsimus on see, et tõsta käsi, kui sa oled kunagi jätnud tööle kandi deerimata, sest sa arvasid, et vanus võib saada takistuseks. Ma näen siin tagapool ka ikkagi mõned sellised on. Kes on tundnud seda, et on küll tööle kuhugi kandideerinud, aga ta arvab, et vanuse pärast tema ei osutunud valituks. Olgu siis noor või vana või mis iganes. Mõned ikkagi on. No kuna käsi tõusis, siis tundub, et see on nagu teema, mis siiski vajab arutelu, selle jaoks me siia täna tulnud oleme ja hakkame siis kuskilt otsast minema. Esimene küsimus võib-olla ongi näiteks kohe Kärdile, et millal sina nägid viimati sellist olukorda, kus vanus mõjutas tööelus mõnda otsust?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="233.16" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 3:53–4:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere. Las ma nüüd mõtlen, kus vanus mõjutas tööelus otsust? Mul on nagu mitu rolli mille üle arutleda, praegu mul esimesena muidugi torkas pähe kohe mu isiklik laps, eks ju. Mis on ja tegelikult kaks last torkasid kohe pähe, et kes on aktiivselt tööellu sise nemas. Et väga huvitav on nende puhul jälgida, kuidas vanus mõjutab tööellu sisenemist, et. Et vanem poeg lõpetas ülikooli ja ei olnud väga lihtne õpitud erialal saada kohe mingit tööpakkumist. Seetõttu ta tegi ikkagi karjääripöörde ja läks õppima hoopiski õpetajaks, mis on tegelikult</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="290.36" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 4:50–6:22</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga miks ta kohe varem selle peale ei tulnud, et noh, et see on ka nagu siuke õppimis koht temale, eks ju, et ja teine on veel gümnaasiumiõpilane, kes teeb praegu praktika t ja, ja siin ma mõtlen nagu vanuselises mõttes seda, et kui, kuidas me tegelikult nagu mõnes mõttes paneme need noored inimesed ka hästi raamidesse, et tal ju ei ole kogemust. Ja kui ma mõtlen sellele noorele, kes mul praegu seal praktikat käib tegemas, kuidas ta on saanud, ta teeb ajakirjanduspraktikat, ta on saanud valitsuse pressikonverents ist kuni vanglani neid kogemusi seal vahepeal. Et see on üliäge, kuidas teda tegelikult läbi selle praktika tööeluks ette valmis tatakse ja kus ta saab paremini teada siis, või nagu mõelda enda jaoks ka selgemaks mi llist eriala valida tööellu astumiseks. Nii et ma tõin selle hoopis perekondliku näite, aga kui tööellu minna nagu oma tööala se poole pealt, kus vanus on muutunud oluliseks. Vot on jah, praegu on üks aktiivne otsus käsil küll, et üks seitsmekümne ühe aastane kolleeg, kes töötab küll meil paindlikult osakoormusega, soovib nüüd minna pensionile , aga kuidagi ei taha lasta. Vot selline personali otsus on küll kaalumisel jah, et kuidas me saaks talle võimalda da veel rohkem paindlikkus, et ta tahaks tööelus osaleda.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="381.68" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 6:22–6:31</span></span><span class="segment-text">Okei, Jüri, kas on midagi lisada sinule, et kus sina oled märganud seda, et vanus mä ngis mingit rolli siin tööelu juures küll?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="390.76" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:31–6:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No minu jaoks küll ei mängi vanus mingit rolli. Kõige tähtsam on see, mida inimene oskab teha, tema tööoskused ja tema tööarmastus. Need on kaks asja, mille eest võtad inimest tööle, vanus ei puutu asjasse.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="407.76" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 6:48–6:51</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Emeka, kas on sama arvamus?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="411" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 6:51–7:39</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et tegelikult küll sellepärast, et meie ettevõttes on keskmine vanus, kui ma ei eksi, üle neljakümne viie aasta. Noh, kui mina peaksin pensionile jääma, siis ilmselt langeb nii mõnegi aasta, aga, aga tegelikult on ikkagi see kõik, oleneb inimesest endast ja kui, kui väga ta tahab seda tööd teha ja kui väga ta oskab seda tööd teha, kusjuures oskus on noh, nagu ma olen va rem öelnud, on see, et me võtame tööle inimesi suhtumise järgi, oskusi me saame alati õpetada, aga suhtumine on eelkõige nii, et on ta ülikoolist tulnud või on ta pension ielik, tegelik, tegelikult see mind huvitab kõige vähem.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="459.2" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:39–7:50</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Väga õige. Henri, sina oled tööinspektsioonist, kas sul on mõni teine vaade, et võib-olla tegelikult on küll neid vanusega seotud küsimusi laual mitmeidki?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="469.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:50–8:34</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kindlasti. Kõige värskem näide äkki siis eel- või nüüd käimasoleva nädala esmaspäevast, et käisin konsulteerimas ühte noort ettevõtjat ja kaudselt me võime tegelikult tuua selle noor use sisse sellepärast, et ta oli heausklik ja naiivne ja tööalane dokumentatsioon oli siis sobivalt täitmata ja lõppude lõpuks ta siis jõudis töövaidluskomisjoni, sellepärast et ta lihtsalt bürokraatia oli sisse viimata. Et, et võib-olla niimoodi üldistavalt sisse tuua, siis me ei saa tegelikult võtta alati , et, et see noorus või iga on just see peamine põhjus, aga see kindlasti mingisuguse d aluspõhjused meid nendele asjadele panevad.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="513.92" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 8:34–9:14</span></span><span class="segment-text">No, no selge on see, et vanusega seotult on neid, selliseid stereotüüpe liikvel küll , no räägitakse ju sageli sellest, kuidas noored võib-olla ei ole piisavalt kohusetund likud või ei taha vastutust võtta või võib-olla ei tunne üldse tööreegleidki, kas nad õigeks ajaks tööle kohalegi jõuavad. Selliseid jutte liigub ja samamoodi ka vanemate inimeste kohta on stereotüüpe, kuidas võib-olla nad on kuidagi aeglased, ei taha kohaneda, õppida uusi asju, et kui teie kõik saaksite jagada, et mis teie arvate sellised suurimad stereotüübid on, mida nagu mõel dakse ja räägitakse, aga mis võib-olla vastab tõele või ei vasta.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="554.32" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 9:14–11:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ennaku, palun. Mul tuli siin just hiljuti meelde, kui ma olin Eestist ära, et näiteks k lienditeenindaja kohvikus, restoranis, meil ikkagi eeldatakse, et on noor ja ilus ja sihvakas ja ja nii edasi ja nii edasi, aga teine asi on see, et kõik oleneb ju keskkonna st ka. Ütleme sellesse konkreetsesse kohvikusse sa ei lähe nagu bensukasse hot do-i küsima, seal on ikkagi nagu see nautimine ja see ümbruskond ja see atmosfäär ja kõik see on nagu ülioluline ja seal ei ole nagu see, et kiiresti ja kohe ja praegu ja nii edasi, et seal võidakse sulle öelda, et kuule, et mine söö burgerit, kui sul nagu nii kiire on. Et, et kõik oleneb nagu, aga, aga oma ettevõttes ma ikkagi eeldan nagu seda, seda ba lanssi punkt üks ja punkt kaks on see, et ma eeldan, et õpetamine on vastastikune Nooremad õpetavad vanemaid ja vanemad õpetavad nooremaid, et see on, see on nagu täiesti noh niisugune uskumatu sünergia, et, et see ongi, et ja kui vanemad ei häbene, noore mate käest küsida, et kuule, ma ei tea, kuidas ma arvutis seda teen või, või missugu ne Exceli valem selle või teise tulemuse toob. Ja nooremad samas noh, ütleme nii, et kui sa ütled, et meie ajal oli see, millega mu navalget vahtu löödi, niisugune, mida sa käega väntasid ja siis need asjad keerlesid seal otsas. Ja minu käest küsiti elektrit ei olnud või. Et, et noh, et, et tegelikult see elukogemus ja, ja see sünergia on minu jaoks kõige tähtsam, et inimesed peavad kompenseerima üksteist, mitte see, et sul on ainult noor ed ja ilusad või ainult vanad ja koledad ja aeglased ja nii edasi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="665.84" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 11:06–13:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jällegi stereotüüpne mõtlemine, väga ohtlik minu meelest vasika, lehma näitel tahan öelda , et minu ema on minust kiirem. Ma ei saa sinna midagi teha, kui ta ütleb, et, et või ta teeb midagi, noh, ma siis võib -olla nagu loivan kohale, hakkan tegema, tal on juba kõrval seesama asi kaks korda tehtud ja ta on noh, mõnevõrra vanem minust. Et inimesi on väga erinevaid erinevates vanuserühmades ja mulle tundub ka, et me võib -olla tahame nagu väga lahterdada, et mina ei ole kunagi tundnud, et, et see põlvkond, milles mind kirjeldatakse, et see vajab stabiilsust. Et vot see on nüüd mina, eks ju. Et kui ma mõtlen oma, oma elus näiteks, kui ma tööellu läksin, ei olnud Internet tava pärane asi. Kui ma, no ma olin siis kahekümnendates, kolmekümnendates, internet oli täiesti inim õigus igal pool olemas, et kuidas tööelu üldse nagu muutub, on ju, siis tulid nutise admed, igal pool olid nutiseadmed neljakümnendates. Edasi läheme kõrgema vanuse juurde. Ja noh, nüüd on tehisintellekt, et me oleme hoopis teistsuguses maailmas, et ma arvan , et, et siin ei ole nagu haisugi stabiilsusest, et, et elu on ju kogu, meie ühiskond on selle aja jooksul nii palju muutunud ja seega on ka meie tööturg väga palju muutunud. Ja ma olen täiesti nõus ja, ja vaja on mitmekesisust sellel tööturule, mitte nagu la hterdada, et vanad ei saa ja noored ei taha või kuidagi nagu panna kasti raa midesse. Et ühesõnaga mu mõte on, et see stereotüüpides mõtlemine. See on liiga ohtlik meie, meie pisikesele ühiskonnale, et ta on ka majanduslikult oh tlik. Et me ei saa seda endale lubada.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
