    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.56" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 0:11–3:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii tere tulemast kõigile, mul on väga hea meel, et meie Välisministeeriumi ja ÜRO Ü hingu koostöös valminud paneeli on tulnud kuulama nii palju inimesi. Suur aitäh teile. Alustan sellest, et tutvustan meie tänaseid paneliste ja minu paremal käel kõige esimene on Marko Mihkelson, tere tulemast, Eesti Riigikogu väliskomisjoni esimees, siis tema paremal käel on Tiina Intelmann. Tere tulemast, endine suursaadik, Eesti suursaadik ÜRO-s, Euroopa Liidu suur saadik. Libeeria Somaalias ning samuti ka. Ma pean nüüd märkmeid vaatama, sellepärast et üks aspekt läks meelest ära. Ka rahvusvahelise kriminaalkohtu assamblee president, mis on väga oluline, sellepärast et täna meil sellest rahvusvahelisest kriminaalkohtust ka juttu tuleb ja proua Intel manni paremal käel on Sven Mikser, endine kaitse ja välisminister, tänane Eesti saad ik Euroopa Parlamendis. Tema paremal käel on Tiina Pajuste, Tallinna Ülikooli rahvusvahelise õiguse ja julge oleku professor ning lõpetame siis meie tänaste panelistide raundi Kristi Okpaga, kes on täna meiega liitunud, siis aktivisti pädevuses, kuid on eelnevalt olnud MTÜ Mondo siis Lähis-Ida projektide koordinaator ja minu nimi on Gete Trutin. Õppisin Tartu Ülikoolis ajalugu ning oma vabal ajal vean väikest vestlussaadet nimega Orbiit. Aga enne veel, kui me jõuame küsimuste juurde, millele meie panelistid hakkavad vasta ma, siis ma teeksin võib-olla publikuga läbi sellise väikese interak tiivse harjutuse. Ja minu küsimus publikule oleks siis selline: palun tõstke käsi kõrgele. Kui teie arvate, et ÜRO ja tema mehhanismid ei saa neile antud ülesannetega hakkama. Tõstke käsi. Kõrgele, kõrgele, kõrgele, nii, mulle tundub, et enamik on selle väitega nõus ja tõst ke nüüd veel kord käsi kõrgele kõrgele, kui te olete nõus ka sellega, et ÜRO-d olemus likult on vaja. Isegi veel rohkem inimesi on sellega nõus, väga hea, nüüd me saame aru, mis meie rahva arvamus on. Ja liigumegi kohe esimese küsimuse juurde. Mis on siis panelistidele. Jaak Jõerüüt kirjutas aastal kaks tuhat neli, kaks tuhat neli diplomaatias, et ingli skeelne sõnapaar United Nations ehk ühinenud rahvad tähendab erakordselt olulist ühi nemispõhimõtet ja tema sõnul on oluline idee ja pidev liikumine selle idee teostumise suunas. Mitte väline ümbris, milles see idee tuleb. Teisisõnu see, kuidas ühinetakse ehk see organisatsioon, on teisejärguline ja Jõerüü di arvates tehti viga, kui tsiteerin eesti keelde, suruti sisse kalk ja bürokraatlik organisatsiooni lisand. Ja Jõerüüt ütleb, et ühinenud rahvad on täiesti teistsuguse sisu ja tunnetusega. Ja see küsimus on kõigile panelistidele, kes soovib esimesena vastata, see võib, kuidas mõistetakse Eestis ÜRO olemust nii ühiskondlikul tasandil kui ka Eesti diplomaatilise korpuse sees. Kes soovib, see võib avada selle küsimuse vastuste vooru.</span></button>

s ÜRO-ga on edasiviiv ÜRO loomulikult on loodud omas hetkes, ta peegeldab teatud nii-öelda jõudude vahekord a maailmas, teise maailmasõja, teisele maailmasõjale vahetult järgnevatel aastatel ja , ja, ja, ja ta on mõne mõneti oma struktuuridega ajale jalgu jäänud, sest maailm on sellest hetkest läinud edasi ja ÜRO disainiti omal ajal sellisel viisil, et tema tea tud struktuure iseäranis Julgeolekunõukogu oleks väga raske, peaaegu võimatu reformi da. Ja see kindlasti tekitab teatud õigustatud frustratsiooni. Aga, aga noh, me kindlasti üks oskus nagu edasi minna on ka see, et teatud paratamatu te asjadega tuleb kohaneda ja leida siis lahendused mitte, mitte jääda kinni sellesse , et nad võib-olla ei vasta meie, meie kõige kõrgematele ootustele.</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="430.12" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:10–9:15</span></span><span class="segment-text">No ma arvan, et eks Jaagus rääkis ka tema selline kirjanikuhing, et kindlasti võib ju neid narratiive erinevaid lugeda, aga, aga reaalsus on loomulikult see, et tegemist on organisatsiooniga, millega on ühinenud siis absoluutne enamik või kelle liikmeks on võetud, saanud absoluutne enamik maailmas tunnustatud riikidest. Ja, ja eeldada, et kogu maailm astuks ühte jalga sellises organisatsioonis nagu seda siis on ÜRO, on ikkagi väga raske eeldada, et isegi kui Rahvasteliit ei saanud sellega hakkama, siis kuidas on võimalik ette kujutada, et ÜRO, mille asutajaks oli ka Jossi f Stalin, saaks sellega tänases keerulises maailmas hakkama. Aga no nii nagu Tiina ütles, kõik sõltub ju meist endist, liikmesriikidest, Eesti sama moodi, kes me oleme ÜRO liikmesriik, kes me oleme ka olnud ÜRO Julgeolekunõukogu mitte alaline liige, saanud seal oma nii-öelda tuleristsed või kogemuse, et mida see organi satsioon tema kõigis detailides ikkagi suuresti tähendab. Aga kui me küsime ühe sellise põhiküsimuse, kas ÜRO missioonoodi heas tahtes ühinenud rahvaste poolt teise maailmasõja lõpuaastatel, tõsi, see põhiotsustamine toimu s siis, kui meie vabadus müüdi maha ehk Jaltas tuhande üheksasaja neljakümne viienda l aastal, siis kas see organisatsioon tagab meie julgeoleku, kas me võime kindlad olla , et ÜRO või tema siis põhistruktuur, julgeolekunõukogu teeks midagi , kui Eesti peaks sattuma rünnaku alla. Ja ma arvan, et kui ma küsiks seda teie käest praegu, siis ilmselt tõuseksid väga palju d käed vastamaks viisile, et kahjuks me sellele loota ei saa. Nii et tema funktsioon ongi tänases maailmas ja, ja ilmselt ka homses midagi muud kui see, et kaitsta rahvaid sõja ja, ja genotsiidi eest kahjuks.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="554.88" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 9:15–10:12</span></span><span class="segment-text">Ma lisaks enda poolt ka, et ma arvan, et Eestis on see arusaamine ÜRO-st väga erinev , et olenevalt sellest tasandist, et ühelt poolt nähakse selles väärtust, ma arvan, et enamus eestlasi hindab ka seda ÜRO harta artiklit kaks neli, mis ütleb siis, et ei to hi kasutada jõudu riigi suveräänsuse vastu, et see on eestlaste jaoks üks olulisemaid põhimõtteid ja ja selle nimel või see on üks aspekt, miks me ÜRO-d väärtustame. Samas ma ei usu, et enamik eestlastest näeb ÜRO-d kui meie julgeoleku garantiid, et et need ootused on pigem NATO peal, aga kuna see on selline suur ja mitmetahuline organi satsioon, siis seal on väga palju aspekte, mis jäävad ebaselgeks, aga seal on väga palju , mis, mis ka toimib täida oma funktsiooni. Aga need suured ootused, see rahu ja julgeolek, see on see, mis kõnetab seda tavaini mest kõige rohkem ja, ja ma arvan, see frustratsioon ja pettumus organisatsioonis tule</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="612.36" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 10:12–10:46</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">neb sellest. Ma, mulle jääb kõlama ter- noh, terve selles jutus see sõnakasutus rahvaste ja riik ide ühendus ja, ja siin ongi see küsimus on ju, et kas, kas sa pead olema riik või kas sa võid ka lihtsalt rahvas olla? Ja, ja, ja, ja siin tekibki minu jaoks alati see küsimus, et kui ÜRO sai loodud niimoodi, et viiskümmend üks riiki olid alguses, siis põhimõtteliselt olemas,</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="646.04" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 10:46–10:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">et me.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="646.6" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 10:47–12:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nende hulgas oli ka Ukraina, kes ei olnud toona. Aga, aga point ongi selles, et jah, me räägime nüüd noh, viiekümne ühest riigist, aga samal ajal oli ju kolonialismi, kolonialism ju laialt levinud, enamus Lähis-Ida riik i, Aafrika riigid olid koloniaalvõimude all, nii et nendel ei olnud üldse isegi, nema d olidki üldse sellest lauast nii-öelda eemale jäetud ja, ja seda tuleb natukene. No loomulikult meie ka, aga see ongi see, et meil on, kui me nüüd meist nagu Eestist räägiksime, siis meil on lihtsalt vedanud see, et meie noh, meie geograafiline ja meie noh, ütleme nii, et meil on vedanud, et me oleme praegu ikkagi selles suurte poistek lubis nagu ikkagi, et see ei ole, ma saan aru, et me oleme väga palju tööd selle nime l teinud, aga fakt on ka see, et meil on ikkagi väga palju ka vedanud selles, see ei ole ka ainult sellepärast, et meie oleme kõike seda teinud, me lihtsalt olemegi sattu nud sellesse olukorda. Aga minu point selles kõik on see, et et, et ÜRO võibki valmistada ju pettumust väga palju sellepärast, et väga paljud riigid ja rahvad tegelikult ei tunnegi ennast täiesti esindatuna, aga samal ajal neil on, neil ei jää mitte midagi muud üle, sellepärast et see ongi see koht, kus sa saad mingisugustki legitiimsust, et olla nii-öelda siis selle laua taga, vahet ei ole, et sina oled lõpuks ikkagi sõltud väga palju sellest, mis need suuremad võimud on. Noh, sina ei otsusta seal väga palju, sa võid küll oma häält, aga ja see ongi selle, võib-olla selle ÜRO võlu või see, see hea asi selles, et vähemalt see on see üks koht , kus igaüks vähemalt tunneb, et ta saabki sinna tulla, aga ja, ja oma nii-öelda arva must või, või häält teha, aga samal ajal
