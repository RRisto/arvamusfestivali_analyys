<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="47.4" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:47–1:57</span></span><span class="segment-text">Tere pärastlõunat, minu nimi on Meelis Kitsing. Ma olen viimased viis aastat olnud EBS-i, see on siis Estonian Business School rektor Ja need, kes EBS-i ei tea, siis EBS on eraülikool Eestis. Eestis on seitse ülikooli ja me oleme ainukene eraülikool ja EBS-i alt siis me pakume tegelikult haridust nii gümnaasiumi tasemel, bakalaureuse tasemel, magistritasemel ja doktori tasemel. Ja lisaks on meil ka noh, muidugi suhteliselt oluline teadus-arendustegevus ja ka in vesteerimistegevus ja võib-olla selle paneeli mõttes, et kui see kuidagi siduda ära E BS-iga, et üks valdkond, mis on meie jaoks hästi oluline, on see, et me tegeleme jah Eesti hariduse ekspordiga, et meil on päris palju välistudengeid, neljakümnest riigi st. Et meil näiteks on olnud ka campus kaua aega Helsingis, et on sealt kogemus, nii et väga erinevate välistudengitega, väga erinevates formaatides. Ja ma arvan, et selline teenuste eksport on tegelikult ka Eesti kontekstis nagu äärmise lt oluline.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="117.04" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 1:57–2:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Ja tervist pärastlõunat, minu nimi Mariin Ratnik, mina olen välisministeeriumi majandus - ja arengukoostöö küsimuste asekantsler. Minu suhe sellesse teemasse on see, et üks minu ülesannetest on toetada Eesti ettevõ tete eksporti nendes kohtades ja nendes riikides, kus nad seda vajavad. Ja see küsimus sellest, et kas ja miks peaks riik mõnda teise riiki eksporti toetama , kui sellel riigil on omad eripärad, esitatakse meile päris tihti, nii et sellepärast olen mina selles arutelus ametkonna poole pealt.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="150.08" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 2:30–3:16</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, mina olen Mari-Liis Tigasing, olen aktsiaseltsist Miks Karmiks Krau. Me oleme pereõttevõte, meie tegeleme turbast kasvusubstraatide tootmisega. See oli kuni siiani, nüüd viimasel ajal, viimased aastad, me oleme otsinud alternati ivi turbale ja ja nüüd siis alates selle aasta märtsist me toodame Eesti saetööstuse jääkidest puidufiibrit, mida siis lisada meie substraatidele, et asendada osaliselt turvast või ka täiesti turbavabasid substraate toota ja kuidas meie ettevõ te sobitub siia teemasse, et enamik meie kaubast läheb ekspordiks, olenevalt aastast , meil on umbkaudu viiskümmend erinevat sihtriiki.</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="348.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:49–6:00</span></span><span class="segment-text">Mariin, ma küsin teilt, et kas Eestil on mingi selline list, mis riikidest kindlasti tasub ettevõtjatel eemale hoida, ma juba ütlen ise ennetavalt ära Venemaa, eks ole.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="413.04" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 6:53–7:08</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">i teeks. Meelisega teilt küsimus, et EBS-is, millised kurioossemad riigid on, kus te teete siis seda nii-öelda hariduse siis eksporti ja kust see kutsute tudengeid meile?</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="512" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 8:32–8:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Meelis juba viis ka teema sinnapoole, aga laiemalt nüüd arutelu küsimus, et kes soovi b esimesena vastata, see haara- , haaraku aga mikrofon, et mida peab arvestama, kui tõesti tehagi koostööd, kas siis oma firmaga või kuidagi riikidena, et teha koostööd sellist e täitsa erineva kultuuriga riikidega?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0016" data-start="536.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:56–10:00</span></span><span class="segment-text">No natuke võiks kultuuri teada, alustada võib sellest. Ja ega tegelikult noh, kui me jõuame kaugematesse riikidesse, Lähis-Idasse, siis ka meie peame ka arvestama sellega, et me peame ikkagi oma kliendi tausta teadma ja oma part nerite tausta. Et kui me tahame kasvõi rahaülekannet teha Saudi Araabiasse, siis pank küsib meilt esimese asjana, et palun saatke dokumendid, kus see raha tuleb ja mille jaoks ja, ja see ei ole mitte ainult Saudi Araabia puhul, see on samamoodi Küprose puhul, sa saadad midagi Kas ahstani või, või või kuhugi Armeeniasse on ju, samamoodi küsitakse tegelikult, et kes on see teine osapool ja sa pead tegelikult seda teadma. Et selles mõttes see on üpris tavapärane ja, ja selleks on nagu ettevõttel endal on si hukesed protsessid paika pandud, et, et kuidas, kuidas äri, äri koha peal teha on ju Et jah, tuleb, tuleb tunda, tuleb kohapeal käia, noh mööbliäri väga keeruline Teamsist teha, et tuleb inimestega kokku saada ja päriselt-päriselt rääkida.</span></button>

  <script>
