küll maailma seisma jäämine, aga vähemalt USA kontekstis ikkagi taastuvenergia, eeskätt siis päikese, tuule, uute võimsuste kasutuselevõtu ikkagi selge aeglustumine, mitte kasv ei jää pidama, aga aeglustumine on väga tõenäoline olulisel määral. Samal ajal tingimustes, kus ka Ameerika Ühendriikides energia, elektrienergia vajadus iga aasta kasvab paar protsenti AI revolutsioon nõuab sellest suure tüki, kus ka USA soovib ju tugevalt osaleda. Noh, ja selle kõrval toimub ka ikkagi kliimateaduse otsene siis, ütleme siis demoralise erimine ja mingis mõttes nagu lammutamine tema seniste kliimauuringute nii-öelda baa si eemaldamine tulevaste kliima ja keskkonnaotsuste nii-öelda motivaatori koha pealt ehk et. Ja ka, ja ka liikumine selles suunas, et siis kõikvõimalike heitmete ja keskkonna siis nõuete tühistamise suunas minnakse nii transpordis kui, kui energeetikas. Et noh need, sellega ei ole kõigega kohale jõutud, aga, aga tõsised sammud, mis on selle tagajärjed? Noh, Ameerika Ühendriikide jaoks energia nappus potentsiaalselt kõrgemad energiahinna d tarbijatele. Maailma jaoks suur ports CO2 ja muid kasvuhoonegaaside heitmeid, mis muul juhul, ütleme senise kursi jätkudes oleks atmosfääri jäänud heitmata. Ja muu maailma jaoks muidugi probleem ka selles, et see on ka ikkagi ideoloogiliselt eeskuju. Kelle jaoks probleem, kelle jaoks see motivaator, eks ole, või selline šnitti võtmise koht, et kliimaskeptikute ja, ja nendes poliitiliste jõudude jaoks, kes sooviksid sellist mudelit järgida, on see kindlasti inspireeriv ja ka Euroopas eeskuju, eeskujuks võeta v. Samal ajal Hiina, eks ole, jätkab suure hooga taastuvenergia siis üleminekut. Rahvusvaheline energiaagentuur hindab, et aastaks kaks tuhat kolmkümmend kuuskümmend protsenti maailma uuest, siis lisanduvast taastuvenergiavõimsusest tuleb just Hiinast , jätkab Hiina domineerimist elektriautode taastuvenergia tehnoloogiaturgudel, toora ine nii kaevandamisel kui töötlemisel tugev roll. Samas sel aastal on, on juba siis jõutud mub ka positiivset ja üldised trendid muidugi majandusliku loogika pinnalt on see, et ta astuvenergiat tuleb ühinal juurde, elektriautosid tuleb mühinal juurde. Nende taga on majanduslik loogika ja nii-öelda pilt ei ole muidugi ainult negatiivne</span></button>
