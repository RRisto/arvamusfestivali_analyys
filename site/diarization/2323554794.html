    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.6" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:12–4:25</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast arvamusfestival on alanud. Tore on siin Paide Vallimäel teid kõiki kohata. Ja väga suur au on pidada festivali üks esimestest aruteludest siin festivali Klubi alal ja rääkida siin Järvamaast ehk sellest paigast, kus mitme d meist igapäevaselt elavad ja töötavad või siit siis ka kuskile mujale tööle käi vad. Ja nagu te kavast märkasite, siis meie arutelul on selline võib-olla natukene kriipi v pealkiri. Ja see kõlab siis nii, et kas me siin Järvamaal oleme tõesti kõige rumalamad? Katsume siis selle pooleteist tunni jooksul sellele küsimusele kena jah või ei vastu se anda ja mul on hea meel, et ma ei ole selles siin üksi, vaid mul on rõõm tervitada siin meie kahel diivanil nelja kaunist tarka naist. Tere tulemast Järvamaa sariõppija Tiina Lipand. Tere tulemast kood/Jõhvi kaasasutaja Mari-Liis Kitter. Ja sulle veel eraldi tere tulemast Paidesse ka. Ja siis on meil siin kohalik täiskasvanute koolitaja ja Talendikeskuse vabatahtlik K elly Saatmann. Ja Sigrid Aruväli, kes on siis Tallinna Ülikooli haridusinnovatsiooni keskuse juhataja ja teab täiskasvanu haridusest peaaegu et kõike. Võite julgelt oma mikrofonid kätte haarata ja ma ütlen ka kohe, et hea publik. Ma arvan, et see on selline teema, kus teilgi võib olla soovi tõsta näpp üles, küsi da, kommenteerida oma mõtteid sekka öelda, sest ma näen siin palju tuttavaid nägusid nii ettevõtjaid, tööandjaid, kunagisi õpilasi, tänaseid õpilasi, Järvamaa arendajaid, kutsekooli esindajat. Nii et kindlasti, kindlasti rääkige julgelt kaasa, meie siin anname sellise väikese ra ami ja, ja loodame väga, et et te tahate meile sõna sekka öelda. Tänases vestluses siis proovime teada saada, miks on Järvamaal kõrgharitud inimesi vähe ja mida see kohalikele kogukondadele tähendab. Samuti, millised täiend ja ümberõppe võimalused on Järvamaal täiskasvanutele ja kui a ktiivselt kohalikud selles osalevad. Kuidas on korraldatud täiskasvanu haridus Eestis laiemalt, kes selle eest vastutab ja kas ning mis on praegu hästi ja kus on puudujääke? Samuti püüame siin kindlasti just teie abiga teada saada, et mis seis on Järvamaa töö turul. Milliseid spetsialiste vajavad tööandjad ja mis motiveeris just kood/Jõhvit siin oma õpet alustamas ja juba sügisest siin Paides pihta hakkab, kood Järva koolis. Ja laiemalt siis, mis on Järvamaa potentsiaal ja kuidas seda realiseerida? Ja alustuseks meie armsad vestluses osalejad, tutvustage igaüks ennast ise ja alusta me Sigrid sinust. Mõtle natukene ja kirjelda meile, mis on sinu enda hariduslik taust, mis võtab sinu iga päevatööpäevast kõige suurema osa, millega sa hetkel kõige intensiivsemalt tegeled. Ja mõtle ka mingi viimane asi või oskus, mis sa viimati õppisid. Ja see võib olla ka mingi väga lihtne asi, mingisugune võib-olla lihtsalt kogemus, et noh, mina nüüd näiteks tean, et, et sellise tugeva konditsioneeri all istuda ei tasu , sellepärast et siis võid oma häälest ilma jääda ja pärast on tüli kui palju. Aga Sigrid, sõna sulle.</span></button>
