<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="91.44" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 1:31–1:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jüri Teras, tsiviilelus kirurg erinevates haiglates töötan. Lisaks sellele Tallinna Tehnikaülikooli külalisprofessor. Kaitseliitlane, meditsiini tark hetkel.</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="232.72" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 3:53–4:01</span></span><span class="segment-text">Et tuleb öelda suuremaid numbreid, et üks miljard, kaks miljardit, kolm miljardit. Et siis on kohe alguses nagu tase õiges kohas.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="240.52" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 4:01–5:12</span></span><span class="segment-text">No vot, aga proovime siis rääkida ise ka valjult, kui, kui valjemaks keerata ei saa ja , ja kohaneme, sest et kohaneda tuleb meil kõigil ka vaadates tulevikku ja kohaneda olulise lt kiiremini, kui me oleme võib-olla viimastel aastatel harjunud, sest ennustamine iga l juhul tänamatu töö. Kui me peame mõtlema selle peale, kus me oleme kahekümne nelja aasta pärast, siis noh , konteksti loomu loomiseks absoluutselt oluline teadvustada võib-olla suurimaid muutu si, mis meid juba täna siin meelitavad ja, ja kindlasti ees ootavad, aga kus, kus me oleme oma tervishoiu üleüldise elukorraldusega aastal kaks tuhat viiskümmend, siis ilmselt see läheb ulmekirjanduse valdkonda, kui me hakkame, hakkame seda visioneerima. Aga ometi on meil vaja täna teha juba otsuseid, mis aitaksid meil siis selles aastanu mbris ka toime tulla. Ma palun, et kõik tooksite välja võib-olla suurima muutuse või, või kõige kriitilise ma teema teie enda ekspertsuse või valdkonna vaates, millele tuleks tähelepanu pööra ta. Kui me mõtleme valmisoleku peale aastaks kaks tuhat viiskümmend. Võib-olla hakkame siis sealtpoolt ja andmete otsast tulema, sest andmetest me kindlasti</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="342.24" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:42–6:16</span></span><span class="segment-text">Vaidleksin vastu, et tõmbaks konflikti kohe ülesse, nagu Kristel palus. Et tegelikult ju Euroopa meditsiin on võrreldes Ameerika omaga natuke üleregul eeritud, kasvõi uute ravimite turuletoomine, kui siin veel paarkümmend aastat tagasi paljud ju uued ravimid tulid läbi Euroopa ja USA-ga ühel ajal, siis tänapäeval on, on see jäänud nagu Euroopa osa on kõrvale jäänud, et Euroopa sörgib siin oma ülereguleeri miste tõttu siin tagaplaanile natuke.</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0015" data-start="397.96" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 6:38–6:45</span></span><span class="segment-text">Alar teab siia kindlasti tuua kui, kui ravimiameti kunagine esindaja, ma saan aru, ka</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0016" data-start="404.84" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 6:45–7:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">siukseid mõtteid juurde, et, et. Aga ma olen nõus, et, et kindlasti meil on palju akuutsemaid probleeme ja kiiremaid are nguid, mida saab tasakesi võib-olla õiguslikult toetada, aga aga meie esimesi samme ei, ei takista võib-olla praegu õigus, see on tõsi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="426.08" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:06–7:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga Taavi lihtsalt, et see esimene repliik saaks meil kõigiga läbi käidud. Taavi, sina lihtsalt tehnoloogia poole pealt võib-olla vaadates mina vähemasti olen küll , rääkides siin health founders&#x27;it erinevate osapooltega ja laiemalt tehnoloogiasektor ist inimestega start-upperitega, et, et see tervise valdkonnas innovatsiooni tegemine igasuguste regulatsioonide, piirangute juriidika poole pealt ikkagi ma saan aru mingi s kontekstis on päris suur kirstunael, aga kui suure probleemina sina seda näed või, või on sinu jaoks teravik hoopis kuskil mujal?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0018" data-start="456.8" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:37–9:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma arvan, et regulatsioonides on ju see teine pool on tihtilugu rakendamine, et, et mina ei ole juuraekspert ja selles mõttes, et võib-olla sul on täiesti õigus, et mulle enda le tihtilugu tundub, et et võib-olla need meie rakendamised on sellised liiga karmid , kus aetakse taga mingisugust tohutut täpsust, mis muidugi noh, inimeste tervise ja elu ja privaatsuse mõttes on olulised kaalutlused. Aga et mul on tunne, et kui tahta, siis tegelikult saaks teha ka lihtsamini selles täna ses raamistikus. Mina arvan, et see, ma toon nagu ühe sellise oma igapäevaelust, kus ma tegutsen, siis mõnevõrra paindlikuma juriidikaga piirkonnas, eks ju, Araabia riikides, kus noh , privaatsust nii palju ei hinnata kui, kui meil võib-olla hinnatakse. Ja noh, ma ei ütleks, et, et sellest on nüüd midagi nagu tohutult nagu palju või kiire mini arenenud, et, et kindlasti mingeid asju siin ja seal nagu tehakse kiiremini, aga Aga, aga ma arvan, et innovatsiooni rakendamisel nagu ka paljudes muudes eluvaldkond ades meie kunstis või kultuuris lõpuks ju loeb rahastus ja rahastusmudelid ja meil Eestis , kus on selline aasta lõikes tasakaalu otsimine noh, nii-öelda riigi tasandil. Et ma arvan, et üks selline innovatsiooni küsimus on see, et kui meil on võimalik de fineerida noh, mingisuguse uuenduse tehnoloogia meetodi, ravimi rakendamine turule too mine, mis täna on väga kallis, aga, aga võib-olla järgmise, ütleme kümne aasta jooksul tõenduspõhiselt näitab, et hoiame kokku, et noh, kas me suudame oma sellises aasta lõ ikes tasakaalu otsimises noh, luua sellise finantsmudeliga siis mingisuguste võlakirja de või, või mingi muu sellise instrumendi näol, et, et me saaksime neid nii-öelda tulevik u säästuprojekte teha täna, tänase rahaga noh, laenates võib-olla seda, aga siis noh , loomulikult seal peavad olema vastavad kontrollimehhanismid, et, et ma, ma küll näe n seda, et, et noh, miks asju nagu tehakse või ei tehta väga palju ikkagi lõpuks sõl tub sellest, kuidas ja kes maksab.</span></button>
