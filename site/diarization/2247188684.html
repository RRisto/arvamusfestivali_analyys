    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:11–2:26</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Võime vaikselt alustada, kas kiirustades elad kauem jah? Me räägime tööohutusest, sellest, miks see vajalik on, millised on sellised päriselu lised näited, kas asjadega on pigem hästi või saab veel paremini ja kui saab paremini , siis kes peaks tegema paremini, aga ma tutvustan tänaseid siis arutelus osalejaid. Meiega on tööinspektsiooni peadirektor Kaire Saarep. Tere. Sealt edasi kohe on siis Eret Püvi, kes on Rannus Aeveskist ja tema esindab meil siis täna väikeste, tema väikeste ettevõtete esindajat. Tere. Siis Robert Reismann on ise tööõnnetuses viga saanud töötaja. Täna siis suhtekorraldusest. Tumsulting ja siis suuri tööettevõtjaid, suuri ettevõtjaid esindab meil Priit Koit U tilitasest. Tere. Mina olen Rahvusringhäälingu ajakirjanik Mirko Ojakivi ja siis meil on suhteliselt in teraktiivne see suhtlus siin. Kohe-kohe kui me avaringid ära teeme, siis lasen ka mikrofoni ringi käima, aga ma küsi n alustuseks, et saada see tunnetus kätte, et kui paljudel, kas saab käega märku and a, et kui paljude arvates Eestis on tööohutusega kõik väga hästi, et rohkem pingutama ei pea. Tõstke käsi, kes arvavad, et noh, praegu on nagu tegelikult üld suures pildis on kõik hästi. Ja kes ja nüüd ma paluks ja mõned käed tõusid, aga kes arvavad, et asjad on ikkagi väga halvasti. Ja kes arvavad, et need on nagu nii ja naa, siis nii ehk nii ja naa, meil on siin võimalik diskuteerida nendel teemadel, aga ma alustaks võib-olla sissejuhatuseks filosoofilise malt, et lõpuks jõuaks sellise igapäevase elu juurde ja räägime siis erinevatest nii -öelda ohuteguritest ja ja probleemidest. Aga kui me räägime tööohutusest, Kaire, millest me räägime, ma saan aru, see on teie igapäevane töö, aga kas see on bürokraatia ja tüütud kohustused, on see nagu hügieen niimoodi, kui me tualetis käime, siis pärast ikkagi noh, käsi peaks pesema, et mille st me tööohutuse puhul räägime?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="146.16" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:26–3:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No viimasel ajal või, või aeg-ajalt jääb mulle silma see, et meedias räägitakse just kui bürokraatiast ja meie igapäevatöös, kes me seal sajakesti üritame tööohutust parem aks teha, näeme, kuidas neid näppi ja sõrmi ja, ja jalgu ära lõigatakse. Et meie räägiksime sellest igapäevast hügieenist, et tehke oma ettevõttes ABC korda, juba on lihtsalt nii palju asju parem, et see alati ei ole päris tasakaalus, mida näe me meie, mida võib-olla avalikus debatina tingimata näeb.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="180.72" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:01–3:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Päikesed ettevõtjad ütlevad, et riik on riik läinud, kuidas teie näete sealt Saski poole pealt, et on siis neid kohustusi liiga palju või teie valdkond on see piisavalt oht lik ja riskantne, et seal võibki asju juhtuda ja seal on liiale minemine õigustatud. Kuidas teie sellest tööohutuse poolest aru saate?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="200.8" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:21–3:46</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Liiale mindud on siis tegelikult just seesama bürokraatiaga, mida ma tahangi öelda, ehk et meil täna on võrdusmärk toodud suurettevõtete, väikeettevõtete vahele, mis tähendab seda, et meil on kõigil samad normid. Kas mul töötab üks töötaja, töötab kümme või töötab sada või tuhat ehk et me kõik jä lgime üksteisid norme, me teeme täpselt samu asju, aga lihtsalt halduskoormust on väike ettevõttel rohkem, sest inimesi on vähe.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="226.4" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:46–3:53</span></span><span class="segment-text">Robert, teie kaasuse juurde tuleme ka varsti, aga et kuidas teie tajute, et mis see töö</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="233.2" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 3:53–4:29</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">ohutus on? No ma arvan ikkagi, et tööohutus on hästi lihtne, et päeva lõpus tuled koju enam-vähe m ühes tükis. Ja kui me suudame seda tagada, siis on juba, ma arvan, üsna suur töö tehtud. Mul endale tundub natuke selle, selle, selle teema juures see, et ma ei ole super kind el, kas me teeme õigeid asju. Et kas kõik need ülesanded, mida ettevõtted peavad täitma, on kõik need kohustused. Tänab tulemast, et minu arust on see, see huvitav aspekt selle juures, mida ma tahaks täna siin kuulda ja, ja ka ise mõtestada rohkem.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="268.88" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:29–4:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Priit, mis see tööohutus teie ettevõttes on, et tüütu kulu?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="273.36" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 4:33–5:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Absoluutne prioriteet. Ma arvan, et see on, see on selline, võiks öelda kõige esmane asi, et, et me loomulikult energetootjana me mõtleme kogu aeg selle peale, milline oleks varustuskindlus ja kuidas klientidel oleks energiavarustus tagatud, aga, aga esmajärjekorras ikkagi mõtleme selle peale, et kuidas kõik meie töötajad saaks tervelt õhtul või kes on öövahetus siis pärast vahetuse lõppu koju tagasi, et absoluutne prioriteet.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="301.16" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 5:01–5:26</span></span><span class="segment-text">Kari, kas tegelikult ongi niimoodi, et kõik saavad aru, et töötajate tervis ja see, et lahkutaks ühes tükis nagu tuldi ja tegelikult see tervis ei halveneks, sellest tegelikult saadakse mõistuse tasandil aru, aga siis tuleb see päriselu töökeskkond. Kogu aeg on kiire, tootmises on tähtajad. Siit lastakse üle ja, ja sealt lastakse üle ja niimoodi need asjad juhtuvad.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="326.16" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 5:26–6:32</span></span><span class="segment-text">Ma tahaks öelda, et ei saada, ma toon lihtsalt ühe näite, hästi lihtne näide. Naabrimees ehitas katust ja minu väike kolmeaastane laps ütles, et emme, onul ei ole kiivreid peas, okei. Lähme siis ütleme onule. Mu vanemad veel lugesid sõnad peale, ära naabritega tülli minema, ma ütlesin okei, ma ettevaatlikult, lähen võtan kolmeaastase lapse kaasa. Ja jõudsin siis naabrite juurde, et kuulge, et meil on siin kiivrid peas, et meil siin need viis meest eelmisel aastal kukkus ehituses surnuks ja noormees ütleb, et jaa, e ma tean, minu paariline kukkus ka. Okei, kas sul kiivrit ikkagi ei ole ja siis tuleb majaomanik ja ütleb, et ja ei, ma tea n, tean, aga ma ka kukkusin. Mul see puus on täitsa nagu täitsa katki, et aga noh, ühesõnaga ma ei saa öelda, et nad saavad aru. Pigem on see suhtumine minuga ei juhtu ja kiiver, kusjuures on üks odavamaid isikukaitse vahendeid üldse see paarikümne euro eest saab täiesti normaalse kiivri, millega sa võiks id töötada. Noh, loodetavasti mitte, aga võiksid ka kukkuda, nii et see kukkumine on veel õnnelik</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="392.84" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:33–6:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga see trend on pigem ju paremuse suunas, kui vaadata kas või seda tööõnnetuste sta tistikat, hukkunute statistika, vigastatute statistika, siis pigem me ju ikkagi suuna ga läheme paremuse poole.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="406.6" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:47–7:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ida-Virumaa on kõige ohutum maakond terves Eestis. Ehk siis ei lähe. Meil on terve hulk teavitamata tööõnnetusi niikaua, kuni Ida-Virumaa on kõige ohutum maakond Eestis ja mitte mingi paari protsendipunktiga, vaid põhimõtteliselt noh, kui me vaatame, seal on vist kolm koma viis, kolm koma seitse tööõnnetust tuhande töötaja kohta versus ohutumates maakondades või no ohtlikumates on siis seal seitse-kaheksa- üheksa isegi. Ei lähe paremuse poole, veel ei lähe. Et jah.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="441.36" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:21–7:27</span></span><span class="segment-text">Robert räägiks selle teie tööõnnetuse loo ka ära, et aastaid tagasi töötasite puiduse ktoris, mis siis juhtus?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="447.48" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:27–8:43</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja ma olin, olin siuke noor mees, umbes kakskümmend, täpselt ei mäletagi enam. Töötasin saeveskis ja oli juhtumi vahetus. Saeveski tootmisliin, pikk, pikk konveierliin ja olin siis saemehe abiline. Ja tuli üks laud või Brüsse kallal jällegi täpselt ei mäleta, mööda liini oli viltu. Ja see vajas sirgeks lükkamist. Ja mind oli tegelikult täiesti korralikult instrueeritud. Aga siis ma mõtlesin, et noh, see on nii lihtne asi, et sellega lükkan sirvi seiskama ta. Ja läksin liinile liiga lähedale ja liini otsas, võlli otsas oli sihuke pikk metallist laba, mis pöördus. Ta haaras mu püksisäärest kinni. Veris mind ümber võlli ja siis lõikas mu kõhu nii-öelda lõhki. Et sisemine ilu oli näha nii endale kui teistele, kes näha soovisid. Huvitaval kombel ma pääsesin sealt eluga, sest et täitsa kogemata lükkasin ühe anduri puusaga paigast ära, mis seiskas liini. Ja noh, nii ta oligi, siis tuli kiirabi ja mind viidi, viidi opil lauale ja lapiti kokku ja. Esimesed paar kuud ainult kõndisin nagu vanainimene küürakil suhteliselt. Noh, nüüdseks ma olen taastunud täitsa kenasti, ma arvan, kahekümne aastaga või viie teist aastaga.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0015" data-start="522.64" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 8:43–8:46</span></span><span class="segment-text">Aga ehmatus oli kõigil päris suur, kujutan ette.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0016" data-start="525.64" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 8:46–9:10</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja eks mul niisugune mälupilt ja sellest hetkest on see, kus tuli mu kolleeg ja siis ma suutsin raadiosaatega abi kutsuda endale. Ja siis tuli mu kolleeg, täiskasvanud mees, kes seal siis minestas ära. Ja siis oli üks mu teine kolleeg, kes muidu võib-olla ei olnud kõige terasem nägukam inimene, aga tol hetkel seal kriisisituatsioonis hakkas siis mägesid juhtima ja lahe</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="549.52" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:10–9:15</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">ndama. Ireka, kas tavaline päev te saekaatris?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0018" data-start="554.68" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 9:15–9:26</span></span><span class="segment-text">Ei ole tavaline päev saekaatris. Aga jaa, selles mõttes, et väga tihti tuleb meelde tuletada töötajatele, et siin on lii kuvad osad ja sinna ennem ei lähe, kui seade on seiskunud.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0019" data-start="565.96" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:26–9:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Sest see on paratamatu, et kui võtta siis valdkonnad, siis ehitus, puidu ja toiduaine tööstus, põllumajandus on ja ka kaubandus on need, kus juhtuvad kõige sagedamini. Eestis tööõnnetused, miks need valdkonnad?</span></button>
