need siis julgeolekusse ja, ja kaitsesektorisse. Ja kliimaministeerium andis siis seal kõige suurema panuse, kaheksakümmend viis miljon it, siis kliimarahadest suundus kaitse, kaitse valdkonda. Aga noh, ega selles mõttes, kui me siin oleme viimased kümme aastat on ju kliimateema d olnud fookuses, kõik rohekokkulepped ja asjad, et ega me ei saa ju sellest tegelikult ka tänasel päeval mööda vaadata, et ega see jätkusuutlikkuse ja kliimakatastroof, mis meid siin ootab, et ega ta ei ole tegelikult kuskile kadunud. Ja näiteks ka maailma majandusfoorum, et nemad annavad igal aastal välja sellist nii -öelda prognoosi või ennustust, millised on need suurimad globaalsed riskid, mis meid siis ohustavad nii kahe aasta kui ka siis kümne aasta lõikes. Ja järgmise kahe aasta lõikes leiame siis sellised kliima ja keskkonnariske kaks tük ki. Et esimene nendest on ekstreemsed ilmastikuolud, et noh, tõenäoliselt oleme ka siin Eestis omal nahal neid kogenud, kas siis põua või siis üleujutuste näol, mis siin on järjest sagenenud ja noh, kliima soojenemine ka, et ma näen, et osad inimesed istuvad meil täna siin saunalaval lausa, et võib-olla siis ka tulevikus saab õues saunalaval istuda, kui kliima, kliima on siis nii soojaks soojaks läinud. Ja teine kahe aasta risk on reostus. Ja kui me vaatame kümne aasta perspektiivi nüüd sellest majandusfoorumi ennustusest, siis seal on lausa pooled ehk viis riski, on seotud siis kliimakeskkonna ja elurikku se kaoga. Ehk et kliima tegelikult endiselt peab olema meie fookuses, sest ega kui meil ei ole seda head keskkonda, kus elada ja majandada, siis ega õigupoolest meil ei olegi ju midagi siin, siin maailmas. Ja ma usun ise ka väga siiralt, et kui me tahame olla sõltumatud ja konkurentsivõime lised, et me ei saa tegelikult rohetehnoloogiaid lahterdada kuidagi eraldi mingisse ni ši kaupa või et nad on kuidagi nagu luksus, et ta ikkagi peab olema horisontaalne läbi valdkondade, noh suur rõõm on näha, et tegelikult see suund on ka sinna, sinna liiku mas ja eks ta saab olema meie uueks baasinfraks. Ja iseäranis seda suunda on märganud ka Euroopa Liit, kes siis eelmisel aastal tuli välja sellise uue poliitikatsükli ja kontseptsiooniga nagu puhta tööstuse lepe. Ja see lepe siis toobki kokku kaks olulist valdkonda, energiamahukat suurtööstused ja puhast tehnoloogiat ja soovib siis nende vahel siis sellist koostööd ja sünergiat so odustada. Ja ega ka Eesti tasandil, kuigi koalitsioonileppes siis konkurentsi ja kaitseteemad on fookuses, siis samamoodi selle rohelise tööstuse või puhta tööstuse leppega, et tegelikult ka ministeeriumi poolt on oodata mitmeid uusi algatusi ja meetmeid ka sellesse sektor isse. Ja täna siin toredate panelistidega, siis soovimegi arutada, et kuidas rohetehnoloogi ad saavad olla siis sillaks seal, kus kohtuvad julgeolek, sõltumatus ja ka, ja ka puhtam majandus. Ja uurime ka seda, et mida siis tuleks teha siin meil Eestis ja milliseid otsuseid vastu võtta, et see sektor ikkagi pigem kasvaks, mitte, mitte, mitte ei känguks. Ja meil on siin selleks kolm suurepärase taustaga panelisti. Neil on kõigil küll veidikene erinev taust, kuid seda enam nad suudavad tuua seda põ nevust meile siia arutelu läbi erinevate vaatenurkade. Minu kõrval istub Alar Saluste, kes töötab Ragen-Sellsis osa projektijuhina ja Alari l on tõesti aastatepikkune kogemus, kuidas tõhusalt ressursse kasutada. Ja samamoodi justkui mulle tundub, et sa oled nagu ühe jalaga sellises innovaatilise s algatuses ja projektis ja teise jalaga sellises traditsioonilises tööstuses. Ehk tegelikult sa oskad näha ka neid tööstuse piire, eks ole, et, et kus me võib-olla sellise suure rohepöörde, kohati ka soovmõtlemisega oleme ja et mis tegelikult siis on võimalik ka tööstuse tasandil ära teha. Siin keskel istub Maris Riim, kes on Swedbanki jätkusuutlikkuse juht. Ja noh, kui me räägime rohetehnoloogiatest, innovatsioonist, muutuste tegemisest, siis kindlasti üks võtmetegur seal on finantseerimine ja ressursid, et sellest me üle ega ümber ei saa ssurssi niimoodi kasutada näiteks. Ja siis võib olla ka süsteemne muutus energeetika või transpordisektoris, et näiteks asendame siis diiselrongid elektrirongidega, et kõik see tegelikult on ja sobib eks ole sinna rohepöörde konteksti hästi ja miks ettevõtted sellega peavad tegelema, ongi ju tegelikult see, et süsinikukvoodi hind kasvab ja üks hetk nad lihtsalt ei ole konkure ntsivõimelised, kui nad kasvatavad sisenditena siis fossiilset päritolu materjale, et tegelikult ettevõtted täna peavadki tegelema sellega, et nad vähendaksid siis sõltuvus t fossiilsetest sisenditest, olgu see siis energeetika, olgu see siis materjalid, ke mikaalid, mida nad kasutavad ja nii edasi ja ka ringmajanduspõhimõtted, et kõik see ju ka samamoodi vähendab jalajälge. Ja tegelikult täna sellega ka tegeletakse, sest et noh, Eestis siseturg on meil väga väike, aga aga ja me sõltume väga palju siis välisturgude nõuetest ja seal tegelikult juba vaadatakse toodete jalajälgu, mistõttu ettevõtted sellega ka tegelevad Ja riigi vaatest, et mida me saaksimegi siis teisiti teha, on tegelikult see, et me ei saa lahendada ära kõiki globaalseid muresid ja kui me neid kõiki hakkame lahendama, siis me lahendame siis kümnest probleemist võib-olla igalt ühelt natukene, aga me peaksime fokusseerima kindlate probleemide lahendamist, mis on Eesti kontekstis olulised ja need peaksid olemagi vaadatud selle järgi, et millised ressursid meil siin on. Et näiteks puiduressurss, see on meil tegelikult täna kasutamata. Me ekspordime ümarpalki, pelleteid, mis on madala lisandväärtusega tooted, kasutame pu itu energeetikas, kus siis süsinik vabaneb eks ole kiiresti tagasi atmosfääri ja vaid kaksteist, ei neliteist protsenti puidust umbes läheb siis selliste kestvustoodete või siis kõrgema lisandväärtusega toodete tootmiseks. Et tegelikult Eesti kontekstis oleks oluline ikkagi see väärindada siin kohapeal majandus e vaatest, siis oleks oluline ja samamoodi, eks ole põlevkivi, et kui me seda energe etikas enam kasutada
