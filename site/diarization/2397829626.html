    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.72" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 0:11–2:13</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii tere päevast, head inimesed, kes te olete siia telgi alla kogunenud, loodame, et hakkab vihma sadama, siis tuleb meid siia rohkem. Ja tere päevast ka kõigile nendele, kes meid Facebooki lehel vaatavad. Meie hakkame rääkima täna piirialadest. Ja mina olen arutelu juht Margit Keller, tulen Tartu Ülikoolist sotsiaalteaduste val dkonnast, tegelen ka ise Ida-Virumaa uurimisega. Ja oma dekaani töös ka Narva kolledžiga, nii et mul on väga selline tööalane tihe pu utumus just konkreetselt Ida-Virumaaga ja minuga koos on siin üks kumalane, kes tahab arutelus osaleda. Aga peale tema veel ka neli ägedat panelisti ja ma lugesin just üle eile ühte meie kõige olulisemat poetessi, Doris Karevat, kes ütles, et arvamine on üle hinnatud. Et pigem on oluline see, mida inimesed teavad ja oskavad. Et ma arvan ka, et me, ma arvan, et me täna arvame vähem ja räägime sellest, mida me teame. Me püüame argumenteerida, analüüsida, võib-olla ka natukene vaielda, et see ei ole võib -olla klassikaliselt ainult arvamine. Minuga koos istuvad siin Meel Valk, kes tuleb Võrumaalt, Võrumaa Arenduskeskusest, ma kohe pöördun kõigi poolega isiklikult, nad saavad rääkida oma väga tihedast puutumus est idapiirialadega, aga, aga natuke veel paar lauset sissejuhatust ennem seda. Siis on Kai Kalman Jutautos, regionaal- ja põllumajandusministeeriumist, kes tegeleb regionaalpoliitikaga oma igapäevatöös. Lauri Alonen Ida-Virumaa ettevõtluse Arenduskeskuse vanemkonsultant, kes teab kõike sellest , mis Ida-Virumaa ettevõtluses toimub. Ja professor Triin Vihalem, kellega koos me Ida-Virumaad uurime, kes vaatab Ida-Viru maa sellist meeleolumaastikku sotsioloogi pilguga.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="135.48" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 2:15–4:10</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga piiriala ja ka konkreetsemalt idapiiriala on üks väga lai mõiste. Ja kui me vaatame Brüsselist piiriala poole, siis on Eesti, Läti, Leedu tervikuna kõik piirialad. Ja kui me hakkaksime rääkima Eestist, Lätist, Leedust või ka ainult Eestist tervikuna , siis meie jutt ilmselt voolaks mööda Vallimäge alla ja, ja valguks väga-väga laiali Et me peaksime seda piiriala, seda idapiiriala ikkagi enda jaoks kuidagiviisi piirit lema. Ja selleks on üks üsna selline töine ja, ja käe pärane viis on tegelikult vaadata seda, mida Regionaal ja põllumajandusministeeriumi juhtimisel on koostatud selle aasta alguses üks raport, kuhu on joonistatud üks kaar t. Ja selle kaardi, selle kaardi peale on need eriti need tumerohelised alad siis, mille st, millest me täna eeskätt rääkima hakkame. Aga piir ei ole meie jaoks kindlasti mitte mingisugune üks asi, ta ei ole ka üks era ldusjoon, ta on väga mitmekihiline nii kultuuriline taristuline sotsiaalne nähtus, et see on selline tõesti mingis mõttes sotsiaalne ruum ja tehniline ruum ja sümboliline ruum, millel on oma lood, oma maine, omad rõõmud ja mured. Kumalane on meie paneelis kindel, kindel tegija. Vaatame, et keegi nõelata ei saa. Ehk siis jah, me räägime sellest piirialast tõesti võib-olla täna oluliselt vähem sellise s kaitse ja taristu ja, ja selles tähenduses, vaid pigem inimese, majanduse, kultuuri identiteedi elu enese tähenduses. Ja, ja nüüd ma küsiksingi, alustades siis meelest, et mis on sinu puutumus piirialaga Ma kahtlustan, et üsna lähedane.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="249.92" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:10–5:33</span></span><span class="segment-text">Üsna lähedane, tõesti viie kilomeetri lähedane, et mina elan siis Setomaal. Kolisin sinna kakskümmend aastat tagasi Tartust, olen Tartus sündinud ja kasvanud. Ja nüüd mul on siis täpselt pool elu juba Setomaal veedetud. Ja meil oli abikaasaga kohe mõte see, et meie valime endale töökoha elukoha järgi, mitte elukohta töökoha järgi, sest elamine on ju hoopis olulisem. Ja meid tõmbas Setomaale just see tugev kogukond, eriline kultuur. Sellised väärtused, mida tänapäeva maailmast on tegelikult juba üsna raske leida. Ja kolisime muidugi noorte ja uljatena päris sügavale metsa sisse, saime seal neli la st ja siis avastasime, et natuke üksildane on võib-olla lastel ja hakkasime siis otsi ma endale häid naabreid. Ja olime selles väga edukad. Et nüüd on meie koduküla metsaja üks Võru maakonna nooruslikumaid külasid, meil kolm ekümne kuuest elanikust neliteist on lapsed ja meil on tõesti selline hästi tore mõt tekaaslaste kogukond, kus on koos nii need põliselanikud kui uued elanikud ja ja on väga -väga ilus ja turvaline elu, et võib-olla ei vasta sellisele standardsele pildile, kui te kujutate ette piiriäärset elu.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="333.12" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 5:33–7:07</span></span><span class="segment-text">Aitäh, Kai, kuidas sul piirialaga lood on? Jah, mina ise tegelikult olen Kesk-Eesti tüdruk Viljandist. Tulin kakskümmend aastat tagasi Tallinnasse, sinna ma jäin, aga tööalaselt ma olen iga päevaselt seotud idapiirialadega juba läbi regionaalpoliitika arendamise. Ja täpsemalt idapiirialadega Ida-Virumaaga, ma olen Ida-Virumaa investeeringute agent uuri nõukogu esinaine. Et see, see annab hea pildi, et näiteks näide, et kui sõda algas, siis tegelikult Ida -Virumaa investeeringute agentuuri tööstusaladele kakskümmend investeerimisprojekti ka tkes, see tähendab reaalselt kaheksakümmend miljonit eurot jäi tulemata, mis on kolm sada töökohta ehk üsnagi markantne näide. Aga ma idapiiriala Isamaa tööalaselt vaatan siukse laiema regionaalarengu spektri läbi , et meil on, eesmärk on väga lihtne, et iga inimene Eestis, kus iganes ta elab, et tal peab olema mõistlikus kauguses töö, kodu ja vajalikud teenused ja ka tuleviku väljava ated, et me oleme näinud, et sihukesest tugevas toimepiirkonnas on seda võimalik saa vutada. Keeruliseks teeb muidugi selle, et seda me peame ühiskonnale jõukohase kuluga tegema Ja, ja see kaarts idapiirialadelt, et ka me vaatasimegi, et miks just need piirkonna d sai valitud, oli sellepärast, et seal avalduvad niisugused kolm survet, ega need või vad ka aja jooksul muutuda. Üks surve, see on seal pikaajalised regionaalarengu probleemid ehk ääremaastumise teema d. Siis teine surve on siis otsene geopoliitiline mõju ja kolmas on siis katkenud sihuke värav või sild siis ida-lääs. Et see on siis minu kokkupuude.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="431.52" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 7:12–7:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">sulle, Lauri. Tervist, et mina olen Lauri Alonen ja, ja mina puutun piirialaga tegelikult igapäeva selt selles mõttes kokku, et ma elan seal, et ma täna hommikul puutusin mitu korda kokku , kuni me autoni läksin, eks ju, et et praegust hetkel ma kokku ei puutu, aga aga mu idu üheksakümne neljandast aastast jah, kui ma ülikooli Tartus lõpetasin, siis sellest ajast saadik ma olen Ida-Virumaal tegutsenud ja toimetanud ja, ja siis erinevate erinevate valdkondadega, et viimase aja selline aktiivsem tegevus on puudutanud siis õiglast üle minekut, õiglase ülemineku programmi ja siis täpsemalt veel Jõhvi filmi filmilinnaku nagu teenuste teenuste poole käivitamist.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="550.28" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 9:10–12:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No nõnda jah, tõepoolest meil on kõigil midagi piirist kogetud ja, ja teatud ja seda seda kõike me tahame siis teiega siin täna jagada. Aga, aga mitte ainult nii, et siin targad arvavad, argumenteerivad, analüüsivad, vaid meil on rahvale loodetavasti üsna tuttav Slido formaat ka käi bel, nii et me võtame teie mõtteid mõne sellise loodetavasti mõtet ärgita va küsimuse kaudu selle jutuajamise vältel ja, ja loodetavasti neid arvajaid ja mõtle jaid ja, ja kaasa küsijaid ja ettepanekute tegijaid leidub, et me saame siis üheskoos ekraani pealt neid ka vaadata ja nii-öelda publiku või osalejate arvamusfesti valil tuleb öelda osalejad ei ole publikut ja, ja esinejaid. Me kõik oleme siin koos, ühine, ühine aju. Et need me võtame siis oma jutuajamise lõpupoole, et siis käib ka mikrofon ringi ja saab küsida ja vahepeal siis saab tõesti küsida veebi vahendusel, kuna meil on ka veebiüle kanne, siis üritame kõiki võrdselt kohelda, et ka need inimesed, kes üle veebisil la vaatavad, saaksid oma küsimusi küsida. Ja vaatame, mis sellest lõpuks siis kõik välja tuleb, aga enne veel, kui hakata arutama, et mis seal piirialal siis täna on ja ilmselt on seal nii muret, nii muret kui rõõmu. Et tahaks ma kutsuda teid üles nii paneliste kui ka siinviibivaid inimesi Slido kesk konna kaudu. Korraks võib-olla paneme isegi silmad kinni ja mõtlema, mis on kaheksandal augustil kaks tuhat kolmkümmend kuus. Nendel aladel, mida me selle roheliselt kaardil märgituna nägime. Mis me tahame, et piirialadel oleks, mis sorti elu seal oleks? Ja see ei ole kindlasti mitte ennustus, võistlus, et kes kõige täpsemini prognoosiga täppi paneb, et mis reaalselt juhtuma hakkab, seda me ennustada ei
