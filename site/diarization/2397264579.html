<button type="button" class="segment-card" data-segment-id="segment-0088" data-start="5262.96" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 87:43–90:23</span></span><span class="segment-text">Ja ei tegelikult edulugusid veel, võib-olla sinu toredatest elukohtadest, et kutsuge Eva enda juurde elama, siis te saate koha, kus on edulugu. Teine edulugu on siis meil Saue vallast, kus on selline algatus nagu Rattaga Kool&quot; ja seal tõepoolest, tegelikult on need vahemaad selles linnaäärses ajaasustuse s, mis on tegelikult probleem ja seal ei jää püsima ei ükski, olgugi et rahvast on pi isavalt, aga meil ei jää kõrtsud püsima, meil jääb midagi püsima nendes uusasumites. See on eraldi teema, millest ma väga tahaks rääkida, et, et tegelikult me planeerime neid uusasumeid selles mõttes valesti, et me ei pane inimesi niimoodi elama, et nad seal uusasumis neid teenuseid tarbiks. Me ei tee uusasumeid, kuhu peaks väljastpoolt keegi tulema, me kogu aeg reklaamime seda , et tulge rohelus viisteist minutit kesklinna, noh, stiilis, stiilis asju, aga miks ma peaks sinna rohelusse tallinlasena minema, kas seal on mingi vaatamisväärsus, kas seda koha, me rääkisime sellest kohaturundusest, kas seda kohaturundust seal kohapeal on, see on tegelikult see, et liikuvuse poole pealt, kui me planeerime neid bussisõi te, siis need peaks olema kahesuunalised. Siis on meil see asi palju, kuidas öelda paremas balansis ja rahaliselt on meil ka võimalik neid asju teha, ehk siis alati me räägime ühest küljest, me oleme rääkinud siin, et ma alt peab linna saama, aga me ei ole rääkinud sellest, et, et tegelikult peaks see teist pidi liikumine ka olema. See on väga tähtis, et, et, et see oleks ja see aitaks meil tegelikult kogu seda asja , kuna me nüüd oleme, aja vist oleme täis rääkinud, siis ma seda, seda nagu siin ei, ei jõuagi võib-olla avada, et need tegelikult neid teemasid on meil siin veel päris palju , mida, mida mainida. Et, et iseenesest jah, üks soovitus on tõesti, et kutsuge Eva enda juurde elama, siis te saate vähemasti mingisugused asjad korda, jalgrattataristu ja nii edasi, aga võib -olla siis need asjad, kui me need kokkuvõtte teeme, sest kõigepealt ma küsin teilt ehk siis meil on jälle Slaido küsimus, aa ei ole enam, okei, siis me seda ei küsi. Et kui me siin võtame kokku, et mida meil selle regioo- regionaalarengu parandamiseks kõige rohkem vaja on, et, et kui ma seda juttu kokku võtan ise, siis me oleme rääkinud sellest, et me tegelikult tahame neid kiireid ühendusi, me tegelikult oleme isegi valmis sealt ka autost välja tulema, kuigi see ei ole võib-olla maailma kõige suurem eesmärk nende asjade puhul. Meil on võimalik maal elada, kui me saame oma teenused mõistlikult ja hästi kätte. Aga kõige tähtsam, et meil oleks seal ka teised inimesed ees, isegi kui sa metsa lähe d, jääme kihla, et sa oled seal metsas võib-olla kaks nädalat, isegi pead vastu peaa egu üksi. Võib-olla, aga seejärel sa tahad juba inimestega suhelda.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0094" data-start="5472.64" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 91:13–91:31</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Inimesed peavad ise oma kodukandis positiivselt rääkima, või seda kuvandit edastama. Ehk siis see on see koha turundusosa, kui sulle endale meeldib su elukoht, siis tänu see sõna levib ja kui on mingid probleemid seda kriitilist kogukonda juba nii palju, et kes saavad selle ära lahendada.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0095" data-start="5490.84" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 91:31–91:42</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma ütleks lihtsalt üks sõna koostöö ja see on ülioluline, et asjad hakkaks laabuma, siis on vaja teha erinevate osapoolte pealt tihedat koostööd.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0096" data-start="5502.36" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 91:42–92:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Samasse kohta tahtsin tegelikult välja jõuda, et me peame just nagu strateegilisest va atest, me peame nagu lõpetama ära nende asjade eraldi tegemise. Et iga valdkond planeerib ise ja siis vaatame, kuidas see kõik kohapeal kokku jookse b, et et nii valdkonnapõhiselt või valdkondade üleselt koos planeerima, kui ka tegelikult just see, et omavalitsus ja riik nagu koos.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0097" data-start="5526.64" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 92:07–92:16</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mul on, kuidas öelda, mul on suur tänu teile, et te, et te jakssite kuulata, need mõ ned inimesed, kes siin lõpuni vastu pidasid. Rain tahab veel öelda.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0098" data-start="5535.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 92:16–92:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma tahan öelda seda, et tegelikult on riiki väga lihtne juhtida. Riik annab siis, loob võimalused, omavalitsused loovad elukeskkonna ja inimesed vali vad. Ja selle ilusa ringi sinna ring panna ja sinna kirjutada finants, ehk siis kuidas siis need asjad niimoodi jaotada ja nii lihtne see tegelikult ongi.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0099" data-start="5558.16" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 92:38–93:14</span></span><span class="segment-text">Jah, suures plaanis me lahendasime praegu regionaalarengu ära, et suur, suur Rain, et sellega on kõik öeldud ja ega meil siin midagi muud ei olegi, aga noh, iseenesest de taile, millest rääkida, oleks veel veel maa ja ilm ja ja ma siiralt loodan, et kuskil mingis ringis, kas või omavahel, me jõuame ka sellest rääkida ja, ja mis veel tähtsa m võib-olla jõuame ka sinnamaani, et need arengud tõesti selliselt läheksid, et, et meil oleks nii linnast maale kui maalt linna kõik variandid ja võimalused olemas. Et me saame ise valida, mida me tahame teha oma elus ja see oleks vaimustav.</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
