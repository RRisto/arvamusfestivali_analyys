    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.16" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 0:11–3:57</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No nii, tere tulemast hea arvamusfestivali kuulajaskond, huvilised, meie panelistid , kes täna on siia Paidesse kohale tulnud. Mille nimi on Triin Ploompuu. Töötan igapäevaselt Tallinna tehnikaülikoolis ja mul on väga põnev töö, nimelt ma olen inseneriakadeemia arendusjuht. Olen inseneeria valdkonnaga kokku puutunud, ma arvan, viimased viisteist aastat ja see tõttu tuli mulle väga suureks üllatuseks tulla just õpiampsudest siia rääkima, sest et inseneeria tavaliselt ikkagi eeldab sellist pikaajalist väga rasket reaalteadust ja tead mist ja õpet ja, ja tegelikult see minu kogemus näitab, et tegelikult see õpian ks just inseneerias on ka üks suur edasiviiv trend, samamoodi ka kõikides teistes di stsipliinides. Nii et õpiampsud hakkavad kogu meie haridust ja elukestvat õpet mõjutama ja igat tööta jat, igat organisatsiooni ja seetõttu ongi hea meel täna tulla siia seda teemat avama väga väärikas seltskonnas, väga õigete inimestega, kes selle teemaga iga päev siis kokku puutuvad. Ma veidikene uurisin infoks selleks, et võib-olla veidi siia lainesse jõuda, et mis siis selle õpiampsude osas meil Tallinna Tehnikaülikoolis toimub ja on selgunud, et pa ari viimase aasta jooksul on siis näiteks mikrokraadide arv kahekordistunud ja need inimesed, kes siis mikrokraade tulevad omandama, et nende arv on vähemalt nelja kordistunud, nii et see üha rohkem jõuab inimesteni, inimesed näevad sellest olulist kasu ja väärtust ja, ja see on põhjus, miks me nende uute trendidega peaksime oma iga päevases töösse hakkama rohkem arvestama. Meie tänases paneelis on, nagu ma juba nimetasin, väga selline kihvt, hea selline tõesti ekspertvaade tuleb siit meiega, on täna meie haridus- ja teadusminister Krist ina Kallas. Meiega on täna andragoog ja Tallinna haridusasutuste värbamisjuht Anneli Tank. Meiega on täna Saku Metallallhange tehase tegevjuht ja ka väga pikaajaline kogemus in seneerias Kert Kivimaa. Tere. Ning Kaia Laineste, kes on Circle Kaltikumi koolitusjuht. Tere. Ja ausalt öeldes, kui ma tänast seda paneeli ette valmistasin, ma helistasin kuskil viie le, kuuele personalijuhile ja küsisin, mis asi on õpiamps. Ja, ja ma sain seinast seina vastuseid, et, et kui näiteks keegi näiteks mõnda huvitavat videot kuulab, et on juba õppijamps või loeb blogipostitust või käib , omandab mikrokraadi, see on juba õppijamps. Ta läks liiga laiaks ja, ja seetõttu ma näengi, et, et võib-olla ma hea meelega taha kski alustuseks teilt kõikidelt küsida. See ei pea olema definitsioon, aga kuidas te tajute, mis asi võiks olla õpiamps ja, ja siis ma mõtlesin küsida ka, et millise õpiampsu ise viimati läbisite, nii et kohe alus tuseks kaks teemat, mis asi võiks olla õpians ja millal see mõne õpiampsu läbisite. Kaia, hakkame peale sinust.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="481.08" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 8:01–12:57</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Täna hommikul uuendasime Smart-ID-d, sain päris palju targemaks, kuidas seda teha. Tegelikult enne siia tulekut siin, ma ei tea, kaks nädalat tagasi ma olen erinevate inimeste ga vestelnud töö juures mujal ja küsinud, et ma olen kahe nädala pärast see arvamusfe stivalile tööaks või sellest õpiampsust rääkima ja siis esimene noh, tegelikult mitte keegi ütleb väga palju. Nad ei tea seda terminit üldse nagu, et, et see on nagu tegelikult ei ole veel inimeste l nagu omaseks saanud. Pigem küsiti, et kas sa mõtlesid ampsu? Ei, õpiampsu. Okei. Aga ütleme, et kui ma nüüd niimoodi juba olen selles teemas nii-öelda kaasatud ja, ja pikemalt nagu mõtelnud, siis mina olen jõudnud nagu järeldusele, kas või meie ettevõ tte näitel seda, et õppijamps nii-öelda kontoritöötajale tähendab midagi muud kui õppi jaamist tootmistöötajatele. Et me pärast saame võib-olla tootmistöötajatest ja ristkoolitustest ja kõigest sellest nagu rääkida. Aga ka üldiselt jah, meil ju ettevõttesüsteem toimib nagu niimoodi, et, et kas siis kord või kaks korda aastas toimuvad inimestega arenguvestlused või face-facevestlused. Selle käigus pannakse siis paika ütleme siis koolitus või täiendumise vajadus, mis on siis selle inimese vajadustest nagu lähtuvalt, et eelkõige jah, oma senist tööd parem ini teha. Teine variant on see, et meil on ka ettevõtte näiteks strateegilisest plaanist või ees märgist tulenevalt või lihtsalt igapäevasest, kus me, mis valdkonnas me toimetame, seal t lähtuvalt tekkinud ülesse siis nii-öelda õpiampsu järgi vajadused, ma toon näite, et me kuna me oleme metall, metallitöötlejad, üks osa on keevitus, seal protsess, siis me kuna meil ettevõte on sertifitseeritud keevitusstandardi järgi, siis meie peame, meil peab olema kaks keevitusinseneri paberitega ja meil juhtus niimoodi, et meil oli üks inimene olemas, aga teine inimene. Teine inimene, teise inimese teenust ma ostsin väljas sisse, aga otsustasime, et meil on seda teadmist majas seest vaja ja siis me saatsime inim- , ühesõnaga arendusjuht o tsis programmi välja, leidsime majas sees inimese, kes oma töö olemuselt ja ise ka mo tivatsiooni mõttes soovis selle teadmise omandada. Tegi selle programmi läbi, see oli lausa, ma mõtlen, kolm kuni äkki isegi neli kuud käi s välismaal veel tegi eksamid, tuli tagasi ja, ja saigi siis keevitusinseneri sertifi kaadi ning ütleme, et vastavalt sellele ka tema motivatsioonipakett ja kõik, ma ei tea , töötasud, kõik saadi korrigeeritud, aga ütleme, et üks näide siis praktiline, kuidas siis inimene läbis tööampsu ja, ja sellega. Mul endal ka juba tervise ka, ühesõnaga õpi ampsu ja, ja, ja seeläbi ka tõstis oma siis motivatsiooni. Ma ühe asja sooviksin veel rääkida, et mul on varasemast kogemusest selline olukord. Ma arvan, et, et väga paljud, ütleme no tootmisettevõtted küll on pigem selles kinni , et, et kui kedagi koolitada, siis see koolitus peab olema selle eesmärgiga, et inimene just seda oma igapäevatööd saaks oskuslikumalt teha. Mul oli selline olukord, kus olin tootmisjuht ja siis ühes osakonnas oli liinijuht, kes õppis hoopis meditsiini. Mõnestaja, kui ma õigesti mäletan, kas ta sai kiirabiõeks või, või kelleks sellist, no ja siis tegelikult esimese sooviga tekib nagu konflikt, et mis asja on, et, et või kuidas , aga me arutasin seda ka mõne ajast ühe väga pädeva personal i valdkonnas töötava inimesega ja tegelikult ütleme, jõudsime nagu sellise aru järel duseni, et kui ma võtan nüüd iseennast, et ma olen erinevaid töö nagu erineva iseloo muga töid teinud niisugune kolm kuni viis aastat, et sul selle aja jooksul tegelikult tekib ambitsioon omandada midagi uut, see on nagu selline loomulik ring, mõnel inimese l tekib, mõnel ei teki nii, aga miks ma peaksin nagu eeldama siis seda, et selle too tmises töötaval inimene, tema on kogu aeg kümme aastat, teeb mul seal ja on kogu aeg olemas ja nii edasi, et miks temal ei võiks siis ehk siis ma ütlesin nagu sinna sellise le järeldusele, et kui nüüd inimene, vahet ei ole, et ta teeb siis täiesti oma igapäeva tööle hoopis teist, omandab seda õpiampsu või seda mikrokraadi mingis täiesti teises valdkonnas. Siis tegelikult tuleks teda toetada igal juhul soosida, kui inimene tuleb ka selle ide ega, et kuule, et mul tekkis soov, et õppida, mine. Et ma leian, et see ja tegelikult ma usun ja ütleme, nähes kõrvalt ka, et kui inimene nüüd omandab või tal on võimalus antud ettevõte toetab ka tal koolis käimist, saame töö graafikud kuidagi sättida niimoodi paika, siis. See tegelikult tõstab selle inimese motivatsiooni, tahet ja kui ta tuleb tööle, siis ta on samamoodi oluliselt rõõmsam, keerulised asjad lahenevad oluliselt lihtsamalt ja ja ta on ka siis nii-öelda kohusesuundlikum.</span></button>
