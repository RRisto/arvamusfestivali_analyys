    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.36" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 0:11–1:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tervist, minu nimi on Annika Arras ja mina ei ole ITK spetsi alist. Mina ei tööta tehnoloogiasektoris. Aga ma oskan rääkida. Ja selle tulemusena on mul täna suur au seda väga sümpaatset paneeli siin juhatada ja ma loodan, et meil tuleb sisukas ja huvitav arutelu ja teie olete täpselt see ideaal ne publik, kes mõtleb kaasa, küsib küsimusi ja võimalusel ka vaidleb vastu. Sest siis on vestlus huvitavam. Ja selle arutelu on ellu kutsunud Haridus- ja Noorteamet ja kood/Jõhvi. Aitäh teile, et te nii olulise teemaga tegelete. Minul isiklikult on naised juhtimises, naised tehnoloogias, naised poliitikas väga sü damelähedane teema ja ja seetõttu ma arvan, et mida rohkem sellest räägitakse, seda suure m see teadlikkus on ja, ja me tegelikult ka seda murekohta lahendame. Täna on meil siis selline suur oluline küsimus, kes ütles, et tehnoloogiasektoris tööta mine pole naistele? No kes ütles?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="80.76" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 1:21–1:24</span></span><span class="segment-text">Mees.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="84.12" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 1:24–2:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Selge, aga nüüd kuna, kuna meil on vastus käes, siis võime siinkohal ka laiali minna , eks. Ja. Proovime siis niimoodi toimetada, et kui te tahate küsida, siis andke mulle käega märk u ja meil on Heleni käes on mikrofon ja ta toob teile mikrofoni, aga kui te tunnete, et sugugi ei tahaks teiste ees rääkida, siis meil on võimalik kaasa rääkida ka nii, et te avate selle QR koodi oma telefoniga ja siis saate sealt küsimusi küsida ja ma aeg -ajalt jälgin seda ka. Ja, ja me mõned küsimused esitame teile ka, hea publik, nii et saate kaasa mõelda ja trikiga küsimusi ei ole, et loodetavasti saate hakkama. Nii, aga ma võtan istet ja, ja lähme liikvele ja, ja ma tutvustan siis, õigemini nad saavad ise tutvustada, aga ma teen otsa lahti, kes siin minuga koos siis täna on. Nii, ja nüüd on see IPad lukus. Oh, ta tuli lahti ka. Hüva, aga hakkame otsast pihta. Ja kõigepealt ma annaks sõna Liinale, Liina Kanter on üks siis korra ldavatest osapooltest, ehk siis Harnost ja Liinat ma tunnen muidu ka, aga seetõttu ma ikkagi lasen sul ennast ise tutvustada, sest et sa ise tead kõige paremini, mis on an tud tänase teema kontekstis oluline, mida sa endast rääkida võiksid.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="172.16" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 2:52–3:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Tere kõigile. Harnos olen täna sellises rollis nagu haridusuuenduste osakonna juht. Aga varasemalt olen tegelenud siis soolise võrdõiguslikkusega, võrdse kohtlemisega. Tegelikult töötades ka mõni aeg tagasi LHV pangas, kes peab ennast IT-ettevõtteks hoopis ki. Justkui olen olnud IT-sektoris ka. Ja, ja siis need kaks teemat kokku IKT ja, ja naised on saatnud mind ka juba päris mitmeid aastaid. Aga siis tõesti minu osakonnas täna töötab väga palju toredaid ja tublisid inimesi ja juba pikki aastaid on tegelenud Eestis siis IKT ja muuhulgas nüüd ka inseneeria niisu guste prioriteetsete teemade vedamisega.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="226.84" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:47–4:03</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh ja minu kõrval istub Liis, kes juhib sellist ägedat punti nagu ma proovin seda nüüd tõlkida nagu ükssarvikute kamp või. Räägi meile, mida, mida, mida sa teed?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="242.88" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 4:03–4:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, mina olen Liis ja tõesti juhin sellist ettevõtmist nagu HK Unicon Squad ja HK Unicon Squad on Eesti esimene. Minu teada ka ainukene. Ainult tüdrukutele mõeldud tehnoloogia kool ja see sai alguse siis kaks tuhat kaheksa teist, ehk ma olen seda juhtinud siis nüüd juba seitse aastat. Ja, ja, ja põhimõtteliselt on siis erasektorist alguse saanud ini tsiatiiviga, mis, mis algas justkui, justkui viieteist tüdrukuga lihtsalt väikse huvi ringina ja on nüüdseks siis kasvanud üle-eestiliseks väga-väga suureks, väga-väga po pulaarseks. Tüdrukute kooliks ja meie koolist on siis läbi käinud nüüdseks juba viis tuhat tüdru kut. Et niisugune tagasihoidlik tutvustus.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="296.2" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:56–5:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tagasihoidlik viis tuhat, see on väga uhke number. Aga me räägime sellest täna kindlasti veel. Ja siis Tuuliki, sina töötad tehnoloogiaettevõ ttes, aga kas sa oled ise ka insener või mis sa teed seal?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="313.96" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 5:14–5:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mina töötan tõesti tehnoloogiaettevõttes, finantstehnoloogiaettevõttes Wise, mis on üks Eesti edukamaid ükssarvikuid ja mina ei tööta tehnilises rollis, olen globaalne personalifunktsiooni tiimijuht ja igapäevaselt partnerdan siis meie ju htidega kõikjalt üle kogu maailma, aitan paremat Wise&#x27;i ehitada, aitan paremat tööta ja kogemust luua ja aitan neid nügida selles suunas, et tuua rohkem naisi tehnoloogi asektorisse.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="347.12" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 5:47–6:04</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh sulle tutvustuse eest ja, ja siis on meie väärikas rivis ka üks tarkvarainsene r ja ja Johanna Stiina on kood/Jõhvi lõpetanud. Räägi meile, kuidas sa jõudsid selleni? Et sa sinna läksid õppima?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="364.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:04–6:36</span></span><span class="segment-text">Kuidas ma jõudsin selleni. Tere kõigile ka minu poolt. Oli niimoodi, et kõigepealt ma läksin bakalaureust õppima geenitehnoloogiasse, vahepe al töötasin Tonis, üritus turundus valdkonnas, siis aitasin ka filmifestivali korralda da ja siis lõpuks jõudsin kuidagi kood/Jõhvisse ja ju siis turundus oli nii hea. Ja see võlus mind ära ja siis ma läksin sinna ja sealt nüüd siis töötan finantstehnoloogi a startupis nimega Re Itarate ja igapäevaselt jah tarkvarainsenerina.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="395.84" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:36–6:38</span></span><span class="segment-text">Kas sulle meeldib see töö, mida sa nüüd teed?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="398.2" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:38–7:06</span></span><span class="segment-text">Meeldib küll, see paneb nagu väga proovile ja ma saan igapäevaselt mingeid uusi huvitav aid asju välja mõelda ja antakse nagu väga palju vabadust ka. Ja kuna selles mõttes, et need probleemid ei saa nagu kunagi otsa, siis ei ole ka nii sugust nagu kartust, et mul võiks see töö otsa saada või et mul võiks nagu igav hakata Pluss meil on hästi palju erinevaid valdkondi, kus on IT vajalik, saab ka vahetada, kui näiteks ütleme, kopa ette viskab, üks valdkond.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="426.4" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:06–7:15</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Eks sa valisid endale sellise turvalise töökoha, et täiesti kindel on, et sellise pro fiiliga inimesi, eksperte on kogu aeg vaja.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="435.48" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:15–7:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja tõsi, aga ega mul ei olnud nagu tegelikult nagu eesmärk, et see on kindel asi, mille ks ma tahan saada, tegelikult õppeajal ma nagu väga palju mõtlesin ka, et oot-oot-oo t nagu tarkvara arendaja, et ma ei tea, et ma ei tunne ennast üldse sihukese inimese na, et mingi kuskil nurgas üksinda mingi koodin ja mingi kellegagi ei räägi, et selles mõttes, et see, ma ei usu, et see ikka on mulle, aga noh, ma teen selle programmi umbes lõpuni ja siis vaatame, mis edasi saab.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="460.4" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:40–8:49</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah, nii. Kas publiku hulgas on inimesi, kes on ise tarkvaraarendajad, käsi püsti? Üks, kaks, kolm, neli, viis, kõik olid naised, nii tore. Väga hea, aga nüüd oleme tuttavaks saanud ja, ja asume siis asja kallale. Ma tahaks kohe teile anda ühe küsimuse, hea publik, et te saate siis harjutada, kuidas seda QR-koodi kasutada, et see on ka selline tehnoloogilise kirjaoskuse väikene õppe tund. Aga, aga enne seda veel. Ma mõtlesin, et me võiksime omavahel ühe asja selgeks teha, millest me räägime, kui me ütleme sellise ilusa tähekombinatsiooni IKT või kui me räägime tehnoloogiasektorist, et kuidas te seda defineerite, et kes on need inimesed, kes, mis sinna tehnoloogiase ktori sisse siis kuulub, sest inimestel on väga erinevad arusaamad sellest ja, ja me võiks vähemasti siin selles ringis täna sellest ühtemoodi aru saada ja siis me läheme asja juurde. Kes mikrofon on vaba.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0016" data-start="528.88" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:49–9:08</span></span><span class="segment-text">Ma võin alustada, ma kujutan ette, et see on siis IKT sektor, et mis valdkonnad siis täpselt sinna alla kuuluvad. Elektroonika, tarkvaraarendus, mingi telekommunikatsioon näiteks, teistsugused IKT-ga seotud mingid tooted, teenused, süsteemid.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="547.6" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:08–9:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Selline. Kõik olete nõus ja keegi tahab täiendada?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0018" data-start="553.76" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 9:14–9:46</span></span><span class="segment-text">Võib-olla lihtsalt laiemalt, et tehnoloogiasektor on need erinevad tehnoloogiaettevõ tted, kes loodavad, kes toodavad erinevaid selliseid tehnoloogilisi tooteid ja lahendus i ja äriregistris on ka siis sellise vastava koodiga. Aga IKT tööd on, võivad olla ka mittetehnoloogiasektoris olevad IKT tööd ehk et tehnilised rollid, mida võib-olla ka, mis iganes sektoris toiduainetööstus es, hariduses, kohalikes omavalitsustes ja nii edasi.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0019" data-start="585.76" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 9:46–10:16</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga see teema, mille üle me täna tahame arutleda ja, ja, ja kus me seda küsimust esi tame, et et kas on piisavalt naisi või ei ole ja kas võiks rohkem olla ja kuidas oleks rohkem naisi, siis me ikkagi räägime sellest, mitte lihtsalt IKT sektoris töötamisest , vaid me räägime naistest, kes tegelikkuses siis peavad ka ametit, mis on siis kas siis tarkvaraarendaja, tarkvarainsener ehk et siis ka tehniline amet nii-öelda, et siis saa me ühtemoodi asjast aru, eks.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0020" data-start="616.4" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 10:16–10:18</span></span><span class="segment-text">Jah, suures raamis on see nii.</span></button>
