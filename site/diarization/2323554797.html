ja on mõned käed püsti, joa, sest ma arvasin, et ma sellest saame hüpata üle, et, et need, need inimesed peaksid olema majandus teemadele päris hästi tuttavad. Hakkame siis, ja Urmas Varblane, Tartu Ülikooli majandusprofessor. Minu kokkupuude temaga peaaegu kümmekond aastat, Urmas ja õpilane ma ei ole, aga pea aegu kogu oma nii-öelda majandusalase elu, kui, kui Eesti majandusarengust on midagi räägitud, siis Urmase näpujäljed on seal kuidagi kuidagi juures olnud või on ta ise sellega aktiivselt kaasa löönud ja täna ka väga oluline mainida, et Urmas on Eesti Panga nõu kogu esimees. Erki Keldo. Minu jaoks mitte poliitiku moodi poliitik. Täna ka mulle tööandja, aga ärge saage sellest valesti aru. Ma olen siis nimelt EIS&#x27;i nõukogus, ise teen tööd ja see on sellepärast, et et E rki pjedest vajalikuks ja, ja kutsus, aga, aga Erki on praegu siis majandus ja tööstus minister ja tema all on, ongi kõik, ütleme Eesti olulisemad, mitte kõik, aga suur osa Eesti olulistest majandusarengu teemadest. Ja Hando Sutter pikaaegse rahvusvahelise rikkaliku juhtimiskogemusega tippjuht, kes täna veab tööandjate Keskliitu ja läbi selle esindab vist seitse tuhat pluss Eesti , Eesti ettevõtet ja teab päris hästi, mis, mis nende huvid ja, ja, ja mis nende vaja dused on. Nii, aga nüüd on tõesti see sissejuhatuse osa läbi ja läheme küsimuste juurde või teemade juurde. Ja alustame sellest, et, et mis see majandusareng, me ei pea seda defineerima, aga kas see üldse on kuidagi oluline teema, kas me üldse räägime siin mingist asjakohasest teemast, ole hea, Urmas.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="390.52" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:31–7:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah, ma alustan võib-olla siis tundub jah, et see on nii nagu iseenesestmõistetav, et miks majandusareng on oluline, aga ma arvan, et ma vastaks sellele niimoodi, et, et meil on, põhiseaduses on see kuulus preambula, mis ütleb, et meie kõige tähtsam on säilitada eesti keel ja kultuur ja, ja ilma tugeva majanduspõhjata ei ole see võimalik. Ja see tundub nagu väga priviaalne väide, aga ma arvan, et kes on käinud näiteks Lõu na-Itaalias, siis te näete linnasid, kus tundub nagu majade ehitamine on kuueteistkümne ndal sajandil lõppenud. Ja need on just need linnad, kus pärast seda on majandus käinud alla ja kus tegelikult nende riikide noh, eriti Lõuna-Itaalias on see drastiliselt näha, kuidas seal ei ole sellist majandust nagu seal oli, viissada aastat tagasi. Et ühesõnaga see ei ole nagu midagi, mis on automaatselt antud ja igavesti läheb edasi , et me peame kogu aeg tegelema, et see majandusareng jätkuks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="460" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 7:40–8:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ole Erki. Ja eks majandusareng, areng on ju selles mõttes ülikriitiline, sest me näeme, et kõik me inimesed, me tahame ju ajas alati paremini elada ja teistpidiselt me näeme, et majandus on elav organism, mis tähendab, et see ei ole kuidagi staatiline, et see, mis töötas kolmkümmend, nelikümmend aastat tagasi, ütleme, ma ei tea, tööstusmudel. See täna enam ei tööta tihti, sest see tähendab seda, et riigid, ettevõtted peavad kogu aeg uuenema ehk siis uhke nimega innovatsioon. See tähendab, et sa mõtled oma tegevust läbi, sa mõtled, kuidas see teha efektiivsema lt, kuidas oma tooteid, teenuseid nii-öelda keerulisemaks muuta või asendamatuks isegi see on veel eriti hea. Ehk selle tõttu me, me näeme ju, mis juhtub siis, kui majandus, eriti demokraatlikes riikides pikalt on stagnatsioonis, siis inimesed muutuvad pahaseks ja siin nad kas hääl etavad hääletuskasti juures, hakkavad protestima või veel hullem hääletavad jalgadega ehk lähevad minema ehk selle tõttu ma arvan, igale valitsusele, ühiskonnale on ülimalt oluline, et majanduskasv oleks järjepidev. See oleks süstemaatiline, sest kui majandus ei kasva, inimeste heaolu väheneb ja selle tõttu tegelikult hakkab ka ühiskonna rahulolu vähenema ja see võib viia väga problemaa tiliste, ütleme nii-öelda lõpptulemusteni.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="537.92" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 8:58–11:28</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja et kevadel käis meid Tööandjate Liidus intervjueerimas IMF-i delegatsioon Ja siis ma kurtsin talle, et, et ei lähe meil väga hästi, et majandus on olnud langu ses kolm aastat ja palgad kipuvad kasvama, inflatsioon on kole kõrge ja riigikulud kas vavad mürinaga ja ta vaatas, mida, mida rohkem ma kurtsin, seda rohkem ta hakkas naer ma ja siis ma lõpuks küsisin, et mis sa naerad. Et, et teema ei ole nii väga naljakas ja siis ta ütles, et tead, ma olen seda kõike va rem kuulnud. Ma ütlesin, kus sa seda kuulsid? Et sõbrad, et teiesugused riigid maailmas, kes on teinud kiiret kasvu ja on tulnud kuskil t üsna madalalt tasemelt ja ühel hetkel ehmatavad ära, et on tal jõudnud kõrgliigasse ja sümptomid on täpselt needsamad, et arvestage nüüd sellega, et olete astunud kõrgli iga uksest sisse ja siin on hoopis teised mängureeglid, et harjuge sellega ja kui te ei harju, siis tegelikult ei ole seal kõrgliigas midagi teha. Ja, ja see kõnetas mind väga, ma ausalt öeldes siiamaani vaikselt seedin seda ja mis on, mis on meie vaatest nagu probleem ja, ja lugesin väga head kokkuvõtet nendest meie sisendaruteludest, mis ka eile olid ja, ja seal jäi ka kõlama just see, et et mis me sealt Eesti tulevikult tahame. Ja ausalt öeldes noh, ma olen sellest nii palju rääkinud, et mul on numbrid peas, et kaks tuhat üheksateist, kaks tuhat kakskümmend neli riigikulud kasvasid seitsekümmend protsenti, samal ajal majandusnominaalselt nelikümmend viis protsenti, vahe on väga suur Ja nüüd on, nüüd on nagu see, et kui me näiteks lepiks kokku, et okei, see, et majandus ei kasva või kasvab oluliselt aeglasemalt, on okei, aga siis me peaks tegema selle, et me peaks ühiskonnas leppima kokku, et me anname kõvasti nii-öelda laseme lati alla ava like teenuste osas. Ja noh, riik tuleb ära kaitsta, seal pole midagi teha, ka kõik teenused noh, me ei saa lihtsalt jätkata kulutamist sellises mahus, sest meil lihtsalt raha ei teki ja tegelikult nii lihtne see ongi. Ja, ja minu arust Olavi Lepp ütles ühe väga-väga hea mõtte, et, et lepiks ühiskonnas kokku, et millise protsendi me võtame majandusest välja avalike teenuste finantseeri miseks. Üks number ja siis on hästi, et me teame, et üle selle noh, ja siis on poliitilised era konnad otsustavad, et mille peale täpselt ja kuidas nad kulutavad, otsustavad, milliste maksude nad koguvad, aga rohkem ei kogu. Aga siis on kõik huvitatud, ühtepidi, et pannakse tõsised prioriteedid paika, sest rohkem me kulutada ei saa, me ei saa lihtsalt midagi juurde panna ja teistpidi kõik mõtlevad selle peale, kus majandus kasvab, saab ju rohkem avalikes teenustes kulutada. Ja tegelikult nii lihtne see küsimus ongi, kui ma võiks nagu alguses asja lihtsalt, küll me keeruliseks jõuame minna.</span></button>
