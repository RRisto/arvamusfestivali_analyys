    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 0:12–2:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast, Paide arvamusfestivalile. Minu nimi on Priit Välja. Mina töötan Tartu Ülikooli Kliinikumi psühhiaatriakliinikus arstiresidendina ja mode reerime esimest arutelu, milleks on, kui keha haigestub, mis saab vaimust ja esimeseks looks sooviks teile rääkida, et miks see teema oluline on, et Kopenhaageni s on selline tore muuseum, õnnemuuseum. Seal on üks näitus, et kui, et mis kõige rohkem inimese õnne mõjutab ja on erinev ad kastid erinevate siltidega, erinevate raskustega ja saad seal ise tõsta neid. Ja kui mina läksin sinna tõstma, kuigi me oleme psühhiaater, tõstsin esimesena valesti , aga selgub, et kõige raskem on ikkagi vaimne tervis ehk see mõjutab meie õnne kõige rohkem, et sellepärast see teema on väga oluline. Üks reegel ka, et publikust küsimusi ma leian mõned hetked enne küsida, kui te il tunneb mingi hetk soovite väga midagi küsida, võite käega tõsta, aga ma ei pruugi seda küsimust tollel hetkel võtta. Aga ma leian ma mõned ajad, et publiku seas ka küsimused saada. Nii, ja alustamiseks kutsun lavale meie esimese panelisti, kelleks on Angela Korela. Tema on esimest tüüpi diabeedipatsient, kes sai diagnoosi üle viie aasta tagasi. Tema on loonud meie esimese diabeediblogi ning tegeleb Instagramis oma kontoga diabe edijutud, kus jagab oma kogemusi ja teadmisi. Palun plaksutame Angelale. Nii Angela, kas sa palun räägiksid pikemalt oma taustast, et kuidas sa, kuidas sa diagnoosi said, kui vana sa olid ja kuidas see kõik toimus?</span></button>
