    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.96" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 0:11–3:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tervist kõigile. Mul on väga hea meel teid kõiki tervitada Eesti Vähitõrjevõrgustiku ESKANi nimel Arva musfestivali alale Ausalt vähist. Kõigepealt ma tahan tänada kõiki, kes on siia tulnud, nii neid, kes on valmis oma tead misi jagama ja kogemusi ning kui ka neid, kes on tulnud kuulama, küsimusi esitama ja mõtlema kaasa. Arvamusfestivali mõte ju selles ongi, et erinevad inimesed ja erinevad vaated saaksid omavahel kokku. Täna räägime vähist. See ei ole lihtne teema. Peaaegu igalühel meist on kas isiklik kogemus või lähedase sõbra, kolleegi kaudu kokku puude vähiga. Aga vähitõrje ise on palju enamad kui ainult vähiravi. See tähendab ennetust, varajast avastamist, teadust ja innovatsiooni, head ja kättesa adav vähiravi ning tuge patsientide ja nende lähedastele. See tähendab ka otsuseid selle kohta, millist tervishoiusüsteemi ja ühiskonda me Eestis kujundame. Just sellepärast otsustasime Meskeniga pühendada selle ala vähiteemadest rääkimise ks. Eskän ehk Eesti vähitõrjevõrgustik loodi just selleks, et kokku tuua erinevad organi satsioonid, kes vähiravi pakuvad, kes viivad läbi vähiteadust, ennetust ühisesse võrg ustikku, kuid meid ühendab ka üks eesmärk. Koos vähi vastu ja tervema Eesti eest. Ükski organisatsioon ega asutus ei suuda seda eesmärki saavutada üksi. Vähitõrje vajab koostööd üle organisatsioonide, erialade sektorite ja vä hitõrje ei ole ainult tervishoiu küsimus. See on küsimus, kas selles, kuidas me ühiskonnana väärtustame koostööd, teadmisi ja tegelikult hoolimist. Võib-olla just see ongi üks hea põhjus, miks arvamusfestivalil on hea nende teemade üle arutleda ja leida ühiseid lähtekohti. Täna me räägime väga erinevatest külgedest vähist. Me räägime sellest, kuidas õige info õigel ajal patsientideni jõuab ja kelle vastutus see on. Me arutame, kuidas Eesti vähitõrjetaja viie aasta jooksul edasi viia. Me vaatame, kuidas tehisintellekt vähiravi võiks muuta ja kujundada ning räägime sellest , kuidas kõneleda vähist ja tervisest nii, et kasvaks teadlikkus, mitte ärevus. Ja puudutame ka üht keerulisemat teemat, surma ning selleks valmistumist. Need ei ole lihtsad küsimused ja tõenäoliselt ei ole nendele ka õiget vastust. Aga just seepärast tulebki nendest rääkida ja kujundada ühiseid seisukohti. Ma väga loodan, et kõik, kes siin on, ei jää ainult kuulajateks. Ma loodan, et te esitate küsimusi, võtate sõna ja kes ka soovib, võib-olla pisut vai elda. Head lahendused sünnivad sageli koos ja just siis, kui erinevad vaatenurgad kokku saa vad omavahel. Ma juba tänan ette meie paneliste, meie arutelujuhte ja kõiki, kes on oma tead misi ja aega selle päeva ettevalmistamisse toonud. Ja aitäh kõigile, kes on ausalt vähist ala kujundanud ja kõige rohkem tänan, et te kõik , kes käite siin, kuulate meid, et võtate selleks aega. Ma soovin teile kõikidele ausaid ja sisukaid vestlusi ja häid arutelusid.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="236.04" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 3:56–6:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Kujutage ette, et teid saadetakse esimest korda elus hästi suurde ehituspoodi. Üks müüja räägib sellest, kuidas valida soojustust. Teine seletab midagi hästi palju elektrijuhtmetest. Kolmas aitab valida kruvisid. Neljas soovitab seda, millist katust tasuks koju kaasa võtta. Kõik on oma ala eksperdid, kõik annavad väga õiget ja vajalikku infot. Aga teie küsimus on hoopis see, et ma ei tulnud siia kruve ostma. Ma tahaks tegelikult ehitada maja, kust ma peaksin alustama? Mida tuleb enne teha, mida tuleb pärast teha, kuidas kõik need jupid ja tükid omavahe l kokku jooksevad? Igaüks selgitab oma osa ravist, uuringutest, teenustest, info ise võib olla väga õige, väga vajalik, aga tervik jääb patsiendi enda panna kokku. Ja, ja seda just siis, kui elus on võib-olla kõige suurem kriis. Ja sellest võibki sündida infoauk, mitte tingimata sellepärast, et infot ei ole, vaid sellepärast, et seda tervikpilti ja süsteemi on keeruline luua. Ja selleks me olemegi täna siin, et arutada, kas me vajame rohkem kruve või me vajame ehitusplaani. Et vaatame, kuhu me jõuame ja mul on siin laval minuga koos panelistid, aitäh teile. Naeratused on näol, mikrofonid on käes, ma näen, et olete valmis. Ma sooviks, et te tutvustaksite ennast ise ja ma soovin, et te tutvustaksite ennast niimoodi , et just oma sellisest igapäevaprofessionaalsuse vaatenurgast lähtuvalt, et mis on see üks asi, mida sina sooviksid? Et vähipatsiente, mis on see üks lause, mida ta võiks kuulda õigel ajal ehk siis, mis on su nimi, paar lauset enda kohta ja mis on siis see üks lause, mida võiks patsient kuulda õigel ajal? Ja ma annan täitsa mõnusalt, ma näen Pille tegelikult siin täitsa noogutav, et nä <button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="373.96" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:14–7:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, tasu liiga aktiivselt noogutada. Tead, Valeeria ma nägin sind seal kohe hommikul onju, kui ma tulin ja minu l on täpselt see sama lause, mis on kirjutatud sinu särgile. Ehk siis see, et ma ei ole statistika. Et see info möllus liikumine pa neb sageli just mõtlema seda, et kui ma kuulen kellelegi mingit lugu, siis see juhtu b minuga. Kui ma loen mingeid tõenäosusi, numbreid, siis see kõik juhtub minuga. Et meil on vaja statistikat, aga ärge tehke endast seda nii-öelda statisti kat, vaid iga lugu on unikaalne. Ma pidin tutvustama ka ennast.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="424.76" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:05–7:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Just, kes sa oled?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="425.76" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:06–8:09</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Olgu. Aga ühesõnaga, et seesama veendumus on siis minuni jõudnud läbi üheksa aastase vähiteekonnal seiklemise. Oma sügavate orgude ja, ja kõrgete mäetippudega ja, ja, ja olen siis nii-öelda patsi ent või tegelikult see sõna meile enam ei meeldi, me oleme vähikondlased nagu me endi d tituleerime. Kui peab peab kuidagi tituleerima, aga väga nagu identiteedi kohta seda ka panna ei taha , et ma olen siis mitte patsient, vaid ma olen särav naisterahvas, kellel on diagnoo s, mitte et ma ei ole diagnoos. Et see tahab ka alati minna nagu nii-öelda võrdusmärgina. Aga minu siis teekond jah, üheksas aasta, kaheksa aastat selle või kaheksa korda selle üheksa aasta jooksul on nii-öelda haigus avaldunud ja, ja praegu siis neljas staadium , saan elu pikendavat ravi. Et elav näide, et saab lustida küll.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="489.28" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 8:09–8:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ehk siis Pille, meie särav naisterahvas diagnoosiga. Nii, kes on valmis järgmisena ennast tutvustama?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="497" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 8:17–9:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere hommikust kõigile. Olen selle paneeli ainukene arst. Onkoloogi staaži on kakskümmend viis aastat, nii et kakskümmend viis aastat olen selle haiguse ja ravi ja nende murede ja rõõmudega, neid on ja palju ja need rõõmud on mõnikord väga suured kokku puutunud olen olnud toeks, olen olnud lo hutajaks, olen olnud infojagajaks. Olen olnud olemas. Ja mõtlesin selle esimese lause peale päris palju. Ja arstina ma tahaksin öelda seda, et see algab kõik paraku diagnoosist, muidu ju patsiendid ja meie meie kaaskondlased ja, ja, ja aga , aga meie, meie ütleme haiglaringkondades ja, ja, ja ravimeeskondadele patsiendid meie ni jõuakski. Et see diagnoosi info raviplaani info haiguse info ja kui ta seda peab tulema nii õigel ajal ja nii adekvaatsena ja nii õigetest allika test kui vähegi võimalik, sest läbi selle hakkab kogu see järgnev teekond kulgema.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="580.56" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_09</strong><span class="timestamp">▶ 9:41–10:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Mina olen Kadi Grinal ja Taltech&#x27;ist ja tegelikult mitte ootuspäraselt. Tegelen hoopis ikkagi tervisekommunikatsiooniga ja ma tegelikult armastan ennast tut vustada kui proviisor sotsiaalteadlast, nii et natukene saan ravimiteemast ka aru. Aga täna on teaduse teemadeni viinud jah, sotsiaalteadustesse ja kui ma nagu ma tegelikult ütlesin vist onko festile esimest korda välja selle, et kuidas ma üldse siia jõudsin ikkagi läbi selle, et mul samamoodi oli ikkagi lähedane, kelle kõrval ma nägin neid ra skusi, mis pani mind küsima, et miks ei saa ja kus need kohad on ja, ja see ainuke la use, mida ma ise mõtlesin ja mida küll mitte ainult vähipatsientidega nii-öelda neid , neid oma uuringutesse kaasates. Aga mida ma ikka olen tajunud, on seesama võib-olla natukene lähtub sellest, mis Pil le juba ütles, aga just seesama, et tegelikult kõik kogemused on õiged. Et ei ole sellist asja, et sa koged mingit asja valesti sellel teekonnal.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="643.72" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 10:44–11:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Tere, mina olen Henri Ette-Liis, Meeliste, Tartu Ülikooli ajakirjanduse kommunikatsiooni magistrant ja tervisekommunikatsiooni uurija vist võib öelda selle kohta, mis minu roll ilmselt selles paneelis on, on see, et mina oma magistritöö raames kirjutan tead usartiklit sellest, kuidas kasutavad väikelaste emad tehisharu tervise kontekstis ehk jah, ja, ja muuhulgas ka olen uurinud ja uurinud praegugi sotsiaalmeedias tervise teema lisi arutelusid. See üks lause, mille, mida võiks kuulda, mis ei kehti minu meelest ainult üldse vähi patsientidele ja see on juba siit jutust läbi ka käinud, et sa oled endiselt sina ise , sa ei ole oma diagnoos. Sest hästi lihtne, ka minul endal on olnud ennast oma diagnoosiga samastada ka kui sa samastad ennast diagnoosiga, siis sa kaotad ära selle, et sul on endiselt see soov või delda, sa oled ikkagi seesama inimene, kes olid enne, et sa ei ole oma diagnoos.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="716.36" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 11:56–12:54</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Tere, minu nimi on Signe Punnisk. Ma olen kliiniline psühholoog, psühhoterapeut, töötan Tartu Ülikooli kliinikumi hema toloogia-onkoloogia kliinikus. Tahaksin öelda patsientidele seda, et ärge ärge kartke küsida küsimusi ar stidelt, õdedelt, spetsialistidelt ja, ja küsida korduvalt Sellepärast et me võime tõlgendada võib-olla mingisuguseid sõnu või vastu seid hoopis teistmoodi. Ja, ja kuna raviteekond on pikk, siis need küsimused võivad muutuda, neid võib juurde tulla ei ole olemas rumalaid küsimusi, nii et küsige.</span></button>
