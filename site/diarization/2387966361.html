    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:11–4:15</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast energilise majanduse alale, kus on, kus me käsitleme energiateemasid, aga mitte ainult, sest et järgmine teema on pigem k liima ja keskkonnapoliitika teema. Aga ka väga tihedalt seotud energiamajandusega. Me hakkame rääkima nimelt Euroopa Liidu CO-kahe heitkogustega kauplemise süsteemist E TS ehk siis rahvakeeliga CO-kahe kvoodikaubandusest. Seda arutelu korraldab Eesti Taastuvenergia Koda, mina olen Silver Sillak, Taastuvene rgia Kojast. Meie arutelu kestab seekord tund aega ehk kuuskümmend minutit. Et üritame teha kiiremini kui tavaliselt. Ja meil on siin palutud teemat avama neli eksperti, aga kindlasti ootame ka teilt küsimus i ja, ja, ja kui aeg on küps, siis annan, annan selleks sõna ja meil peaks siin olema inimesed, kes aitavad mul mikrofoni. Siis kätte anda teile. Aga alustame teemaga pihta, et nii-öelda ets on siis olnud Euroopa Liidu kliimapoliitik a nurgakivi aastast kaks tuhat viis. Miks me sellest räägime, eraldi siin Arvamusfestivalil täna. Seetõttu, et see on üsna eriline ja ka üsna oluline keskkonnapoliitika instrument, et see ei ole tavaline keskkonnamaks. See on selline turupõhine heitkoguste hinnastamise süsteem. Ja teiselt poolt see on olnud üsna mõjukas, et sellel on olnud ka, võiks öelda tavalise st keskkonnamaksust suurem mõju ja ilmselt tulevikus ka üha kasvav. Hea näide on see, et alates selle süsteemi kasutuselevõtust aastast kaks tuhat viis, Euroopa Liidu kasvuhoonegaaside heitkogused on vähenenud peaaegu nelikümmend protsenti Samal ajal kui samas sektorites uus puhas majandus on kasvanud seitsekümmend üks protsenti , me räägime siis peamiselt elektri ja soojatootmise sektorist suurtest elek trijaamadest või, või soojuselektri koostootmisjaamadest. Samal ajal on selge, et, et teatud tööstusettevõtted või isegi tööstusharud on selle süsteemi tagajärjel konkurentsist välja langenud või välja langemas. Et, et on ka negatiivne mõju. Viimasena, miks me seda teemat täna avame, on sellepärast, et teema on väga päev päeva kajaline, kuna äsja juulikuus Euroopa Komisjon on tulnud välja selle süsteemi reform i ettepanekuga mille kohta siis liikmesriigid, sealhulgas Eesti, hakkavad oma seisukoht i kujundama ja neid Euroopa Nõukogus läbi vaidlema et siis see mingisugune kompromis slahendus kokku leppida, et, et siin võib tulla uusi, uusi suur i muutusi. Arutelu eesmärk on siis anda teile ja meile kõigile parem ülevaade sellest, mis see süsteem on ja kuidas seda võiks reformida. Selleks me oleme kutsunud siia kõigepealt kliimaministeeriumist kliimaosakonna juhataja Laura Remmelgas. Terevõtjate esindaja Gren Eesti äride juht Margo Külaots. Tere. Energeetikaekspert, Eesti Teaduste Akadeemiast ja mujalt Arvi Hamburg. Ja keskkonnaekspert kliima- ja keskkonnaekspert Ivo Krustok. Tere. Hetkel vabakutseline, suvi on. Ma suunakski esimese küsimuse siis kohe siit Laurale, et, et noh, see CO2 heitkogustega kauplemise süsteem inimesele, kes ei ole sellega nagu süvitsi kursis, võib kõlada natuke nagu selline raketiteadus, et kas sa oskad selgitada mulle ja meile noh, kujuta ette , et nagu ma oleks su vanaema või nagu ma oleks su viieaastane tütar või, või poeg, et kuidas sa selgitaksid, et kuidas see toimib?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="254.76" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 4:15–7:50</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja et siin tuleb neid sõnu kindlasti väga läbi kaaluda, et kui nii keeru list ja tehnilist süsteemi proovida selgitada, aga hästi lihtsustatult öeldes on Euroopa Liidu heitkogustega kauplemise süsteem saastaja maksab süsteem ja selle ees märk on olnud kulu tõhusalt vähendada Euroopa nii -öelda suurimate heitkoguste heitkoguseid tekitavate sektorite ehk siis energeetika, suurtööstus, heitkoguseid ja teha seda siis nii-öelda tu rupõhiselt. Et süsteem toimib põhimõttel, et, et iga aasta kohta antakse ette siis kui palju tonne CO kahte Euroopa Liidu peale kokku suurtööstused ja elektri tootmine õhku paisata tohib. Ja siis ettevõtetel on valik, et kas nad kompenseeri vad oma heite, ostes siis neid ühikuid ja üks ühik vastab ühele tonnile CO kahe he itele. Või investeerivad puhtamatesse lahendustesse, et sõltuvalt sellest, mis on parasjagu kulutõhusam ja heitkoguste ühikute hind sõltub siis sellest, et mis , kui palju neid on ja kui palju neid vaja on ettevõtetel ehk siis nõudluspakkumise tule musel. Ja nagu sa mainisid, on see süsteem Euroopas ennast tõestanud. Ma vaatasin viimased numbrid, et isegi viiskümmend protsenti on nende sektorite heide vähenenud ja, ja ma võib-olla parandan ka siin selle ära, et tegemist ei ole kuidagi maailmas erilise süsteemiga, et neid kauplemissüsteeme on tegelikult päris paljudes riik ides ja ka kohalikul tasandil ja ka näiteks Ühendkuningriik, kes on Euroopa Liidust välja astunud, ka neil kauplemissüsteem jätkab ja nad hoiavad seda siis ka kooskõlas Euroopa Liidu süsteemiga. Aga jah, et et siin on ka küsitud, et tihti, et miks ei ole kehtestatud siis sellist konkreetset keskkonnamaksu ja, ja põhjus seisneb selles, et ma ks <button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="470.6" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:51–10:34</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ivo, soovid lisada midagi? Ei ega kõik on õige, et noh, põhimõte on hästi lihtlabane, kuigi süsteem ise on keeru line, et mida rohkem sa saastad, seda rohkem sa pead maksma või, või oma saastamise ära lõpetama, kokku tõmbama. Et meil noh, minnes nagu selliste väga tõsiste alusprintsiipideni ja sellesama küsimus ena, et miks meil üldse heitkogustega kauplemise süsteem on, me teame selliseid nii- öelda tõsist, tõsiseid baasfakte meie maailma kohta, mida me peame arvestama kõikide oma poliitikate puhul. Me teame seda, et kasvuhoonegaasid on tõsine probleem keskkonnas, me teame seda, et fo ssiilkütuste põletamine toob kaasa väga tõsiseid tagajärge läbi kliimamuutuse ja nüüd , kui me vaatame seda, et kus, kus see probleem kõige tõsisem on, kus neid fossiilkü tuseid kõige rohkem kasutatakse, kus see saaste on kõige suurem, siis me jõuame just nendesamade ettevõteteni, peamiselt nad toodavad elektrienergiat, nad toodavad erinev aid fossiilkütuste teri vaate, bensiine, erinevaid nii-öelda selliseid vedelkütuseid , nad toodavad väetiseid, teraseid, need on sellised suured mahukad tööstusettevõtte d ja nendel on vaja mingisugust motiivi, et siis noh, nagu oma ärihuvide kõrval ka ka tegeleda siis sellesama saasteaine vähendamisega. Sa võid öelda tõesti, et noh, et me väga palume, et seda heidet vähendaksite, aga noh , nendel on endal ka keeruline, kui sa oled täna, eks ole, ettevõte, sina võid tahta midagi head teha, aga kui su konkurendid nii-öelda ei, ei huvitu, lasevad üle, noh siis lõpuks lihtsalt oma heatahtlikkusega lööd ennast konkurentsist välja, ehk siis meil on vaja ühist süsteemi, mis neid nii-öelda ettevõtteid, kes teevad hästi, kes saastavad vähem, kes innovatsiooni panustavad, uusi ärimudeleid välja töötavad, sa annad neile midagi positiivset. Eks nad ei pea maksma ja nendele, kes keelduvad muutumast, sa sead järjest kõrgema ma ksu, et ma arvan, et see, mis sa välja tõid, Laura, et, et noh, tegu ei ole päris klassi kalise maksuga ja, ja ei saakski olla, on siin ka väga oluline, et, et heitkogustega kauplemise süsteem on üles ehitatud juba sellise mõttega, et et noh, okei, täna võib saastada nii palju, järgmine aasta natuke vähem ja nii edasi, et see, see nii-öelda hu lk saastet, mis üldse on võimalik Euroopas nende ettevõtete poolt õhku paisata iga aasta ga väheneb ja sellega siis nii-öelda see surve kasvab, see on ette nähtav, me teame, et üks hetk mingit tehnoloogiad peavad ära kaduma, me teame, et need ei ole mingi sa ja perspektiivis enam mõistlikud, nad korjatakse ära ja maks seda päris niimoodi ei tee , siis seda maksu peaks hakkama iga aasta läbi rääkima, tekiksid poliitilised jauramise d natuke ühele teisele ja tegelikkuses see ettevõtete nii-öelda pikem vaade, et noh, et kuidas siis see kõik neid mõjutama hakkab, läheb veel hägusamaks, et see tegelikult ei ole hea mõte.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="634.24" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 10:34–11:00</span></span><span class="segment-text">No Margo, ma pöördun nüüd sinu poole, sa oled Greni juht, Gren on üks Eesti suurimaid energiaettevõtjaid, peamiselt toodate sooja kaugkütet Eesti mitmes linnas, aga ka ele ktrit. Teie jaamad on selles süsteemis osalevad juba ammu. Kuidas see süsteem on teid mõjutanud? Ja, ja võib-olla ka Eesti kaugküttesektorit siis tervikuna, sa oskad öelda?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="659.56" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 11:00–13:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah, aitäh. Lisaks me tegutseme aktiivselt veel ka teises kahes Baltimaas ja, ja Ühendkuningriigi s, aga aga kuidas see heitmekaubanduse süsteem on siis kaugküttesektorit mõjutanud, noh , kui me hakkame tulemustest tagantpoolt niimoodi tulemustest pihta, siis Eesti kau gküttest seitsekümmend viis protsenti rajaneb taastuvatel allikatel või siis heitsoo jusel, heitsoojus on siis selline soojus, mida ei pea spetsiaalselt tootma, aga mis te kib mingisuguses kas tööstuslikus protsessis, mis on mõistlik ära kasutada. Et kui vaadata nagu sellest vaatevinklist, siis see tulemus on ju, ju super tegelikult , et kaugküttesektor on liikunud taastuvatele allikatele palju kiiremini Eestis kui ele ktrisektor. Mis sellega kaasnenud, kaasnenud on, et reeglina reeglid on need taastuvad allikad on ka kohalikud, mis tähendab seda, et, et varustuskindluse mõttes on juba päris suur vahe , et et nii-öelda me liigume impordisõltuvuselt nagu kohalikele allikatele on ju, et et, et tarnekiir just eriti tänases julgeoleku situatsioonis on see tarnekindluse as pekt hästi tähtis. Teiseks, kui see kütus või see allikas on kohalik, siis see raha makstakse tegelikult ju Eestisse. Et importkütuse puhul see läheb välja kohaliku kütuse puhul jääb siia, ütleme, võtame sellise Tartu suuruse linna, maksame selle kohaliku kütuse eest circa kuusteist miljon it aastas, et, et see tegelikult läheb ju sinnasama piirkonda majandusse tagasi. Mis hindadega on juhtunud? Tegelikult need kaugküttepiirkonnad, kus on tuldud importkütuselt siis kohalikule ta astuvkütusele, seal on kõige odavamad hinnad ka. Et ja, ja, ja kui inimesed peavad näiteks soojuste, soojuse eest vähem maksma, siis see raha jääb ju ka kohalikku majandusse on ju, et et, et kui, kui siis vaadata, muidugi see kõik ei ole nüüd ainult siis etsi, et sitsiteene ainukene, et üks, ta on üks asi ikkagi, mis on nüginud selles suunas ja noh, kokkuvõttes võikski öelda, et et mis see tulemus on, soojus on odavam, ta on kodumaisest allikast, selle varustuskindlus on parem ja lõppude lõpuks see raha, mis makstakse sisendite eest, läheb ka kohaliku, kohaliku rahva kätte, et, et see on tegelikult see tulemus.</span></button>
