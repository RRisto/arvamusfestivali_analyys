    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.64" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:11–0:18</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere õhtust, Paide, tere õhtust, Eesti Televisiooni teise programmi vaatajad, me oleme otse-eetris ja alustame.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="17.64" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 0:18–1:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, Arvamusfestival on jõudnud siis iga-aastase kulminatsioonini ehk siis teie ees on juba pikaaegne traditsioon. Laval on istuma seadnud ja valmis arutama selle üle, et kus me täna oleme ja kuhu me suundume võib-olla, mis on need lahendused, mida selleks parema tuleviku nimel kasuta me. Meil on parlamendi erakonna esimeeste debatt ja meiega on täna siin laval erakonna Eesti kakssada esimees Kristina Kallas. Meiega on erakonna Isamaa esimees Urmas Reinsalu. Reformierakonna esimees Kristen Michal. Ja sotsiaaldemokraatliku erakonna esimees Lauri Läänemets. Ja Keskerakonna esimees Mihhail Kõlvart. Meie seast on puudu erakonna Eesti Konservatiivse Rahvuserakonna esimees Martin Helme , kes paraku ei viibi Eestis. Me väga loodame, et ta on järgmine aasta siin meiega.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="98.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 1:38–1:39</span></span><span class="segment-text">Võib plaksutada?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="99.28" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 1:39–1:51</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja võib muidugi. Ja meie arutelujuhid, mina olen Kai Klandorf, arvamusfestivali nõukoja liige ja minu ga on Mirko.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="111.36" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 1:51–2:27</span></span><span class="segment-text">Jah, minu tööandja on Rahvusringhääling, aga meil on aega üheksakümmend minutit. Plaanime kolmel peamisel teemal peatuda, majandusel toimetulekul, haridusel ja konku rentsivõimel, aga ka riigikaitsel ja kahte kaitsetahtel, aga ma loodan siis, et erakonna esimehed mitte niivõrd ei keskendu sellele, et kuidas me siia oleme jõudnud, vaid vaata me natukene ka nendele toimivatele lahendustele otsa, aga ma alustaks hoopiski täitsa ootamatult, et küsiks noh, ikkagi suvi hakkab läbi saama ja selline positiivsed meele olud, et Kristina Kallas, millal oli üks viimane hetk, mil te tundsite siirast uhkust</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="146.6" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 2:27–3:01</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">oma töö ja tehtu üle? Ei, ma arvan, et see oli eile hommikul, kui me Telia telgis arutasime seda , et kuidas me esimesel septembril koolipäeva alustame. Seekord koos tehisharuga gümnaasiumites, et noh, see on mingi asi, mis on väga kiire sti tehtud, aga ta tegelikult liigub edasi positiivselt, et suured hirmud, mis seal enne olid. Aga ma arvan, et iga lapsevanem tavaliselt tunneb uhkust siis, kui ta hommikul üles är kab ja oma lastele otsa vaatab.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="180.88" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 3:01–3:09</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nii, aga sama küsimus tegelikult on kõigile, Mihhail Kõlvart, et millal teie viimati uhkust tundsite ja mille üle?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="189.44" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:09–3:22</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mõni päev tagasi vaatasin, et meie reiting kasvab, et et esikoht on päris uhke. Urmas Reinsalu.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="201.6" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 3:22–3:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See on tõsine küsimus. Täna hommikul ma niitsin muru, nii palju oli putukaid, aga ma sain sellega hakkama ja siis ma enne siia sõitu, siis ma vaatasin uhkusega, et on midagi reaalselt mõõdetava</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="213.24" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 3:33–3:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">t. Väga hea ja lähme edasi Lauri Läänemets.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="218.12" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 3:38–3:58</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Jah, ma jään selle laste jutu juurde, mida Kristina ütles, et ma arvan, et see on selline südamelähedane asi, et, et kui sa näed, kuidas noh, kui palju nad kasvavad, kui palju nad arenevad ja kui palju nad sind üllatavad, et noh, see ei jõua ära imestada, et see teeb, ma arvan, iga inimese uhkeks.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="238.36" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 3:58–4:01</span></span><span class="segment-text">Ja kuidas on teiega, Kristen Michal?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0013" data-start="241.36" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 4:01–4:20</span></span><span class="segment-text">Päris mitu asja, et no ma arvan ka, et ilmselt laste kasvamine on kõige suurem asi, eks , aga mul on kolm poega ja üheüks, kes nüüd on sõduri baaskursus parajasti läbimas, et ta nägi vormis juba täitsa mehe moodi välja, nii et meil oli päris uhke tunne.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="260.48" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:20–4:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Läheme aga teemadega edasi. Ma vist enda reitingu jutu ikkagi võtan tagasi. Kas see tähendab seda, et ei olegi uhkust tundnud, mitte midagi positiivset, mille üle rõõmustada pole?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0015" data-start="273.28" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 4:33–4:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ei, prioriteet on ikkagi minu laps.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0016" data-start="278.04" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:38–5:01</span></span><span class="segment-text">Tuleme majanduse ja toimetuleku teemani, no kui lühidalt kogu see lugu kokku võtta, siis valitsuse lootus oli see, et teeme maksutõusud ära, saame eelarve paremasse vor mi, majandus paneb ise asjad paika ja tõusuvesi tõstab kõiki paate. Aga see pole niimoodi läinud, Kristina Kallas, miks?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="300.88" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:01–5:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ei, aga kõigepealt natuke vara veel selles mõttes, et maksutõusud, otsused tehti ära , aga maksude mõju majandusele ei ole ju veel, ei realiseeru enne, kui need maksutõus ud reaalselt realiseeruvad, et ma arvan, et natuke vara on sellest rääkida, küll aga on eelarve täna oluliselt-oluliselt paremas seisus, kui ta oli veel kaks aastat tagasi , nii et noh, selle üle, kui sa küsid, mille üle võib-olla uhke olla, siis tuleb meel de ka see, et me oleme meeletu pingutuse kogu ühiskonnana teinud kogu ühiskonnana ja väga valusa pingutuse selle nimel, et me suudaksime sellest potentsiaalsest võlaspira alist, mis meil veel kaks aastat tagasi reaalselt silme ees terendas, ikkagi välja tulla , et me tuleme sealt põhjast, oleme me ikkagi noka üles saanud, et me ei ole saanud veel eelarvega sellisesse faasi, kus meil laenuvõimekus oleks suur ja me ei peaks võlaspi raali pärast muretsema, aga me oleme ikkagi sealt põhjast väljas.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0018" data-start="352.48" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:52–6:10</span></span><span class="segment-text">Aga kui küsida lühidalt ja konkreetselt, et mis siis on täna majanduse probleem, mida , mis vajab lahendamist, kui me juba liigume positiivses suunas, väga hea, aga läheks edasi. Mihhail Kõrvalt, kuidas teile tundub, mis on täna ikkagi Eesti majanduse peamine probleem</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0019" data-start="372.08" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:12–7:14</span></span><span class="segment-text">Eesti majanduse peamine probleem on Eesti inimesed. Eesti inimesed ei saa endale elementaarselt toidupoodidest toitu lubada. Ja, ja see on eksistentsiaalne probleem ja meil tegelikult puudub selline arusaam nagu kontseptuaalne majandus, kuna puudub ka igasugune analüütika. Ma lihtsalt tuletan meelde kolme aasta jooksul tõstame kaks protsenti, ei, tegelikult on vaja veel kaks protsenti, tõstame ikkagi veel kaks protsenti ja siis pärast ütleme , et ei tegelikult veel kaks protsenti ei ole vaja, loobume sellest. Et kõigepealt ütleme, et see on ajutine, sest ütleme, et tegelikkus on püsiv. Ja siis kogu see jutt kaasneb sellega, et neid vahendid on vajalikud riigikaitseks, aga pärast me vaatame numbreid, aga tegelikult aukude lappimiseks. Ja noh, meie peamine majanduse probleem seisneb selles, et see ei ole kontseptuaalne See on kaootiline ja mingid pika plaani tegelikult ei ole.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0020" data-start="433.64" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 7:14–7:17</span></span><span class="segment-text">Ehk et inimeste toimetulek on tegelikult keeruline.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0021" data-start="437.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:17–7:35</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kristen Michal, aga kui tõesti vaadata sellele Mihhai argumentatsioonile otsa, siis seda pidi mõtlevaid inimesi on päris palju, et teil on võimalus neile selgitada, neid vee nda, miks siis Eesti majanduses ei lähe veel nii hästi, kui teie tahaksite?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0022" data-start="455.08" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:35–9:42</span></span><span class="segment-text">Sellel on muidugi hulga põhjusi ja kindlasti Eesti inimesed ei ole Eesti majanduse probleem , selle ma lükkan kohe ümber, et Mihhaili kontseptuaalne lähenemine selles ei ole õige Eesti inimesed on targad, järjest enam panustavad Eesti ettevõtjad teaduspõhisesse majandus se, et investeeringud sellesse on kasvanud ja see on ainukene tee tegelikult jõukama sse liigasse. Teiseks kaitsekuludega, enne sõda oli plaanis meil kulutada järgmisel aastal kaitseku ludele kaheksasada miljonit, veidi peale. Järgmisel aastal kulutame kaks koma kaks, kaks koma kolm miljardit, vahe on poolteist miljardit. See raha läheb sinna, maksuraha ja jääb puudugi, me võtame laenu ka veel juurde. Nii et, et hästi klaar oleks, lugu oli Postimehes, kes tahab, võib graafikut ka vaadata Majanduse tulevik ikkagi on järgmises liigas, tehes nutikamaid asju heal haridusel ba seeruv, ettevõtjad ikkagi lähevad edasi just sellesama innovatiivse toimetamisega. Eestis oli aastal kaks tuhat seitseteist oli umbes kaks tuhat ükssada teaduskraadiga töötajat. Kahekümne kolmandal aastal neli pool tuhat. Noh, kui oli aeg kuskil, kus oli hetk, et teadlane ei leidnud töökohta, siis nüüd vi satakse nalja, et ei ole enam teadlast, keda ettevõte saaks võtta, et me tegelikult l ähme õigesse liigasse ja ettevõtlus investeeris eelnevatel aastatel rekordarvu raha tegelikult ka sellesse teadusarendusse. Teised vastused on ikkagi ka päris palju meie need turud, et oleme ausad, Eesti on ju tahtnud olla põhjamaa. Ja nüüd me olemegi Põhjamaad ja Põhjamaadega koos, mis tähendab seda, et kui Skandina avias on rahaliselt väga raske intressidega on väga vilets lugu, siis kui me võrdleme ennast näiteks Läti-Leeduga, viitan Eesti Panga kirjeldusele, siis Läti-Leedu laenuko ormus on oluliselt madalam. Euribor tuleb alla, on ka meil lihtsam, nii et meie eksporditurud, Skandinaaviad on para nemises. Rootsil läheb lihtsamalt, Soome nagu Soome peaminister ütles mulle, rõõmsalt agressi ivselt ootavad kasvu. Nii et see on ka meie jaoks oluline turg, nii et innovatiivne toimetamine, hea haridus , targad investeeringud, targad inimesed ja õiged turud.</span></button>
