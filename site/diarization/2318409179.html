<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="33.56" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 0:34–1:28</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">. Aitäh. Esiteks suur tänu, et olete mind kutsunud siia paneeli, ma loodan, et ma kuidagi tunne n, et siin kolme naisterahva vastu ma nüüd pean kuidagi, esindan siis täna noori här rasmehi. Et mul on au. Mina olen Karl Wilhelm, ma olen kahekümne nelja aastane hetkel olen ma just naasnud tagasi Eestisse Ameerikast, Bostonist oma magistriõpingutelt. Ja nüüd alustan oma doktoriõpinguid Tartu Ülikoolis, aga industriaaldoktori alal siis , et tegelen, müü on tomograafiaga. Sellest võib-olla võime mingi teise diskussiooni teha, see natuke pikem teema. Aga lisaks siis sellele ma ka teen bändi, Arkpart. Nii et tegelen ka muusikaga. Ma arvan, et see võttis lühikokkuvõte, punkt.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="87.68" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 1:28–2:06</span></span><span class="segment-text">Tere, mina olen Birgit Paidest kakskümmend kaheksa ja minul on ka väga hea meel siin olla, sellepärast et kui kunagi see Arvamusfestival alguse sai, siis esimesed kuus aastat olin ka mina siin korraldusmeeskonnas kuni ma Paidest siis õpingute jaoks eemaldusin ja sellepärast see on mulle eriti südamelähedane koht. Täna, kasvatan ma kodus kaheksa kuuste beebit ehk siis tööl otseselt ei käi, aga akti vist nagu ma olen, siis mõned projektid siit-sealt ikka tulevad, aitan mõnda bändi ma nageerida, korraldan mõne pulma, töötan Unipetareenal ja teen nii muudki, mida ette tuleb</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="126.04" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 2:06–2:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">. Tere, mina olen Hana, töötan Riigikogu liikmena peamiselt siis keskkonnakomisjonis ja Euroopa Liidu asjade komisjonis. Ma olen Reformierakonna liige, poliitikasse sattusin läbi protesti, kuna mulle ei meeldi nud tollane valitsus, aga varasemat kogemust mul ei ole ei poliitika ega ühegi sellise õpilasesindusega näiteks, nii et lihtsalt kuskilt maalt tulin ja nüüd olen siin.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="158.32" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 2:38–3:23</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt, mina olen Helemai. Töötan tegelikult siis loovjuhina turunduses ehk siis väga palju tee ngi noortele kampaaniaid ja need ei ole kõik müügikampaaniad, väga paljud neist on sotsiaal kampaaniad ehk siis noorte teemad, mured, nii edasi on mulle väga südamelähedased ja olen ka väga palju vastavalt siis jõule ja, ja ajale tegelenud ka aktivismi ga ja proovinud siis ka anda siis ütleme erialaselt siis nõue, kuidas kõige paremini siis noore ja, ja võib-olla vähemate siis ressurssidega jõuda siis mingite päris muutu steni ühiskonnas.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="203.36" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 3:23–4:03</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga hakkame siis pihta, et me oleme kõik sellised kahekümnendates noored. Palju me siin räägime täna ka iseseisvumisest ja ma arvan, et üks selline verstapost on kindlasti selleks kooli lõpetamine ja ma näen, et siin on ka väga palju noori ja natuke vanemaid, et ma võib-olla algatuseks küsiksingi, et et kui teie olete siis nüüd lõpe tamas kooli või siis lõpetasite, et kas te teadsite, et mida te soovite edasi teha, et võite käe tõsta, et kui te olite kindlad selles mõni mõni käsi ikka tuleb. No vot, kuidas teil oli?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="243.2" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:03–4:58</span></span><span class="segment-text">Ma võin siis alustada, et mina plaanisin täiesti teist eriala minna õppima ja see , kuidas ma läksin siis õppima kirjandusteadust ja see, kuidas ma sinna jõudsin, oli gi lihtsalt, et ma mõistsin mingi hetk, et et see, millest ma tegelikult hea olen, ongi siis humanitaarteadused, aga mida mult võib-olla oodati, oleks, on see, et oleks läinud õppima siis mingit ikka nagu päris eriala ja midagi, mis ikkagi nagu siis, millega saab raha teenida. Ja ma arvan, et kui ma oleks siis vastavalt nendele ootustele, siis läinud õppima mingi sugust täiesti teist eriala, mis mulle tegelikult ei oleks hingelähedane olnud, et siis ei oleks tulnud ka mingisugused saavutused või, või mingisugune erialane siis läbilöö</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="297.64" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:58–5:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">mine. Mina üldse ei teadnud, mul oli mingisugune aim ja mingisugused mõtted ja unelmad kuna gi niimoodi põhikooli ajal, mis oli siis peaaegu kümme aastat tagasi või, või täpselt siis ma unistasin Ameerikasse kolimisest, noh, täna me saame aru, see võib-olla ei ole kõige mõistlikum mõte. Aga jah, mul oli mingi selline võib-olla jah vabandust ei seal on kindlasti väga tore , aga noh, ühesõnaga te saate aru.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="329.64" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 5:30–5:31</span></span><span class="segment-text">Ma tulin tagasi, nii et.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="331.08" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:31–7:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nojah, siin sa oled, eks. Aga ei teadnud, tahtsin minna maailma avastama ja tegelikult peale gümnaasiumi ma ei tahtnud üldse kohe ülikooli minna, ma tahtsin võtta vaheaasta, et lihtsalt leida see asi, millega ma tahaks tegeleda, aga pere survel ma ikkagi läksin ülikooli ja ma ei tea Hela, ma ei võib-olla me oleme õppinud sama asja, aga ma läksin Tartu Ülikooli Kirja ndus- ja kultuuriteadust õppima, see on seesama, millest sa räägid. Ja okei, aga ma läksin sinna, kuna ma olen ka nii-öelda see humanitaarinimene, mul läks eesti keele eksam väga hästi ja ma sain nii palju punkte eesti keele eksamil, et ma oli n paljudes sellistes erialades automaatselt sees. Ega mul seal mingit nagu sellist suurt ideed ei olnud ja siis ma olin seal ühe semest ri ja ma sain aru, et seal koolitatakse kirjandusõpetajaid tulevasi vähemalt nii mulle öeldi, siis ma sain aru, et okei see vist ei ole päris see, siis ma tulin ära, ma oli n hästi kurb ja siis kuidagi tegin kannapöörde üldsegi läksin õppima mingisugusele raamatu pidamiskoolitusele ja siis läksin panka tööle. Tegema neid asju, mis ma üldse ei arvanud, et võiksid olla sellised nii-öelda minuliku d, aga ma arvan, et läbi selle, et sa proovid erinevaid asju, sa avastadki end palju rohkem. Et noh, see suund, mis sa arvad, et sul võiks potentsiaalselt olla, kui sa oled mingi kuusteist või kaheksateist, et see võib lihtsalt tuleneda paljudest mingitest asjadest , mida sa oled kuskil näinud, aga sulle endale ei pruugi üldse sobida ja ja samamoodi tuli ka poliitikaellu, et lihtsalt läbi katsetamise ja, ja uute asjade proovimise, et aga seda, et poliitikuks saada tahaksin võib-olla kui mõni väike, siis vähemalt mu va nem on rääkinud, et ma tahtsin presidendiks saada, aga noh, see pole päris sama asi, ma tahtsin ka lauljaks saada. Ma tahtsin ka lauljaks saada, nii et mul oli väga erinevaid mõtteid.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="437.4" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 7:17–8:45</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mina otsustasin ära kuskil kaheteistkümnenda klassi alguses, et mina lähen õppima Tartu Ülikooli ajakirjandust ja kommunikatsiooni ja ma lendasin selle plaaniga kuni täitsa sinna kaheteistkümnenda klassi lõpuni välja, registreerisin ennast katsetele. Käisin katsetel, sain sisse, aga kaks päeva enne neid katseid sain ma vist a la no F acebookis vist tol hetkel ei olnud, aga ühesõnaga kuskil internetis tuli mulle ette mingi reklaam, et on ka selline asi nagu Tartu Ülikooli Viljandi kultuuriakadeemia ja seal olid hästi toredad niisugused värvilised kodused pildid juures, ma mäletan väga hästi seda, see on see, miks ma seda nagu klikkisin. Ja siis ma leidsin sealt sellise eriala nagu kultuurikorraldus ja mõtlesin, et okei, ma lähen sinna ka selle katsetele jõudmine oli mulle veel nagu logistiliselt väga ke eruline, ma pidin olema samal päeval, kui need vestlused hakkasid, pidin juba kuskil mujal olema niimoodi, et ma sõitsin kaks tundi varem rongiga Viljandisse. Anusin neid õppejõude, et nad võtaksid mu esine esimesena vestlusele, nad väitsid, et ma pean olema lihtsalt kiire esimesena kirja panema. Ühesõnaga lõppude lõpuks ma sain ka sinna sisse ja ma lihtsalt otsustasin külma närvi pealt, et ma tahan proovida hoopis seda Viljandi elu ja ma ei saaks olla rohkem õnne lik, et ma seda tegin, et võib-olla, kui ma oleksin ajakirjandust õppima läinud, ma oleks samamoodi tundnud, et see ei ole ikka minu asi ära tulnud, aga ma õnneks sain sellest varem aru ja seda sammu päris lõpuni ei astunudki.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="524.84" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 8:45–11:31</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma esiteks võib-olla rõhutaks Hannah teisele kenasti ka välja, et tuleb proovida, et ega muud moodi selles mõttes selgeks ei saa ja see, kui mingit kindlat ideed ei ole, on ka täiega okei. Et siis tuleb võtta lihtsalt parim võimalik valik, kui seda ka ei oska, siis teha mü ndivise või mis iganes, et minna lihtsalt proovida, et Eestis on see võimalik, et sa saad teha seda tasuta, sa saad enne, kui sa oled pool õppeaega läbinud, saad vahetada erialasid ja, ja sa saad nagu katsetada ja, ja leiutada ja, ja kuhugi lõpuks püsima jää da. Minu enda teekond on ka olnud selles mõttes kirju, mina unistasin ka Ameerikasse koli misest juba siis poisina ja tegin ka gümnaasiumis siis kõik selle kadalipu, et Ameeri kasse kandideerida läbi need eksamid, mis satid, asjad peab tegema ja inglise keele eks amid ja ei saanud sisse mitte kuhugi, kuhu ma kandideerisin ja siis ma olin nagu oke i, ma olen siis Tartu Ülikooli humanitaarinimene ma ei ole. Eesti keele eksam oli mul kuuskümmend üheksa punkti, aga ma olen õnneks reaalteaduste inimene ja rakett kuuekümne üheksaga, mul olid kõik erialad selles mõttes valla ja siis ma otsustasin, et teeme IT. Seal poole pealt ma avastasin, et noh, see ikka ei liiga abstraktne ja et läheb asi iga vaks ja sai valida kõrval eriala, milleks ma valisin siis ka põhimõtteliselt välistus meetodil materjaliteaduse. See hakkas mulle meeldima, siis nüüd ma magistri tegingi materjaliteadust, aga nüüd do ktorisse ma olin ka ennast jõudnud juba välja veenda, et ma ikkagi ei tee doktorit, kuna ma ei taha akadeemiasse minna, aga siis pakuti mulle noh, reaalselt maikuus võimalus t, et ma saan teha tööstus doktorantuuri, mis siis noh, ongi selle eesmärgiga, et sa ei lähe akadeemiasse, vaid sa teed seda tööstuses ja siis nüüd ma olen järsku füüsika doktorantuuris ikkagi. Et selles mõttes noh, minul oli see reaalteaduste suund on nagu kindel, aga see, kus t seal sees ma olen ka läbi ujunud, noh, täiesti erinevad erialad ja see ongi jumala põnev ja tegelikult ma ütleks ka seda, et tänapäeva maailmas sellised interdistsiplina arsed tegelikult oskused ja teadmised tulevad näiteks väga kasuks, et ka seal näiteks siis materjaliteaduse programmis erialal ma sain spetsialiseeruda siis arvutuslikule materjaliteadusele, kuna ma oskan programmeerida ja kõike seda teha, siis need on os kused, mida ma kandsin otseselt üle ja millega ma nüüd seal materjaliteaduste nii-öelda teaduskonnas täitsa eristusin ja sain tegeleda hoopis materjalide simuleerimisega veel lisaks, no ühesõnaga, et sul on võimalik nagu liita väga erinevaid nagu asju kokku ja , ja lõpuks see tee hakkab saama aina, aina selgemaks.</span></button>
