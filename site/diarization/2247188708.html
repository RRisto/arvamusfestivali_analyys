    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.72" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 0:11–3:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast kõigile kuulajatele siia tööelualale, järgmisele pa neelarutelule, mis hästi lühidalt ja üldiselt on kokkuvõetav teema ka disainime tööd. Ja tänasel arutelul me püüame siin viiekesi jõud a järeldusele ja, ja reaalsete tegevusteni, kuidas Eesti rahvas saaks kõige tööga rahulolevamaks rahvaks Euroopas. Me oleme täna kuskil seal keskmikes eas, sealt on kõvasti tõusta. Me püüame aru saada, milles see tööõnn ja töörõõm ja rahulolu üldse seisneb. Mis seda takistab ja mida peaksid tegema juhid ja mida saame meie igapäevaselt igal hommikul tööle minnes ise ära teha? Ja võib-olla selle pooleteise tunni lõpus tekibki meil see unistus, millest me ennem rääkisime. Ja need järgmised sammud, kuidas Eesti iga inimene saaks kõige rahulolevamaks inimeseks Euroopas. Ja mul on väga-väga hea meel enda juurde siia olnud kutsuda inimesed , kes, kes on kokku puutunud miljonite ja miljonite inimestega, esiteks Eva Truu värk, kes on pannud aluse koos teiste mõttekaaslastega Teeme Ära aktsioonile, millest tänaseks tõesti on välja kasvanud miljoneid inimesi üle maailma puudutav aktsioon ja nende inimeste kokkutoomine, koos hoidmine, ühiselt tegutsema panemine on kindlasti seotud nii rahulolu kui motivatsiooni ja unistusega. Mul on hea meel näha siin paneelis Tiinat, kes on spetsialiseerunud tööõnne uurija ja Happy Me juhtimist toetava tarkvara looja ja, ja arendaja. Tabasko loovjuht, keda võib-olla kõige rohkem koos tema tiimiga tuntakse igapäevaselt meile ette hüppavate pakendikeskuse reklaamide järgi. Kessu Raidma. Vabandust, jah, Kessu Raidma, mina kutsun, sa vist ise kutsud ka ennast, kes suks pigem , et. Selles kokku leppida. Ja Kaidi Kask on peaaegu terve elu juhtinud jaekaubandusettevõtteid, Juskid, LP-d, Sportlandid on kõik tema juhtimise all saanud tugevamaks, paremaks ja inimesed paremini motiveeritumaks ja ühis e eesmärgi suunas liikumas. Ja nüüd siis uued väljakutsed ja Soome siit me tuleme. Mina olen Kristjan Vanasel ja olen Pare juhatuse liige ja ja igapäevaselt paindliku töö platvormi Go work ja tasuta ja, ja, ja tegevjuht. Aga hakkame otsast liikuma ja püüaks Tiina äkki esiteks sinu abiga lahti mõtestada selle , et milles see tööõnn ja rahulolu tööga üldse on, milles see seisneb, millest see sõ ltub, mis on inimeste jaoks oluline, et öelda, ma olen oma tööga rahul ja ma olen oma tööl õnnelik.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="350.56" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 5:51–6:20</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">see muu. Sa jõudsid, Tiina siin oma, oma jutus lõpus selle suure tähenduse või, või, või, või eesmärgini, Eeva, sina oled käivitanud kümneid tuhandeid inimesi täiesti ilma rahata suures plaanis ühise eesmärgi nimel tegutsema? Mis nendel inimestel sära silma toob, mis on see, mis nad, mis nad rõõmsaks ja õnneliku ks teevad ja mis panevad nad neid tegelikult panustama ühise eesmärgi suunas.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0004" data-start="379.92" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 6:20–8:35</span></span><span class="segment-text">Et kui võtta seda, et tõesti, et maailmakoristamisega tänaseks on ühinenud üle kahes aja miljoni inimese, praktiliselt maailma kõigis riikides on koristamas käinud ja nad on teinud seda tõesti vaba, vabast tahtest hästi suures osas. Aga muidugi on täiesti erinevad organisatsioonid, need, need organisatsioonid, kus inimene läheb hommikul tööle, teeb kaheksa tundi tööd ja siis läheb koju ja nii iga päev ruti inselt ja teistpidi organisatsioonid, mis korraldavad näiteks selliseid sündmusi, kas või nagu arvamusfestival, mis toimubki üks kord aastas ja mida tehakse hästi palju koos töös vabatahtlikega, et näiteks ka Arvamusfestivali korraldamisel mõne, mõni üksik inimene saab töötasu, aga ülejäänud teevad seda vabatahtlikkuse korras oma teiste tööde kõrval Sest mis on ka huvitav see, mida ma olen näinud kõigi nende aastate jooksul töötades vabatahtlikega, kui inimene on oma eluga rahul, siis ta teeb väga head vabatahtlikku tööd. Kui inimene on töötu, isegi kui ta on muidu hästi-hästi tore ja äge inimene ka, siis ta tegelikult ei tule vabatahtlikku tööd tegema. Nii et kõigepealt peab see baasrahulolu olema olemas ja sinna peale saab siis ehitada nagu kõiki neid muid asju ja ka see inimesi motiveerida, et üks asi võib öelda, et, et raha ei ole oluline siis, kui ta ühtepidi on olemas ja sealt edasi on tehtud ka suur i uuringuid, et mis siis inimesed liikuma paneb, mida, mis inimesi käivitab ja seal on kaks asja, on kuuluvustunne ehk siis, et mul tekib äreseltskond, mul on need maailma parandajad, mul on need Arvamusfestivali korraldajad, meil on ühesugused särgid, meil on ühesugused või meil on koosolekud omavahel, kus me kohtume, meil on siis lõpuks see äge sündmus, mille loojad me oleme, ehk siis see kuuluvustunne, see, et ma olen inimeste ga koos ja teine on eesmärk, mis mind kõnetab. Et, et see eesmärk teeb natukene kõigi elu siin maailmas paremaks ja see on see, mis mind isiklikult rõõmustab, et kas see on siis prügikorjamine, see on vähihaigete aita mine või see on loomakaitse või metsakaitse või tegelikult ka, miks mitte samamoodi pa are juhatuses olemine, et, et kõik sellised asjad, mida ma tahan lisaks oma igapäeva sele tööle teha just, et toetada seda eesmärki, mis mulle on oluline.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="514.56" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 8:35–9:24</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Eks see eesmärk ju võiks olla ka igal äriühingul peakski olema. Et, et kuhu suunas me kõik liigume. Kaidi, sina oled aastate jooksul pidanud tegelema just nende inimestega , kes peavad seal kuidagi kaheksast viieni või, või teinekord isegi kümnest õhtul ke lla kümneni tööl käima. Uuringud näitavad, et teenindus ja müügiinimeste rahulolu on mõnevõrra madalam võib- olla teiste traditsiooniliselt ja see ei ole mitte ainult Eestis nii, vaid, vaid ka mu jal riikides. Mis seal inimestele sära silma toob või, või mismoodi sina juhina oled, oled nende rahulolu ja õnne püüdnud mõjutada?</span></button>

das me ühiskonnana, et kuskohas see arutelu on, on ju, et kui palju me oleme valmis nagu, nagu loobuma sellest, et iga päev on nii-öelda kauplus lahti kümnest kümneni on ju, et kaubandustöötajad saaksid ka võib-olla olla va</span></button>
