    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.64" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 0:11–1:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast arutelule tänase arutelu teema on pedofiilia uus nägu, kuidas avatus loo bub uusi riske. Enne alustamist ma paluks korraks märku anda publikul, kui paljud siin teist on näiteks lapsevanemad. Kui paljud teist tegelevad tööalaselt näiteks noorte või lastega? Väga hea, aitäh. Pealkirjas täna me kasutame väljendit pedofiilia uus nägu, mis on meelega üsna provo katiivne. Lastevastasest seksuaalvägivallast rääkides tihtipeale inimestel tekib väga selge si huke kujutluspilt, et, et kes see inimene on. On ta selline keskealine või, või vanem mees lakutud koledate juustega. Täna me räägime väga palju sellest, mis need ohud päriselt tänu siis veebimaailmale, mis on väga avar, millised need riskid tegelikult on, kas me peame üldse mõtlema ühe konkreetse isiku peale või me peame mõtlema hoopis käitumismustrite peale? Arutelu käsitleb laste vastu suunatud seksuaalvägivalda ja selle veebipõhiseid vorme eelkõige ja me kindlasti ei lähe täna graafilistesse kirjeldustesse ja kui me ka midagi küsime või midagi omavahel jagame, siis kindlasti palun tehke seda võimalikult anonüü mset ja diskreetselt. Me ei hakka kindlasti ühtegi juhtumit täna siin väga täpselt arutama. Aga selleks, et kogu seda teemat arutada, olen ma palunud täna siia oma ala eksperdid ja alustame minu vasakult käelt. Margus Veem, palun räägi paari lausega, kes sa oled ja miks sa täna siin oled.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="173.44" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 2:53–3:00</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja kui üks mehe nimi Eestis on populaarne, siis see on Margus, meil on veel üks Marg us täna paneelis.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="334.76" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 5:35–5:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma korra küsin, Marilyn kohe siit väikse jätkuküsimus, et kui palju näiteks sellised väärarusaamad võivad muuta ka keerulisemaks selle, et, et laps saab õigel ajal abi?</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0018" data-start="494.08" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 8:14–8:38</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Margus, selleks, et nüüd edasi siit minna, veel, vabandust, jah, peame me täna õhtul , ma mõtlen, et veem Raspel äkki, teeme nii korra inimestele kuidagi kokkuvõtlikult. Mida see pedofiilia tegelikult üldse tähendab ja miks ei saa seda automaatselt samas tada lapse vastu pandu, vastu pandud siis seksuaalkuriteoga?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0019" data-start="517.56" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_00</strong><span class="timestamp">▶ 8:38–12:03</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Praegu meditsiinis keskendutakse siis sellele, et me ikkagi proovime diagnoosida häi ret. Häiret me saame diagnoosida siis, kui see käitumine siis häirib või mingisugune probleem , häirib inimest ennast. See on üldine definitsioon. Me räägime siis, siis üldine mõiste meditsiinis on parafiil ja see on siis kirjeldab sellist seksuaalkäitumise mingisugust häirunud vormi, see on üldine mõiste on parafi ilia, pedofiilia nüüd on väga konkreetne, sellisel juhul inimese, siis üks peamisi se ksuaalse erutuse allikatest on eelteismeline laps. Miks eelteismeline on seal oluline on see, et, et teismes eas inimesed hakkavad keha lised muutused toimuma ja see tegelikult ei, see see, kuna see kehakuju on selline oluline seksuaalse erutuse allikas, siis kui inimese kehakuju on juba täiskasvanulik, siis see ei erista enam nüüd selliseid väga häirunud seksuaalse sellise sättumusega inimesi. Sellepärast pedofiiliat niimoodi väga konkreetselt eristatakse, et, et need, see eel puberteediealise siis mõiste sealjuures on. See peab olema üks peamisi siis seksuaalse erutuse allikaid ka, et see ei tohi olla mingi sugune selline juhuslik juhtum, see peab olema ka ajaliselt teatud kestusega, et mis tähendab seda, et, et üks lühiajaline käitumisepisood ei anna alust öelda, et selle inimene on nüüd kindlasti pedofiilne. Inimesed käituvad seksuaalselt ebakohaselt paljudel erinevatel põhjustel, see võib olla selline, kas juhuslik mõte, kuid see võib olla põhjustatud ka mingisuguse impulsikontroll i probleemist, see võib olla põhjustatud mingisugusest emotsionaalsest seisundist, see võib olla põhjustatud ka mingisugusest vääruskumusest, mis inimesel on, et see ei ole seotud otsesel
