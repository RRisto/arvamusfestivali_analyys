s ikka puhub ja, ja jõuab meile siia ja ei ole tähtis, et elektrijaam asuks Eestis , vaid turg on üle-Euroopaline ja vaba. Kuidas me siis oleme nüüd sellesse kohta jõudnud, et me Eestis enam sellisest turust ei, ei unista, vaid peame siin arutelu, kui palju juhitavaid võimsuseid me konkreetselt Eestimaa peale peame ehitama?</span></button>
