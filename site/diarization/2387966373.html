    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.2" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:11–0:56</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere hommikust, energeetikahuvilised! Alustame arvamusfestivali teist päeva energilise majanduse alal. Teemaga, mis aeg-ajalt kerkib ja siis jälle vaob ja siis kerkib uuesti. Ja see teema või küsimus on, miks peab elektriga kauplema börsil. Organiseerijad on valinud selle arutelu formaadiks kuum tool ehk siis eeldatakse teravaid küsimusi ja võib-olla ka ebamugavaid küsimusi. Ja mul on hea meel, et Marko Allikson Baltic Energy Partners juhatuse liige, on sellise formaadi ja sellise aruteluga nõustunud. Tere hommikust.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="55.68" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 0:56–0:57</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere hommikust.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="57" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:57–2:07</span></span><span class="segment-text">Mina olen Vikerraadio ajakirjanik Arp Müller, tegelen aeg-ajalt ka natukene energeeti ka teemadega. Võib-olla sellepärast siis on mind siia kutsutud. Ma ise olen valmistunud ette elektribörsi teemal rea küsimusi. Ma olen küsimusi kogunud ka mõnest sotsiaalmeediagrupist, Facebookis. Tegin üleskutse energeetikagruppides taastuvenergia Eestis tuumajaam ja sõltumatu ene rgia tootmine, salvestamine ja juhtimine, sealt nopin ka mõningaid küsimusi, aga kindlasti ootan teid ka täna järgneva tunni jooksul kätt tõstma ja, ja siis tuuakse teieni mik rofoni ja saate ka oma küsimusi elektribörsi teemal esitada. Aga Marko tunnista üles, tegelikult on sul isiklik kasu mängus. Sa oled isiklikult sellest elektribörsist huvitatud. Kui elektribörs ära lõpetada, kui uuesti Konkurentsiamet hakkaks hinda määrama või, või plaanikomitee hakkaks uuesti elektri hinda määrama, sa jääksid tegelikult töötuks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="127.44" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 2:07–2:34</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No tegelikult ei jää, sellepärast et me tegutseme elektriturul ajast, kui börsi ei olnud Et aastal kaks tuhat kuus, kui me alustasime, siis börs ei olnud kuni aastani kaks tuhat kolmteist. Et ja me suurepäraselt saime hakkama, tegelikult saab veel paremini hakkama, sellepärast et kui börs ei ole börs, paljastab palju, mis turul toimub ja kui börsi ei ole, siis tegelikult, mis turul toimub, seda ei ole näha ja, ja see lihtsalt inimeste eest var</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="153.84" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:34–6:27</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">ju. Me peame vist kuulajatele ka väikese sissejuhatuse tegema, kuigi ma eeldan, et kell kümme hommikul on siia tõesti kogunenud teemahuvilised, kes hästi teavad, mis asi see elek tribörs on. Aga teeme ikkagi väikese sellise sissejuhatuse ka sellepärast, et meie tänast arutelu , kuuma tooli saab ka järelkuulata hiljem Spotify&#x27;st ja, ja arvamusfestivali veebile helt. Niisiis praegu käib Euroopa Liidus, terves Euroopa Liidus ja ka Eesti on Euroopa Liidu osa siis elektriga kauplemine elektribörsil, kus on siis selline põhimõte, kus on ma rginaalhinna põhimõte, et selle hinna, mille kõik tootjad saavad, selle määrab kõige kõrgema hinnaga turule pakkumise teinud tootja ja täpselt sama hinda saavad siis antud tunniks või, või nüüd juba veerandtunniks kõik tootjad ka näiteks tuu- , tuuliku, tuuleenergia tootja, kes tuli turule näiteks hinnaga kümme eurot megavatt saab hinda kakssada eurot megavatt, mille pakkus näiteks mõni põlevkivijaam, kes viimasena turu le tuli. Ja, ja selles, sellel teemal on väga palju kriitikat viimasel ajal olnud. Ma viitan natukene ka sellele kriitikale. Hiljuti Eesti põhimõttekoda avaldas energiapoliitika raporti, selle koostasid Arvi Ha mburg ja Märt Ots ja nemad tõid esile või väitsid, et see Nord Pooli turukorraldus ei vasta nõudlusele ja nad leiavad, et juba selle põhimõte on selline, mis investeeringu id elektri tootmisesse ei võimaldagi. Ja, ja Nord Pooli süsteem on siis mõjunud nõnda, et varasem ületootmine meie piirkonnas on siis nüüd selle turusüsteemi mõjul asend unud siis tootmisvõimsuste puudusega, aga investeerimiskindlust see ei paku. Ja, ja see on nüüd meie sisemaine kriitika, aga ka terve Euroopa Liidu tasandil, kui energiakriis algas kaks tuhat kakskümmend üks, lõpus juba, aga kaks tuhat kakskümmend kaks, Venemaa agressiooni tagajärjel elektrihinnad, gaasi hinnad kõigepealt, elektri hinnad seejärel läksid lakke, siis ka Euroopa Liidu tasandil tekkis surve arutelu ka Euroopa Komisjon siis hakkas analüüsima, kas see marginaalkhinnasüsteem on õige ja kas peaks äkki muutma, analüüsiti, analüüsiti, aga ikka jõuti järeldusele, et, et ei, me ei hakka seda muutma, et see marginaal hinnasüsteem on üks hea ja kasulik asi. Aga no küll mööndi, et, et võiks otselepinguid rohkem kasutada ja, ja mingeid väikse id nii-öelda joonealuseid märkuseid lisati. Aga see Euroopa Komisjoni analüüs või otsus, et me jääme selle turumudeli juurde, ikkagi ei ole rahuldanud kõiki. Tänavu Itaalia tegi uue ettepaneku näiteks, et võtta sellest elektrihinnast CO kahe komponent välja gaasijaamadel fossiillektrijaamadel, mida siis riik kompenseeriks. Prantsusmaal on käivitunud arutelu, et, et näiteks odav tuumaenergia ei peaks sama kõrge t turuhinda saama nagu see kallis gaasijaamadest toodetud elekter. Seega ikkagi kogu aeg podiseb, et eri riikides, eri huvigrupid ei jää rahu le selle kinnitusega, et börs praegusel kujul see marginaalkind on parim süsteem, hästi pikk sissejuhatus oli, aga, aga ma loodan, et andestate. Veidi oli seda olukorda vaja kirjeldada. Kas sa saad aru, mis selle kriitika taga on, miks ei olda rahul selle marginaalhinna põhimõttel elektribörsiga?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0006" data-start="386.56" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 6:27–9:37</span></span><span class="segment-text">Ma arvan, see kriitika tuleb sellest, et asjad on ebaselged, et, et kui keegi millest ki aru ei saa, tuleb ju küsida, et, et selles mõttes on see kõik arusaadav. Et ma just enne rääkisin siin ühe härrasmehega, kes rääkis mulle, et, et paarkümmend aastat tagasi oli kõik üliselge, et oli üks konkreetne elektri hind ja nüüd justkui tuleb seal võrgutasud ja kõik muud asjad ja igasugused varustuskindluse tasud ja asjad sinna lisanduvad ja, ja asi on jõle keeruliseks läinud, et kuidas enne sai elektrihinnaga hakka ma ja nüüd enam ei saa. Et tegelikult nagu see elektribörs või Nord Pooli börs päev ette börs, millest me räägime , on ju ka nagu sellest elektri hinnast ainult ja elektriturust ainult üks väike komp onent. Aga probleem on selles, et ta on kõige nähtavam komponent ehk siis nii-öelda päev, et ta turuhinnad on kõikidel teada, päev ette sa kusagil kella kahe ajal tead, palju see hind on, võid veebisaidilt vaadata, palju te eile oli, palju tal oli seal eelmine kuu , eelmine aasta ja nii edasi. Aga, aga see päev ette turg tegelikult kannab ju turul ainult nagu ühte rolli, et, et aitab elektrijaamadel ja tarbijatel järgmist päeva planeerida. Aga elektrisüsteemis on vaja planeerida igasuguseid asju, et, et lisaks järgmisele päeva le on sul vaja planeerida nii-öelda lühemat aega, järgmisi tunde, veerand tundi ja nii edasi ja ka pikemaid aegu, et, et mis sa teed järgmine aasta, mis sa teed järgmine k vartal, mis sa teed järgmised mitmed aastad ja, ja iga selle funktsiooni jaoks on olemas ju tegelikult erinev börs, et, et see Nord Pooli börs või see päevite börs on ainult üks nendest börsidest. Lihtsalt sellest me räägime kõige rohkem, sellepärast ka, et, et võib-olla kodutarbi ja jaoks on see üks ainukesi börse, mille ka kodutarbija hind teinekord seotud on. Börsipakett on seotud konkreetselt selle päevvete hinnaga, aga börsipakett ei ole seotud näiteks seal tulevikutehingute hindadega reeglina või, või ei ole seotud ka siis päeva sisese turuhindadega või reguleerimisturuhindadega, mis on kõik jällegi erinevad turu d mis, mis nagu kogu seda kompleksi koos hoiavad ja, ja selles mõttes, et noh, ma ei tea, alustades kas või Itaaliast on ju, et, et, et loomulikult kui ühes riigis on enamasti gaasijaamad ja, ja eriti kui HUSi väinas toimub midagi sellist, et kakskümmend protsenti maailma LNG-st ei tule järsku enam turule, hinnad on kõrged, ga asi hinnad on peaaegu et mitte päris kahekordsed, aga ütleme seitsekümmend prossa kõrge mad kui, kui aasta aega tagasi. Et siis elektrihinnad on kõrged. Poliitikud vaatavad täpselt samamoodi, et ainuke börs, mida ma tean, on see päev, et turg tähendab, äkki saab kuidagi seda päeva võtta turgu teistmoodi tehes hinna alla, tegelikult ju ei saa, et, et selle hind tuleb alla siis, kui sul on mingisugused ele ktritootmise jaamad, mis suudavad odavamalt elektrit pakkuda, et, et paraku börs ise enesest on see siis nii-öelda päeviti turg, on ta mingisugune teistsugune turg, iseen esest ta hinda alla ei too, hinda toob alla ainult see, kui keegi suudab odavamalt ele ktrit pakkuda ja, ja, ja noh, ka see, ütleme, et see näiteks Itaalia case on taandunud tegelikult ainult sellele, et, et võib-olla nendele samadele gaasitootjatele siis ko mpenseeritakse nende CO kahe kulud.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="576.76" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 9:37–9:49</span></span><span class="segment-text">Nii, aga keegi suudab odavamalt pakkuda, toome selle Prantsusmaa näite. Kui tuumajaamad suudavad stabiilset, odavamat hinda pakkuda, no miks peab neile maks ma seda kõrget hinda, mille teeb mingisugune gaasijaam?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="589.28" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 9:49–10:51</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aga keegi ei ja ka Prantsusmaal tegelikult ei ostetagi reeglina nii-öelda otseselt siis ütleme, et tuumajaam müüb enamus oma nii-öelda toodangut samamoodi nagu CFD-na, et, et tegelikult sa saad teha pikaajalisi lepingu. On olemas hulgiturg, kus kohas sa saad sellelt samalt mitte antud juhul tuumajaamalt , vaid nii-öelda turul saadaoleva hinna, mida toob alla tuumajaam Prantsusmaal, et, et see päev ette turg ei tähenda nagu mitte midagi muud, kui ta ütleb seda, et, et järgmise l päeval on saadaval niivõrd palju tuumajaamu, tuulikuid ja kõiki muid, millest nii- öelda tarbimise koos tuleb mingisugune hind, see on nagu hinna paljastamine, et, et see tegelikult räägib sellest, et mis seal tegelikult sees toimub, vastasel juhul oleks meil ainult nii-öelda teada, et on üks suur elektri hind nagu kakskümmend aastat tagasi ja ühtegi probleemi ei ole, aga tegelikult need probleemid olid ka kakskümmend aastat tagasi , kõik seal elektri hinnas sees. Lihtsalt tänasel hetkel on nad paljastatud, nad on välja toodud ja päev ette turg too b osa sellest välja.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="651.16" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 10:51–11:30</span></span><span class="segment-text">Ma ei tea, kas, mis probleem siis selles oli, ma vaatasin järgi enne Eesti elektritu ru täielikku avanemist kodutarbijatele esimesel jaanuaril kaks tuhat kolmteist, viima ne Konkurentsiameti poolt kinnitatud reguleeritud hind oli kolm koma null seitse euro sent ehk siis kolmkümmend eurot megavatt-tunni kohta. Täitsa hea hind ju, et aga vaata, mis praegu on viimased kolm aastat on Eesti hinnapi irkonnas elektri aasta keskmine börsihind olnud üle kaheksakümne euro megavatt-tunni kohta, kaks tuhat kakskümmend kaks oli lausa sada üheksakümmend kaks eurot megavatt- tunni kohta. Miks see börs on toonud meile sellise elektrihinna, mille all me kõik ägame?</span></button>
