    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.76" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 0:11–1:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere tulemast kõigile siia Arvamusfestivali reede õhtusse. Ma loodan, et kõigil on olnud väga põnev päev ja väga palju arutelusid on juba kuula ta ja veel rohkem arutelusid on tänase õhtu ja homse päevaga veel ees. Et meie siin ja teie seal olete kogunenud parlamendierakondade noorte debatile ehk siis , kui eelmisel aastal oli mul väga hea meel juhtida siin parlamendierakondade esimees te debatti, siis ausalt öeldes veel parem meel on mul täna siin juhtida koos Johanne sega parlamendierakondade noortekogude esimeeste debatti. Selle debati siin on kokku kutsunud Eesti Noorteühenduste Liit, kes seisab eest selle le, et noored ja noorte hääl meie ühiskonnas oleks esindatud. Ja minu nimi on Kristin Parts. Mina olen Eesti Väitlusseltsi tegevjuht ja Spiiksmardi koolitaja ja moderaator. Ja täna siin olen koos Johannesega.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0002" data-start="73.92" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 1:14–1:24</span></span><span class="segment-text">Ja tere kõigile, mina olen Johannes Peetsalu, ma olen Tartu Ülikooli ajakirjandustud eng ja tudengiväljaande neljas dimensioon peatoimetaja.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="84" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 1:24–2:07</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja lisaks meile on siis juhuslikult siia lavale sattunud ka mõned noor poliitikud, ma ei tea, kas nii võib öelda, ju nad siis varsti mind parandavad. Meiega koos on täna Keskerakonna noortekogu esimees Dmitri Faadin. Lisaks temale noor Isamaa esimees Getter Angerjas. Noor Eesti kakssada juht Meeri Vainola. Noored sotsiaaldemokraadid asepresident Aivar Kaval. Ja Reformi noorte juhatuse esimees Martin Ottas.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="127.12" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 2:07–3:28</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja ma räägin korralduslikust poolest ka kahe sõnaga. Meil ei ole mikrofoni, mis hakkab publiku seas ringi käima, aga meil on Slido keskkond , selle jaoks on QR-koodid, need olid ka kuskil siin istumiskohtade kõrval maas ja ka siin lava peal. Võite ka minna lihtsalt Slidosse ja seal on kood ENL ja saate siis kirjutada küsimus i. Mida tahaksite, et me küsime ja me neid jooksvalt siis võtame ka vestluse ajal. Ja ma arvan, et kuna meil istub lava peal Eesti poliitikamaastiku järgmine generat sioon. Võib-olla siin on nii mõnigi minister, miks mitte ka president, siis oleks hea nende ga alustuseks natuke rohkem tuttavaks saada. Ehk siis ma paluks, et te kõik vastate kõigepealt ühele küsimusele. Me hakkame siis siit minema noortest sotsidest alustame ja küsimus on see, et miks noore inimesena poliitika? Et tegelikult on nii palju teisi asju, mida saaks teha ja noorte seas vähemasti vali misaktiivsus ei ole. Samaväärne kui on vanemate seas, et miks olete teie noore inimesena siis otsustanud, et poliitika on see koht, kus te tahate ennast teostada?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="208.16" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:28–4:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et eks elu jooksul võib igasuguseid asju teha, et mitte ainult poliitikas, sellega ma olen nõus ja tegelikult tavaliselt juhtubki nii, et mitte meie valime poliitikat, vaid poliitika valib meid. Et see ikkagi juhtub tavaliselt sellest, et kui sa märkad oma kodukohas mingisuguseid asju, mis vajavad parandamist. Siis sul on väga vähe ressurssi, kuidas sa saad seda mõjutada ja kindlasti saad kirjuta da kohalikule omavalitsusele, sa saad kirjutada Riigikogule, teha pretensiooni, mida iganes. Aga kui sa tahad midagi muuta, siis sa pead ennast näitama ja siis kõige mõistlikum ja , ja tegelikult ainuke võimalus demokraatlikus ühiskonnas, kuidas just ennast esinda da ja, ja siis pärast kõige parimaid ideid ellu viia ongi siis teha seda poliitikas.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="339.04" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:39–5:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No ma arvan, et siin on väga banaalne vastus peaks olema, et siis ma tahan, et meie ühiskond oleks parem ja samuti noorte hääl oleks kuuldavaks.</span></button>

<button type="button" class="segment-card" data-segment-id="segment-0016" data-start="434.72" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 7:15–8:03</span></span><span class="segment-text">Nii et tundub, et see päriselt millegi ära tegemine on vist läbiv mõte. Aga võtaks esimese suurema teemana ette noorte kaasa mise poliitikasse ja just siis seda kohalike omavalitsuste valimiste tuules, mis nüüd siis on selle aasta oktoobris aset leidmas. Ehk siis ma arvan, et kõigepealt võiks rääkida natukene taus ta mõttes, millega üldse noorte kogud ja noortevolikogud tegelevad. Ma arvan, et võtame taas kord, Aivar, räägi siis sellest, et millega tegeleb noorteko</span></button>
