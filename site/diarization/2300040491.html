    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.92" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:11–1:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Suur rõõm teid kõiki siin näha ja veel suurem rõõm, et tunnete huvi lastekaitsetöö vastu Lapsed ja pered vajavad nii riigi kui kogu ühiskonna erilist hoolt ja tähelepanu ja see , kui palju panustatakse laste ja perede heaolusse, kajastub meie rahva tervises, haridus es, tööhõives, majanduses ja kuritegevuses. Liigume oma tänase aruteluga täpselt seda rada pidi, kuidas üks laps või pere, kes on sattunud lastekaitsesüsteemi, liigub ja missuguseid etappe ta sellel teekonnal läbi tegema peab. Aga enne, kui alustame siis, kallis kuulama tulnud publik. Me tahaksime natukene teada ka teie arvamust. Palume, et räägiksite meiega täna kaasa. Julgemad võivad seda teha kõva häälega hõigates, aga, aga pakun ka teile varianti lii tuda meie aruteluga Slido keskkonnas. Lasen siit ringi käima sellised väiksed lipikud, saate seda QR-koodi skännides. Jah, aitäh. Saate seda QR-koodi skännides jõuate meie aruteluni ja, ja küsi n esimesena sellise küsimuse, et mis märksõna seostub teile esimesena lastekaitse tööga? Mis on see, mis mõtteid see teis tekitab? Võite, võite ka hüüda, võite sinna kirjutada, et ma siin jooksvalt vaatan, saan neid siin ette lugeda. Aga inimesed, kes võib-olla on vähem kursis lastekaitsetööga.</span></button>

<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="135.72" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 2:16–4:23</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ehk siis maine, maine on endiselt ikkagi negatiivne pigem, mis meedias. Ja loen siin vahepeal ette, siin on vajalik vastutus, vaimselt raske töö, ametnik, mitte kaitsja, kerge läbi põleda, probleemid lastel, vägivald, vägi valdsed lapsed, koostöö kooliga, tugimeeskond. Absoluutselt kõik, kõik on väga õige. Veel üks küsimus. Millised, millised on hirmud lastekaitse töötaja poole pöör dudes? Võite lihtsalt siia avatud chat&#x27;i kirjutada. Mis või, või ka öelda kõva häälega, mida, mida kardetakse, mis, mis võib tekitada seda hirmu lastekaitsetöötaja pöördumise ees. Laps võetakse ära, pannakse lastekodusse, see on kindlasti see kõige, kõige kahjuks le vinum, et, et endiselt seda tõepoolest kardetakse, see on, see on väga-väga sage. Vanema hirm, et olen läbi kukkunud. Just nii. Selge, aga, aga jätame, kes veel kirjutab, võib kirjutada, me jooksvalt vaatame. Tuli veel vastu spetsialistina hirm, kas saan vajalikku abi? Jätame selle chat&#x27;i siia lahti, saate ka jooksvalt oma küsimusi terve arutelu vältel küsida. Me võtame vahepeal selle aja, et vastata. Aga alustame oma aruteluga. Räägime lühidalt siis üldse, mis on lastekaitsesüsteem. Alustame minu vasakult käelt, Kristina Laul Sotsiaalkindlustusameti, lastekaitsetöö toeta mise talituse juhtivspetsialist. Kristina, selgita palun lastekaitsesüsteemi ülesehitust, milliselt see Eestis meil täna sel päeval toimib?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="262.6" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:23–6:10</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt. Muidugi mina sain sellise tuima küsimuse, et pean selle süsteemi selgitama hakkama. Aga Eestis ei ole lastekaitsetöö pelgalt ainult selle üksiku lastekaitsetöötaja vastu tus, vaid see koosnebki kolmest tasemest. Meil on ju Vabariigi valitsus, ennetusnõukogu ja sotsiaalministeerium, kelle ülesand eks ongi lastekaitsepoliitika loomine ja selle rakendamise koordineerimine. Siis on Sotsiaalkindlustusamet, kuhu, kus ka mina töötan ja meie lastekaitses on meie selline suurem eesmärk siis selle riikliku lastekaitsepoliitika elluviimine, valdkondade ülene koostöö ja ka ennetus. Ja selle suure laia eesmärgi täitmiseks me pakumegi lastele ja peredele erinevaid riik likke teenuseid, aga ka meie sihtrühmaks on tegelikult just lastekaitsetöötajad. Me abistame neid nii riigisisestes kui ka rahvusvahelistes lastekaitsejuhtumites, aga ka korraldama ka siis nende täiendkoolitusi. Nüüd lapsele ja perele on kõige lähem tema elukohajärgne kohalik omavalitsus ja seal töötav lastekaitsetöötaja. Meil on seitsekümmend üheksa omavalitsust ja umbes kolmsada lastekaitsetöötajat, aga seda arvu ma ei julge tegelikult kunagi öelda, sest iga päev see kahjuks vahetub. Ja kui mõelda nüüd, kus me kõik elame ja mõtleme sellele KOV-ile, siis sealt just ei leiategi enda need lastekaitsetöötajad, kes siis hakkavad teid abistama. Vot selline süsteem on meil.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0005" data-start="370.08" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:10–6:17</span></span><span class="segment-text">Just. Aga räägi Kristina ka sellest, et kes on üldse abi vajav laps ja kes on hädaohus ole</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="376.92" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 6:17–8:12</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">v laps? Me oleme sellest abivajava lapse teemast Sotsiaalkindlustusametis väga palju. Minu hinnangul viimastel aastatel rääkinud, et seda spetsialistideni rohkem tuua. Aga tegelikult ma arvan, et on iga inimese ülesanne teha vahet, mis on, kes on siis abi vajav laps ja kes on siis hädaos olev laps. Abivajav laps on nüüd see laps, kelle heaolu on ohustatud või siis on kahtlus tema hea olu ohustatuse kohta ja selle heaolu, lapse heaolu ongi selline. Tema toimetulek ja tema elukvaliteet. Et kui laps tunneb ennast väärtuslikuna, armastatuna, teda tunnustatakse ja ka turvaliselt, siis tegelikult on selle lapse heaolu tagatud. Aga kui seal juba esineb puudusi või ühte neist üldse ei ole, siis me räägime juba te gelikkuses abi vajavast lapsest. Ja hädaos olev laps on nüüd kriitilisem, hädaos olev laps on siis see laps, kes on ise enda elu ja tervist ohustavas olukorras, aga ka see laps siis, kelle käitu mine tegelikult ohustab teiste isikute elu ja tervist ja seal on märksõnaks kiire se kkumine ja selle hädas oleva lapse peab võimalikult kiiresti esimesel võimalikul, esimese l võimalusel seal hädaohtu tekitavast olukorrast siis eemaldama. Et nendel on kahel väga erinevad tööprotsessid lastekaitses, aga ka ma arvan, et igal inimesel on vaja teada, kas tegemist, see, mis ma praegu näen, on abi vajav la ps või see on ikkagi hädas olev laps ja ma pean teavitama üks üks kahte.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="492.44" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:12–8:35</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh. Alustame siis abivajava lapse märkamisest. Meiega on siin, liigume teise otsa, Elva Perekeskuse juhataja Tiina Tres. Tiina räägi meile natukene perepesadest, mis on perepesa eesmärgiks ja, ja kuidas teie seal oma tööd korraldanud olete?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="514.88" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 8:35–10:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja et tere, Elva perekeskuses tõesti on päris erinevaid teemasid, millega me seal to imetame ja üks äärmiselt tänuväärne tegevus on kindlasti perepesa tegevus, et meie pere pesa saab oktoobris kolme aastaseks ja suuresti on ta selline mõnus hu bane, turvaline, kohtumise paik siis lapseootel peredele või siis la ps, kui ta siis koolieani lõpuks saab, siis on see selline mõnus peredele kohtumise koht , kus spetsialistid siis neid võib-olla vajadusel nõustavad, toetavad, aitavad, aga ka saavad omavahel vanemad kogemusi jagada. Korraldame koolitusi, mis siis aitab vanematel paremini mõista võib-olla oma lapse erinev aid arenguetappe, kuidas seda ise märgata, olla teadlikum. Kuidas olla teadlikum partner oma suhtes? Sellised pidevad koolitused, õpitoad ja, ja järjest rohkem see perepesa on võib-olla oma kanda Elvas kinnitanud, et, et see külastatavuse arv järjest kasvab. Ja miks just märkamine on seal väga oluline, et seal on võimalik märgata võimalikult varakult, kuna sinna tõesti tulevad hästi väikesed lapsed, võib-olla pered, kes juba lapseootel vajaksid tuge ja nii edasi, et minu meelest selle märkamise juures on üli oluline, et me, et me märkaksime seda võimalikult vara. Seetõttu mina nagu arvasin, et perepesade tegevus peaks rohkem Eestis propageerima ja selle kogemuse pealt, mis meil kolm aastat on, julgen küll väita, et tänuväärne ja, ja väga toimiv tegevus.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="629.84" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 10:30–10:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh, räägi natukene sellest, et mis see märkamine teie töös täpsemalt on, mida te märk ate ja mis, mis siis sellest edasi saab?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="640" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 10:40–12:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Vanemad tulevad oma lastega siis tavapäraselt mängutuppa mängima, et meil on siis mä ngutoa juhendaja, meil on psühholoog perepesus ja, ja seal võib olla mitut viisi, et kas võib-olla mängutoa juhendaja või siis mõni teine spetsialist perepesas midagi märk ab, mida siis vanemaga arutada või vanemaga järjest rohkem meiega võib-olla koos töös olles ise avab ennast, et tihtilugu nad jõuavad oma lugudega läbi selle, et ka psühholoogi toeni, et leiavadki sealsamas perepesas selle tee psühholoogi juurde ja ja on ka olnud selliseid näiteid, kus psühholoogi juurest kasvab võib-olla lugu natuke kaugemale, et vajab mõnda teist spetsialisti ja, ja võib-olla ka nõu lastekaitset ja ja siin saame ka võib-olla positiivse näitena tuua, et et on pere olnud, kes väga on kartnud lastekaitse poole pöördumist samade põhjustel, mis siin enne välja toodi. Aga meie spetsialisti selgitusel võib-olla ka julgustamisel ja tõesti seda teist lastekaitse rolli rohkem nagu välja tuues sai pere tegelikult läbi lastekaitse üliolulist tuge. Nii et selline igapäevaelu, silmad ja kõrvad lahti märgata, olla toeks. Vanemad tegelikult seda väga vajavad, aga seda kindlustunnet, et just turvatunnet oma lugusid jagada, et see, see peab olema perepesas kindlasti tagatud.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="741.28" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 12:21–13:03</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Just, et vahel, vahel võib teade abivajavast lapsest tulla kellegi teise märkamise ka udu vahepeal võib pöördujaks olla laps või pere ise, aga see esimene kontakt lastekaitse töötajaga võib perede jaoks olla väga erinev. See võib olla hirmutav, see võib olla täiesti neutraalne. Või see võib ka olla päästev kõne, sest et lõpuks ometi keegi on võtnud kuulata minu muresid ja, ja tegeleb probleemiga. Aga teeme nüüd kõik koos Kristina juhendamisel läbi ühe lihtsa harjutuse ühe võimalik u esimese kontakti kohta lastekaitsetöötajaga.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="782.72" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 13:03–14:18</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et mõtlesin, et teeme siin sellise rollimängu. Ja mina nüüd palun teil kõigil sulgeda enda silmad ja päriselt sulgeme nüüd silma d. Ootan, et ka viimased ikkagi, kes viiluvad veel, sulgevad oma silmad, üldse lahkutakse nüüd. Aga kui teil on need silmad suletud, siis mõelge enda elu ühe kõige piinlikumale hetkele. Sellele hetkele, mida te kunagi mitte kellegile ei räägiks. Te ei räägiks sellest enda abikaasale, sõbrannale, lastele, veel vähem lastekaitse töötajatele. Mõelge sellele hetkele, mida teie keha tundis, mis emotsioonid seal olid, mis olid need põhjused, miks te sellest nüüd ei räägiks. Võtke see pool minutit korraks ja mõelge sellele hetkele. Mina nüüd olen valinud siit seltskonnast välja ühe inimese, hoidke veel enda si</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="858.48" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 14:18–14:21</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">lmi kinni.</span></button>
