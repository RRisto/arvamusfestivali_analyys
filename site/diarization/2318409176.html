    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.92" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 0:11–0:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Alustame aruteluga kaamera ei mõista hukka. Arutleme siis, et noore, noortefilmid tihti käsitlevad teemasid, millest muidu on raske rääkida. Miks see nii on ja kuidas me saaks noori selles toetada? Mina olen Kessu, ma olen Paide gümnaasiumi õpilane, ma olen filmifestival Horisondi eest vedaja, horisont on siis Euroopa Liidu rahastatud projekt, mille eesmärk on noor te mõtted tuua ekraanile. Nii, aga meiega on siin kolm külalist. Rääkige, kes te olete ja millega te tegelete.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="53.16" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:53–1:17</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, mina olen Liina. Olen filmirežissöör ja kinomaja filmikooli juht. Ning Kinomaja filmikool see omakorda jaguneb siis ka üheks toredaks festivaliks, mille nimi on Koolifilm, mis toimub siis igas igal oktoobril. Igas oktoobris ja, ja samamoodi korraldame ka rahvusvahelist filmilaagrit suveti, nii et palju asju.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="76.68" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 1:17–1:46</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, minu nimi on Kirke. Ma olen noor filmitegija. Ehk siis tegelikult tavaliselt ma tutvustan ennast niimoodi, et tere, ma olen Kirke suur filmi fanaatik. Mulle meeldib filme vaadata, filme teha, rohkem kaldun sinna teadusulme poole, düstoopia poole. Aga noh, tegelikult loon kõike.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="105.6" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 1:46–2:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See on kõik. Tere, mina olen Maria, mina olen siis psühholoog. Olen ligi kümme aastat tegelenud noorte nõustamisega, lastevanemate ja ka täiskasvanu te nõustamisega ja minu üheks suureks kireks lisaks kümne aastasele psüh holoogia kogemusele on mul ka lihtsalt huvi väga stsenaristi vastu, stsenaristika vastu Ja, ja kõik filmid mind ka väga huvitavad.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="139.36" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 2:19–2:43</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mainin ära, et publiku küsimused on alati teretulnud, keegi tahab midagi vahele öelda , küsida, andke käega märku. Alustame siis soojendusküsimusega, et kuidas saate teie lausest kaamera ei mõista hukka aru? Ja võite siit alustada.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="162.68" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 2:43–3:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">See, ma ütleks niimoodi, et see on pigem selline, et et film on kui fi lmikunst ehk siis tegelikkuses kunstis puudub selline asi nagu õige või vale. Ja see on hästi tobe näide, aga, aga võib-olla on hea, hea näide, et ma võin öelda, et ma nägin eile unes lillatkaamlit ja kui keegi ütleb mulle selle kohta, et see on nagu vale või et see ei ole õige, siis sellel noh, argumendil ei ole mingisugust mõtet, sellepärast et see on minu enda looming. Et seal ei saa vaielda, seda võib kritiseerida, aga seal ei saa vaielda, et see on minu enda loodud nagu. Ehk siis filmikunstis ka me ei, me ei saa niivõrd palju nagu vaielda seal kohapeal, mis</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="217.2" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 3:37–4:23</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">on õige, mis on vale justkui. Mina ütleks, et filmi ja reaalsuse vahe le tähendab kaamera ja film filmireaalsuse vahele jääb siis justkui minu jaoks sild, aga samas ka sein. Ehk siis kui rääkida ka mingist isiklikust teemast, siis läbi kaamera tegelikult saab selle seina ette panna. Ja läbi selle siis kaamera tegelikult ei mõista hukka isiklikult , isiklikku kogemust.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="263.32" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:23–4:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma läheneksin võib-olla veidi proosalisemalt, et, et kaamera ei saagi kedagi hukka mõ ista, et saab ikka hukka mõistes inimene, kes on kaamera taga ja kasutada seda kaame rat siis vastavalt, et ma arvan, et kaamera täna filmitegija jaoks on, on see nii-öelda käepikendus ja tema mõte täide viia, eks ju, aga kõik otsused teeb tema, mitte kaamera.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0009" data-start="293.2" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 4:53–5:00</span></span><span class="segment-text">Kirke, milline oli sinu kõige esimene film ja mis oli selle filmi ajendiks?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0010" data-start="300.24" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 5:00–5:47</span></span><span class="segment-text">Minu kõige esimene film valmis kaks tuhat kakskümmend kolm. Selle pealkiri oli nimi. Oli düstoopilise kontekstiga ja siis sellise sõnumiga filmike. Ja seda luues ma olin hästi egoistlik ja mõtlesin endale, mõtlesin, et kui mina olen publik, siis mida mulle meeldiks vaadata, ma ei mõtlenud üldse, mida teistele võiks meeldi da, vaadata ja puhtalt selle pealt siis lõin oma esimese lühifilmi. Ja rakendasin sinna siis, siis mitmeid teemasid, mis mind puudutavad kõige rohkem.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="346.76" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 5:47–5:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ehk siis see oli väga isikliku teemaga film.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0012" data-start="352.68" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 5:53–6:00</span></span><span class="segment-text">Vähem isiklikku, rohkem isiklikud märkamised maailma ja ühiskonna kohta.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="360.08" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 6:00–6:15</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Liina, kas noored tulevad tihti sinu juurde isikliku teemaga, millest nad soovivad fi lmi teha ja millised on siis peamised teemad?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="374.56" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:15–6:42</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Enamasti noored, vähemalt filmikooli noored, nende filmide lood ongi isiklikud, sest ma arvan, et see on nii, nagu me neid ka õpetame. Et filmitegija peab hoolima sellest, millest see lugu räägib. Et alati esimene küsimus on see, et miks mina, miks mina seda lugu siin praegu räägi n? Ja sellepärast jah, kõik need lood on isiklikud. Et ühel siis ka suuremal või vähemal määral. Et ma arvan, et see on õige.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0015" data-start="402" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 6:42–6:48</span></span><span class="segment-text">Aga kas on mingisugust peamist teemat, millest siis nagu kõige rohkem tahetakse teha</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0016" data-start="408.28" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 6:48–7:41</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">filmi? Ma arvan, sellist üldist teemat ei ole ja see on hea. Aga on kindlasti väga palju sellist, sellist katsetamist ja sellist enese otsimist ilmselt, et et mingisuguste tunnete ja emotsioonide katsetamist erinevates keskkondades ja aga on ka sellist keskkonnas märgatud või ühiskonnas märga tud, eks ju, et mida, mis mulle muret teeb või mis rõõmu teeb, et sealt sealt pealt mingi lugu ja on õnneks ka fantaasiat, et et endiselt ütlen, et ikka ootan filmikooli mõnda noort, kes ühe õudusfilmi stsenaariumi kirjutab siiamaani keegi pole kirjutanud. Aga, aga, aga et siiamaani on jah, ütleme selline pigem selline enda sisemaailma võib -olla avamine ja mingisugune uute teemade otsimine. Veidi on ka ajaloolist huvi, mis on väga huvitav.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="460.68" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 7:41–7:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Maria, miks tahavad noored just anda sellist vaimse te rvise sõnumit, filmides edasi nagu identiteet, peresuhted?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0018" data-start="475" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 7:55–8:36</span></span><span class="segment-text">No noorte selline arenguetapp, arenguülesanne on iseenesest lahendada ära siis minapilt, maailma tunnetus, identiteet ja, ja kui nad nagu nendest teemadest räägi vad ja kui see kõnetab neid siis tegelikult see ei näita nagu nõrkust, et me tõstata me mingisuguseid probleeme selles, selles temaatikas, vaid pigem see näitab teadlikku st, vajadust mõtestada seda enda jaoks, võib-olla selgitada enda nägemust selles. Et see on pigem selline arenguliselt loomulik protsess, miks noored neid teemasid kõ</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0019" data-start="516.2" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 8:36–8:45</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">netavad. Kirke, millised teemad just sind kõige rohkem kõnetavad, milliseid sa enda ümber</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0020" data-start="525.28" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 8:45–9:32</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">märkad? Mina märkan enda ümber kõige rohkem selliseid teemasid, kus võib-olla noh , noortepõhised teemad võib-olla rohkem üritan tähelepanu and a teemadele, kus noori tehakse maha või või võib-olla mitte just maha, aga kus noori mingitel hetked, hetkedel ei mõista, et ja siis minu sihuke si semine soov ongi see noorte pilt siis nagu ühiskonnani rohkem sel g- noh, ühiskonnani tuua ja see selgemaks teha.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0021" data-start="572" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 9:32–9:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Liina, kuidas sina toetad noort, kes tuleb ideega filmi teha, aga see idee võib tunduda väga valus või tundlik?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0022" data-start="586.64" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 9:47–10:47</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ma arvan, et. Et siin on toetama, me toetame kõiki neid noori, kes tulevad oma ideega minu juurde, et ja, ja kui, kui idee on väga isiklik ja väga valus, siis siis lugu tulebki ära rääkida. Et siis me lihtsalt, meil hästi palju põhineb nagu aruteludel on ju, et, et siis me nagu arutame, selgitame, et miks mingi teema on oluline, miks tema seda lugu peab rääkima Ja, ja kui selle, selle käigus sünnib see stsenaarium ja see stsenaariumi kirjutamine on juba mõnes mõttes selline, selline oma loo läbi analüüsimine ja, ja natuke teraapi line ka, et, et see lugu saab paberile ja kui see lugu saab paberile, siis selle aja peale tegelikult on tal juba selline kunstniku visioon. Et see lugu on talle tähtis, aga tal on tekib selline kunstiline laiem visioon, et siis see ei olegi enam võib-olla nii noh, nii otseselt isiklik ja valus lugu rääkida, kui ta oleks lihtsalt, kui ta peaks hakkama midagi jutustama kuskil.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0023" data-start="647.2" style="--speaker-color:#dc2626"><span class="segment-head"><strong>SPEAKER_06</strong><span class="timestamp">▶ 10:47–10:56</span></span><span class="segment-text">Maria, kas ühiskond on muutunud noorte suhtes avatumaks või hoopis nõudlikumaks?</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
