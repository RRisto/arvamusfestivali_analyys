    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.08" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 0:11–2:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere hommikust või ennelõunat. Tere tulemast Arvamusfestivalile, rõõm on olla taas kord energilise majanduse alal, nii et suur aplaus kõigile, kes on kohale tulnud ja sellele, et me oleme kord jälle alusta nud Arvamusfestivaliga. Ja selleks, et seda kahte päeva väga hästi kasutada, alustame energeetikast. Alustame sellest, mis on energeetika pikk plaan, mitte väga pikk plaan, järgmise kümne aasta vaade. Ja minuga on siin panelistid, aga enne seda, kui ma annan panelistidele sõna, siis taha n kinnitada, et täna me räägime ainult elektrist, ehk siis energeetikast väga palju la iemalt ei, ei räägi. Ja sellele arutelule fooni andmiseks märgin ära, et Eesti aastane elektritarbimine täna ehk siis aastal kaks tuhat kakskümmend viis oli üheksa teravat t-tundi. Ja me tootsime kolm koma kuus teravatt-tundi taastuvatest ja üks koma seitse teravat t-tundi fossiilsetest allikatest, mis tähendab, et Eesti on elektri puudujäägis, on siis üks kolmandik kuni pool elektrist on meil kogu aeg puudu , peame sisse importima. Ja kui me hakkame nüüd tegema plaani tulevikuks, siis meie esimene ülesanne on tõenä oliselt ära katta see puudujääk. Siis me peame vaatama, mis toimub tarbimise kasvuga. Ja siis peab see kõik olema ka hea hinnaga kättesaadav, mitte sõltuma sellest, kas tu ul puhub, päike paistab, olema loodussõbralik ja kõike muud veel. Aga tänases paneelis ma ei ole üksi, mina olen Terje Talv, Eesti Tuuleenergia Assotsi atsiooni tegevjuht. Tänane paneel on rangelt tehnoloogia neutraalne. Ma ei kiida maismaa tuult ainult siis, kui väga vaja on. Ja alustame siis meie panelistidest, et Andrus, kes sa oled sina, kuidas sa siia tulid ja millise sõiduvahendiga sa täna siia tulid?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="138.64" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 2:19–2:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja tere! Rõõm näha. Nimi siis Andrus. Viimased kolm aastat olen Eesti Energiaga ettevõttega tegelenud Eesti Energiaga nii- öelda väikse tähega ja suure tähega, nii et selles mõttes on väga põnev teekond. Tulin siia siis esimese osa elektriautoga ja, ja viimase osa siis kahjuks diiselauto ga. Aga see on logistiline probleem, lihtsalt mul oli vaja lahendada erinevalt. Et selles mõttes, et olen suur elektritranspordi huviline, aga, aga osaliselt siis nii -öelda fossiiliga. Mis oli veel küsimuse osa?</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="173.12" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 2:53–2:55</span></span><span class="segment-text">Ei sellest täitsa.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="174.92" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 2:55–4:00</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Priit? Tere, mina olen Priit, mina olen kolmteist aastat siis e nergeetikas olnud Uudilitase kontsernijuhina, et mina tulin siia elektriautoga, ka hästi suur elektritranspordi fänn, diiselmootorit vaja ei olnud, et oluline ka see, et millega siis ikkagi see, kust elekter tuleb, et et kontoris siis la eme meie koostootmisjaamade ja päikesepaneelide ja tuuleparkide toodetud elektriga ja kodus on siis laen päikesepaneelid, akud, nii-öelda see, need lahendused on kõik olemas , nii et ma arvan, et elektri mõistes siis sada protsenti taastuv oli see, millega me siia jõudsime ja, ja mitte mitte nagu vähem vähem oluline see, et et ma võtsin kaasa ka oma abikaasa ja tütre, et, et mitte sõita üksi autos, sellepärast et kui me nagu sama energiaga saame kolmekesi, siis on palju parem kui üksi tulla, nii et et igal juhul selline , selline oli minu siiasaamise lugu.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="240" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:00–4:03</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Kolm korda tahtsid tulla.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="242.56" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 4:03–4:05</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Väga, väga.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0007" data-start="244.52" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:05–4:07</span></span><span class="segment-text">Väga hea, aitäh, Jaanus, palun.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0008" data-start="247.44" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 4:07–4:53</span></span><span class="segment-text">Ja tere kõigile minu poolt. Olen Jaanus, energeetika ja maavara tasakantsler kliimaministeeriumis. Sellel, selles rollis kaks pool aastat vist juba äkki. Varasemalt ka tegelenud natukene energeetika teemadel, et siia, siia tulin bensiiniautoga. Pole midagi teha, see on mul see auto, mis mul on ja sellega ma sõidan nii kaua, kuni saab sellega sõita, et. Kedagi eraldi kaasa ei võtnud, et nad ei tahtnud tulla. Aga noh, teinekord ma mõtlen äkki, äkki ikka siis nagu kuidagi parandab see minu posi tsiooni. Sul on alluvad ju. Jah, jah, et jah, teinekord panen auto täis igaks juhuks. Et jah, selle ma võtan kaasa, see on väga hea soovitus juba järgmiseks aastaks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="292.76" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 4:53–4:55</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Väga hea, Jevgeni.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="294.56" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 4:55–5:32</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja mina olen Jevgeni sotsiaaldemokraatliku erakonna siis poliitik ja, ja aastate jooksul ka energeetikahuviline olnud erinevates ametites, mida ma, mida ma pidanud olen. Tulin elektriautoga, võtsin ka kolleegi kaasa, laadisin öösel, elekter on sada protsenti Soome. Vaatasin järele. No täna öösel praktiliselt oli niimoodi, et meil endal siin tuuletootmist peaaegu ei olnud ja, ja, ja Soomest oli, oli mõlemad kaablid olid täies töös.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0011" data-start="332.4" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 5:32–6:30</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mina tulin ka elektriautoga ja minu auto laeb kuskil kaugel-kaugel. Nii, aga selleks, et aru saada, kuhu me minema hakkame järgmise kümne aasta vaates, ma arvan, et kõige esimene punkt on paika saada. Kui palju elektrit me tarbime kümne aasta pärast, võtame siis aastal kaks tuhat kolm kümmend kuus. Tänane aastane tarbimine on enam-vähem, üheksa teravatt-tundi. Ta niimoodi vaikselt kasvanud läbi aastate, aga mitte väga palju. Aga ma olen seda elektriauto küsimust küsinud vist nüüd kolm või neli aastat siin. Iga kord see inimeste arv, kes elektriautoga tulevad arvamusfestivalile, tõuseb. Ja nüüd ongi nagu lihtne küsimus. Alustame Jaanus sinust. Mis on see number? Kui palju Eesti vajab elektrit aastal kolmkümmend kuus, teravatt-tundides? Palju on see tarbimine siis, mis on see koht, kuhu me läheme, täna on üheksa, aastal kolmkümmend kuus, on see.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="390.44" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:30–7:28</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja see on, ma arvan keerulisem küsimus kui esmapilgul paistab, et see sõltub sellest , millesse ka me usume, et kas me usume, et tuleb uusi energiamahukaid tööstusi siia ka, ka tehisintellekti tehaseid nii-öelda. Kas me usume sellesse või me arvame, et, et neid ei tule. Sest kui vaatame lihtsalt orgaanilist kasvu, ongi need soojuspumbad, elektriautod, mingi l määral elektrifitseerimine, siis see on see Eleringi prognoos kaksteist kuni kolmteist teravatt-tundi. Minu meelest praegu noh, eelmine aasta oli kaheksa koma kolm, mitte üheksa päris, aga okei. Et noh, ütleme kaksteist kuni kolmteist teravatt-tundi võiks see olla kaks tuhat kolm kümmend viis, kuus, kui toimub see orgaaniline kasv, elektriautod, kõik muu. Kui tuleb aga mingisugune tehisintellekti tehas, siis on see võib-olla palju suurem. Küsimus on selles, kas me usume sellesse või mitte, onju, et me oleme proovinud ka aru tada kõrgemate tarbimisnumbrite pealt laiemat poolehoidu need ei leidnud.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="448.16" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:28–7:34</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Okei. Andrus, mis on sinu number aastas kaks tuhat kolmkümmend kuus?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="453.64" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:34–7:35</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Mul on kaks numbrit.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0015" data-start="454.8" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 7:35–7:37</span></span><span class="segment-text">Sul on kaks numbrit, millised numbrid sul on?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0016" data-start="457.2" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:37–8:13</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et see, alustame sealt, see jah, see kaheksa või üheksa on see tänane tase, nimetame seda siis see platooks, et tõenäoliselt mõlemad on õiged, aga mul on ettevõtte number ja mul on isiklik number, et selles mõttes, et ma ütlen selle isikliku numbri siis välja , et ma ise usun, et see on umbes neliteist teravatt-tundi selleks ajaks, et see para tamatu elektri kasutamine ühiskonnas kasvab nii palju, et see sinna läheb. Ettevõtte poolelt me oleme konservatiivsed, me oleme selle kaheteist poole peal. Oma plaanides, nii et noh, oleme ettevaatlikumad, aga ma ise usun, et läheb sinna välja ja ja loomulikult tahaks Leedust mööda minna, aga see oli nali praegu, Leedu on praegu</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0017" data-start="493.28" style="--speaker-color:#0891b2"><span class="segment-head"><strong>SPEAKER_05</strong><span class="timestamp">▶ 8:13–8:33</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">kaksteist. Aga kui sa korraks vaatad sinna Leedu poole, et või üldse Baltikumi poole. Eesti on teiste riikide keskel, et kas nemad näevad ainult seda orgaanilist kasvu või nad suunavad need pilgud ikkagi nagu suuremad ambitsioonide poole?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0018" data-start="512.84" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 8:33–10:08</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Nüüd, kui Leedust rääkida, siis ma arvan, kõik ju sihivad tegelikult ju energeetikas ka eksportijat, et noh, tänane pilt küll on natukene kurb selles ekspordis, me ekspo rdime odavalt ja ostame kallilt, et noh, seda peaks ka pöörama, aga see on nagu stru ktuurne küsimus. Aga ma arvan, et Leedu riik teeb samuti kõik selleks, et defitsiit või oma energia too tmist suurendada, ikkagi sihitakse oma, oma riigi energiajulge olekut, oma riigi majandust ja oma riigi nii öelda majanduskasvu, nii et pole midagi öelda. Ma just tulin eile või täna öösel Poolast, vaatasin ka seda nii-öelda tööstuslikku po tentsiaali, et meil on siin veel ju maad minna, et need andmekeskused üksi ei ole need , mis meid sellest hädast välja aitavad. Andmekeskused võimendavad tänaseid energeetika probleeme, ta tõstavad küll tarbimist , aga ta ta tegelikult on meil vaja ka teistsugust struktuuri majandusse, et see nii -öelda majanduskasvu koos energeetikaga käima saada, et noh, see on tegelikult see kõige tähtsam ja ma julgen praegu öelda, et Leedu seda teeb päris hästi. Meie oleme, kui ma täna numbreid vaatasin sellel aastal impordinud nelikümmend üks protsenti kasutatud energiast. Leedu on kahekümne peal, kolm aastat tagasi me olime võrdselt kolmandiku peal, nii et noh, suunad on erinevad. Meie impordime rohkem, Leedu impordib vähem, nii et noh, see, aga see ei ole puhas e nergeetika küsimus, see on tegelikult majandusstruktuuri küsimus ka.</span></button>
