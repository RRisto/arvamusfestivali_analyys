    <div class="legend" aria-label="Kõnelejad"><span class="speaker-chip" style="--speaker-color:#2563eb">SPEAKER_00</span><span class="speaker-chip" style="--speaker-color:#db2777">SPEAKER_01</span><span class="speaker-chip" style="--speaker-color:#059669">SPEAKER_02</span><span class="speaker-chip" style="--speaker-color:#d97706">SPEAKER_03</span><span class="speaker-chip" style="--speaker-color:#7c3aed">SPEAKER_04</span><span class="speaker-chip" style="--speaker-color:#0891b2">SPEAKER_05</span><span class="speaker-chip" style="--speaker-color:#dc2626">SPEAKER_06</span><span class="speaker-chip" style="--speaker-color:#4f46e5">SPEAKER_07</span></div>
    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="10.88" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 0:11–4:19</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere päevast siis kõigile, mikrofonid on meil sisse lülitatud, kell kaksteist ja ma mõtlesin, ma alustan kohe sellise tõdemusega, et siin välispoliitika alal suurem osa arutelusid täna ja homme hakkavad puudutama ikkagi meie oma julgeolekuolukorda ja , ja, ja kõike seda, mis, mis toimub Euroopas, USAs, meie majanduses ja nii edasi. Et päris huvitav planeering oli, et, et me alustame kogu seda välispoliitika alade arutelude seeriat hoopiski Lähis-Idaga. Mis, mis jääb võib-olla meie jaoks kaugemaks, aga samas me oleme siin kõik väga rõõm salt üllatunud, et, et kohe praegu on juba niivõrd palju huvilisi siia kokku tulnud, et, et loodame, et siis kõik saavad siit uusi mõtteid, kindlasti püüame jätta ka lõpp u aega küsimuste esitamiseks. Telgist, mitte siis saalist. Aga tõesti on Lähis-Ida ka üks selliseid teemasid, mis siis meie enda julgeolekuoluko rra kõrval on no vähemalt alates seitsmendast oktoobrist kaks tuhat kakskümmend kolm jälle olnud väga-väga teravalt kogu maailma, sealhulgas meie endi huviorbiidis. Hamasi rünnakud Iisraeli elanike vastu, seejärel Iisraeli pikaleveni nud vastus sellele. Süürias toimuv, Liibanonis toimuv hiljuti täiemahuliseks sõjaks korra lahvatanud ka Iraani ja Iisraeli vastasseis, et neid sündmusi on seal palju ja palju. Kui ma seda planeerima hakkasin tänast arutelu, siis oli mõte, et, et me võiksime aru tleda eelkõige teemal, et kuidas kõik see Lähis-Idas toimuv mõjutab meie oma julgeole kut. Ja, ja, ja miks see üldse meile peaks korda minema ja, ja miks meid huvitama, aga kuna seal toimub niivõrd palju, siis, siis meie arutelu ikkagi puudutab siin ilmselt täna väga palju aspekte, mitte, mitte ainult seda. Aga kindlasti tahaks jõuda ka selleni, et, et miks, miks see meie julgeoleku ja välis poliitika võtmes kõik väga oluline on ka seal. Mul on hea meel tutvustada paneliste, keda te kindlasti vähemalt osa , osasid ka juba tunnete. Kõigepealt siis Eesti, ma arvaks üks tunnustatumaid Lähis-Ida eksperte Peeter Raudsik , kes on ka oma elus diplomaadina töötanud mõnda aega, aga siiski suurema osa ajast eks perdina erinevates asutustes ja praegu erasektoris Euroopa Parlamendi saadik Sven Mi kser, kes on olnud ka välis- ja kaitseminister ja riigikogu väliskomisjoni esimees, nii et ka väga pikalt just nimelt välispoliitikaga tegelenud ja välisministeeriumi rahvus vahelise õiguse jurist Maarja Naagel, kes siis aitab meil natukene vaadata nendele teema dele ka läbi rahvusvahelise õiguse prisma. Ja mina olen Kristi Karelson, Välisministeeriumi Aasia, Vaikse ookeani piirkonna Lähi s-Ida ja Aafrika osakonna peadirektor, nii et katan väga-väga laia valdkonda. Nüüd enne kui me lähemegi nende täpsemate küsimuste juurde võib-olla oleks mul palve , et, et Peeter annaks sellise väikese ülevaate nagu taustaks või sissejuha tuseks, et et mis meil seal Lähis-Idas ikkagi praegu see olukord on, et selgelt meie silmad ja eelkõige on, on kaasal ja, ja seal toimuval ja, ja Iisraeli tegevusel, aga , aga seal toimub ju ka palju muud, et. Et kus meil siis on lootust, kus meil ei ole lootust, kas, kas ja kuidas on seal mingi d jõujooned praegu muutunud või, või, või mida meil sealt oodata on?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="259.08" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:19–11:20</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Aitäh ja aitäh Välisministeeriumile selle kutse eest ka. Alati on tore olla teiega koos ja, ja mul on ka hea meel, et siin on nii palju publiku t praegu tulnud juba kokku, mis on siis Arvamusfestivali üks esimesi arutelusid siin Tulles selle küsimuse juurde, siis mulle ikkagi meeldib minna nen- nende küsimuste juures korraks hüpata tagasi, et kui me oleks siin olnud või kui me oleks siin viisteist aastat tagasi, millest me siis räägiks? Kas ma räägiks kaasast, kas me räägiks Palestiinast või räägiksime hoopis millestki muu st? No toona me tõenäoliselt oleksime rääkinud sellest kuidas läheb USA sisse tung Iraaki, Iraagi valitsemine, kus ka ju eestlased erinevates rollides võtsid osa, seal oli nii Eesti erapalgasõdureid, kes, kellega käisid kaasas needsamad probleemid , mis USA palgasõduritega, kes seal oma operatsioone läbi viisid. Samamoodi ju seal hukkus Eesti sõdureid, ehk siis meil oli väga vahetu kokkupuude ka toona ja sellel, mis Lähis-Idas toimus, oli väga vahetu kokkupuude või mõju sellele, kus, millega me ise siin silmitsi seisime ja otsus ju minna sinna samasse Iraaki näiteks noh, väga otseselt oli ju seotud sellega, et Eesti ise tahtis saada NATO liikmeks ja nägi seda ühe olulise sammuna toona. Ja kui me oleks siin kümme aastat tagasi või kaheksa aastat tagasi, kas me siis räägi ksime Palestiinast? Põhimõtteliselt jälle väga palju ei räägiks, et siis me räägiksime hoopis terrorirünna kutest erinevates Euroopa suurlinnades terrorirünnakutest, erinevates Lähis-Ida pi irkondades. Ehk siis meil tegelikult on siin kaks sellist suurt epohrii etappi on selja taga. Üks on siis see, mille vallandas USA sissetung Iraaki koos oma liitlastega, mille jä rel tegelikult Lähis-Ida regioonis algas selline fragmenteerumine, terve see piirkond , kõik need vanad jõujooned, mis seal olid, need hakkasid muutuma ja ka tegelikult pi irid hakkasid muutuma. Ja algas selline pikem ebastabiilsuse periood, mis siis pärast Araabia kevadet tegelikult me nägime, kuidas päädis sellise väga võika terrorismilainega. Tead mäletate ju väga hästi alles hiljuti veel ISISe nimelist terrorirühmitust, kes hõllu- , hõivas siis suured alad nii Süürias, Iraagis. Et see oli noh, see tippmoment. Kui me vaatame seda terrorismi aega ja see on läbi, et ma arvan, esimene sõnum on see , et tegelikult see terrorismivastase võitluse aeg ja see ajastu on läbi. Nüüd ta on päris kindlasti läbi. Kui veel mõned aastad tagasi seda väidet tegin, siis ikkagi viibutati mulle sõrme ja öeldi ka selliste paksude kardinatega tubadest, et ei, ei, Peeter, et sa eksid terro rismi vastane võitlus kindlasti kestab veel ja see aeg ei ole kindlasti selja taha jää nud, aga noh tegelikult, tegelikult jäi ja tegelikult on jäänud. Et kui me vaatame kas või statistikat, siis ka Euroopas terrorismiga seotud ja ma pea n silmas siis islamiäärmuslikku terrorismi praegu. Arreteerimiste arv võrreldes, ma ei tea, kaks tuhat seitseteist, kaheksateist, kui see oli seal ikkagi tuhande ligi, siis täna on see noh paarsada võib-olla. Ehk siis meil on viiekordne langus toimunud ainuüksi selles vallas, noh rääkimata rü nnakutest. Täna ei ole sedalaadi rünnakuid, mida me siin kaks tuhat viisteist, kuusteist nägime , kus ka ju eestlased tegelikult, kes mäletab Prantsusmaal, hukkusid. Et see terrorismivastase võitluse või terrorismiajastu tegelikult on läbi ja noh, si it paratamatult tekib siis küsimus, et kus me siis oleme, mis siis, mis on selle uue ajajärgu need parameetrid, need mõju või jõujooned. Ja see üks keskne mõte siin, kohe lõpetan ka, ma väga pikalt ei venita. Aga see üks keskne mõte on see, et riik on tagasi ja riik on tagasi selles mõttes, et need keskvõimud, kes tegelikult väga pikal perioodil kaotasid oma mõju äärealade üle , mis tõi kaasa endaga suure ebastabiilsuse Lähis-Ida regioonis. Noh, ma toon lihtsa näite Egiptus, kus eestlased ka teadupärast ju palju käivad. Kuidas isegi Egiptus mitme tuhande aastane tugeva keskvõimuga riik järsku avastas, et ei ole seda kontrolli. Hiina poolsaarel seitse-kaheksa aastat tagasi. Need samad terrorirühmitused, nende harud, vohasid Kiisa püramiidide lähedal turismi busse rünnati. Ehk siis täna me ei kuule sellest, me ei kuule sellepärast, et neid asju lihtsalt ei juhtu. Et samamoodi Liibüas vähemal määral küll samamoodi Süürias, küll täna uus võim, aga selline suurem keskvõimu kontroll oma territooriumi üle, ma arvan, et see on see tees mis täna kehtib ja see on see trend. Me tegelikult näeme, kuidas riik oma siis suveräänina on ennast kehtestamas Lähis-Ida s taas kord. Ja see toob kaasa siis kaks asja, esiteks ta toob kaasa selle, et julgeolekuolukord kui selline tervikuna on paranenud. Ma ei tea, kas mõni teist juba jõudis, aga isegi Eesti turismifirmade Alpion näiteks korraldas juba Iraaki esimese turismireisi siin poolteist aastat tagasi. Kas keegi jõudis osalema, võib-olla veel ei jõudnud, aga et noh, asjad, mille peale me siin tõenäoliselt viimase kümme-viisteist aastat ei oleks julenud isegi mõelda, et minna Bagdadi turistina või vaatama sooaraablasi kuskile päris lahe kaldal. Et need asjad on täna järsku võimalikud ja see on sellepärast, et riik tegelikult on ennast kehtestanud ja ta kontrollib oma territooriumi ja ta suudab julgeolekut tagada Et see on nagu see positiivne lugu siin. Negatiivne on muidugi see, et Lähis-Ida riigid ei ole demokraatlikud, ehk siis vabad used ja inimeste vabaduste kasv sellega tingimata ei kaasne. Ja see on see, millega ma arvan, noh mis jääb nüüd järgmisi probleeme jätkuvalt põhjus tama, et see keskvõimu selline natuur oma olemuselt ei ole paraku muutunud, et need auto kraatlikud trendid on väga tugevad, olgu selleks Egiptus, olgu selleks, olgu selleks kas Süüria, täna oma uue võimuga. Et paraku, paraku see nii on. Nii et need on need, ma arvan, sihukese suure laia pintsliga tõmmatud jooned siia sisse juhatuseks.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0003" data-start="680.2" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 11:20–12:26</span></span><span class="segment-text">Ja aitäh. Tahad sa Sven, täiendada või ma küsiksin siit kohe tegelikult siis järgmise küsimuse sellesama, mis, mis oli meie arutelu teemana nagu välja visatud, et. Et kuidas need muutused siis, mis seal toimunud on, ikkagi avaldavad mõju Euroopale, Eestile, meie välispoliitikale, meie julgeolekule, jah sa mainisid, et, et kunagi oli see peamine mõju meile need terrorirünnakud Eesti kaitseväelaste viibimine või ka era erasõjaväelaste osalemine seal. Aga et mis on, mis on see praegune mõju, kas, kas selleks mõjuks võiks olla näiteks see , et meie ja meie suurima liitlase USA huvid teatud küsimustes lahknevad ja meie sei sukohad lahknevad, kas selleks võiks olla ühe Lähis-Ida suurjõu Iraani toetus Venemaa le tema sõjas Ukraina vastu või ja üldse nende koostöö? Millest nagu tuleneb see kõige suurem mõju meie enda julgeolekuolukorrale?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="745.96" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 12:26–19:44</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Et võib-olla Sven? Noh, kõigepealt. Et natuke polemiseerida. On küsimus, et tõepoolest kümme-viisteist aastat tagasi tõenäoliselt me sellises foor umis ei oleks rääkinud Palestiinast. Sest meie fookus oli kusagil mujal. Et küsimus on, kas me ei oleks temast rääkinud sellepärast, et polnud midagi rääkida või et see ei toimunud midagi olulist või, või sellepärast, et me lihtsalt ignoreeri sime mingisugust teemat, millega oleks tulnud tegeleda. Et noh, tegelikult ju ma arvan, et see, kus, kus on tänase Iisraeli- Palestiina konflikti hetkeseis, tõukub rohkem, võib-olla sellest Oslo protsessi umbe jooksmisest kui konkreetselt Ameerika Ühendriikide sõjakäigust Pärsia lahe äärde. Ja, ja, ja kindlasti oleks olnud väga palju põhjust keskenduda sellele, milline on hu manitaarne olukord siis Palestiina aladel, milline on Iisraeli sisepoliitiline dü naamika. Kogu selle vahepealse kahekümne või kahekümne viie aasta jooksul või kolmekümne viie aasta jooksul juba aeg lendab väga kiiresti. Et nüüd, kui me, me teeme tihtipeale käsitledes selliseid enda jaoks kaugeid ja eksoo tilisi küsimusi, teeme mõned nii-öelda fundamentaalsed vead. Noh, üks neist on kindlasti see, mida Edvat Said on nimetanud selliseks kultuuri ori entalismiks. Et ka meist kauged kandid, mida me halvasti tunneme, on meie jaoks eksootilised ja see tõttu me käsitleme neid kui mingite primitiivsete ja, ja selliste impulsiivsete inim , inimeste või inimrühmadena, kes ei tee ratsionaalseid otsuseid ja kelle, kelle tea tud, noh, kes väärtustavad inimelu teistmoodi kui meie ja nii edasi. Et see on, see on fundamentaalne viga, mida ma arvan, lääne ühiskonnad teevad käsitle des no mitte ainult Lähis-Ida, vaid tegelikult noh, kogu seda niinimetatud kolmandat maailma. Ja teine selline fundamentaalne viga, mida me teeme ja tihtipeale ka Eestis teeme, et me nendele tegutsejatele, kes, kes opereerivad kusagil seal Lähis-Idas või mille pärast Kagu-Aasias. Et me ei omista neile sellist noh, inglise keeles on see termin, on see independent a gency, et me ei omista neile nii-öelda iseseisvat mingisugust agentsust või iseseisva id motivatsioone. Me arvame, et nende, et nemad teevad oma otsuseid lähtuvalt nendest teemadest, mis on meile siin Eestis olulised. Et Iraan tegutseb nii-öelda lähtuvalt Venemaa huvidest või, või noh, minu pärast, ma ei tea palestiinlased tegutsevad lähtuvalt Iraani huvidest, on nende agendid, neil ei ole iseseisvaid huve ega, ega ootusi ega lootusi. Et see on väga põhimõtteline fundamentaalne viga, mida me teeme käsitledes neid regi oone. Miks see on Eestile tähtis? Hästi lühidalt, et, et ma arvan, et noh, kõigepealt muidugi see, miks on Eestile täht is see, mis täna toimub kaasas. Ma arvan, et noh, see on nii-öelda, see ei ole Eesti spetsiifiline, see on üldhumani stlik küsimus. Et tegemist tõenäoliselt on kahekümne esimene sajand on nüüd veerandi juba kestnud enda , enda sajast aastast ja, ja tegemist on kindlasti kõige ühe, ühe, ühe kõige hirmsama humanitaarkatastroofiga sellel sajandil. Ja ma arvan, et see peaks nagu lihtsalt inimestele kui inimestele korda minema. Ja, aga noh, teine küsimus, me alati räägime, et, et julgeolek on jagamatu. Ja siis ütleme, et oi, et aga see teema on meile kauge. Et me proovime veenda, ma ei tea, argentiinlasi ja indoneeslasi ütlema, et, et see, mis Venemaa teeb Ukrainas, on ka teile oluline, sest see õõnestab seda reeglitel põhineva t maailmakorda ja, ja rahvusvahelise õiguse pidamist kahjustab ja, ja siis ütleme, et aga noh, et aga miks peaks meile minema korda see, mis toimub Lähis-Idas või minu pärast kusagil kaugemal maailmas, et see ju kuidagi, et kui, kui julgeolek on jagama tu, siis ta on jagamatu mõlemas s
