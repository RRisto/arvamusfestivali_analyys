    <div class="segments"><button type="button" class="segment-card needs-review" data-segment-id="segment-0001" data-start="11.28" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 0:11–0:53</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere päevast kõigile, kell on neliteist ja kolmkümmend üks, tegelikult oleme nüüd ühe minutiga juba graafikust maas, aga loodame, et ei ole hullu. Saaremaa gümnaasiumi õpilasesindus on siis kokku pannud sellise põneva paneeli arutama ks nutiseadmete kasutust koolikeskkonnas ja tänase arutelu jooksul siis üritame aru saada, millal ja millal mitte. Aga enne kui ma siin ühe soojendusküsimuse küsin annan ma kohe sõna meie panelistide le. Tutvustage ennast paari lausega. Võtame sealt otsast näiteks.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0002" data-start="52.96" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 0:53–1:32</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, minu nimi on Anton. Olen Saaremaa Gümnaasiumi hoolekogu juht. Ja minu side nutiseadmetega on selline, et minu esimesed lapsed läks id kooli kui nutiseadmeid veel ei olnud. Nuputelefone ka ei olnud. Nemad said nuputelefonid kusagil põhikooli hilisemates klassides. Ja kui minu kaks viimast last läksid kooli, no siis juba kuskil algklassides said ne mad nutitelefoni. Nii et selline pikem kontakt ja, ja kogemus.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0003" data-start="91.52" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 1:32–2:52</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere ka minu poolt, mina olen Maria Kurisoo, olen Tallinna Tõnismäe riigigümnaasiumi õppejuht ja nutiseadmega seob mind kindlasti isik lik kasutuskogemus, mis on nagu meil kõigil väga tihe ilmselgelt. Aga õpetajana alustasin ma vahetult enne nutiseadmet või siis nutitelefoni väljatule kut põhimõtteliselt samal kevadel, kui Steve Jobs kuulutas siis iPhone&#x27;i välja. Ehk siis ja ma täiesti mäletan seda hetke, kui esimest korda minu klassis üks õpilane näitas teisele õpilasele laua alt iPhone&#x27;i. Vaata mis mul on. Ja siis ma mõtlesin, oi ta on ilmselt väga rikas. Sest noh, õpetajana ma ei saanud iPhone&#x27;ist unistadagi õpetaja palga eest. Aga, aga ma olen siis näinud nagu kõrvalt seda, seda arengut, kuidas me oleme kasvanud kokku nutitelefonidega. Kuidas minu isiklikud lapsed on nendega peaaegu et juba füüsiliselt kokku kasvanud ja , ja kuidas olen otsinud siis nii õpetajana, haridustöötajana, emana siukest mõnusat keskteed selle kooskasvamise koha pealt, et kuidas võtta sellest välja see maksimum ja kuidas leevendada neid kahjusid.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0004" data-start="171.68" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 2:52–3:37</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere mina olen Liia Ots, töötan Muhu noortekeskuse juhatajana ja nutiseadmetega saan tuua natukene teaduspõhist vaadet. Nimelt siis Tallinna Ülikooli hariduspsühholoogidega koostöös tegi koostöö on, aitasin koostada Tallinna linnale siis niisugust vahvat analüüsi nagu nutiseadmete mõju ja se kkumise analüüs, et ja seal me vaatasimegi teaduspõhiselt, et kuidas siis selle teema ga, mida peale hakata. Ja, ja noh, ja ka igapäevatöös ma näen siis ka tegelikult ju neid võlusid ja valusid , mida, mida see maailm meiega kaasa toob, on toonud.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0005" data-start="216.52" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 3:37–4:06</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tere, mina olen Marit Tarkin, Kuressaare Nooruse Kooli juht ja Saaremaa Gümnaasiu mi väitlusõpetaja. Mul on hea meel siin paneelis osaleda ja ja tõepoolest nutiseadmetega koolijuhina pu utun kokku iga päev igasuguste teemadega ja, ja rääkimata sellest, et see kee lamine ja ärakeelamine ja selles mõttes ma usun, et meil tuleb põnev arutelu siin.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0006" data-start="246.16" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 4:06–4:40</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tervist ka minu poolt, mina olen Helis Luks. Ka Saaremaa gümnaasiumi endine õpilane ja praegune Tartu Ülikooli tudeng. Olen viimased neli aastat tegelenud noorte esindamisega ja olnudki selle nii-öelda ke eristormi keskel, milleks on siis arutelu, mis me nende nutiseadmetega koolides peale hakkame. Ja igapäevaelus, kuna ma esindan noori mitmes erinevas organisatsioonis, siis eks seda nutiseadme kasutamist ikka päris palju esineb.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0007" data-start="279.72" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 4:40–5:14</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Ja mina olen Kenned Puiestee, mina üritan täna seda vestlust siin ilusti käimas hoida . Samamoodi nagu helis olen ka mina Saaremaa gümnaasiumi vilistlane, nii et ma loodan, et ma siin väga palju sellist problemaatikat tekitama ei hakka ja vestlus läheb ladus alt. Aga ilma pikema jututa ma küsiks kohe sellise sissejuhatava küsimuse ja alustaks Heli s sinuga ja siis läheme jällegi teisele poole Antoni juurde, et mis teil umbes selline keskmine telefonikasutus on ühes päevas?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0008" data-start="314.48" style="--speaker-color:#7c3aed"><span class="segment-head"><strong>SPEAKER_04</strong><span class="timestamp">▶ 5:14–5:27</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No minul, kui ma arvestan maha arvutaja, sest seda ma ausalt öeldes ei ole kuskilt järgi vaadanud, ma ütleks, et keskmine jääb sinna viie-kuue tunni sekka.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0009" data-start="326.76" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 5:27–6:02</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Päris vastik küsimus. Et ma pean ütlema, et noh, ma ikkagi natukene arvestaks seda arvutimaailma ka sinna sisse , sellepärast et kui ma ei ole monitori taga, siis ma olen ikkagi telefonis nendesama de kirjadega ja kogu selle looga, mis sinna kohale patsatab postkasti ja, ja kõik uud ised ja muud asjad. Et ma tahaks, et ei oleks terve tööpäev, aga ma ütlen ka, et viis tundi kindlasti ja ma natuke valetan, natuke rohkem tegelikult.</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0010" data-start="361.8" style="--speaker-color:#4f46e5"><span class="segment-head"><strong>SPEAKER_07</strong><span class="timestamp">▶ 6:02–6:25</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">Tahaks kohe telefonikotist võtta järgi vaadata, sest ma, ma ei ole ausalt öeldes ise jälginud. Aga tõesti ekraani taga kui sellise taga, suurem osa tööpäevast saab veedetud ja, ja natukene veel kodust aega peale, et ma ütlen liiga palju.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0011" data-start="384.8" style="--speaker-color:#db2777"><span class="segment-head"><strong>SPEAKER_01</strong><span class="timestamp">▶ 6:25–7:10</span></span><span class="segment-text">Ja ei ole mina ka sellest patust puhas ja pidin just kangematele silmatilkadele üle mine ma nüüd sel kevadel, sest silmad lihtsalt muutuvad väga kuivaks, sellepärast et kui me istume ekraani taga, siis me ei pilguta nii tihti silmi kui peaks ja see annab kohe tund a. Et ma arvan, et ta on erinev, ta kõigub, et tööpäeval on ta kindlasti no kui lugeda sinna sisse ka teleka vaatamine, võib-olla äkki ja ja mingi selline rongis istumine rongiga tööl iga päev sinuga rongis Facebook&#x27;i või Instagrami scrollimine, et noh, ikka kuus tundi ja pluss tuleb julgelt tuleb ära lisaks töö tegemisele ja nädala vahetusel ma loodan, et roh- vähem vähem, kindlalt vähem sest siis tuleb suhelda päris</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0012" data-start="430.32" style="--speaker-color:#059669"><span class="segment-head"><strong>SPEAKER_02</strong><span class="timestamp">▶ 7:10–8:36</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">inimestega ka niimoodi et ei ole ekraan vahel mina ei nimeta ise oma nutitelefoni kasutamist patuks, minu jaoks on ta tööriist ja ma teist kõigist kasuta n seda ilmselt kõige vähem. Ma olen vahest vaadanud oma päevast kasutust, et telefonikasutus on selline üks kuni kaks tundi, palju sellest ajast moodustab telefoniga rääkimine, kuna mu põhitöö on selline arvutis, tabelite kirjade tegemine, no siis arvutikasutust on palju, aga telefoniga on nii, et Internet ei juhi mind, mina juhin Internetti, sest et mul on telefonis see välja lülitatud ja kui mul on vaja suhelda sotsiaalmeediakanalite kaudu, siis ma lülita n interneti sisse, teen selle ära ja lülitan välja, esiteks säästab akut, teiseks sä ästan närve, kolmandaks säästab tervist, ja ma täna hommikul siia sõites lugesin palju , kui mul neid siis erinevaid kanaleid on, mida ma telefonis kasutan või arvutis, ma sain kokku üheksa arvutiprogrammid, e-kirjad, telefonikõned, SMS, EMS, siis Messenger, Facebook, Snapchat ja Instagram. Aga neid kõiki sotsiaalmeedia omi, ma kasutan siis, kui ma lülitan omale interneti sisse</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0013" data-start="516.12" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 8:36–9:58</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">. Nüüd meil on vähemalt kõigist väike pilt ees, kui palju, kes mida kasutab, aga tegelikult lähme kohe asja kallale ja räägime sellest, et nutiseadmed tegelikult tekitavad ikkagi üsna palju selliseid, ütleme niimoodi, ütleme otse kahju. Et nad tekitavad näiteks igasuguste uuringute järgi vaimse tervise probleeme, Lõuna- Koreas ja Taiwanis on uuringute põhjal ka isoleerimine tekkinud seetõttu. Noored isoleerivad ennast enda tuppa, vaatavad ainult ekraani, kannatab selline suht lemine ja tihtipeale ka selline tihe kasutus võrdub pindmine õpistiil. Aga ma alustaks Marit sinuga, sina oled põhikooli ja algklasside sellise va nusegrupi nii-öelda koolijuht. Pärast saab sõna ka Maria, kes on just võib-olla oskab rohkem gümnaasiumi kohta seda rääkida. Pärast kuulete, miks see vanuseklasside ja vanuserühmade teema või kooli nii-öelda a stmete teema nii tähtis on. Siis Marit, milliseid selliseid probleeme või nähtusi sa oled täheldanud enda koolike skkonnas kui noored näiteks neid telefone kasutavad?</span></button>
<button type="button" class="segment-card needs-review" data-segment-id="segment-0014" data-start="598.4" style="--speaker-color:#2563eb"><span class="segment-head"><strong>SPEAKER_08</strong><span class="timestamp">▶ 9:58–11:48</span><span class="review-badge">Kontrolli kõnelejat</span></span><span class="segment-text">No ma läheks selle juurde, et me oleme püüdnud leida sellist kuldset teed, et nad kooli s oleks võimalikult vähe telefonis ja ma saan aru, me räägime sellest täna kolmandas plokis veel, aga meil on liikuma kutsuv kool ja, ja päriselt on meil selliseid la psi, keda kuidagi õue liikuma ei saa, sest et koolikotis see telefon on ja vahetund on see aeg, kus ta saab minna sinna piiluma ja me suudame üsna hästi kontrolli all heas mõttes hoida esimest kuni kolmandat klassi, sest nad on oma koduklassis, neil on oma üks õpetaja, neil on oma asjad kokku lepitud, vanematega kokku lepitud. Aga neli kuni üheksa tõusvas joones ja, ja tegelikult ma olen väga seda meelt, mis, mis tuli ennem siit minu kõrvalt ka see Grete Arro mõtteviis, et et me peame tegelikult, me ei saa keeluga midagi teha, me peame tegelikult jõudma selle ni, et ikkagi see laps ise saab aru. Et, et vahetunnis noh, mul on endal selline situatsioon, õpetaja on olnud, et läksime gi õue kõik õue, vaatan, et mingi sagimine kuidagi oli veel klassis, kuigi klass on tü hi ja üks noormees oli ilusasti pingi alla pugenud oma telefoniga ja lootis, et ma ke eran ukse kinni ja, ja ta saab rahulikult telefonis olla selle asemel, et minna palli mängima, jooksma, mida iganes. Nii et see telefon haarab. Ja see on suur-suur väljakutse, sest haarab järjest rohkem ja vanemaid ka. Jalutavad ema-isa laps, kõik on telefonis. Nii et mis me teeme.</span></button>
<button type="button" class="segment-card" data-segment-id="segment-0015" data-start="708.32" style="--speaker-color:#d97706"><span class="segment-head"><strong>SPEAKER_03</strong><span class="timestamp">▶ 11:48–11:53</span></span><span class="segment-text">Aga vahetunnis noored suhtlevad omavahel või on pigem ka see tendents, et istuvad ek</span></button>

  <script>
    const player = document.getElementById("episode-audio");
    const nowPlaying = document.getElementById("now-playing");
    const cards = [...document.querySelectorAll(".segment-card")];
    cards.forEach((card) => {
      card.addEventListener("click", () => {
        const start = Number(card.dataset.start);
        player.currentTime = start;
        player.play().catch(() => {});
        cards.forEach((item) => item.classList.toggle("active", item === card));
        nowPlaying.textContent = card.querySelector("strong").textContent
          + " · "
          + card.querySelector(".timestamp").textContent.replace("▶ ", "");
      });
    });
  </script>
