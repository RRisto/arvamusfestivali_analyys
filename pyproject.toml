[project]
name = "arvamusfestivali-transcripts"
version = "0.1.0"
description = "arvamusfestivali-transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.scripts]
arvamusfestivali-transcripts = "arvamusfestivali_transcripts.__main__:main"


[build-system]
requires = ["uv_build>=0.8.15,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
topic-analysis = [
    "bertopic>=0.17,<0.18",
    "google-genai>=1,<2",
    "hdbscan>=0.8.40,<0.9",
    "ipykernel>=6,<8",
    "ipywidgets>=8,<9",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5,<6",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "scikit-learn>=1.6,<2",
    "sentence-transformers>=5,<6",
    "torch>=2.7,<3",
    "umap-learn>=0.5.7,<0.6",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
