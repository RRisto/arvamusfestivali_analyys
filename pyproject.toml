[project]
name = "arvamusfestivali-transcripts"
version = "0.1.0"
description = "arvamusfestivali-transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
]

[project.scripts]
arvamusfestivali-transcripts = "arvamusfestivali_transcripts.__main__:main"


[build-system]
requires = ["uv_build>=0.8.15,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
