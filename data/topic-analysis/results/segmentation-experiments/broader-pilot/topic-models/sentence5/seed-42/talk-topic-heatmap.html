6.36\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 3455.04, 3533.36, \"Samal ajal nad saavad astuda ka vahele, aga vaheleastumisega on see lugu, et tuleb hinna ta iseenda nii-\\u00f6elda turvalisust. Et kas ma olen selles positsioonis, et ma v\\u00f5in sinna vahele astuda, et ma ei t\\u00f5mba sellega kiusamist enda peale. Et\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=3455.04\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 3533.36, 3616.48, \"Siin on \\u00fcks aspekt, mida ma hea meelega t\\u00e4iendan lisaks. Kui ma m\\u00e4letan \\u00f5igesti, siis aastast kaks tuhat kaks tuhat kaksk\\u00fcmmend kaks on meil t\\u00f6\\u00f6 lepinguseaduses \\u00fcks v\\u00e4ike muudatus just nende inimeste, nende t\\u00f6\\u00f6tajate osas, kes n\\u00e4e vad peal\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=3533.36\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 3616.48, 3815.6, \"Kuulge, ma panin, nagu te n\\u00e4gite juba oma selle ettevalmistatud stsenaariumi siia. Selles m\\u00f5ttes, et selle, see on selles m\\u00f5ttes ma panin \\u00e4ra sellep\\u00e4rast, et ma vaatan neid teie k\\u00fcsimusi, te olete jube tublid, esiteks ait\\u00e4h teile, sest et\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=3616.48\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 3881.6, 4069.52, \"Oh sa \\u00e4ra \\u00fctle. Kui paljud teist on kiusajad? Oh n\\u00e4e, \\u00fcks h\\u00e4rra seal. Ma juba enne kahtlustavalt vaatasin. Raudselt kiusaja. Ei, tegelikult, miks ma seda k\\u00fcsin, et siia on tulnud mulle elektrooniliselt teie neid k\\u00fcsimusi ja arvamusi ja m\\u00f5t\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=3881.6\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 4069.52, 4262.56, \"Et noh, et ka selliseid juhtumeid siis vahepeal on, et me ei saa kunagi \\u00f6elda, et, et nagu rohkem on nagu t\\u00f6\\u00f6tajad v\\u00f5i rohkem t\\u00f6\\u00f6andjad, aga need keskastme juhid t\\u00f5epoolest me nimetame seda, et meil on olemas niisugune t\\u00f6\\u00f6kiusamisi mitte \\u00fc\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=4069.52\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 4262.56, 4355.44, \"Omast praktikast tahan ka veel \\u00fche, \\u00fche asja r\\u00e4\\u00e4kida, et v\\u00e4ga sageli on olnud ka sellise id olukordi. Noh, ma ei taha n\\u00fc\\u00fcd \\u00f6elda, et, et enamasti, aga, aga on juhtunud ikkagi, kus esialg ne ohver osutub hoopiski kiusajaks. Et nii-\\u00f6elda see\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=4262.56\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 4355.44, 4512.72, \"Nimelt, me oleme k\\u00f5ik saanud k\\u00fcsimustele ju vastata, kogu publik, ainult \\u00fcks inimene , kes ei ole \\u00fcldse vastanud, on tegelikult ju Tanel ise. Ja ma hea meelega k\\u00fcsiks sinu k\\u00e4est, kas tohib. Mina eitan k\\u00f5ike. Mis sa arvad nii, et jah v\\u00f5i ei\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=4355.44\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 4655.12, 4912.96, \"No keegi ei olnud enam n\\u00e4puotsaga puutunud ega mitte midagi, no ju vist hormoonid m\\u00f6 llasid v\\u00f5i ei tont teab, mis seal muud mingi muu konflikt oli. Aga ta oli selgeks saanud selle ja politsei k\\u00e4is, pidi tulema ikka ja, ja siis katsu seleta\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=4655.12\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 4912.96, 5050.28, \"Kuldsed s\\u00f5nad, ma lihtsalt tahtsin praegu \\u00f6elda seda, mida praegu te toote v\\u00e4lja, et \\u00e4ra v\\u00f5ta seda kaasa ja endale, mida ma pole hea meelega t\\u00e4iendaks, et kui me r\\u00e4\\u00e4gime n\\u00fc\\u00fcd t\\u00f5endite liikidest, siis tegelikult nagu mul kumab sealt l\\u00e4bi se\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=4912.96\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 5050.28, 5211.04, \"See heli, mis siin vahepeal tuli, et mul tegelikult on telefon h\\u00e4\\u00e4letu peal, aga ma pa nin endale \\u00e4ratuse, et see t\\u00e4hendab seda, et meil on viis minutit nii-\\u00f6elda saate l\\u00f5 puni, et me siin ei r\\u00e4\\u00e4giks t\\u00f5esti p\\u00e4ris hommikuni v\\u00e4lja, aga mul o\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=5050.28\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 5211.04, 5276.96, \"Ei, seda ei ole, ei. Ma lootsin, et saab mingi huvitava pealkirja siin \\u00f5htust. Aga ei, ei neelanud s\\u00f6\\u00f6ta alla nii-\\u00f6elda. Kuulge, meil on t\\u00f5esti loetud minutid alles ja ma tahan veel t\\u00e4nukoha ka veel j\\u00e4tta siia aja sisse, et h\\u00e4sti kiirelt,\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=5211.04\"], [\"T\\u00f6\\u00f6kius otse laval\", \"2247188693\", 5276.96, 5366.57, \"Mina \\u00fctleksin, et nii-\\u00f6elda riske tuleb ka t\\u00e4hele panna, et mitte ainult oodata, kuni olukord nii-\\u00f6elda p\\u00e4\\u00e4dib t\\u00f6\\u00f6 kiusamisega, vaid et m\\u00e4rgake neid punaseid lipukesi vare m juba. V\\u00e4ga h\\u00e4sti \\u00f6elda, sellega on t\\u00e4nane saade paslik l\\u00f5petada,\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2247188693-arvamusfestival-tookius-otse-laval-9.mp3#t=5276.96\"] i nimi on k\\u00e4ttesaadavad kodud, on ju, siis Ivo v\\u00f5ib-olla oskab siin t\\u00e4iendada, kas \\u00fctles teekaart? Et kaksk\\u00fcmmend viis protsenti leibkonna sissetulekust on maksimum need kulud, mis peaks siis leibkond eluasemele kulutama, vastasel ju\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2396670927-arvamusfestival-kodude-kattesaadavus_kas-eestil-on-plaan-5.mp3#t=1001.32\"], [\"Kodude k\\u00e4ttesaadavus_ kas Eestil on plaan_\", \"2396670927\", 1845.8, 1908.12, \"See kinnisvara on v\\u00e4ga lokaalne. Aga selle lokaalsele lisaks on siis see uusarenduste kiht. Ja need uusarendused nagu nii kaua, kuni nad on need uued, siis nad \\u00fcle Eesti nagu tegelikult k\\u00e4ituvad samamoodi. Ehkki selles m\\u00f5ttes ma \\u00fctlen, et\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2396670927-arvamusfestival-kodude-kattesaadavus_kas-eestil-on-plaan-5.mp3#t=1845.8\"], [\"Kodude k\\u00e4ttesaadavus_ kas Eestil on plaan_\", \"2396670927\", 2424.84, 2518.44, \"Et olgu see Holland v\\u00f5i Saksamaa v\\u00f5i mingid muud asjad ja m\\u00f5nes m\\u00f5ttes see on nagu hea , et me erineme sellep\\u00e4rast, et nende probleemid on palju hullemad, kuhu nemad t\\u00e4nase ks nagu j\\u00f5udnud on. Et selle k\\u00f5rval v\\u00f5iks \\u00f6elda, et meil ei ole \\u00fcl\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2396670927-arvamusfestival-kodude-kattesaadavus_kas-eestil-on-plaan-5.mp3#t=2424.84\"], [\"Kodude k\\u00e4ttesaadavus_ kas Eestil on plaan_\", \"2396670927\", 4571.56, 4667.36, \"Ja v\\u00f5ib-olla \\u00fcks asi, mis ma tahtsin veel tuua v\\u00e4lja, et selles teekaardis me spetsi aalselt ei r\\u00e4\\u00e4kinud sellest, et milline peaks olema \\u00fc\\u00fcrikorterite v\\u00f5i omandikorterite omavaheline suhtarv. Et ma arvan, et \\u00fc\\u00fcrnikud on noh, on, on oma, om\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2396670927-arvamusfestival-kodude-kattesaadavus_kas-eestil-on-plaan-5.mp3#t=4571.56\"], [\"Kodude k\\u00e4ttesaadavus_ kas Eestil on plaan_\", \"2396670927\", 4667.36, 4959.12, \"Et katsume kuidagi selliste, selliste sammudega liikuda, liikuda edasi, nii et need meil terved linnad korda saavad. Viimased kommentaarid, reflektsioonid kogu paneelile. Nii, palun. Ma lihtsalt selle noorte \\u00fc\\u00fcrimise ja omamise osas mainin\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2396670927-arvamusfestival-kodude-kattesaadavus_kas-eestil-on-plaan-5.mp3#t=4667.36\"]]"],[0,"0 contributing passages","[]"],[0,"0 contributing passages","[]"],[0,"0 contributing passages","[]"],[0,"0 contributing passages","[]"],[8,"8 contributing passages:\u003cbr\u003e1. Kodude k\u00e4ttesaadavus_ kas Eestil on plaan_ \u00b7 2396670927 \u00b7 1556.72\u20131845.8 s \u00b7 Okei, aga v\u00f5tame, kas kellelgi on kommentaari, k\u00fcsimust praegu, esimene ring on pane listidega r\u00e4\u00e4gitud, et t\u00f5stke k\u00e4si. Nii, palun. Mina olen Arnika, J\u00e4rva valla avalike suhete juht ja minul on k\u00fcll \u00fcks niisugune t\u00e4he lepanek. R\u00e4\u00e4kisime s\u2026 \u00b7 https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2396670927-arvamusfestival-kodude-kattesaadavus_kas-eestil-on-plaan-5.mp3#t=1556.72\u003cbr\u003e2. Kodude k\u00e4ttesaadavus_ kas Eestil on plaan_ \u00b7 2396670927 \u00b7 1908.12\u20132008.08 s \u00b7 Aga kui v\u00f5ib-olla tuleme siit ikkagi selle sihtgrupi juurde, et nii Triin kui Andres , et Andres, teie tegite uuringut. Teie selgitasite v\u00e4lja, et kes on need, kellele me peaksime, kellega me peaksime nii -\u00f6elda tegelema v\u00f5i kes on see sih\u2026 \u00b7 https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2396670927-arvamusfestival-kodude-kattesaadavus_kas-eestil-on-plaan-5.mp3#t=1908.12\u003cbr\u003e3. Kodude k\u00e4ttesaadavus_ kas Eestil on plaan_ \u00b7 2396670927 \u00b7 2008.08\u20132135.68 s \u00b7 Ja vot see on \u00fcks nagu oluline moment, millest me peame nagu, mulle t
