f\u002ffeeds.soundcloud.com\u002fstream\u002f2400164916-arvamusfestival-aga-kes-hoiab-opetajat-7.mp3#t=3316.04\"], [\"Aga kes hoiab \\u00f5petajat_\", \"2400164916\", 3393.04, 3536.24, \"Ma siis teen kontsentreeritult. Alushariduse v\\u00e4\\u00e4rtustamine, l\\u00e4bipaistev rahastamine. Ait\\u00e4h. \\u00dcks m\\u00f5te, mille v\\u00f5tad kaasa. Alusharidus on oluline osa hariduss\\u00fcsteemis. Ait\\u00e4h. Mina j\\u00f5udsin siia natuke hilja ja ma sain kohe osa sellest ringist\\u2026\", \"https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2400164916-arvamusfestival-aga-kes-hoiab-opetajat-7.mp3#t=3393.04\"]]"],[0,"0 contributing passages","[]"],[9,"9 contributing passages:\u003cbr\u003e1. Aga kes hoiab \u00f5petajat_ \u00b7 2400164916 \u00b7 138.52\u2013207.08 s \u00b7 Ehk et oleme vastastikku lugupidavad, igal\u00fchel on \u00f5igus oma arvamusele selle kohta, mis \u00f5petaja t\u00f6\u00f6elu puudutab ja oleme palunud \u00fcksteisega ka sina peal, et oleks liht sam suhelda. Ma loodan, et Eestis on see juba \u00fcsna tavap\u00e4rane. Siis ma\u2026 \u00b7 https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2400164916-arvamusfestival-aga-kes-hoiab-opetajat-7.mp3#t=138.52\u003cbr\u003e2. Aga kes hoiab \u00f5petajat_ \u00b7 2400164916 \u00b7 839.04\u2013907.32 s \u00b7 Teie vaatest saanud. Ja alustamegi siis sotsudraamaga ja uurime Eesti \u00f5petajate rolli t\u00e4nast ja homset. Palun nimetage \u00f5petajahoitust ja v\u00e4\u00e4rtustatust m\u00f5jutavad rollid . M\u00f5ned juba k\u00f5lasid. Millised rollid? N\u00e4iteks vallavalitsus. Kes \u00fctleb\u2026 \u00b7 https:\u002f\u002ffeeds.soundcloud.com\u002fstream\u002f2400164916-arvamusfestival-aga-kes-hoiab-opetajat-7.mp3#t=839.04\u003cbr\u003e3. Aga kes hoiab \u00f5petajat_ \u00b7 2400164916 \u00b7 907.32\u20131069.64 s \u00b7 Kui sa \u00fctled riik, kas sa m\u00f5tled ministeeriumi v\u00f5i? Ait\u00e4h. Lapsevanemad. Kas see on imaginaarsel toolil \u00f5petaja toolil, kes veel siin \u00fcmber on, kes
